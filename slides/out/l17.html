.tt{display:block;font-size:13px;line-height:1.3;margin-top:3px}

iddle\">predict</text>\n</svg><p class=\"cap\">orange: observed frames and what is inferred from them; teal: predicted</p></div><div class=\"eq\">\\[h_t = f(h_{t-1},\\ s_{t-1},\\ a_{t-1}), \\qquad s_t \\sim p(s_t \\mid h_t), \\qquad o_t \\sim p(o_t \\mid h_t, s_t), \\quad r_t \\sim p(r_t \\mid h_t, s_t)\\]</div><p>The <b>recurrent state-space model</b>: $h_t$ (a GRU, $200$ units) carries memory; $s_t$ ($30$-D diagonal Gaussian) carries uncertainty.</p>", "n": ""}, {"t": "A latent dynamics model", "sub": "4 of 4: prior, posterior, loss", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 438 148\" width=\"438\" role=\"img\" aria-label=\"The recurrent state-space model with its two distributions marked: a posterior for the state at a step that was observed, and a prior for the state at a step that is only predicted.\">\n  <defs><marker id=\"abaaecaccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"abaaecink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"abaaecsoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M174.5 128.7 L174.2 126.5 L173.5 124.5 L172.4 122.6 L170.8 121.1 L169.0 120.0 L166.9 119.2 L164.8 119.0 L162.6 119.2 L160.6 120.0 L158.7 121.1 L157.2 122.6 L156.0 124.5 L155.3 126.5 L155.1 128.7 L155.3 130.9 L156.0 132.9 L157.2 134.8 L158.7 136.3 L160.6 137.5 L162.6 138.2 L164.8 138.4 L166.9 138.2 L169.0 137.5 L170.8 136.3 L172.4 134.8 L173.5 132.9 L174.2 130.9 L174.5 128.7 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"164.8\" y=\"131.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,s "/>\n  <path d=\"M241.3 55.4 L241.3 71.3\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#abaaecink)\"/>\n  <text x=\"279.6\" y=\"22.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M250.4 46.3 L308.7 46.3\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#abaaecink)\"/>\n  <path d=\"M279.6 24.5 L291.4 43.6\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#abaaecsoft)\"/>\n  <path d=\"M249.0 75.1 L309.0 52.7\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#abaaecink)\"/>\n  <path d=\"M234.8 120.5 L234.8 90.4\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#abaaecaccent2)\"/>\n  <path d=\"M327.6 128.7 L327.3 126.5 L326.6 124.5 L325.5 122.6 L323.9 121.1 L322.1 120.0 L320.0 119.2 L317.9 119.0 L315.7 119.2 L313.6 120.0 L311.8 121.1 L310.3 122.6 L309.1 124.5 L308.4 126.5 L308.1 128.7 L308.4 130.9 L309.1 132.9 L310.3 134.8 L311.8 136.3 L313.6 137.5 L315.7 138.2 L317.9 138.4 L320.0 138.2 L322.1 137.5 L323.9 136.3 L325.5 134.8 L326.6 132.9 L327.3 130.9 L327.6 128.7 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"317.9\" y=\"131.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">o<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M309.0 55.1 L326.7 55.1 L326.7 37.4 L309.0 37.4 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"317.9\" y=\"48.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M327.6 81.6 L327.3 79.4 L326.6 77.4 L325.5 75.5 L323.9 74.0 L322.1 72.8 L320.0 72.1 L317.9 71.9 L315.7 72.1 L313.6 72.8 L311.8 74.0 L310.3 75.5 L309.1 77.4 L308.4 79.4 L308.1 81.6 L308.4 83.8 L309.1 85.8 L310.3 87.7 L311.8 89.2 L313.6 90.4 L315.7 91.1 L317.9 91.3 L320.0 91.1 L322.1 90.4 L323.9 89.2 L325.5 87.7 L326.6 85.8 L327.3 83.8 L327.6 81.6 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"317.9\" y=\"84.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M317.9 91.6 L317.9 118.4\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#abaaecink)\"/>\n  <path d=\"M317.9 55.4 L317.9 71.3\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#abaaecink)\"/>\n  <text x=\"340.2\" y=\"81.6\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">prior p(s₃ | h₃)</text>\n  <text x=\"142.4\" y=\"81.6\" text-anchor=\"end\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">posterior q(s₁ | h₁, o₁)</text>\n  <text x=\"340.2\" y=\"128.7\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predict</text>\n</svg><p class=\"cap\">orange: observed frames and what is inferred from them; teal: predicted</p></div><ul><li><b>Prior</b> $p(s_t \\mid h_t)$: the prediction before seeing $o_t$. Used when imagining.</li><li><b>Posterior</b> $q(s_t \\mid h_t, o_t)$: after seeing it. Used on real frames.</li><li><b>Analogy:</b> a navigator's dead reckoning (prior), corrected by a sighted landmark (posterior).</li></ul><div class=\"eq\">\\[\\mathcal{L} = \\sum_t \\Big( \\underbrace{-\\ln p(o_t \\mid h_t, s_t) - \\ln p(r_t \\mid h_t, s_t)}_{\\text{reconstruct}} + \\underbrace{\\mathrm{KL}\\big(q(s_t \\mid h_t, o_t)\\,\\|\\,p(s_t \\mid h_t)\\big)}_{\\text{predict what you will see}} \\Big)\\]</div>", "n": ""}, {"t": "PlaNet: plan in the latent space", "sub": "Hafner et al., ICML 2019", "min": 2.5, "sz": "", "html": "<ol><li>Filter the real frames into $(h_t, s_t)$ with the posterior.</li><li>CEM over $12$ actions, scored by summed predicted reward, rolled out with the <b>prior</b> only. Run the first action.</li><li>Every $100$ updates, collect one more episode and add it to the data.</li></ol><div class=\"fig\"><svg viewBox=\"0 0 576 127\" width=\"576\" role=\"img\" aria-label=\"Horizontal bars: D4PG, pixels, 100,000 episodes 881; PlaNet, 1,000 episodes 816; A3C, states, 100,000 episodes 267.\">\n  <path d=\"M221.1 42.0 L525.6 42.0 L525.6 20.1 L221.1 20.1 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"var(--rule-strong)\"/>\n  <text x=\"206.1\" y=\"31.0\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">D4PG, pixels, 100,000 episodes</text>\n  <text x=\"540.6\" y=\"31.0\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">881</text>\n  <path d=\"M221.1 74.2 L503.1 74.2 L503.1 52.4 L221.1 52.4 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"var(--rule-strong)\"/>\n  <text x=\"206.1\" y=\"63.3\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">PlaNet, 1,000 episodes</text>\n  <text x=\"518.1\" y=\"63.3\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">816</text>\n  <path d=\"M221.1 106.5 L313.4 106.5 L313.4 84.6 L221.1 84.6 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"var(--rule-strong)\"/>\n  <text x=\"206.1\" y=\"95.6\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A3C, states, 100,000 episodes</text>\n  <text x=\"328.4\" y=\"95.6\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">267</text>\n</svg></div><p>Mean return over six control tasks (Table 1), with a hundredth of the episodes. The paper also proposes <b>latent overshooting</b> (KL terms on multi-step predictions); its appendix says the final agent did not need it.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "1 of 8: learning from a score", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 612 104\" width=\"612\" role=\"img\" aria-label=\"Two boxes, the agent and the environment. An arrow from the agent carries the action to the environment; an arrow back carries the next state and a reward.\">\n  <defs><marker id=\"ac1e4baccent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"ac1e4baccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker></defs>\n  <path d=\"M39.1 83.5 L188.9 83.5 L188.9 20.1 L39.1 20.1 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"114.0\" y=\"57.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">agent (policy)</text>\n  <path d=\"M436.5 83.5 L597.8 83.5 L597.8 20.1 L436.5 20.1 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"517.2\" y=\"57.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">environment</text>\n  <path d=\"M188.9 34.5 L436.5 34.5\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#ac1e4baccent)\"/>\n  <text x=\"312.7\" y=\"16.1\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">action aₜ</text>\n  <path d=\"M436.5 69.1 L188.9 69.1\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#ac1e4baccent2)\"/>\n  <text x=\"312.7\" y=\"87.5\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">next state sₜ₊₁, reward rₜ</text>\n</svg><p class=\"cap\">teal: what the agent chooses; orange: what the world returns</p></div><ul><li>In supervised learning (L05) every input comes with the right answer. Here the robot acts, and the world returns only a <b>reward</b>: a score, often long after the action that earned it.</li><li>The robot has to work out for itself which of its actions led to the score. This is the <b>credit assignment</b> problem.</li></ul><p><b>Analogy:</b> learning a video game with no manual. You press buttons; the only feedback is the score.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "2 of 8: the pieces of the problem", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 415 132\" width=\"415\" role=\"img\" aria-label=\"Three states in a row, A, B and C. The action right moves A to B with reward 0 and B to C with reward 1; C ends the episode. The action stay keeps the agent where it is with reward 0.\">\n  <defs><marker id=\"a4a9c8ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M111.9 75.5 L111.4 70.6 L109.7 66.0 L107.2 61.9 L103.7 58.4 L99.6 55.9 L95.0 54.2 L90.1 53.7 L85.3 54.2 L80.7 55.9 L76.6 58.4 L73.1 61.9 L70.5 66.0 L68.9 70.6 L68.4 75.5 L68.9 80.3 L70.5 84.9 L73.1 89.0 L76.6 92.5 L80.7 95.1 L85.3 96.7 L90.1 97.2 L95.0 96.7 L99.6 95.1 L103.7 92.5 L107.2 89.0 L109.7 84.9 L111.4 80.3 L111.9 75.5 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"90.1\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">A</text>\n  <path d=\"M253.3 75.5 L252.8 70.6 L251.2 66.0 L248.6 61.9 L245.2 58.4 L241.0 55.9 L236.4 54.2 L231.6 53.7 L226.7 54.2 L222.1 55.9 L218.0 58.4 L214.6 61.9 L212.0 66.0 L210.4 70.6 L209.8 75.5 L210.4 80.3 L212.0 84.9 L214.6 89.0 L218.0 92.5 L222.1 95.1 L226.7 96.7 L231.6 97.2 L236.4 96.7 L241.0 95.1 L245.2 92.5 L248.6 89.0 L251.2 84.9 L252.8 80.3 L253.3 75.5 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"231.6\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">B</text>\n  <path d=\"M394.8 75.5 L394.2 70.6 L392.6 66.0 L390.0 61.9 L386.6 58.4 L382.5 55.9 L377.9 54.2 L373.0 53.7 L368.2 54.2 L363.6 55.9 L359.5 58.4 L356.0 61.9 L353.4 66.0 L351.8 70.6 L351.3 75.5 L351.8 80.3 L353.4 84.9 L356.0 89.0 L359.5 92.5 L363.6 95.1 L368.2 96.7 L373.0 97.2 L377.9 96.7 L382.5 95.1 L386.6 92.5 L390.0 89.0 L392.6 84.9 L394.2 80.3 L394.8 75.5 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"373.0\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">C</text>\n  <path d=\"M113.0 75.5 L208.7 75.5\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a4a9c8ink)\"/>\n  <text x=\"160.9\" y=\"58.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">right, r = 0</text>\n  <path d=\"M254.4 75.5 L350.2 75.5\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a4a9c8ink)\"/>\n  <text x=\"302.3\" y=\"58.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">right, r = 1</text>\n  <path d=\"M76.9 50.4 L76.3 48.5 L76.0 46.6 L76.0 44.7 L76.3 42.7 L76.8 40.9 L77.6 39.1 L78.6 37.4 L79.8 35.9 L81.2 34.6 L82.8 33.5 L84.5 32.6 L86.3 31.9 L88.2 31.5 L90.1 31.4 L92.1 31.5 L94.0 31.9 L95.8 32.6 L97.5 33.5 L99.1 34.6 L100.5 35.9 L101.7 37.4 L102.7 39.1 L103.5 40.9 L104.0 42.7 L104.3 44.7 L104.2 46.6 L104.0 48.5 L103.4 50.4\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"90.1\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">stay, r = 0</text>\n  <path d=\"M218.3 50.4 L217.8 48.5 L217.5 46.6 L217.5 44.7 L217.7 42.7 L218.2 40.9 L219.0 39.1 L220.0 37.4 L221.2 35.9 L222.6 34.6 L224.2 33.5 L225.9 32.6 L227.8 31.9 L229.7 31.5 L231.6 31.4 L233.5 31.5 L235.4 31.9 L237.2 32.6 L239.0 33.5 L240.5 34.6 L242.0 35.9 L243.2 37.4 L244.2 39.1 L244.9 40.9 L245.4 42.7 L245.7 44.7 L245.7 46.6 L245.4 48.5 L244.9 50.4\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"231.6\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">stay, r = 0</text>\n  <text x=\"373.0\" y=\"116.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">end</text>\n</svg></div><ul><li><b>State</b> $s$: what the robot knows now. Here $A$, $B$ or $C$.</li><li><b>Action</b> $a$: what it can do. Here <i>right</i> or <i>stay</i>.</li><li><b>Transitions</b> $p(s' \\mid s, a)$: how the world responds. This is exactly a <b>world model</b>.</li><li><b>Reward</b> $r(s, a)$: here $1$ for reaching $C$, otherwise $0$.</li></ul><p>On a robot: the state is joint angles and an image, an action a motor command, the reward $1$ when the block is in the bin.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "3 of 8: the return, and why discount", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[G_t = r_t + \\gamma\\,r_{t+1} + \\gamma^2 r_{t+2} + \\cdots = r_t + \\gamma\\,G_{t+1}\\]</div><ul><li>The <b>return</b> adds up all the rewards still to come. The agent tries to make it large.</li><li>The <b>discount</b> $\\gamma &lt; 1$ counts a reward $k$ steps away as $\\gamma^k$: sooner is worth more, and the sum stays finite.</li></ul><table class='cmp'><thead><tr><th>weight $\\gamma^k$</th><th>$k = 1$</th><th>$k = 10$</th><th>$k = 50$</th><th>$k = 100$</th></tr></thead><tbody><tr><td>$\\gamma = 0.9$</td><td>$0.900$</td><td>$0.349$</td><td>$0.005$</td><td>$2.7 \\times 10^{-5}$</td></tr><tr><td>$\\gamma = 0.99$</td><td>$0.990$</td><td>$0.904$</td><td>$0.605$</td><td>$0.366$</td></tr></tbody></table><p>On the chain, rewards $0, 0, 1$ give $G_0 = 0.9^2 = 0.81$. $\\gamma$ sets how far ahead the agent cares: about $1/(1 - \\gamma)$ steps.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "4 of 8: a policy, and why it should sometimes explore", "min": 2.5, "sz": "", "html": "<div class=\"eq\">\\[\\pi(a \\mid s): \\qquad \\pi(\\text{right} \\mid A) = 0.8, \\quad \\pi(\\text{stay} \\mid A) = 0.2\\]</div><ul><li>A <b>policy</b> says what to do in each state, as a probability for each action. In deep RL it is a network, the <b>actor</b>.</li><li><b>Exploration:</b> an agent that always takes its current best action never finds out whether another one is better.</li></ul><p><b>Analogy:</b> always ordering your favourite dish, or sometimes trying a new one. Trying costs a little tonight and can pay off on every later visit.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "5 of 8: value, the return you expect", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[v_\\pi(s) = \\mathbb{E}_\\pi\\big[\\,G_t \\mid s_t = s\\,\\big]\\]</div><ul><li>The <b>value</b> of a state is the return to expect from there when following $\\pi$, averaged over everything that could happen.</li><li>It is a prediction about the future, made now. It lets the agent judge a state without playing it out.</li><li>In deep RL it is a network, the <b>critic</b>.</li></ul><p>Example: from $s_0$, two equally likely futures with returns $0.81$ and $0$, so $v(s_0) = 0.405$.</p><p><b>Analogy:</b> a chess player who looks at a board and says <i>white is winning</i>, without playing the game to the end.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "6 of 8: learning values from experience (TD)", "min": 3.5, "sz": "", "html": "<div class=\"eq\">\\[v(s) \\leftarrow v(s) + \\alpha\\,\\big(\\underbrace{r + \\gamma\\,v(s')}_{\\text{target}} - v(s)\\big)\\]</div><ul><li>Usually we cannot compute values exactly: the transitions are unknown and the states too many.</li><li>So after each real step, nudge $v(s)$ towards one reward plus the current guess for the next state: <b>temporal-difference (TD) learning</b>. A guess improved by another guess is called <b>bootstrapping</b>.</li></ul><table class='cmp'><thead><tr><th>$\\alpha = 0.5$</th><th>start</th><th>after 1</th><th>after 2</th><th>true value</th></tr></thead><tbody><tr><td>$v(A)$</td><td>0</td><td>$0$</td><td>$0.225$</td><td>$0.9$</td></tr><tr><td>$v(B)$</td><td>0</td><td>$0.5$</td><td>$0.75$</td><td>$1$</td></tr></tbody></table>", "n": ""}, {"t": "Reinforcement learning", "sub": "7 of 8: actor-critic", "min": 3, "sz": "", "html": "<ul><li><b>Critic</b> $v(s)$: learns values by TD.</li><li><b>Actor</b> $\\pi(a \\mid s)$: after each action, asks the critic whether it went better than expected.</li></ul><div class=\"eq\">\\[\\delta = r + \\gamma\\,v(s') - v(s) \\qquad \\delta &gt; 0: \\text{ make } a \\text{ more likely}; \\quad \\delta &lt; 0: \\text{ less likely}\\]</div><p>From $B$, with $v(B) = 0.75$: <i>right</i> gives $\\delta = 1 - 0.75 = +0.25$, so raise it; <i>stay</i> gives $\\delta = 0.9 \\cdot 0.75 - 0.75 = -0.075$, so lower it.</p><p><b>Analogy:</b> a coach who predicts how well each play will go, and a player who repeats the plays that beat the prediction.</p>", "n": ""}, {"t": "Reinforcement learning", "sub": "8 of 8: where the experience comes from", "min": 2.5, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>Who produces the steps $(s, a, r, s')$</th></tr></thead><tbody><tr><td>model-free RL</td><td>the real robot or simulator: millions of steps, slow, and wear on the hardware</td></tr><tr><td>model-based RL</td><td>a learned <b>world model</b>: cheap, thousands in parallel on a GPU, but carrying the model's errors</td></tr></tbody></table><p>PlaNet used its model to <b>plan</b> at every step. Dreamer uses it to <b>practise</b>: an actor-critic trained on experience the world model imagines.</p>", "n": ""}, {"t": "Dreamer: learn the behaviour in imagination", "sub": "Hafner et al., ICLR 2020; figure from DreamerV3", "min": 3, "sz": "", "html": "<div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACHYAAAMHCAYAAABW8kKtAAAATmVYSWZNTQAqAAAACAAEARoABQAAAAEAAAA+ARsABQAAAAEAAABGASgAAwAAAAEAAgAAAhMAAwAAAAEAAQAAAAAAAAAAASwAAAABAAABLAAAAAGbYnAsAAEAAElEQVR42uz9e3zc5X3n/b+/3++MRifraFtYtfABjClxbKhJm5o0brdSG9r9mSbFEHZZciC1ue8EktZp7Hu3UILbXdyG7V2SdGM3JKmXXQImofi3CflF2js1BN9pawVMDcUxlrDlyMi2jtacv4ffH6MZZmxJ1mFmNIfXsw83liw0M9fMvOd7Xdfnui7D8zxPAAAUoO3bt2vfvn3au3evtm3bdtm/79q1S3v27NHq1at18uTJSX+HYRhqbGzU0NBQVu9b8rY7OzvV3t4+o/+mo6NDXV1dKsaP3vne95m211zatRAU6/0GAAAAAACFJznOIElDQ0NqbGykUa7QVjMZk8nF+A1jWQCAfDFpAgBAodq4caMkqbu7e9J/7+rqkiT19PSop6dnyn+ncwIAAAAAAIBiceDAgUn/Pl+GYaijo6Pk269cHicAoLxQ2AEAKFjJgoxkgUa64eFhdXd3a/Xq1VP+TPJ7yQIRIFe2bdumzs5OXmsAAAAAAGBeurq61NPTo507d0qS9u3bR6NMYzZjMozf0BYAUMx8NAEAoFCtXr1aq1evVk9Pj4aHhzO2nUwWbWzbtk27du2adFeP5PfYsQP5eq0CAAAAAADMR3KHjm3btml4eFj79u1Td3c3E/BTmM2YDOM3tAUAFDN27AAAFLSpdu1IL+zYuHHjlDt2rF69OqPjOzw8rF27dumaa66RYRgyDEPXXHONdu3addl/v2vXrtS2jQcOHEj9N9NJ/v6mpqbU77/jjjsmPSpmKsnbvfR3NTU1pe5nV1eXbr755tRt3HzzzZdtzTmbxzqf+37pbXR0dEz6fMzXTG+nu7tbd9xxR8bjmOxxT/f8pv/bpW2yfft2DQ8PZ/yuffv2qaOjI6PAaLa/Y7L2T/5cR0fHlM8bAAAAAAAoDclCjo0bN2r16tWpcbHpdu2YbPzn5ptvzvhv0scouru71dHRkXFUSa7Hy+Zz3690m+ljMld6nJON38z0PswFY1mMZQFANrFjBwCgoCWLMrq7u7V169bU97 7lFsBaYC0AAABen8KOZ/R9H0VRPLlJi4jIsizSNI2maXw7E7kF+QeZBflHbuUWwFpgLQAAAF7Vh4eHhwfD8P1st9uIiNjtdgYDuYUJa5omyrKMtm0jy7LYbDaRpqmBQWZhguq6jqqq5B+5BeAiee4CAAD8Vzp2fCdN08R2u42qqgwGcgsT13VdrNfr2Gw2cX9/H0mSxHq9NjDILEw0/0VRxGaziS9fvkSSJOPbsiC3AEyZ5y4AAMD3orDjO96oRYQ3sJBbuAB1XUeWZZFlWSwWi9jtdtF1nZa5yCxMdL+SpmlkWRYRj9+wb9vWwCC3AFzEehDhuQsAAPDf+RTLd6a1InIL09d1XUREJEky/v+bm5v48uXL2XeSQWZhWvq+H/ct+/3egCC3AFwEz10AAID/6idDAMDcDIfjEeefuHBAjszCdLVtG9vtNpqmibu7OwOC3AIAAAAwGz7FAsBslWUZy+UyVquVN6eQWZi4NE3jcDjE8XiMoih81gK5BQAAAGA2dOwAYJaKooi+7+N4POp6gMzChFVVFREReZ5HxONBeZqm0bat79UjtwAAAADMgo4dAMxOVVXRdV3c3d05IEdm4UKugb7vI+Lx0xYOx5FbAAAAAOZExw4AZqdt22iaJj58+HD294eHB4ODzMLE5HkeXdfFzc3N2PFgt9s5IEduAQAAAJiNDw9OBAAAgInr+z66rnMwjtwCAAAAMDv/A1snaJR/N31NAAAAAElFTkSuQmCC\" alt=\"Nature Fig. 1, 'Training process of Dreamer'. Left panel 'World model learning': Minecraft frames x1..x3 (with vector inputs q1..qN) go through the encoder 'enc' to discrete latents z1..z3 (black-and-white grids); the sequence model's recurrent states h1..h3 (teal boxes) are chained by actions a1, a2 (joystick icons); the decoder 'dec' reconstructs x-hat1..x-hat3. Right panel 'Actor-critic learning': from the encoded z1, the model imagines z-hat2, z-hat3 forward without the encoder, predicting rewards r2, r3, values v1..v3 and actions a1, a2.\" style=\"max-height:217px\"><p class=\"credit\">Figure: DreamerV3 (Hafner et al.), Nature 2025, Fig. 1, CC BY 4.0</p></div><ul><li><b>Left, world model learning</b> on real frames $x_t$: encoder, recurrent state $h_t$, latent $z_t$, decoder. The RSSM from the start of today.</li><li><b>Right, actor-critic learning</b> in imagination: from one real frame the model rolls forward to $\\hat z_2, \\hat z_3$ and predicts actions $a$, rewards $r$ and values $v$. No image is decoded.</li></ul>", "n": ""}, {"t": "Dreamer's actor and critic", "sub": "", "min": 2.5, "sz": "", "html": "<ul><li><b>Critic</b> $v(s)$: regresses onto targets computed from imagined rewards and its own values.</li><li><b>Actor</b> $\\pi(a \\mid s)$: trained to make those targets large.</li><li>The critic lets a $15$-step imagined rollout count rewards long after it ends: stop, and add $\\gamma^{H} v(s_{t+H})$.</li></ul><p>Dreamer v1: $20$ visual control tasks, average $823$ after $5 \\times 10^6$ steps, against PlaNet's $332$ and model-free D4PG's $786$ after $10^8$.</p>", "n": ""}, {"t": "$\\lambda$-returns", "sub": "what the critic is trained on", "min": 3, "sz": "", "html": "<p>An $n$-step return uses $n$ imagined rewards, then the critic: $R^{(n)}_t = r_t + \\cdots + \\gamma^{n-1} r_{t+n-1} + \\gamma^n v(s_{t+n})$. TD used $n = 1$.</p><div class=\"cols\"><div style=\"flex:0.500 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 395 175\" width=\"395\" role=\"img\" aria-label=\"Bar chart of the weight on each n-step return. With a small lambda almost all the weight is on the one-step return; with lambda near 1 the weights are small and spread over long returns.\">\n  <path d=\"M12.6 138.6 L306.4 138.6\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M12.6 138.6 L12.6 18.9\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"154.1\" y=\"159.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">n-step return</text>\n  <path d=\"M18.1 138.6 L30.3 138.6 L30.3 29.8 L18.1 29.8 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M53.4 138.6 L65.7 138.6 L65.7 84.2 L53.4 84.2 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M88.8 138.6 L101.0 138.6 L101.0 111.4 L88.8 111.4 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M124.1 138.6 L136.4 138.6 L136.4 125.0 L124.1 125.0 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M159.5 138.6 L171.7 138.6 L171.7 131.8 L159.5 131.8 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M194.9 138.6 L207.1 138.6 L207.1 135.2 L194.9 135.2 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M230.2 138.6 L242.5 138.6 L242.5 136.9 L230.2 136.9 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M265.6 138.6 L277.8 138.6 L277.8 137.7 L265.6 137.7 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M306.4 36.3 L319.4 36.3 L319.4 23.2 L306.4 23.2 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"331.4\" y=\"29.8\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">λ = 0.5</text>\n  <path d=\"M31.7 138.6 L43.9 138.6 L43.9 127.7 L31.7 127.7 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M67.0 138.6 L79.3 138.6 L79.3 128.2 L67.0 128.2 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M102.4 138.6 L114.6 138.6 L114.6 128.7 L102.4 128.7 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M137.7 138.6 L150.0 138.6 L150.0 129.2 L137.7 129.2 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M173.1 138.6 L185.3 138.6 L185.3 129.7 L173.1 129.7 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M208.5 138.6 L220.7 138.6 L220.7 130.1 L208.5 130.1 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M243.8 138.6 L256.1 138.6 L256.1 130.6 L243.8 130.6 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M279.2 138.6 L291.4 138.6 L291.4 131.0 L279.2 131.0 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <path d=\"M306.4 63.5 L319.4 63.5 L319.4 50.4 L306.4 50.4 Z\" stroke=\"var(--ink)\" stroke-width=\"0.66\" fill=\"var(--ink-faint)\"/>\n  <text x=\"331.4\" y=\"57.0\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">λ = 0.95</text>\n  <text x=\"30.3\" y=\"157.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <text x=\"136.4\" y=\"157.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <text x=\"277.8\" y=\"157.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n</svg></div></div><div style=\"flex:0.470 1 0\"><ul><li>Small $n$: leans on the critic, which may be wrong (<b>bias</b>).</li><li>Large $n$: leans on imagined rewards, which compound errors (<b>variance</b>).</li><li>The $\\lambda$-return weights $R^{(n)}$ by $(1-\\lambda)\\lambda^{n-1}$.</li></ul></div></div><div class=\"eq\">\\[R^\\lambda_t = r_t + \\gamma\\Big((1 - \\lambda)\\,v(s_{t+1}) + \\lambda\\,R^\\lambda_{t+1}\\Big), \\qquad R^\\lambda_H = v(s_H)\\]</div><p><b>Analogy:</b> estimating a drive's arrival time. Ask the sat-nav now, or drive some legs and then ask it; the $\\lambda$-return averages all of these.</p>", "n": ""}, {"t": "DreamerV3 as a reinforcement learner", "sub": "each RL piece, and where it lives", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th>RL piece</th><th>In DreamerV3</th></tr></thead><tbody><tr><td>state $s$</td><td>the model state $(h_t, z_t)$: recurrent memory plus a discrete latent</td></tr><tr><td>transitions $p(s' \\mid s, a)$</td><td>the sequence model and dynamics predictor: the RSSM's prior</td></tr><tr><td>reward $r$</td><td>a <b>reward head</b> on the model state</td></tr><tr><td>episode end</td><td>a <b>continue head</b>: will the episode go on? It scales the discount</td></tr><tr><td>value $v(s)$</td><td>the <b>critic</b>, trained on $\\lambda$-returns</td></tr><tr><td>policy $\\pi(a \\mid s)$</td><td>the <b>actor</b>, trained on advantages</td></tr><tr><td>experience</td><td>imagined $15$-step rollouts from replayed real states</td></tr></tbody></table><p>Every RL quantity is computed from the model state. The actor and critic never see an image.</p>", "n": ""}, {"t": "DreamerV3's training loop", "sub": "three learners, one replay buffer", "min": 3.5, "sz": "", "html": "<ol><li><b>Act:</b> run the actor on the real environment; store frames, actions, rewards and episode ends in a <b>replay buffer</b>.</li><li><b>Learn the model:</b> on replayed sequences, reconstruct frames, predict rewards and ends, and train the prior towards the posterior (the KL).</li><li><b>Imagine:</b> from replayed states, roll forward $15$ steps with the actor and the prior. The heads score every step.</li><li><b>Learn to act:</b> the critic regresses onto $\\lambda$-returns; the actor raises actions whose return beat the critic.</li></ol><div class=\"eq\">\\[\\text{actor: increase } \\pi(a_t \\mid s_t) \\text{ in proportion to } \\frac{R^\\lambda_t - v(s_t)}{\\max(1,\\ S)}\\ \\ +\\ \\text{an entropy bonus}\\]</div><p>$R^\\lambda_t - v(s_t)$ is the actor-critic $\\delta$ with a better target. $S$ is the spread of recent returns, so one setting fits any reward scale.</p>", "n": ""}, {"t": "Why one configuration is hard", "sub": "four fixes, in one table", "min": 2, "sz": "", "html": "<p>DreamerV3 uses one set of hyperparameters on over $150$ tasks in $8$ domains. Rewards, returns and observations differ by orders of magnitude between domains, and so does every loss term; earlier Dreamers retuned for each. DreamerV3 adds four fixes:</p><table class='cmp'><thead><tr><th>Fix</th><th>What it handles</th></tr></thead><tbody><tr><td>symlog, two-hot</td><td>targets of unknown size: a reward of 0.01 and one of 10,000</td></tr><tr><td>free bits, KL balancing</td><td>the world model's KL swamping, or vanishing against, reconstruction</td></tr><tr><td>return normalisation</td><td>the actor's entropy bonus mattering too much or too little</td></tr><tr><td>1% unimix</td><td>categorical distributions going deterministic</td></tr></tbody></table>", "n": ""}, {"t": "Self-supervised learning", "sub": "", "min": 2, "sz": "", "html": "<ul><li><b>Supervised</b> (L05): every input comes with a human label.</li><li><b>Self-supervised:</b> hide part of the data and predict it from the rest. The labels come from the data itself.</li><li>Examples so far: the autoencoder predicts its own input; the world model predicts the next frame.</li></ul><p>The goal is usually the <b>representation</b>: an encoder whose features are useful for other tasks, learned from unlabelled images and video.</p>", "n": ""}, {"t": "Why predict pixels at all?", "sub": "", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 594 166\" width=\"594\" role=\"img\" aria-label=\"Three small diagrams. Joint embedding: x and y are encoded and their codes compared. Generative: x is encoded and a decoder predicts the pixels of y. JEPA: x is encoded, a predictor predicts the code of y, and the comparison is made between codes, not pixels.\">\n  <defs><marker id=\"a81823accent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"a81823ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M25.9 94.9 L75.2 94.9 L75.2 68.0 L25.9 68.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"50.6\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">enc</text>\n  <path d=\"M115.5 94.9 L164.8 94.9 L164.8 68.0 L115.5 68.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"140.2\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">enc</text>\n  <text x=\"50.6\" y=\"125.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x</text>\n  <path d=\"M50.6 112.8 L50.6 95.8\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823ink)\"/>\n  <text x=\"140.2\" y=\"125.8\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">y</text>\n  <path d=\"M140.2 112.8 L140.2 95.8\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823accent2)\"/>\n  <path d=\"M50.6 67.1 L95.4 43.4\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\"/>\n  <path d=\"M140.2 67.1 L95.4 43.4\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\"/>\n  <text x=\"95.4\" y=\"20.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">D</text>\n  <text x=\"95.4\" y=\"151.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">joint embedding</text>\n  <path d=\"M232.0 94.9 L281.3 94.9 L281.3 68.0 L232.0 68.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"256.6\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">enc</text>\n  <path d=\"M321.6 94.9 L370.9 94.9 L370.9 68.0 L321.6 68.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"346.2\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">dec</text>\n  <text x=\"256.6\" y=\"125.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x</text>\n  <path d=\"M256.6 112.8 L256.6 95.8\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823ink)\"/>\n  <text x=\"346.2\" y=\"125.8\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">y</text>\n  <path d=\"M282.6 81.5 L320.3 81.5\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823ink)\"/>\n  <text x=\"346.2\" y=\"42.9\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ŷ pixels</text>\n  <path d=\"M346.2 67.1 L346.2 47.9\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823ink)\"/>\n  <path d=\"M364.2 112.8 L368.6 45.6\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"301.4\" y=\"151.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">generative (MAE, PlaNet)</text>\n  <path d=\"M438.1 94.9 L487.4 94.9 L487.4 68.0 L438.1 68.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"462.7\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">enc</text>\n  <path d=\"M527.7 94.9 L577.0 94.9 L577.0 68.0 L527.7 68.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"552.3\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">enc</text>\n  <text x=\"462.7\" y=\"125.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x</text>\n  <path d=\"M462.7 112.8 L462.7 95.8\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823ink)\"/>\n  <text x=\"552.3\" y=\"125.8\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">y</text>\n  <path d=\"M552.3 112.8 L552.3 95.8\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823accent2)\"/>\n  <path d=\"M482.9 50.1 L532.2 50.1 L532.2 27.7 L482.9 27.7 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"507.5\" y=\"42.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">pred</text>\n  <path d=\"M462.7 67.1 L485.1 43.4\" stroke=\"var(--ink)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a81823ink)\"/>\n  <text x=\"507.5\" y=\"14.3\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ŝ_y</text>\n  <path d=\"M532.6 38.9 L552.3 38.9\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\"/>\n  <path d=\"M552.3 67.1 L552.3 47.9\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"575.2\" y=\"38.9\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">D</text>\n  <text x=\"507.5\" y=\"151.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">JEPA</text>\n</svg><p class=\"cap\">orange: the target $y$ (real data); teal: the model's prediction; $D$: the distance compared</p></div><ul><li>PlaNet and Dreamer learn their state by <b>reconstructing frames</b>. Most of a frame is irrelevant to control: leaves, carpet texture, glare.</li><li>A pixel loss spends capacity on all of it, and punishes a sharp but slightly wrong future more than a blurry average.</li><li><b>Joint-embedding predictive architecture (JEPA):</b> encode both, and predict the target's <i>code</i> from the context's.</li></ul>", "n": ""}, {"t": "I-JEPA", "sub": "1 of 2: what to hide (Assran et al., CVPR 2023)", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.450 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 431 210\" width=\"431\" role=\"img\" aria-label=\"A 14 by 14 grid of image patches. A large context block covers most of it; four smaller target blocks inside it are outlined and removed from the context.\">\n  <path d=\"M10.3 201.5 L24.1 201.5 L24.1 187.7 L10.3 187.7 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 187.7 L24.1 187.7 L24.1 173.9 L10.3 173.9 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 173.9 L24.1 173.9 L24.1 160.1 L10.3 160.1 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 160.1 L24.1 160.1 L24.1 146.2 L10.3 146.2 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 146.2 L24.1 146.2 L24.1 132.4 L10.3 132.4 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 132.4 L24.1 132.4 L24.1 118.6 L10.3 118.6 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 118.6 L24.1 118.6 L24.1 104.8 L10.3 104.8 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 104.8 L24.1 104.8 L24.1 90.9 L10.3 90.9 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 90.9 L24.1 90.9 L24.1 77.1 L10.3 77.1 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path d=\"M10.3 77.1 L24.1 77.1 L24.1 63.3 L10.3 63.3 Z\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"var(--surface)\"/>\n  <path 190.0 187.7 L190.0 21.8 L24.1 21.8 Z\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"224.6\" y=\"31.0\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">context: what the encoder sees</text>\n  <text x=\"224.6\" y=\"59.8\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4 targets: to predict</text>\n</svg><p class=\"cap\">orange: target blocks, the real patches to be predicted; grey: context</p></div></div><div style=\"flex:0.520 1 0\"><ul><li>Cut the image into patches, as a ViT does (L10).</li><li><b>Targets:</b> $4$ blocks, each covering $15$ to $20\\%$ of the image.</li><li><b>Context:</b> one large block, $85$ to $100\\%$, with the targets cut out.</li><li>Targets large enough to need semantics (a dog's head), context big enough to infer them from.</li></ul></div></div>", "n": ""}, {"t": "I-JEPA", "sub": "2 of 2: two encoders and a predictor (redrawn from Fig. 3)", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 555 190\" width=\"555\" role=\"img\" aria-label=\"The context block goes through the context encoder and then the predictor, which is told the positions of the target blocks and outputs predicted codes. The full image goes through the target encoder, a slow moving average of the context encoder that receives no gradient, and its codes at the target blocks are the targets. The loss is the squared distance between the two sets of codes.\">\n  <defs><marker id=\"a121dbaccent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"a121dbaccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"a121dbink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M43.8 72.0 L115.5 72.0 L115.5 41.3 L43.8 41.3 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"79.7\" y=\"61.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">context x</text>\n  <path d=\"M43.8 153.9 L115.5 153.9 L115.5 123.2 L43.8 123.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"79.7\" y=\"143.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">full image</text>\n  <path d=\"M156.5 74.6 L248.6 74.6 L248.6 38.7 L156.5 38.7 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"202.6\" y=\"61.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">f<tspan baseline-shift=\"sub\" font-size=\"72%\">θ</tspan> context enc.</text>\n  <path d=\"M156.5 156.5 L248.6 156.5 L248.6 120.6 L156.5 120.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"202.6\" y=\"143.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">target enc.</text>\n  <text x=\"202.6\" y=\"174.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">f_θ̄, EMA of f_θ</text>\n  <path d=\"M299.8 74.6 L371.5 74.6 L371.5 38.7 L299.8 38.7 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"335.7\" y=\"61.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predictor g<tspan baseline-shift=\"sub\" font-size=\"72%\">φ</tspan></text>\n  <path d=\"M422.7 115.5 L494.4 115.5 L494.4 79.7 L422.7 79.7 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"458.6\" y=\"102.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">‖ ŝ<tspan baseline-shift=\"sub\" font-size=\"72%\">y</tspan> - s<tspan baseline-shift=\"sub\" font-size=\"72%\">y</tspan> ‖<tspan baseline-shift=\"super\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M117.6 56.6 L154.4 56.6\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a121dbink)\"/>\n  <path d=\"M117.6 138.6 L154.4 138.6\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a121dbink)\"/>\n  <path d=\"M250.7 56.6 L297.8 56.6\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a121dbink)\"/>\n  <path d=\"M373.6 56.6 L420.7 87.4\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a121dbaccent)\"/>\n  <text x=\"399.7\" y=\"53.1\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ŝ_y</text>\n  <path d=\"M250.7 138.6 L420.7 107.8\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a121dbaccent2)\"/>\n  <text x=\"335.7\" y=\"136.5\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s<tspan baseline-shift=\"sub\" font-size=\"72%\">y</tspan> at the target blocks</text>\n  <text x=\"335.7\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">+ target positions</text>\n  <path d=\"M202.6 75.6 L202.6 119.6\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#a121dbink)\"/>\n  <text x=\"215.9\" y=\"97.6\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">EMA</text>\n  <text x=\"335.7\" y=\"167.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">no gradient</text>\n</svg><p class=\"cap\">teal: the predicted codes; orange: target codes computed from the real image</p></div><div class=\"eq\">\\[\\mathcal{L} = \\frac{1}{M}\\sum_{i=1}^{M}\\ \\sum_{j \\in B_i} \\big\\| \\hat{s}_{y_j} - s_{y_j} \\big\\|_2^2, \\qquad \\bar\\theta \\leftarrow \\tau\\,\\bar\\theta + (1 - \\tau)\\,\\theta\\]</div><p>The <b>target encoder</b> $\\bar\\theta$ is a slow copy of $\\theta$ ($\\tau$ from $0.996$ to $1$) and gets no gradient. Without that, both encoders could give every image the same code and score a perfect loss: <b>collapse</b>.</p>", "n": ""}, {"t": "How JEPA is being extended", "sub": "follow-up papers", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th>Paper</th><th>Data</th><th>What is hidden and predicted</th><th>What changes</th></tr></thead><tbody><tr><td>I-JEPA (2023)</td><td>images</td><td>codes of large image blocks</td><td>the original: codes, not pixels</td></tr><tr><td>MC-JEPA (2023)</td><td>video frames</td><td>codes, plus optical flow between frames</td><td>learns motion and content in one encoder</td></tr><tr><td>A-JEPA (2023)</td><td>audio</td><td>codes of masked spectrogram patches</td><td>the same recipe on sound</td></tr><tr><td>V-JEPA (2024)</td><td>video</td><td>codes of space-time tubes</td><td>time; features beat pixels on video too</td></tr><tr><td>Point-JEPA (2024)</td><td>point clouds</td><td>codes of hidden groups of points</td><td>3D input</td></tr><tr><td>V-JEPA 2 (2025)</td><td>video, then robot video</td><td>next-frame codes given the arm's action</td><td>actions: a world model; plans with CEM</td></tr></tbody></table><p>The recipe stays fixed: mask, predict codes, slow target encoder. What changes is the data, and in V-JEPA 2, the actions.</p>", "n": ""}, {"t": "Two families of latent world model", "sub": "", "min": 2.5, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>Reconstruction (PlaNet, Dreamer)</th><th>Latent prediction (JEPA)</th></tr></thead><tbody><tr><td>State learned by</td><td>decoding frames (ELBO)</td><td>predicting the codes of hidden parts</td></tr><tr><td>Collapse prevented by</td><td>pixel targets are fixed</td><td>EMA target, stop-gradient</td></tr><tr><td>Actions</td><td>in the model from the start</td><td>none in I-JEPA; added in V-JEPA 2</td></tr><tr><td>Decides by</td><td>CEM (PlaNet) or a trained actor (Dreamer)</td><td>I-JEPA does not act; V-JEPA 2 plans with CEM</td></tr><tr><td>Data</td><td>one task's own experience, with reward</td><td>unlabelled web images or video</td></tr><tr><td>Weak point</td><td>capacity spent on irrelevant pixels</td><td>no reward; actions only added later</td></tr></tbody></table><p>Neither family's state has units or geometry.</p>", "n": ""}, {"t": "Where 3D fits", "sub": "", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 514 164\" width=\"514\" role=\"img\" aria-label=\"Left: a latent state drawn as a bar of twelve numbers, with no axes or units. Right: a small voxel grid with an object two voxels tall, a 3D state measured in metres in which free space and contact can be checked.\">\n  <path d=\"M56.4 86.3 L68.4 86.3 L68.4 45.7 L56.4 45.7 Z\" stroke=\"var(--accent)\" stroke-width=\"0.57\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M70.6 86.3 L82.5 86.3 L82.5 24.0 L70.6 24.0 Z\" stroke=\"var(--accent)\" stroke-width=\"0.57\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M84.7 86.3 L96.7 86.3 L96.7 35.5 L84.7 35.5 Z\" stroke=\"var(--accent)\" stroke-width=\"0.57\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M98.8 86.3 L110.8 86.3 L110.8 31.2 L98.8 31.2 Z\" stroke=\"var(--accent)\" stroke-width=\"0.57\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M113.0 86.3 L125  L174.0 91.4 L163.6 84.8 L152.0 80.8 L139.8 79.4 L127.6 80.8 L116.0 84.8 L105.6 91.4 L96.9 100.1 L90.3 110.5 L86.3 122.1 L84.9 134.3 L86.3 146.5 L90.3 158.1 L96.9 168.5 L105.6 177.2 L116.0 183.8 L127.6 187.8 L139.8 189.2 L152.0 187.8 L163.6 183.8 L174.0 177.2 L182.7 168.5 L189.3 158.1 L193.3 146.5 L194.7 134.3 Z\" stroke=\"var(--ink)\" stroke-width=\"1.71\" fill=\"var(--ground)\"/>\n  <path d=\"M249.6 134.3 L246.9 109.9 L238.7 86.6 L225.7 65.8 L208.3 48.4 L187.4 35.3 L164.2 27.2 L139.8 24.5 L115.4 27.2 L92.1 35.3 L71.3 48.4 L53.9 65.8 L40.8 86.6 L32.7 109.9 L30.0 134.3 L32.7 158.7 L40.8 181.9 L53.9 202.8 L71.3 220.2 L92.1 233.2 L115.4 241.4 L139.8 244.1 L164.2 241.4 L187.4 233.2 L208.3 220.2 L225.7 202.8 L238.7 181.9 L246.9 158.7 L249.6 134.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"98.5\" y=\"77.5\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">F = 0</text>\n  <text x=\"67.2\" y=\"36.8\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">F = 3</text>\n  <circle cx=\"139.8\" cy=\"134.3\" r=\"4.2\" fill=\"var(--ink)\"/>\n  <text x=\"149.8\" y=\"148.3\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">(0, 0)</text>\n  <circle cx=\"172.7\" cy=\"90.4\" r=\"4.2\" fill=\"var(--ink)\"/>\n  <text x=\"182.7\" y=\"104.3\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">(0.6, 0.8)</text>\n  <circle cx=\"249.6\" cy=\"134.3\" r=\"4.2\" fill=\"var(--ink)\"/>\n  <text x=\"259.6\" y=\"148.3\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">(2, 0)</text>\n</svg></div></div><div style=\"flex:0.550 1 0\"><div class=\"eq\">\\[F(x, y) = x^2 + y^2 - 1\\]</div><div class=\"hand\" data-h=\"16\"><p class=\"cue\">Evaluate $F$ at the three dots. Which are inside?</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}F(0, 0) &amp;= -1 \\;(\\text{inside}), \\quad F(0.6, 0.8) = 0 \\;(\\text{on})\\\\ F(2, 0) &amp;= 3 \\;(\\text{outside})\\end{aligned}\\]</div></div><div class=\"panel\" style=\"height:16mm\"></div></div><p>An <b>implicit function</b> stores a shape as a test you can run at any point: negative inside, zero on the boundary, positive outside. Here the boundary $\\{F = 0\\}$ is the unit circle.</p></div></div>", "n": ""}, {"t": "Level sets", "sub": "contour lines of a function", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 280 269\" width=\"280\" role=\"img\" aria-label=\"Concentric circles, the level sets of F = x^2 + y^2 - 1 for c = -0.75, 0, 3; the solid one, F = 0, is the unit circle.\">\n  <path d=\"M8.0 134.3 L271.6 134.3\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M139.8 260.6 L139.8 8.0\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M167.2 134.3 L166.6 128.2 L164.5 122.4 L161.3 117.2 L156.9 112.8 L151.7 109.6 L145.9 107.5 L139.8 106.8 L133.7 107.5 L127.9 109.6 L122.7 112.8 L118.3 117.2 L115.1 122.4 L113.0 128.2 L112.3 134.3 L113.0 140.4 L115.1 146.2 L118.3 151.4 L122.7 155.8 L127.9 159.0 L133.7 161.1 L139.8 161.8 L145.9 161.1 L151.7 159.0 L156.9 155.8 L161.3 151.4 L164.5 146.2 L166.6 140.4 L167.2 134.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"167.8\" y=\"103.7\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">F = -0.75</text>\n  <path d=\"M194.7 134.3 L193.3 122.1 L189.3 110.5 L182.7 100.1 L174.0 91.4 L163.6 84.8 L152.0 80.8 L139.8 79.4 L127.6 80.8 L116.0 84.8 L105.6 91.4 L96.9 100.1 L90.3 110.5 L86.3 122.1 L84.9 134.3 L86.3 146.5 L90.3 158.1 L96.9 168.5 L105.6 177.2 L116.0 183.8 L127.6 187.8 L139.8 189.2 L152.0 187.8 L163.6 183.8 L174.0 177.2 L182.7 168.5 L189.3 158.1 L193.3 146.5 L194.7 134.3 Z\" stroke=\"var(--ink)\" stroke-width=\"1.71\" fill=\"var(--ground)\"/>\n  <text x=\"188.8\" y=\"86.0\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">F = 0</text>\n  <path d=\"M249.6 134.3 L246.9 109.9 L238.7 86.6 L225.7 65.8 L208.3 48.4 L187.4 35.3 L164.2 27.2 L139.8 24.5 L115.4 27.2 L92.1 35.3 L71.3 48.4 L53.9 65.8 L40.8 86.6 L32.7 109.9 L30.0 134.3 L32.7 158.7 L40.8 181.9 L53.9 202.8 L71.3 220.2 L92.1 233.2 L115.4 241.4 L139.8 244.1 L164.2 241.4 L187.4 233.2 L208.3 220.2 L225.7 202.8 L238.7 181.9 L246.9 158.7 L249.6 134.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"230.9\" y=\"50.7\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">F = 3</text>\n</svg></div></div><div style=\"flex:0.550 1 0\"><div class=\"hand\" data-h=\"14\"><p class=\"cue\">Which points have $F = c$? Try $c = -0.75$, $0$, $3$.</p><div class=\"worked\"><p>$x^2 + y^2 = 1 + c$: circles of radius $0.5$, $1$, $2$.</p></div><div class=\"panel\" style=\"height:14mm\"></div></div><p>The <b>level set</b> $\\{\\mathbf{p} : F(\\mathbf{p}) = c\\}$ is every point with value $c$. Like contour lines on a hiking map.</p><p>ONet picks one level, $\\tau$, of a probability, and calls it the surface.</p></div></div>", "n": ""}, {"t": "Inside or outside: a score becomes a probability", "sub": "illustrative scores", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.500 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 366 224\" width=\"366\" role=\"img\" aria-label=\"The S-shaped sigmoid curve in teal, the model's output, rising from 0 to 1 as the score goes from -5 to 5, with the scores 2, 0, -1.4 marked.\">\n  <path d=\"M42.8 164.7 L3 \"183.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-4</text>\n  <text x=\"134.2\" y=\"183.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-2</text>\n  <text x=\"195.1\" y=\"183.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"256.1\" y=\"183.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"317.0\" y=\"183.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <text x=\"34.1\" y=\"45.0\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <text x=\"34.1\" y=\"104.8\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <circle cx=\"256.1\" cy=\"59.3\" r=\"4.6\" fill=\"var(--accent)\"/>\n  <text x=\"266.9\" y=\"73.9\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.881</text>\n  <circle cx=\"195.1\" cy=\"104.8\" r=\"4.6\" fill=\"var(--accent)\"/>\n  <text x=\"206.0\" y=\"119.5\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.500</text>\n  <circle cx=\"152.5\" cy=\"141.0\" r=\"4.6\" fill=\"var(--accent)\"/>\n  <text x=\"163.4\" y=\"155.7\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.198</text>\n</svg></div></div><div style=\"flex:0.470 1 0\"><div class=\"eq\">\\[\\sigma(s) = \\frac{1}{1 + e^{-s}}\\]</div><div class=\"hand\" data-h=\"12\"><p class=\"cue\">$\\sigma$ at $s = 2$, $0$, $-1.4$?</p><div class=\"worked\"><p>$0.881$, $0.500$, $0.198$.</p></div><div class=\"panel\" style=\"height:12mm\"></div></div><p>A network outputs one number $s$ per point. The <b>sigmoid</b> squeezes it into $(0, 1)$: the probability the point is inside.</p></div></div>", "n": ""}, {"t": "The occupancy function", "sub": "1 of 3: a network answers one query", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 640 208\" width=\"640\" role=\"img\" aria-label=\"A point p in R^3 and a latent code z from the encoder both feed a stack of four fully connected blocks whose output, drawn in the predicted colour, is f_theta, a probability between 0 and 1 that p is inside.\">\n  <defs><marker id=\"a36fbbink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a36fbbsoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M77.3 77.9 L162.4 77.9 L162.4 35.4 L77.3 35.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"119.9\" y=\"62.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">p in R<tspan baseline-shift=\"super\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M77.3 163.0 L162.4 163.0 L162.4 120.5 L77.3 120.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"119.9\" y=\"147.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z</text>\n  <path d=\"M229.3 153.9 L265.8 153.9 L265.8 44.5 L229.3 44.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--ground)\"/>\n  <path d=\"M284.0 153.9 L320.5 153.9 L320.5 44.5 L284.0 44.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--ground)\"/>\n  <path d=\"M338.8 153.9 L375.2 153.9 L375.2 44.5 L338.8 44.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--ground)\"/>\n  <path d=\"M393.5 153.9 L430.0 153.9 L430.0 44.5 L393.5 44.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--ground)\"/>\n  <path d=\"M162.4 56.6 L229.3 87.0\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a36fbbink)\"/>\n  <path d=\"M162.4 141.8 L229.3 111.4\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a36fbbink)\"/>\n  <path d=\"M265.8 99.2 L284.0 99.2\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a36fbbsoft)\"/>\n  <path d=\"M320.5 99.2 L338.8 99.2\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a36fbbsoft)\"/>\n  <path d=\"M375.2 99.2 L393.5 99.2\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a36fbbsoft)\"/>\n  <text x=\"360.0\" y=\"16.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">fully connected</text>\n  <path d=\"M430.0 99.2 L472.5 99.2\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a36fbbink)\"/>\n  <path d=\"M478.6 120.5 L588.0 120.5 L588.0 77.9 L478.6 77.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"533.3\" y=\"104.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">f<tspan baseline-shift=\"sub\" font-size=\"72%\">θ</tspan> in [0, 1]</text>\n  <text x=\"119.9\" y=\"191.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">encoder output</text>\n  <text x=\"533.3\" y=\"148.4\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predicted</text>\n</svg></div><div class=\"eq\">\\[f_\\theta(\\mathbf{p}, \\mathbf{z}) \\approx \\Pr\\big(o(\\mathbf{p}) = 1 \\mid \\text{observation}\\big)\\]</div><ul><li>A probability: a sigmoid (two slides back) on the network's output score.</li><li>$\\mathbf{z}$ says <i>which</i> shape: one network stores a whole family.</li></ul>", "n": ""}, {"t": "The occupancy function", "sub": "2 of 3: an encoder per input, one decoder", "min": 1.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 691 192\" width=\"691\" role=\"img\" aria-label=\"Three observed inputs (orange), an image, a point cloud and voxels, each go through their own encoder (ResNet-18, PointNet, 3D CNN) to a latent code z, which conditions one decoder that also takes the query point p.\">\n  <defs><marker id=\"a6cb41ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a6cb41soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M45.1 58.2 L154.5 58.2 L154.5 18.6 L45.1 18.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"99.8\" y=\"43.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">image</text>\n  <path d=\"M197.1 58.2 L318.7 58.2 L318.7 18.6 L197.1 18.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"257.9\" y=\"43.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ResNet-18</text>\n  <path d=\"M154.5 38.4 L197.1 38.4\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a6cb41soft)\"/>\n  <pat ry cross-entropy (BCE)</b>, next slide.</li></ul></div></div><div class=\"eq\">\\[\\mathcal{L}(\\theta, \\psi) = \\sum_{i=1}^{B}\\sum_{j=1}^{K} \\mathrm{BCE}\\big(f_\\theta(\\mathbf{p}_{ij}, g_\\psi(x_i)),\\ o_{ij}\\big)\\]</div>", "n": ""}, {"t": "The loss by hand", "sub": "four sampled points (illustrative predictions)", "min": 4.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.500 1 0\"><div style=\"height:4mm\"></div><div class=\"eq\">\\[\\mathrm{BCE}(f, o) = -\\big[\\,o \\ln f + (1 - o)\\ln(1 - f)\\,\\big]\\]</div></div><div style=\"flex:0.470 1 0\"><table class='cmp'><thead><tr><th>point</th><th>label $o$</th><th>$f_\\theta$</th><th>loss</th></tr></thead><tbody><tr><td>a</td><td>inside</td><td>0.9</td><td>?</td></tr><tr><td>b</td><td>inside</td><td>0.6</td><td>?</td></tr><tr><td>c</td><td>outside</td><td>0.2</td><td>?</td></tr><tr><td>d</td><td>outside</td><td>0.7</td><td>?</td></tr></tbody></table></div></div><div class=\"hand\" data-h=\"19\"><p class=\"cue\">BCE: minus the log of the probability given to the true label. Find each loss, the mean, and $f - o$. Which point is pushed hardest?</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}&amp;-\\ln 0.9 = 0.105, \\quad -\\ln 0.6 = 0.511, \\quad -\\ln(1 - 0.2) = 0.223, \\quad -\\ln(1 - 0.7) = 1.204\\\\ &amp;\\text{mean} = 0.511, \\qquad f - o = -0.1,\\ -0.4,\\ +0.2,\\ +0.7\\end{aligned}\\]</div></div><div class=\"panel\" style=\"height:19mm\"></div></div>", "n": ""}, {"t": "From a function to a mesh: MISE", "sub": "evaluate only near the surface", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.550 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 497 269\" width=\"497\" role=\"img\" aria-label=\"Two square grids over a circle, the surface the network predicts. Left, a coarse grid with the cells that the circle crosses shaded; right, the grid at twice the resolution, with only the subdivided cells along the circle shaded. Everything else is never evaluated again.\">\n to 3 s</b>. A planner checks candidate paths against the forecast without knowing <i>what</i> the obstacle is.</li><li><b>No future labels:</b> lidar only says where each ray stopped.</li></ul>", "n": ""}, {"t": "UnO: occupancy as a 4D field", "sub": "Agro et al., CVPR 2024", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 502 144\" width=\"502\" role=\"img\" aria-label=\"A lidar ray to a return, drawn in the observed colour. Points sampled between the sensor and the return are labelled free; points in a short band just behind the return are labelled occupied; beyond that, nothing is known.\">\n  <circle cx=\"59.7\" cy=\"81.0\" r=\"6.7\" fill=\"var(--ink)\"/>\n  <text x=\"59.7\" y=\"108.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">lidar</text>\n  <path d=\"M59.7 81.0 L424.5 81.0\" stroke=\"var(--rule)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"210.3\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"134.6\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"150.6\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"308.4\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"147.5\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"264.5\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"206.2\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"247.5\" cy=\"81.0\" r=\"4.7\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"351.4\" cy=\"81.0\" r=\"5.7\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"341.7\" cy=\"81.0\" r=\"5.7\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"349.6\" cy=\"81.0\" r=\"5.7\" fill=\"var(--accent-2)\"/>\n  <path d=\"M327.2 111.4 L327.2 32.3\" stroke=\"var(--accent-2)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <text x=\"327.2\" y=\"16.5\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">return</text>\n  <path d=\"M71.8 99.2 v7.3 H315.0 v-7.3\" stroke=\"var(--ink-soft)\" stroke-width=\"1\" fill=\"none\"/>\n  <text x=\"193.4\" y=\"117.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">sampled points: free, o = 0</text>\n  <path d=\"M327.2 62.7 v-7.3 H351.5 v7.3\" stroke=\"var(--accent-2)\" stroke-width=\"1\" fill=\"none\"/>\n  <text x=\"339.4\" y=\"44.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">o = 1</text>\n  <text x=\"385.6\" y=\"81.0\" text-anchor=\"start\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">beyond: unknown</text>\n</svg></div><div class=\"eq\">\\[o_\\theta(x, y, z, t) \\in [0, 1], \\quad \\text{trained with BCE on points labelled from future lidar rays}\\]</div><ul><li>A lidar ray says two things: the space <b>before</b> the hit is empty, and the spot <b>at</b> the hit is full.</li><li>So points before the return are labelled free, points just behind it (within $0.1$ m) occupied. No human labels.</li></ul>", "n": ""}, {"t": "The two occupancies meet", "sub": "", "min": 1.5, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>Occupancy Networks</th><th>UnO</th></tr></thead><tbody><tr><td>Function</td><td>$f_\\theta(\\mathbf{p}, \\mathbf{z})$</td><td>$o_\\theta(x, y, z, t)$</td></tr><tr><td>Extent</td><td>one object, unit cube</td><td>a street, plus time</td></tr><tr><td>Labels</td><td>inside test on a watertight mesh</td><td>free and occupied points along lidar rays</td></tr><tr><td>Sampling</td><td>2,048 points, uniform in a box</td><td>900,000 each side, along rays</td></tr><tr><td>Loss</td><td>BCE</td><td>BCE</td></tr></tbody></table><p>The same recipe in both: sample points, classify each as inside or outside, train with BCE. What changed is where the labels come from.</p>", "n": ""}, {"t": "Learn it again, differently", "sub": "other explanations of today's material", "min": 1, "sz": "", "html": "<ul><li>Sutton and Barto, <a href=\"http://incompleteideas.net/book/the-book-2nd.html\" target=\"_blank\" rel=\"noopener\">Reinforcement Learning: An Introduction</a>, free online: Chapters 3 and 6 cover today's RL slides at a gentler pace.</li><li>The <a href=\"https://danijar.com/project/dreamerv3/\" target=\"_blank\" rel=\"noopener\">DreamerV3 page</a>, with videos of every domain, and Meta's post on <a href=\"https://ai.meta.com/blog/yann-lecun-ai-model-i-jepa/\" target=\"_blank\" rel=\"noopener\">I-JEPA</a>.</li><li>The <a href=\"https://github.com/autonomousvision/occupancy_networks\" target=\"_blank\" rel=\"noopener\">Occupancy Networks code</a>, with MISE in a few hundred lines, and the authors' <a href=\"https://www.cvlibs.net/publications/Mescheder2019CVPR_slides.pdf\" target=\"_blank\" rel=\"noopener\">CVPR 2019 slides</a>.</li><li>The <a href=\"https://tsinghua-mars-lab.github.io/Occ3D/\" target=\"_blank\" rel=\"noopener\">Occ3D benchmark</a>.</li></ul>", "n": ""}, {"t": "What you should be able to do", "sub": "", "min": 1, "sz": "", "html": "<ul><li>Explain return, value, TD learning and actor-critic, and say where each lives in DreamerV3.</li><li>Say how I-JEPA chooses its masks and why it predicts codes, and what later JEPAs change.</li><li>Say what a level set is, and why ONet's surface is the level set at $\\tau = 0.2$.</li><li>Say what Occupancy Networks learn and how they are trained; compute the BCE loss on a few sampled points; explain MISE.</li><li>Say what driving occupancy predicts and what forecasting adds, and how UnO labels points from lidar without human labels.</li></ul>", "n": ""}, {"t": "Next", "sub": "", "min": 1, "sz": "", "html": "<ul><li><b>Response papers due Sun Nov 8:</b> DreamerV3, and Occupancy Networks.</li><li><b>Mon Nov 9: Seminar II</b> (Unit 2) and <b>Wed Nov 11: Seminar III</b> (Unit 3), student-led. I am at <script>
(function(){
  "use strict";
  var flat=[];
  DECK.forEach(function(L){ L.slides.forEach(function(s,i){
    flat.push({lec:L,s:s,i:i,n:L.slides.length});
  });});

  var cur=0, notesOn=false, gridOn=false, mode="a";
  var slideEl=document.getElementById("slide"), countEl=document.getElementById("count"),
      notesEl=document.getElementById("notes"), notesBody=document.getElementById("notesbody"),
      gridEl=document.getElementById("grid"), progEl=document.getElementById("prog"),
      pickEl=null;

  try{ var sm=localStorage.getItem("rob3dp-mode"); if(sm==="a"||sm==="w") mode=sm; }catch(e){}

  function setMode(m){
    mode=m; document.body.setAttribute("data-mode",m);
    try{ localStorage.setItem("rob3dp-mode",m); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
      b.setAttribute("aria-current", b.getAttribute("data-m")===m ? "true":"false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
    b.addEventListener("click",function(){ setMode(b.getAttribute("data-m")); });
  });

  function typeset(el){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([el]).catch(function(){});
    }
  }

  function render(){
    var f=flat[cur];
    slideEl.innerHTML =
      '<p class="s-meta">'+f.lec.num+' &middot; '+f.lec.title+' &middot; '+f.lec.date+
        (f.s.min?(' &middot; '+f.s.min+' min'):'')+'</p>'+
      '<h2>'+f.s.t+'</h2>'+
      (f.s.sub?'<p class="sub">'+f.s.sub+'</p>':'')+
      '<div class="rulel"></div>'+
      '<div class="body'+(f.s.sz?' sm':'')+'">'+f.s.html+'</div>';
    countEl.textContent=(f.i+1)+" / "+f.n;
    if(notesBody) notesBody.textContent=f.s.n||"—";
    progEl.style.width=((cur+1)/flat.length*100)+"%";
    if(gridOn) buildGrid();
    try{ history.replaceState(null,"","#"+f.lec.id+"-s"+(f.i+1)); }catch(e){}
    document.getElementById("stage").scrollTop=0;
    typeset(slideEl);
  }
  function go(i){ if(i<0||i>=flat.length) return; cur=i; render(); }

  function buildGrid(){
    gridEl.innerHTML="";
    flat.forEach(function(f,k){
      var b=document.createElement("button");
      b.className="thumb"; b.type="button";
      b.setAttribute("aria-current",k===cur?"true":"false");
      b.innerHTML='<span class="tn">'+f.lec.num+' &middot; '+(f.i+1)+
        (f.s.min?(' &middot; '+f.s.min+"'"):'')+'</span><span class="tt">'+f.s.t+'</span>';
      b.addEventListener("click",function(){
        gridOn=false; gridEl.classList.remove("on"); go(k);
      });
      gridEl.appendChild(b);
    });
  }

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); go(cur+1); }
    else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(k==="Home"){ e.preventDefault(); go(0); }
    else if(k==="End"){ e.preventDefault(); go(flat.length-1); }
    else if(k==="a"||k==="A"){ setMode("a"); }
    else if(k==="w"||k==="W"){ setMode("w"); }
    else if((k==="s"||k==="S")&&notesEl){ notesOn=!notesOn; notesEl.classList.toggle("on",notesOn); }
    else if(k==="o"||k==="O"){ gridOn=!gridOn; gridEl.classList.toggle("on",gridOn); if(gridOn) buildGrid(); }
    else if(k==="p"||k==="P"){ document.body.classList.toggle("present"); }
    else if(k==="f"||k==="F"){
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
      else { (document.exitFullscreen||function(){}).call(document); }
    }
    else if(k==="Escape"){ gridOn=false; gridEl.classList.remove("on");
      document.body.classList.remove("present"); }
  });

  var x0=null;
  document.addEventListener("touchstart",function(e){ x0=e.changedTouches[0].clientX; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) go(cur+(dx<0?1:-1));
    x0=null;
  },{passive:true});

  var h=(location.hash||"").replace("#","");
  var m=/^(l\d\d)(?:-s(\d+))?$/.exec(h);
