<script>
const DECK = [{"id": "l04", "num": "L04", "title": "Robust estimation, and 3D sensing", "date": "Mon Sep 14, 2026", "slides": [{"t": "Robust estimation, and 3D sensing", "sub": "L04 · Unit 0", "min": 1, "sz": "", "html": "<p class=\"big\">Before any geometry you need matches, and a third of them will be wrong. After that, a camera that moves can build its own map.</p><p>Wednesday ended with the geometry of two views and the question of which points can be matched at all. Today finds the matches, turns them into cameras and 3D points, keeps that running on a moving robot, and ends with sensors that measure depth directly.</p>", "n": ""}, {"t": "Today", "sub": "", "min": 1.5, "sz": "", "html": "<ol><li><b>Features</b> and <b>RANSAC</b>: finding matches when a third of them are wrong.</li><li><b>Triangulation</b>: why two noisy rays need a least-squares answer.</li><li><b>Structure from motion</b> and <b>bundle adjustment</b>.</li><li><b>Visual SLAM</b>: keyframes and loop closure.</li><li><b>Depth sensors</b>: LiDAR, and metric versus relative depth.</li></ol><p>Notes: Modules A4, A5 and A6, then A3. Lab 1 comes out on Friday.</p>", "n": ""}, {"t": "Invariance", "sub": "what a feature has to survive", "min": 3, "sz": "", "html": "<p>So far every transformation was computed from correspondences we were given. Finding them needs a definition first: an <b>invariance</b> is a property that some operation leaves unchanged. You have used one all term:</p><div class=\"eq\">\\[\\begin{bmatrix}x\\\\ y\\\\ 1\\end{bmatrix} \\;\\sim\\; k\\begin{bmatrix}x\\\\ y\\\\ 1\\end{bmatrix}, \\qquad k \\neq 0\\]</div><div class=\"fig\"><svg viewBox=\"0 0 401 97\" width=\"401\" role=\"img\" aria-label=\"The same asymmetric glyph drawn five times: as it is, rotated, scaled down, sheared, and on a darker background. An orange dot marks the same corner of the glyph in each copy.\">\n  <path d=\"M10.4 72.8 L75.1 72.8 L75.1 8.0 L10.4 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <path d=\"M28.0 61.0 L28.0 19.8 L57.5 19.8\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <path d=\"M28.0 38.9 L51.6 38.9\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <circle cx=\"28.0\" cy=\"19.8\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <text x=\"42.7\" y=\"84.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">original</text>\n  <path d=\"M89.8 72.8 L154.6 72.8 L154.6 8.0 L89.8 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <path d=\"M122.0 65.7 L98.3 31.9 L122.5 15.1\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <path d=\"M109.3 47.6 L128.6 34.1\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <circle cx=\"98.3\" cy=\"31.9\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <text x=\"122.2\" y=\"84.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">rotated</text>\n  <path d=\"M169.3 72.8 L234.1 72.8 L234.1 8.0 L169.3 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <path d=\"M193.6 51.7 L193.6 29.0 L209.8 29.0\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <path d=\"M193.6 39.6 L206.6 39.6\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <circle cx=\"193.6\" cy=\"29.0\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <text x=\"201.7\" y=\"84.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">scaled</text>\n  <path d=\"M248.8 72.8 L313.6 72.8 L313.6 8.0 L248.8 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <path d=\"M257.2 56.9 L275.8 23.9 L305.2 23.9\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <path d=\"M267.1 39.2 L290.7 39.2\" stroke=\"var(--ink)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <circle cx=\"275.8\" cy=\"23.9\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <text x=\"281.2\" y=\"84.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">warped</text>\n  <path d=\"M328.3 72.8 L393.1 72.8 L393.1 8.0 L328.3 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--rule-strong)\"/>\n  <path d=\"M346.0 61.0 L346.0 19.8 L375.4 19.8\" stroke=\"var(--ink-soft)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <path d=\"M346.0 38.9 L369.5 38.9\" stroke=\"var(--ink-soft)\" stroke-width=\"2.85\" fill=\"none\"/>\n  <circle cx=\"346.0\" cy=\"19.8\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <text x=\"360.7\" y=\"84.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">darker</text>\n</svg></div><p>A feature has to survive scale, rotation, translation, illumination and geometric distortion such as an affine warp, and still hand back the same point.</p>", "n": ""}, {"t": "A feature transform", "sub": "", "min": 3, "sz": "", "html": "<p>A feature transform $\\mathbf{x} = f(\\mathbf{I})$ maps information to a summary of part of that information, in a different form: an image in, a vector out. A vision-language model is the same shape of object, with different features falling out of the end.</p><div class=\"cols\"><div style=\"flex:0.440 1 0\"><table class='cmp'><thead><tr><th></th><th>which is short for</th></tr></thead><tbody><tr><td>SIFT</td><td>scale invariant feature transform</td></tr><tr><td>SURF</td><td>speeded up robust features</td></tr><tr><td>ORB</td><td>oriented FAST and rotated BRIEF</td></tr><tr><td>BRIEF</td><td>binary robust independent elementary features</td></tr></tbody></table></div><div style=\"flex:0.530 1 0\"><div class=\"fig\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweH  blur then subsample.\">\n  <defs><marker id=\"a3abfbaccent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker></defs>\n  <path d=\"M62.5 186.2 L277.8 186.2 L329.8 134.2 L114.5 134.2 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.33\" fill=\"var(--ground)\"/>\n  <path d=\"M99.6 108.2 L240.7 108.2 L281.5 67.4 L140.5 67.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.33\" fill=\"var(--ground)\"/>\n  <path d=\"M129.3 41.4 L211.0 41.4 L240.7 11.7 L159.0 11.7 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.33\" fill=\"var(--ground)\"/>\n  <path d=\"M84.8 128.6 L114.5 113.8\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\" marker-end=\"url(#a3abfbaccent)\"/>\n  <path d=\"M121.9 61.8 L151.6 47.0\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\" marker-end=\"url(#a3abfbaccent)\"/>\n  <text x=\"64.0\" y=\"93.4\" text-anchor=\"end\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">blur, then</text>\n  <text x=\"64.0\" y=\"106.4\" text-anchor=\"end\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">subsample</text>\n  <text x=\"170.2\" y=\"205.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">full size</text>\n  <text x=\"216.9\" y=\"22.8\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">coarsest</text>\n</svg></div></div><div style=\"flex:0.570 1 0\"><ul><li>Blur, subsample, repeat. Each blur is a <b>local average</b>, so each level keeps only what survives at a coarser scale.</li><li>A feature found at several levels is one whose appearance does not depend on how far away you were standing.</li><li><b>Gaussian</b> and <b>Laplacian</b> pyramids are two choices of filter.</li></ul></div></div><p>So the invariance is obtained by construction rather than assumed.</p>", "n": ""}, {"t": "Matching is a distance", "sub": "", "min": 2.5, "sz": "", "html": "<p>A feature is a vector of numbers, so “is this the same point?” becomes “how close are these two vectors?” Choose a metric, choose a tolerance:</p><div class=\"eq\">\\[\\mathrm{distance}(\\mathbf{f}_1, \\mathbf{f}_2) \\;<\\; \\varepsilon \\quad\\Longrightarrow\\quad \\text{call it a match}\\]</div><ul><li>An <b>inlier</b> is a pair closer than $\\varepsilon$ and an <b>outlier</b> is a pair that is not. Matching hands you plenty of both.</li><li>Brute force compares every feature against every other, and two things go wrong: the features do not land on the same spot of the object in both images, and the region the two images share does not hold the same number of them.</li><li>Two fixes. Sample densely enough that some pair does land close, and estimate in a way that rejects outliers. The second one is RANSAC, after one cheap filter.</li></ul>", "n": ""}, {"t": "The ratio test", "sub": "the cheap filter before RANSAC", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.520 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 412 212\" width=\"412\" role=\"img\" aria-label=\"Two panels of descriptor space. Left: the query's nearest neighbour is much closer than its second nearest, so the match is kept. Right: the two nearest are almost equally far, so it is rejected.\">\n  <path d=\"M8.0 182.7 L177.0 182.7 L177.0 29.1 L8.0 29.1 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <circle cx=\"34.9\" cy=\"59.8\" r=\"2.9\" fill=\"var(--rule-strong)\"/>\n  <circle cx=\"31.0\" cy=\"140.5\" r=\"2.9\" fill=\"var(--rule-strong)\"/>\n  <circle cx=\"150.1\" cy=\"148.2\" r=\"2.9\" fill=\"var(--rule-strong)\"/>\n  <circle cx=\"153.9\" cy=\"56.0\" r=\"2.9\" fill=\"var(--rule-strong)\"/>\n  <circle cx=\"19.5\" cy=\"98.2\" r=\"2.9\" fill=\"var(--rule-strong)\"/> es. The rest are wrong by an arbitrary amount, which is a different problem from noise.</p><div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 321 162\" width=\"321\" role=\"img\" aria-label=\"A scatter of inliers along a line with a cluster of outliers above; the least-squares fit is pulled toward the outliers while the RANSAC fit follows the inliers.\">\n  <path d=\"M8.0 153.6 L235.3 71.3\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <path d=\"M8.0 129.3 L235.3 40.3\" stroke=\"var(--accent-2)\" stroke-width=\"2.09\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <circle cx=\"26.4\" cy=\"145.6\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"47.9\" cy=\"138.9\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"69.4\" cy=\"129.0\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"90.9\" cy=\"124.4\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"112.4\" cy=\"114.3\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"134.0\" cy=\"108.8\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"155.5\" cy=\"98.3\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"177.0\" cy=\"92.8\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"198.5\" cy=\"82.3\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"220.0\" cy=\"76.8\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <path d=\"M80.2 44.9 L80.1 43.8 L79.7 42.9 L79.2 42.0 L78.5 41.3 L77.6 40.7 L76.6 40.4 L75.6 40.3 L74.6 40.4 L73.6 40.7 L72.7 41.3 L72.0 42.0 L71.4 42.9 L71.1 43.8 L71.0 44.9 L71.1 45.9 L71.4 46.9 L72.0 47.7 L72.7 48.5 L73.6 49.0 L74.6 49.4 L75.6 49.5 L76.6 49.4 L77.6 49.0 L78.5 48.5 L79.2 47.7 L79.7 46.9 L80.1 45.9 L80.2 44.9 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <path d=\"M104.8 35.6 L104.7 34.6 L104.3 33.6 L103.8 32.8 L103.0 32.0 L102.2 31.5 L101.2 31.2 L100.2 31.0 L99.1 31.2 L98.2 31.5 L97.3 32.0 L96.6 32.8 L96.0 33.6 L95.7 34.6 L95.6 35.6 L95.7 36.7 L96.0 37.6 L96.6 38.5 L97.3 39.3 L98.2 39.8 L99.1 40.1 L100.2 40.3 L101.2 40.1 L102.2 39.8 L103.0  115.0 L264.3 116.6 L268.7 118.2 L273.2 119.8 L277.7 121.4 L282.2 122.9 L286.7 124.5 L291.1 126.0 L295.6 127.5 L300.1 129.1 L304.6 130.6 L309.1 132.2 L313.5 133.7 L318.0 135.3 L322.5 136.9 L327.0 138.6\" stroke=\"var(--accent-2)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <path d=\"M255.3 72.5 L276.8 72.5\" stroke=\"var(--accent-2)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <text x=\"286.1\" y=\"72.5\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s = 8</text>\n</svg></div></div></div><p class=\"pull\">Read the last column. The minimal sample size sits in an exponent, which is the entire argument for the five-point algorithm.</p>", "n": ""}, {"t": "Making RANSAC work in practice", "sub": "", "min": 3, "sz": "", "html": "<ul><li><b>Adaptive</b> $N$: you do not know $w$ in advance. Re-estimate it from the best inlier count so far and shrink $N$ as you go, usually an order of magnitude cheaper.</li><li><b>The threshold matters most:</b> too tight and every hypothesis has few inliers; too loose and outliers get counted. Set it from your measurement noise, about $3\\sigma$ in pixels.</li><li><b>MSAC</b> scores by truncated squared residual rather than a binary count, which breaks ties between hypotheses with the same inlier set.</li><li><b>LO-RANSAC</b> refits locally on a promising hypothesis before scoring. Cheap, and consistently better.</li></ul>", "n": ""}, {"t": "Triangulation", "sub": "the rays do not meet", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 248 204\" width=\"248\" role=\"img\" aria-label=\"Two camera centres with a ray back-projected from each. The rays pass close to one another but do not intersect; the short segment at their closest approach is marked, with the estimated point in the middle of it.\">\n  <path d=\"M27.3 175.0 L152.0 8.7\" stroke=\"var(--accent)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <path d=\"M220.3 175.0 L99.8 8.7\" stroke=\"var(--accent)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <circle cx=\"27.3\" cy=\"175.0\" r=\"4.1\" fill=\"var(--ink)\"/>\n  <text x=\"27.3\" y=\"190.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <circle cx=\"220.3\" cy=\"175.0\" r=\"4.1\" fill=\"var(--ink)\"/>\n  <text x=\"220.3\" y=\"190.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M124.6 45.5 L132.7 39.2\" stroke=\"var(--accent-2)\" stroke-width=\"2.66\" fill=\"none\"/>\n  <text x=\"155.7\" y=\"45.1\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the rays miss</text>\n  <circle cx=\"128.6\" cy=\"42.3\" r=\"3.8\" fill=\"var(--accent-2)\"/>\n  <text x=\"128.6\" y=\"13.2\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hatX</text>\n  <path d=\"M49.6 145.3 L101.5 130.5\" stroke=\"var(--rule-strong)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <path d=\"M168.4 130.5 L220.3 145.3\" stroke=\"var(--rule-strong)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <circle cx=\"70.4\" cy=\"139.4\" r=\"3.2\" fill=\"var(--ink)\"/>\n  <text x=\"70.4\" y=\"157.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">u<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <circle cx=\"192.9\" cy=\"135.7\" r=\"3.2\" fill=\"var(--ink)\"/>\n  <text x=\"192.9\" y=\"153.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">u<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n</svg></div></div><div style=\"flex:0.550 1 0\"><p>You know the two cameras $\\mathbf{P}_1$, $\\mathbf{P}_2$ and a correspondence $\\mathbf{u}_1 \\leftrightarrow \\mathbf{u}_2$. You want the world point $\\mathbf{X}$ that projects onto both, where $\\pi$ divides out the last coordinate:</p><div class=\"eq\">\\[\\min_{\\mathbf{X}} \\; \\sum_{i=1}^{2} \\big\\| \\pi\\big(\\mathbf{P}_i\\tilde{\\mathbf{X}}\\big) - \\mathbf{u}_i \\big\\|^2\\]</div></div></div><p>With noise in either measurement the two back-projected rays miss each other, so there is nothing to intersect. Start from a linear estimate, the DLT, then minimise this reprojection error, and check that the point has positive depth in both cameras.</p>", "n": ""}, {"t": "Structure from motion", "sub": "", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.550 1 0\"><p>Two or more views of a static scene, taken by one camera that moved. The data are only the images.</p><ul><li><b>Known:</b> the images, and the intrinsics $\\mathbf{K}$, the same at every time step.</li><li><b>Unknown:</b> every camera $\\mathbf{P}_t = \\mathbf{K}[\\mathbf{R}_t \\mid \\mathbf{T}_t]$, which changes because the camera moves, and every 3D point $\\mathbf{X}_j$.</li><li>Two views make a stereo pair with shared intrinsics, except that nobody measured the baseline.</li></ul></div><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 329 287\" width=\"329\" role=\"img\" aria-label=\"A camera at three positions, labelled t equals 0, 1 and 2, joined by arrows marked with the rotation and translation between them. Rays from all three meet at one point of a static scene.\">\n  <defs><marker id=\"a2886fsoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M50.4 213.7 L165.2 34.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M160.3 243.6 L165.2 34.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M270.1 218.7 L165.2 34.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M50.4 213.7 L77.1 200.0 L58.1 184.7 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"50.4\" cy=\"213.7\" r=\"3.8\" fill=\"var(--ink)\"/>\n  <text x=\"50.4\" y=\"236.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">t = 0</text>\n  <path d=\"M160.3 243.6 L174.6 217.3 L150.3 215.4 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"160.3\" cy=\"243.6\" r=\"3.8\" fill=\"var(--ink)\"/>\n  <text x=\"160.3\" y=\"266.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">t = 1</text>\n  <path d=\"M270.1 218.7 L266.6 188.9 L245.6 201.4 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"270.1\" cy=\"218.7\" r=\"3.8\" fill=\"var(--ink)\"/>\n  <text x=\"270.1\" y=\"241.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">t = 2</text>\n  <circle cx=\"135.3\" cy=\"58.9\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"165.2\" cy=\"34.0\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"200.2\" cy=\"53.9\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"150.3\" cy=\"83.9\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"190.2\" cy=\"78.9\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"225.2\" cy=\"39.0\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"175.2\" cy=\"58.9\" r=\"3.4\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"165.2\" cy=\"34.0\" r=\"5.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"165.2\" y=\"15.0\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">X<tspan baseline-shift=\"sub\" font-size=\"72%\">j</tspan></text>\n  <text x=\"248.1\" y=\"34.0\" text-anchor=\"start\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">static scene</text>\n  <path d=\"M65.4 238.6 L140.3 261.1\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a2886fsoft)\"/>\n  <text x=\"102.8\" y=\"269.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan>, T<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M180.2 261.1 L247.6 246.1\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a2886fsoft)\"/>\n  <text x=\"215.2\" y=\"271.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">R<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan>, T<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n</svg></div></div></div>", "n": ""}, {"t": "Incremental structure from motion", "sub": "", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 733 212\" width=\"733\" role=\"img\" aria-label=\"A flow chart. Top row: match the first two images, estimate E with RANSAC, pick R and t, triangulate. Bottom row, repeated for each new image: match to the map, PnP with RANSAC, triangulate new points, bundle adjust.\">\n  <defs><marker id=\"a84c8bink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M148.5 67.9 L268.4 67.9 L268.4 31.0 L148.5 31.0 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"208.4\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">match I<tspan baseline-shift=\"sub\" font-size=\"72%\">0</tspan>, I<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M296.0 67.9 L415.8 67.9 L415.8 31.0 L296.0 31.0 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"355.9\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">E, RANSAC</text>\n  <path d=\"M443.5 67.9 L563.3 67.9 L563.3 31.0 L443.5 31.0 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"503.4\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">pick R, t</text>\n  <path d=\"M590.9 67.9 L710.7 67.9 L710.7 31.0 L590.9 31.0 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"650.8\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">triangulate</text>\n  <path d=\"M148.5 160.1 L268.4 160.1 L268.4 123.2 L148.5 123.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"208.4\" y=\"145.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">bundle adjust</text>\n  <path d=\"M296.0 160.1 L415.8 160.1 L415.8 123.2 L296.0 123.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"355.9\" y=\"145.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">triangulate new</text>\n  <path d=\"M443.5 160.1 L563.3 160.1 L563.3 123.2 L443.5 123.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"503.4\" y=\"145.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">PnP, RANSAC</text>\n  <path d=\"M590.9 160.1 L710.7 160.1 L710.7 123.2 L590.9 123.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"650.8\" y=\"145.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">match to map</text>\n  <path d=\"M270.7 49.5 L293.7 49.5\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M293.7 141.6 L270.7 141.6\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M418.1 49.5 L441.2 49.5\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M441.2 141.6 L418.1 141.6\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M565.6 49.5 L588.6 49.5\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M588.6 141.6 L565.6 141.6\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M650.8 70.2 L650.8 120.9\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <path d=\"M208.4 162.4 L208.4 183.1 L650.8 183.1 L650.8 162.4\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84c8bink)\"/>\n  <text x=\"153.2\" y=\"16.3\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">initialise from two views</text>\n  <text x=\"429.6\" y=\"197.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">repeat for each new image</text>\n</svg></div><p>Set the first camera as the origin. Initialise from two views, then add one image at a time: PnP places it, triangulation adds its new points, and bundle adjustment refines both.</p><p>What you already know changes the order. If some 2D–3D correspondences are known, from a marker or an earlier map, PnP can come first; IMU odometry can seed every pose.</p>", "n": ""}, {"t": "Initialising from two views", "sub": "", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.600 1 0\"><div class=\"hand\" data-h=\"48\"><p class=\"cue\">Recover $\\mathbf{R}$ and $\\mathbf{t}$ from $\\mathbf{E}$</p><div class=\"worked\"><div class=\"eq\">\\[\\mathbf{E} = \\mathbf{U}\\,\\mathrm{diag}(1, 1, 0)\\,\\mathbf{V}^\\top, \\qquad \\mathbf{W} = \\begin{bmatrix} 0 & -1 & 0\\\\ 1 & 0 & 0\\\\ 0 & 0 & 1\\end{bmatrix}\\]</div><div class=\"eq\">\\[\\mathbf{R} \\in \\{\\mathbf{U}\\mathbf{W}\\mathbf{V}^\\top,\\ \\mathbf{U}\\mathbf{W}^\\top\\mathbf{V}^\\top\\}, \\qquad \\mathbf{t} = \\pm\\mathbf{u}_3\\]</div><p>Four candidates. Triangulate one match with each and keep the one whose point has <b>positive depth in both cameras</b>. Since $\\|\\mathbf{t}\\| = 1$, the reconstruction has no scale yet.</p></div><div class=\"panel\" style=\"height:48mm\"></div></div></div><div style=\"flex:0.370 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 228 269\" width=\"228\" role=\"img\" aria-label=\"Four small diagrams of two cameras and a triangulated point. Only in the first is the point in front of both cameras; in the others it lies behind one or both.\">\n  <path d=\"M37.8 53.4 L63.4 11.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M89.0 53.4 L63.4 11.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M37.8 53.4 L44.3 38.8 L31.3 38.8 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"37.8\" cy=\"53.4\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <path d=\"M89.0 53.4 L95.5 38.8 L82.5 38.8 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"89.0\" cy=\"53.4\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <text x=\"27.8\" y=\"53.4\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A</text>\n  <text x=\"98.9\" y=\"53.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B</text>\n  <circle cx=\"63.4\" cy=\"11.8\" r=\"3.3\" fill=\"var(--accent-2)\"/>\n  <text x=\"63.4\" y=\"116.2\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">front of both</text>\n  <path d=\"M146.6 53.4 L172.2 95.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M197.8 53.4 L172.2 95.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M146.6 53.4 L153.1 38.8 L140.1 38.8 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"146.6\" cy=\"53.4\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <path d=\"M197.8 53.4 L204.3 38.8 L191.3 38.8 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"197.8\" cy=\"53.4\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <text x=\"136.6\" y=\"53.4\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A</text>\n  <text x=\"207.7\" y=\"53.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B</text>\n  <circle cx=\"172.2\" cy=\"95.0\" r=\"3.3\" fill=\"var(--ink-faint)\"/>\n  <text x=\"172.2\" y=\"116.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">behind both</text>\n  <path d=\"M37.8 194.2 L63.4 152.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M89.0 194.2 L63.4 152.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M37.8 194.2 L44.3 179.6 L31.3 179.6 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"37.8\" cy=\"194.2\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <path d=\"M89.0 194.2 L82.5 208.9 L95.5 208.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"89.0\" cy=\"194.2\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <text x=\"27.8\" y=\"194.2\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A</text>\n  <text x=\"98.9\" y=\"194.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B</text>\n  <circle cx=\"63.4\" cy=\"152.6\" r=\"3.3\" fill=\"var(--ink-faint)\"/>\n  <text x=\"63.4\" y=\"257.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">behind B</text>\n  <path d=\"M146.6 194.2 L172.2 235.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M197.8 194.2 L172.2 235.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M146.6 194.2 L153.1 179.6 L140.1 179.6 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"146.6\" cy=\"194.2\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <path d=\"M197.8 194.2 L191.3 208.9 L204.3 208.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"197.8\" cy=\"194.2\" r=\"2.4\" fill=\"var(--ink)\"/>\n  <text x=\"136.6\" y=\"194.2\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A</text>\n  <text x=\"207.7\" y=\"194.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B</text>\n  <circle cx=\"172.2\" cy=\"235.8\" r=\"3.3\" fill=\"var(--ink-faint)\"/>\n  <text x=\"172.2\" y=\"257.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">behind A</text>\n</svg></div></div></div>", "n": ""}, {"t": "Adding an image with PnP", "sub": "", "min": 2, "sz": "", "html": "<div class=\"rbox\"><span class=\"rbox-t\">Reminder: PnP</span><p>Perspective-n-Point: you know some 3D points and the pixel where each one appears in a single image, and you want the camera pose $\\mathbf{R}$, $\\mathbf{t}$. Triangulation holds the cameras and solves for a point; PnP holds the points and solves for a camera.</p></div><ul><li>Match the new image to features whose 3D points already exist. Each match is a 2D–3D correspondence.</li><li>Solve PnP inside RANSAC. Three correspondences give up to four poses, and a fourth picks one.</li><li>Refine the pose by minimising reprojection error with the points held fixed.</li><li>Triangulate matches that now have two registered views, and check their cheirality.</li></ul>", "n": ""}, {"t": "Adding an image with PnP, drawn", "sub": "by hand", "min": 3, "sz": "", "html": "<div class=\"hand always\"><p class=\"cue\">Draw the map so far, the new camera, its 2D–3D matches, and the new points it lets you triangulate</p><div class=\"panel\" style=\"height:51mm\"></div></div>", "n": ""}, {"t": "Bundle adjustment", "sub": "everything at once", "min": 2.5, "sz": "", "html": "<div class=\"eq\">\\[\\argmin_{\\{\\mathbf{T}_i\\},\\,\\{\\mathbf{X}_j\\}} \\; \\sum_{i}\\sum_{j \\in \\mathcal{V}(i)} \\rho\\!\\left( \\big\\| \\pi\\!\\left(\\mathbf{K}, \\mathbf{T}_i, \\mathbf{X}_j\\right) - \\mathbf{u}_{ij} \\big\\|^2_{\\boldsymbol{\\Sigma}_{ij}} \\right)\\]</div><div class=\"cols\"><div style=\"flex:0.560 1 0\"><ul><li>Every camera pose and every 3D point, against every observation, in one nonlinear least-squares problem.</li><li>$\\mathbf{K}$ is shared; only $\\mathbf{R}_t$ and $\\mathbf{T}_t$ change from frame to frame.</li><li>$\\rho$ is a robust kernel such as Huber, so a surviving outlier bends the answer instead of breaking it.</li></ul></div><div style=\"flex:0.410 1 0\"><div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2UAAAK9CAIAAAArDlPyAAAAA3NCSVQICAjb4U/gAAAAGXRFWHRTb2Z0d2FyZQBnbm9tZS1zY3JlZW5zaG907wO/PgAAIABJREFUeJzsvT1v1Pj7xvth/6tTBv4oShWBRJEiOgVER1RUEaHaFxAR6TTegoJqi01xpC3oTLEVBcWmOjLKC6DCiIqKIqaimALJKFWEIpw34FNY931u2zOTyeM85PoIrSYej/21Pb9frlz3EwghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCLDb/M+0FCCGmRAb/C8W0lyGEEGLm+W3aCxBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIWaNZNoLEEIIIYQQM0017QUIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBDiJpNCOu01CHEav017AUIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghFp9s2gsQQojRqF+3EEJMmwRWpr0GIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCHEOUmmvQAhhBBCCDHTVNNegLgUMjWaFkKIxef3aS9A3FRuT3sB4lL4NO0FCCGEEEIIIYQQQgghZpgU8mmvQYiLk0M67TUIMbcoHi2EGMsABtNegxAXZ3/aCxBCCCGEEEIIIYQQQgghhBBCCCGEEEIIIYQQQgghhBBCCCGEEGIhKaa9ACGEaPPbtBcghBAikMCHaa9BCCGEEEIIIYQQQgghhBBCCCHEXJBAMu01CCHEBVD+ohBCXDHbsDbtNQghhBBCCCGEEEIIIYQQQgghxHxRKjPvykjUiFEIIYQQC4DE4pWSTnsBQgghhBBCCCHEqfzPtBcghBBXTwEP4OO0lyGEEPOJ+ukIIW4Aj2Aw7TUIIYQQQgghhBBCCCFmmAwSyO3HBDLIr7coRxUqQohFRPFoIcQwovCaFw5hDY5MIK7BITyFvetaQAobI95KoLquZQghhBBCXAfJolhlCZTXeLoUsvN+du4EuhDixvD7tBcghJhJrs2Tu1yS3so3r73S5dO5PpXA0SUvRAghhBBCtBlqJV6nuSiEEAuK8heFEIvCJryy5MXcil2ujdmPJs/+CoUQQgghrpYcKsihgBpqqEw+XoN2nH01NvsrFEIIIYS4clL7bw4lFOGty+qqExv0pJqgLYQQQggxjzQVyql1ZOxTQnneAvCs/XrUQYqrKTC/osMKIYQQQtwIvAdQx1bsS8ahGyekGC1DO6e4Is53ZPmgQgghhBCtHuOlBYvzCzREHHWKSfTirFGb0hVCiLOj+mghxKKwB1smGfcB+A+OhjVETNoe5OSsAbAzh/0pX8MHOJz2MoQQQgghpklhFloW5GAxwgucJAtwaO/Ga27TI4QQQggx90yxRjhtS7fEmumkF5Z0jQE5auLzmOvtOJczWJsyg0sSQsw8ikcLIc6FD0remN4aBhZ3bmhixN9gF46CqjtHKfQaPIAv9mNHfe6FA3ZKpPfgg71Op3pzhpLAs2mvQQjRIVFusRBiUZnZ1oO5/UusYnpCsThmt75b6WFuvw+54tRCiHMx+f9NCSHEwnL9stL/WB+VvNgnm7ix4ryTSNcKIc6M4tFCiKskhZ credit\">Image: OpenCV contrib sfm module docs, Apache-2.0</p></div></div></div>", "n": ""}, {"t": "The same thing as a graph", "sub": "", "min": 3, "sz": "", "html": "<div class=\"fig\">\n<svg viewBox=\"0 0 560 230\" width=\"560\" role=\"img\"\n     aria-label=\"A factor graph: four pose variables in a chain joined by odometry\n     factors, two landmark variables joined by projection factors, a prior on the\n     first pose, and a loop-closure factor between the first and last pose.\">\n  <g stroke=\"var(--ink-soft)\" stroke-width=\"1.2\" fill=\"none\">\n    <path d=\"M62 120 H110 M148 120 H206 M244 120 H302 M340 120 H398 M436 120 H480\"/>\n    <path d=\"M129 120 V78 M129 78 V56 M225 120 V78 M225 78 V56\"/>\n    <path d=\"M321 120 V78 M321 78 V56 M417 120 V78 M417 78 V56\"/>\n    <path d=\"M110 56 H206 M302 56 H398\"/>\n    <path d=\"M110 145 C130 195 210 200 265 200 C320 200 420 195 452 148\"/>\n  </g>\n  <g fill=\"var(--ink)\">\n    <rect x=\"56\"  y=\"114\" width=\"12\" height=\"12\"/>\n    <rect x=\"123\" y=\"114\" width=\"12\" height=\"12\"/>\n    <rect x=\"219\" y=\"114\" width=\"12\" height=\"12\"/>\n    <rect x=\"315\" y=\"114\" width=\"12\" height=\"12\"/>\n    <rect x=\"123\" y=\"72\"  width=\"12\" height=\"12\"/>\n    <rect x=\"219\" y=\"72\"  width=\"12\" height=\"12\"/>\n    <rect x=\"315\" y=\"72\"  width=\"12\" height=\"12\"/>\n    <rect x=\"411\" y=\"72\"  width=\"12\" height=\"12\"/>\n    <rect x=\"259\" y=\"194\" width=\"12\" height=\"12\"/>\n  </g>\n  <g stroke-width=\"1.6\">\n    <circle cx=\"110\" cy=\"120\" r=\"21\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <circle cx=\"206\" cy=\"120\" r=\"21\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <circle cx=\"302\" cy=\"120\" r=\"21\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <circle cx=\"398\" cy=\"120\" r=\"21\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <circle cx=\"158\" cy=\"46\"  r=\"21\" fill=\"var(--accent-2-soft)\" stroke=\"var(--accent-2)\"/>\n    <circle cx=\"350\" cy=\"46\"  r=\"21\" fill=\"var(--accent-2-soft)\" stroke=\"var(--accent-2)\"/>\n  </g>\n  <g font-family=\"Georgia,serif\" font-size=\"15\" fill=\"var(--ink)\"\n     text-anchor=\"middle\" dominant-baseline=\"middle\">\n    <text x=\"110\" y=\"121\">T&#8321;</text>\n    <text x=\"206\" y=\"121\">T&#8322;</text>\n    <text x=\"302\" y=\"121\">T&#8323;</text>\n    <text x=\"398\" y=\"121\">T&#8324;</text>\n    <text x=\"158\" y=\"47\">X&#8321;</text>\n    <text x=\"350\" y=\"47\">X&#8322;</text>\n  </g>\n  <g font-family=\"Georgia,serif\" font-size=\"12\" fill=\"var(--ink-soft)\">\n    <text x=\"18\" y=\"124\">prior</text>\n    <text x=\"265\" y=\"222\" text-anchor=\"middle\">loop closure</text>\n  </g>\n</svg>\n</div><ul><li><b>Circles</b> are unknowns: poses $\\mathbf{T}_i$ and landmarks $\\mathbf{X}_j$. <b>Squares</b> are factors, one per measurement.</li><li>Reading this one: a prior pins $\\mathbf{T}_1$, odometry links neighbouring poses, each landmark links the poses that saw it, and a loop closure links $\\mathbf{T}_1$ to $\\mathbf{T}_4$.</li></ul>", "n": ""}, {"t": "Factor graphs, one square at a time", "sub": "", "min": 2.5, "sz": "", "html": "<p>A factor graph draws an estimation problem. Each circle is something you do not know. Each square is something you measured or assume, and it touches only the circles that measurement depends on.</p><table class='cmp'><thead><tr><th>Factor</th><th>Connects</th><th>Its residual is small when</th></tr></thead><tbody><tr><td>Prior</td><td>one pose</td><td>the pose sits where we put the origin</td></tr><tr><td>Odometry</td><td>two consecutive poses</td><td>their relative motion matches what the wheels or the IMU measured</td></tr><tr><td>Projection</td><td>one pose, one landmark</td><td>the landmark projects onto the pixel where it was seen</td></tr><tr><td>Loop closure</td><td>two distant poses</td><td>the two frames agree that they saw the same place</td></tr></tbody></table><p>Solving the graph means choosing every circle so that all the squares are satisfied together, in the least-squares sense: $\\sum_k \\|\\mathbf{r}_k\\|^2_{\\boldsymbol{\\Sigma}_k}$, one term per square. A new sensor adds a new kind of square; the solver stays the same.</p>", "n": ""}, {"t": "Structure from motion, odometry, SLAM", "sub": "", "min": 2, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>Input</th><th>Output</th><th>How it runs</th></tr></thead><tbody><tr><td>Structure from motion</td><td>a set of images, in any order</td><td>poses and 3D points</td><td>offline, all at once</td></tr><tr><td>Visual odometry</td><td>a video stream</td><td>the camera trajectory</td><td>online, frame to frame</td></tr><tr><td>Visual SLAM</td><td>a video stream</td><td>the trajectory and a map it reuses</td><td>online, with keyframes and loop closure</td></tr></tbody></table><p>Odometry chains relative poses, so small errors add up into <b>drift</b>. Nothing inside odometry can remove it. SLAM removes it by recognising a place it has already mapped.</p>", "n": ""}, {"t": "Visual SLAM, step by step", "sub": "", "min": 2, "sz": "", "html": "<ol><li>Set the first frame as the origin.</li><li>Run structure from motion on the first frames: correspondences, triangulation, PnP.</li><li>Bundle adjust to refine the poses and points.</li><li>Add a <b>keyframe</b> when the view has changed enough that too few correspondences overlap.</li><li>Keep doing structure from motion relative to the current keyframe.</li><li>Detect loops: compare each new keyframe with the earlier ones. A match means the same 3D point seen again.</li><li>At every loop, bundle adjust over the keyframes to remove the drift.</li></ol><p class=\"pull\">Noise gets handled at three scales: SVD inside the geometry, bundle adjustment inside structure from motion, and bundle adjustment across keyframes.</p>", "n": ""}, {"t": "Visual SLAM, drawn", "sub": "by hand, 1 of 2", "min": 4, "sz": "", "html": "<div class=\"hand always\"><p class=\"cue\">Draw the camera moving around a loop: keyframes, the points they share, and the drift</p><div class=\"panel\" style=\"height:51mm\"></div></div>", "n": ""}, {"t": "Visual SLAM, walked through", "sub": "by hand, 2 of 2", "min": 4, "sz": "", "html": "<div class=\"hand always\"><p class=\"cue\">Walk the steps over the drawing: track, add a keyframe, detect the loop, correct</p><div class=\"panel\" style=\"height:51mm\"></div></div>", "n": ""}, {"t": "Tracking and local mapping", "sub": "", "min": 2, "sz": "", "html": "<ul><li><b>Tracking, every frame:</b> predict the pose from the last motion, project nearby map points into the image, match them, and solve for this frame's pose alone.</li><li><b>Mapping, every keyframe:</b> triangulate new points against neighbouring keyframes, then bundle adjust a local window of keyframes and their points while older keyframes stay fixed.</li><li><b>When to add a keyframe:</b> for example when the share of map points still tracked falls below a threshold, or when many frames have passed since the last one.</li></ul><p class=\"pull\">Keyframes keep bundle adjustment small enough to run while the robot is still moving.</p>", "n": ""}, {"t": "Loop closure", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.540 1 0\"><ul><li><b>Recognise the place:</b> describe each keyframe as a histogram of visual words, which are quantised descriptors, and look for an earlier keyframe with a similar histogram.</li><li><b>Verify it:</b> match features between the two keyframes and fit their relative pose with RANSAC. Keep the loop only if enough inliers agree.</li><li><b>Correct it:</b> add the loop as a constraint, optimise the pose graph, then bundle adjust. Past keyframes move too.</li></ul></div><div style=\"flex:0.430 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 327 284\" width=\"327\" role=\"img\" aria-label=\"A square loop of keyframes. The drifting estimate, dashed, ends away from where it started; a dotted loop-closure edge joins its last keyframe to the first, and the corrected loop closes.\">\n  <path d=\"M72.8 197.7 L150.2 191.0 L226.7 177.5 L301.8 157.4 L275.2 84.3 L242.4 13.9 L175.1 52.7 L111.4 97.3 L51.9 147.3 L106.8 202.2 L166.4 252.2\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M156.1 191.0 L155.9 189.7 L155.5 188.4 L154.8 187.3 L153.9 186.4 L152.7 185.7 L151.5 185.2 L150.2 185.1 L148.9 185.2 L147.6 185.7 L146.5 186.4 L145.6 187.3 L144.9 188.4 L144.5 189.7 L144.3 191.0 L144.5 192.3 L144.9 193.5 L145.6 194.6 L146.5 195.6 L147.6 196.3 L148.9 196.7 L150.2 196.9 L151.5 196.7 L152.7 196.3 L153.9 195.6 L154.8 194.6 L155.5 193.5 L155.9 192.3 L156.1 191.0 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <path d=\"M232.6 177.5 L232.5 176.2 L232.0 174.9 L231.3 173.8 L230.4 172.9 L229.3 172.2 L228.0 171.7 L226.7 171.6 L225.4 171.7 L224.2 172.2 L223.1 172.9 L222.1 173.8 L221.4 174.9 L221.0 176.2 L220.8 177.5 L221.0 178.8 L221.4 180.0 L222.1 181.1 L223.1 182.1 L224.2 182.8 L225.4 183.2 L226.7 183.4 L228.0 183.2 L229.3 182.8 L230.4 182.1 L231.3 181.1 L232.0 180.0 L232.5 178.8 L232.6 177.5 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <path d=\"M307.7 157.4 L307.5 156.1 L307.1 154.8 L306.4 153.7 L305.5 152.8 L304.4 152.1 L303.1 151.6 L301.8 151.5 L300.5 151.6 L299.3 152.1 L298.1 152.8 L297.2 153.7 L296.5 154.8 L296.1 156.1 L295.9 157.4 L296.1 158.7 L296.5 159.9 L297.2 161.0 L298.1 162.0 L299.3 162.7 L300.5 163.1 L301.8 163.3 L303.1 163.1 L304.4 162.7 L305.5 162.0 L306.4 161.0 L307.1 159.9 L307.5 158.7 L307.7 157.4 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <path d=\"M281.1 84.3 L281.0 83.0 L280.5 81.8 L279.8 80.7 L278.9 79.7 L277.8 79.0 L276.5 78.6 L275.2 78.4 L273.9 78.6 L272.7 79.0 L271.6 79.7 L270.6 80.7 L269.9 81.8 L269.5 83.0 L269.3 84.3 L269.5 85.6 L269.9 86.9 L270.6 88.0 H/AINrz/41S/8ADMPx3/6KNpP/AINrz/41QBoeKmT+13UMCRGuRnpXkvx3ZB4ask3DcbsEDPJARv8AEV6JJ+yr8bJJGlk8eaG7tjczandknHTnyaq337IvxdvkVL3xf4auUU5VZb+6YA+vMNAH2p8K/wDkmHhT/sC2f/ohKKu+CdNn0bwZoekXLxvPY6db20rRklSyRqpIyAcZHcCigD//2Q==\" alt=\"The Tsukuba stereo image (a lamp, statue head and bookshelves) beside its block-matching disparity map, with brighter meaning closer.\" style=\"max-height:133px\"><p class=\"credit\">Image: OpenCV depth map tutorial, Apache-2.0</p></div></div></div><p>Rectify, so epipolar lines become rows and matching is a search along one row. Then $Z = fB/d$ with disparity $d = x_L - x_R$. For example, $f = 500$ px, $B = 1$ m and $d = 100$ px give $Z = 5$ m.</p>", "n": ""}, {"t": "How a LiDAR makes a point", "sub": "", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.400 1 0\"><div style=\"height:6mm\"></div><div class=\"fig\"><svg viewBox=\"0 0 385 127\" width=\"385\" role=\"img\" aria-label=\"Two views of one LiDAR return. Top view: the beam leaves the sensor at azimuth theta. Side view: the same beam at elevation phi, with its height marked as r sin phi.\">\n  <defs><marker id=\"a12a77rules\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--rule-strong)\"/></marker></defs>\n  <path d=\"M21.6 96.2 L141.5 96.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a12a77rules)\"/>\n  <text x=\"148.4\" y=\"96.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x</text>\n  <path d=\"M21.6 96.2 L21.6 23.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a12a77rules)\"/>\n  <text x=\"21.6\" y=\"12.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">y</text>\n  <path d=\"M21.6 96.2 L108.1 46.3\" stroke=\"var(--accent)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <path d=\"M51.6 96.2 L51.6 95.6 L51.6 95.1 L51.5 94.5 L51.5 94.0 L51.5 93.4 L51.4 92.8 L51.3 92.3 L51.3 91.7 L51.2 91.2 L51.1 90.6 L51.0 90.1 L50.8 89.5 L50.7 89.0 L50.6 88.4 L50.4 87.9 L50.3 87.4 L50.1 86.8 L49.9 86.3 L49.7 85.8 L49.5 85.2 L49.3 84.7 L49.1 84.2 L48.9 83.7 L48.6 83.2 L48.4 82.7 L48.1 82.2 L47.9 81.7 L47.6 81.2\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"60.2\" y=\"88.2\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">θ</text>\n  <text x=\"58.2\" y=\"60.6\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">rcosφ</text>\n  <circle cx=\"108.1\" cy=\"46.3\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"21.6\" cy=\"96.2\" r=\"3.4\" fill=\"var(--ink)\"/>\n  <text x=\"81.5\" y=\"114.8\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">top view</text>\n  <path d=\"M194.7 96.2 L314.5 96.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a12a77rules)\"/>\n  <text x=\"321.5\" y=\"96.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">horizontal</text>\n  <path d=\"M194.7 96.2 L194.7 42.9\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a12a77rules)\"/>\n  <text x=\"194.7\" y=\"32.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z</text>\n  <path d=\"M194.7 96.2 L291.6 72.0\" stroke=\"var(--accent)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <path d=\"M224.7 96.2 L224.7 95.9 L224.6 95.7 L224.6 95.4 L224.6 95.1 L224.6 94.9 L224.6 94.6 L224.6 94.4 L224.6 94.1 L224.6 93.8 L224.5 93.6 L224.5 93.3 L224.5 93.1 L224.5 92.8 L224.4 92.5 L224.4 92.3 L224.4 92.0 L224.3 91.8 L224.3 91.5 L224.2 91.2 L224.2 91.0 L224.2 90.7 L224.1 90.5 L224.1 90.2 L224.0 90.0 L223.9 89.7 L223.9 89.5 L223.8 89.2 L223.8 88.9\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"233.3\" y=\"91.5\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">φ</text>\n  <text x=\"236.5\" y=\"73.5\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">r</text>\n  <path d=\"M291.6 72.0 L291.6 96.2\" stroke=\"var(--ink-soft)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"300.2\" y=\"84.1\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">rsinφ</text>\n  <circle cx=\"291.6\" cy=\"72.0\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"194.7\" cy=\"96.2\" r=\"3.4\" fill=\"var(--ink)\"/>\n  <text x=\"254.6\" y=\"114.8\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">side view</text>\n</svg></div></div><div style=\"flex:0.570 1 0\"><div class=\"hand\" data-h=\"44\"><p class=\"cue\">Turn one timed return into a 3D point</p><div class=\"worked\"><div class=\"eq\">\\[r = \\frac{c\\,\\Delta t}{2}\\]</div><div class=\"eq\">\\[x = r\\cos\\phi\\cos\\theta, \\qquad y = r\\cos\\phi\\sin\\theta, \\qquad z = r\\sin\\phi\\]</div><p>Example: $\\Delta t = 66.7$ ns gives $r = 10.0$ m. At azimuth $\\theta = 30^\\circ$ and elevation $\\phi = -2^\\circ$ the point is $(8.65, 5.00, -0.35)$ m.</p></div><div class=\"panel\" style=\"height:44mm\"></div></div></div></div><p>A spinning unit fires a fixed set of elevation angles $\\phi$ and sweeps $\\theta$ through $360^\\circ$. Every return is already in metres.</p>", "n": ""}, {"t": "LiDAR scans", "sub": "", "min": 2, "sz": "", "html": "<ul><li><b>Spinning</b> units sweep $360^\\circ$ with a fixed set of elevation beams. <b>Solid-state</b> units have no moving parts, a narrower field of view, and a lower price.</li><li>Each beam traces a ring, so the cloud is dense along a ring and sparse between rings: a 32-beam unit at 20 m has rings about 40 cm apart.</li><li>Points arrive over the sweep, so a moving robot measures one scan from many poses.</li></ul><div class=\"cols\"><div style=\"flex:0.520 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 479 148\" width=\"479\" role=\"img\" aria-label=\"Side view of a LiDAR on a mast firing five beams at a wall. The beams spread apart with distance. A thin table edge floats between the two lowest beams and none of them touches it.\">\n  <path d=\"M32.9 120.9 L337.0 120.9\" stroke=\"var(--rule-strong)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <path d=\"M323.2 120.9 L323.2 10.3\" stroke=\"var(--ink)\" stroke-width=\"2.47\" fill=\"none\"/>\n  <path d=\"M46.7 120.9 L46.7 72.5\" stroke=\"var(--ink-soft)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <path d=\"M46.7 72.5 L323.2 116.3\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"323.2\" cy=\"116.3\" r=\"2.6\" fill=\"var(--accent)\"/>\n  <path d=\"M46.7 72.5 L323.2 94.3\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"323.2\" cy=\"94.3\" r=\"2.6\" fill=\"var(--accent)\"/>\n  <path d=\"M46.7 72.5 L323.2 72.5\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"323.2\" cy=\"72.5\" r=\"2.6\" fill=\"var(--accent)\"/>\n  <path d=\"M46.7 72.5 L323.2 50.8\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"323.2\" cy=\"50.8\" r=\"2.6\" fill=\"var(--accent)\"/>\n  <path d=\"M46.7 72.5 L323.2 28.7\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"323.2\" cy=\"28.7\" r=\"2.6\" fill=\"var(--accent)\"/>\n  <circle cx=\"46.7\" cy=\"72.5\" r=\"4.1\" fill=\"var(--ink)\"/>\n  <text x=\"36.0\" y=\"72. PZgdEf78aQX1vS062RrrYWI671bskKa8J3fgHz7cOHAhvY9a+KoXhKW+r9Taa/b2nXv88ocOHBRy/RyklcRw2IY7lVC2oZfYd2u4g+4Oh7/ABw4cCSWjC+EGVj7ozJdaERb2qr29w8+/wDHFnDhwUDnxXrHqDJ2OpbrR2Za6IGqhI3IBj35U/kEjZ4cOStcJaWUm6sz9Kv1AiTqiTd0kCLDK57dgswHnRA+PbxxDeo/TUaVn1e/6pHbt7ddva2vffnhw5l0UuHzvhw4DqvmpLt2f+swJk5L8sImsTH++qqRsI/+kkDW9HxzvKYiuMTczVVnhgTJtUirN95Ve0sCX8bI9vbhw4CLhw4cCzTv3Kde3BVsvDFbi9Gwq+0ib3o/xsA8dWkxmS6ekyUGNWhYS3BVVYZD6fb2HuYqfJYkb3v/AG4cOBuf096fhw2YzMZm+olryrXWQp2+O0MTrZ17/wDw5tOHDmp6cuvY5MbU7RwRSSGSKuSY438qNnZGv54cOVF+9WjlxlbJgCKS3ZkVo0ACIBrXaP8AfithpiPwdcOHBX//2Q==\" alt=\"Single-sweep lidar point cloud of a street scene with trees, pedestrians, a car and crosswalks; the concentric elevation rings on the ground are clearly visible.\" style=\"max-height:140px\"><p class=\"credit\">Image: Shvicha, CC BY-SA 4.0, via Wikimedia Commons</p></div></div></div>", "n": ""}, {"t": "Metric versus relative depth", "sub": "", "min": 2, "sz": "", "html": "<p>Metric depth is in metres. Relative depth gets the ordering and the shape right but not the size, and a planner or a gripper needs the size.</p><table class='cmp'><thead><tr><th>Source</th><th>What you get</th><th>Where the metres come from</th></tr></thead><tbody><tr><td>Stereo</td><td>metric</td><td>the baseline $B$, measured once</td></tr><tr><td>LiDAR, time of flight</td><td>metric</td><td>the speed of light and a time</td></tr><tr><td>Monocular SfM or SLAM</td><td>metric up to one global scale</td><td>nowhere: no image fixes it</td></tr><tr><td>Monocular depth network</td><td>relative: scale and shift unknown per image</td><td>nowhere: trained to ignore them</td></tr><tr><td>Metric depth network</td><td>approximately metric</td><td>the intrinsics, or training on one camera</td></tr></tbody></table>", "n": ""}, {"t": "Why monocular reconstruction has no scale", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.560 1 0\"><div class=\"hand\" data-h=\"34\"><p class=\"cue\">Scale the scene and the translation together</p><div class=\"worked\"><div class=\"eq\">\\[\\tilde{\\mathbf{u}} \\sim \\mathbf{K}(\\mathbf{R}\\mathbf{X} + \\mathbf{t})\\]</div><div class=\"eq\">\\[\\mathbf{K}\\big(\\mathbf{R}\\,(s\\mathbf{X}) + s\\,\\mathbf{t}\\big) = s\\,\\mathbf{K}(\\mathbf{R}\\mathbf{X} + \\mathbf{t}) \\sim \\tilde{\\mathbf{u}}\\]</div><p>Every pixel is unchanged for every $s &gt; 0$. Rotations are unaffected; points and translations only have a shape.</p></div><div class=\"panel\" style=\"height:34mm\"></div></div></div><div style=\"flex:0.410 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 307 276\" width=\"307\" role=\"img\" aria-label=\"Two cameras a baseline t apart see a point X. Doubling the baseline and the point's position gives rays parallel to the originals, so both cameras record the same pixels.\">\n  <path d=\"M47.9 187.7 L97.9 28.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M97.9 187.7 L72.9 107.8\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <path d=\"M147.8 187.7 L97.9 28.0\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M47.9 187.7 L58.1 164.9 L37.8 164.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"47.9\" cy=\"187.7\" r=\"3.8\" fill=\"var(--ink)\"/>\n  <path d=\"M97.9 187.7 L108.0 164.9 L87.7 164.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"var(--accent-soft)\"/>\n  <circle cx=\"97.9\" cy=\"187.7\" r=\"3.8\" fill=\"var(--ink)\"/>\n  <path d=\"M147.8 187.7 L157.9 164.9 L137.6 164.9 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"var(--accent-2-soft)\"/>\n  <circle cx=\"147.8\" cy=\"187.7\" r=\"3.8\" fill=\"var(--ink)\"/>\n  <circle cx=\"72.9\" cy=\"107.8\" r=\"5.1\" fill=\"var(--accent)\"/>\n  <circle cx=\"97.9\" cy=\"28.0\" r=\"5.1\" fill=\"var(--accent-2)\"/>\n  <text x=\"57.4\" y=\"107.8\" text-anchor=\"end\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">X</text>\n  <text x=\"113.3\" y=\"28.0\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2X</text>\n  <path d=\"M47.9 207.7 L97.9 207.7\" stroke=\"var(--accent)\" stroke-width=\"1\" fill=\"none\"/>\n  <path d=\"M47.9 203.7 v8 M97.9 203.7 v8\" stroke=\"var(--accent)\" stroke-width=\"1\"/>\n  <text x=\"72.9\" y=\"220.7\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">t</text>\n  <path d=\"M47.9 237.6 L147.8 237.6\" stroke=\"var(--accent-2)\" stroke-width=\"1\" fill=\"none\"/>\n  <path d=\"M47.9 233.6 v8 M147.8 233.6 v8\" stroke=\"var(--accent-2)\" stroke-width=\"1\"/>\n  <text x=\"97.9\" y=\"250.6\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">2t</text>\n  <text x=\"170.7\" y=\"117.8\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">same rays, same pixels</text>\n</svg></div></div></div><p>This is L01's doll's house. The two-view initialisation set $\\|\\mathbf{t}\\| = 1$ for exactly this reason.</p>", "n": ""}, {"t": "Where learned depth fits", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.600 1 0\"><ul><li><b>Monocular depth networks</b> such as MiDaS and Depth Anything predict depth from one image, and they are good at <i>relative</i> depth.</li><li>Most are trained with a scale- and shift-invariant loss, so the output is correct only up to $aZ + b$, with $a$ and $b$ unknown for each image.</li><li><b>Metric</b> variants take the scale from the intrinsics or from training on one camera; <b>depth completion</b> takes it from sparse LiDAR returns. Either way it comes from the sensor or the body, never from the image.</li></ul></div><div style=\"flex:0.370 1 0\"><div class=\"fig\"> =\"193.6\" y=\"28.8\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">metric</text>\n  <text x=\"193.6\" y=\"64.6\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">network: aZ + b</text>\n  <text x=\"114.9\" y=\"150.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">true depth</text>\n  <text x=\"54.4\" y=\"20.8\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predicted</text>\n</svg></div></div></div>", "n": ""}, {"t": "Recovering metric scale", "sub": "", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.570 1 0\"><div class=\"hand\" data-h=\"42\"><p class=\"cue\">Fit a scale and a shift to the LiDAR returns that land in the image</p><div class=\"worked\"><div class=\"eq\">\\[\\min_{a, b} \\; \\sum_i \\big(a\\,d_i + b - z_i\\big)^2\\]</div><div class=\"eq\">\\[\\begin{bmatrix}\\sum d_i^2 & \\sum d_i\\\\ \\sum d_i & n\\end{bmatrix}\\begin{bmatrix}a\\\\ b\\end{bmatrix} = \\begin{bmatrix}\\sum d_i z_i\\\\ \\sum z_i\\end{bmatrix}\\]</div><p>Example: $d = (0.20, 0.35, 0.50, 0.80)$ and $z = (1.9, 3.1, 4.4, 6.7)$ m give $\\sum d_i = 1.85$, $\\sum d_i^2 = 1.0525$, $\\sum d_i z_i = 9.025$ and $\\sum z_i = 16.1$, so $a = 8.02$ and $b = 0.32$.</p></div><div class=\"panel\" style=\"height:42mm\"></div></div></div><div style=\"flex:0.400 1 0\"><div style=\"height:4mm\"></div><div class=\"fig\"><svg viewBox=\"0 0 346 246\" width=\"346\" role=\"img\" aria-label=\"Four points plotting LiDAR depth against a network's relative depth, with a fitted straight line through them.\">\n  <path d=\"M86.9 190.2 L316.5 190.2\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M86.9 190.2 L86.9 30.5\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"86.9\" y=\"209.2\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.0</text>\n  <text x=\"196.7\" y=\"209.2\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <text x=\"306.5\" y=\"209.2\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1.0</text>\n  <text x=\"72.9\" y=\"115.3\" text-anchor=\"end\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4 m</text>\n  <text x=\"72.9\" y=\"40.4\" text-anchor=\"end\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8 m</text>\n  <path d=\"M86.9 184.3 L306.5 34.2\" stroke=\"var(--accent)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <circle cx=\"130.8\" cy=\"154.6\" r=\"4.7\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"163.8\" cy=\"132.2\" r=\"4.7\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"196.7\" cy=\"107.8\" r=\"4.7\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"262.6\" cy=\"64.8\" r=\"4.7\" fill=\"var(--accent-2)\"/>\n  <text x=\"196.7\" y=\"230.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">network output d</text>\n  <text x=\"102.3\" y=\"28.0\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">LiDAR depth z</text>\n  <text x=\"218.1\" y=\"72.7\" text-anchor=\"end\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z = 8.02 d + 0.32</text>\n</svg></div></div></div><p>Other sources of scale: a stereo baseline, an IMU's accelerometer, or an object of known size.</p>", "n": ""}, {"t": "What you should take away", "sub": "", "min": 2, "sz": "", "html": "<ul><li>Triangulation, PnP and bundle adjustment all minimise reprojection error; a linear solve only starts them.</li><li>Structure from motion is a loop: place an image with PnP, triangulate what is new, bundle adjust.</li><li>Bundle adjustment refines every pose and every point against every observation, in one sparse least-squares problem.</li><li>Visual SLAM adds keyframes to keep that problem small and loop closure to remove drift.</li><li>Stereo and LiDAR give metric depth. Monocular reconstruction and most depth networks give relative depth until something supplies the scale.</li></ul><p>Notes: Modules A4, A5, A6 and A3. Szeliski §7 for features, §11 for structure from motion and bundle adjustment, §12 for stereo.</p>", "n": ""}, {"t": "Next time", "sub": "L05 · The learning half of the crash course", "min": 1, "sz": "", "html": "<p>Everything so far has been geometry you can derive. Wednesday is the other half of the toolkit: what a network is doing when it replaces one of these blocks, and why the architectures that work on images do not work on 3D data.</p><ul><li>Autograd and backpropagation as a graph computation.</li><li>Convolutions, and precisely why dense 3D convolution is not viable at the resolutions you need.</li><li>Attention, permutation equivariance, and why transformers took over point-cloud processing.</li><li>Training practicalities, and the reproducibility habits the labs grade.</li></ul><p><b>Lab 1 is out on Friday, Sep 18.</b> Run the fetch script the day it comes out, not the night before it is due. <b>Both diagnostic quizzes are due Sun Sep 20.</b> Quiz 2 is today’s depth-sensor material and Wednesday’s; both stay retakeable through Sep 27.</p>", "n": ""}]}];
</script>

<script>
(function(){
  "use strict";
  var flat=[];
  DECK.forEach(function(L){ L.slides.forEach(function(s,i){
    flat.push({lec:L,s:s,i:i,n:L.slides.length});
  });});

  var cur=0, notesOn=false, gridOn=false, mode="a";
  var slideEl=document.getElementById("slide"), countEl=document.getElementById("count"),
      notesEl=document.getElementById("notes"), notesBody=document.getElementById("notesbody"),
      gridEl=document.getElementById("grid"), progEl=document.getElementById("prog"),
      pickEl=null;

  try{ var sm=localStorage.getItem("rob3dp-mode"); if(sm==="a"||sm==="w") mode=sm; }catch(e){}

  function setMode(m){
    mode=m; document.body.setAttribute("data-mode",m);
    try{ localStorage.setItem("rob3dp-mode",m); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
      b.setAttribute("aria-current", b.getAttribute("data-m")===m ? "true":"false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
    b.addEventListener("click",function(){ setMode(b.getAttribute("data-m")); });
  });

  function typeset(el){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([el]).catch(function(){});
    }
  }

  function render(){
    var f=flat[cur];
    slideEl.innerHTML =
      '<p class="s-meta">'+f.lec.num+' &middot; '+f.lec.title+' &middot; '+f.lec.date+
        (f.s.min?(' &middot; '+f.s.min+' min'):'')+'</p>'+
      '<h2>'+f.s.t+'</h2>'+
      (f.s.sub?'<p class="sub">'+f.s.sub+'</p>':'')+
      '<div class="rulel"></div>'+
      '<div class="body'+(f.s.sz?' sm':'')+'">'+f.s.html+'</div>';
    countEl.textContent=(f.i+1)+" / "+f.n;
    if(notesBody) notesBody.textContent=f.s.n||"—";
    progEl.style.width=((cur+1)/flat.length*100)+"%";
    if(gridOn) buildGrid();
    try{ history.replaceState(null,"","#"+f.lec.id+"-s"+(f.i+1)); }catch(e){}
    document.getElementById("stage").scrollTop=0;
    typeset(slideEl);
  }
  function go(i){ if(i<0||i>=flat.length) return; cur=i; render(); }

  function buildGrid(){
    gridEl.innerHTML="";
    flat.forEach(function(f,k){
      var b=document.createElement("button");
      b.className="thumb"; b.type="button";
      b.setAttribute("aria-current",k===cur?"true":"false");
      b.innerHTML='<span class="tn">'+f.lec.num+' &middot; '+(f.i+1)+
        (f.s.min?(' &middot; '+f.s.min+"'"):'')+'</span><span class="tt">'+f.s.t+'</span>';
      b.addEventListener("click",function(){
        gridOn=false; gridEl.classList.remove("on"); go(k);
      });
      gridEl.appendChild(b);
    });
  }

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); go(cur+1); }
    else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(k==="Home"){ e.preventDefault(); go(0); }
    else if(k==="End"){ e.preventDefault(); go(flat.length-1); }
    else if(k==="a"||k==="A"){ setMode("a"); }
    else if(k==="w"||k==="W"){ setMode("w"); }
    else if((k==="s"||k==="S")&&notesEl){ notesOn=!notesOn; notesEl.classList.toggle("on",notesOn); }
    else if(k==="o"||k==="O"){ gridOn=!gridOn; gridEl.classList.toggle("on",gridOn); if(gridOn) buildGrid(); }
    else if(k==="p"||k==="P"){ document.body.classList.toggle("present"); }
    else if(k==="f"||k==="F"){
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
      else { (document.exitFullscreen||function(){}).call(document); }
    }
    else if(k==="Escape"){ gridOn=false; gridEl.classList.remove("on");
      document.body.classList.remove("present"); }
  });

  var x0=null;
  document.addEventListener("touchstart",function(e){ x0=e.changedTouches[0].clientX; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) go(cur+(dx<0?1:-1));
    x0=null;
  },{passive:true});

  var h=(location.hash||"").replace("#","");
  var m=/^(l\d\d)(?:-s(\d+))?$/.exec(h);
  if(m){
    var idx=flat.findIndex(function(f){
      return f.lec.id===m[1] && (!m[2]||f.i+1===parseInt(m[2],10)); });
    if(idx>=0) cur=idx;
  }
  setMode(mode);
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(render);
  } else { render(); }
})();
</script>
