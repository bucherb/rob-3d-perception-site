<script>
const DECK = [{"id": "l13", "num": "L13", "title": "3D scene graphs, open-set and task-driven", "date": "Wed Oct 21, 2026", "slides": [{"t": "3D scene graphs, open-set and task-driven", "sub": "L13 · Unit 2", "min": 1, "sz": "", "html": "<p class=\"big\">L11 put a feature in every voxel. A robot asked to fetch a mug does not want 50 million voxels. It wants the mug, the room it is in, and how to get there.</p><p>Today: the <b>scene graph</b>, a map of things and places joined by relations, and the open-set systems that build one from foundation models.</p>", "n": ""}, {"t": "Today", "sub": "", "min": 1, "sz": "", "html": "<ol><li><b>The data structure:</b> nodes, edges, and the layered hierarchy: mesh, objects, places, rooms, building.</li><li><b>ConceptGraphs, in depth:</b> how SAM, CLIP and an LLM become an open-set object graph. Association worked by hand.</li><li><b>What counts as an object depends on the task:</b> Clio in brief (Monday's guest goes deeper), then HOV-SG and OpenGraph.</li><li><b>Why graphs:</b> memory, bandwidth between robots, and noticing that the world changed.</li><li><b>Graphs and memories for language models</b>, from L15: SayPlan, ReMEmbR, and embodied question answering.</li></ol>", "n": ""}, {"t": "From a dense map to a graph", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 788 235\" width=\"788\" role=\"img\" aria-label=\"Left: a grid of voxels, some shaded, each holding a feature vector. An arrow labelled group leads to the right: a graph with one room node, kitchen, joined to three object nodes, table, chair and shelf, with a dashed edge between table and chair.\">\n  <defs><marker id=\"a6a97cink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M136.3 172.2 L155.7 172.2 L155.7 152.7 L136.3 152.7 Z\" stroke=\"var(--rule)\" stroke-width=\"0.47\" fill=\"var(--accent-soft)\"/ L640.1 97.1 L637.2 99.0 L634.6 101.5 L632.8 104.5 L631.6 107.8 L631.2 111.4 L631.6 114.9 L632.8 118.2 L634.6 121.2 L637.2 123.7 L640.1 125.6 L643.5 126.8 L647.0 127.2 L650.5 126.8 L653.9 125.6 L656.9 123.7 L659.4 121.2 L661.3 118.2 L662.4 114.9 L662.8 111.4 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"647.0\" y=\"145.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">shelf</text>\n  <path d=\"M516.9 117.4 L558.2 135.7\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"574.0\" y=\"218.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a graph: a few hundred nodes</text>\n</svg></div><ul><li>A dense map answers <i>what is at this point?</i> A robot more often asks <i>where is the mug?</i>, <i>which room has a printer?</i>, <i>how do I get to the kitchen?</i></li><li>Answering those from voxels means scanning all of them, every time.</li><li>A <b>scene graph</b> stores the answer once: a node per thing or place, an edge per relation.</li></ul>", "n": ""}, {"t": "Nodes and edges", "sub": "what a scene graph stores", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th>Part</th><th>What it carries</th></tr></thead><tbody><tr><td>Object node</td><td>a pose or centroid, a 3D bounding box, its points or mesh, a label or a feature vector, a caption</td></tr><tr><td>Place node</td><td>a position in free space and its distance to the nearest obstacle</td></tr><tr><td>Room node</td><td>a centroid, a label or feature, the places it contains</td></tr><tr><td>Intra-layer edge</td><td><i>traversable</i> between places; <i>on</i>, <i>next to</i>, <i>inside</i> between objects; <i>adjacent</i> between rooms</td></tr><tr><td>Inter-layer edge</td><td><i>contains</i>: building to room, room to place, place to object</td></tr></tbody></table><p class=\"pull\">Nodes are things you can name. Edges are the relations a planner needs.</p>", "n": ""}, {"t": "The layered hierarchy", "sub": "Rosinol et al., RSS 2020; Hughes et al., RSS 2022", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.620 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 542 249\" width=\"542\" role=\"img\" aria-label=\"Five stacked layers drawn as slanted planes. Bottom: the mesh, a wavy line. Above it: object nodes, each joined by a dotted line down to the mesh. Then a chain of place nodes joined to each other, then three room nodes joined to each other, then one building node at the top. Lines between layers show which place each object hangs from, which room each place belongs to, and that every room is in the building.\">\n  <path d=\"M67.6 39.4 L497.7 39.4 L533.5 12.5 L103.4 12.5 Z\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"var(--ground)\"/>\n  <text x=\"53.7\" y=\"25.9\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">building</text>\n  <path d=\"M67.6 88.6 L497.7 88.6 L533.5 61.8 L103.4 61.8 Z\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"var(--ground)\"/>\n  <text x=\"53.7\" y=\"75.2\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">rooms</text>\n  <path d=\"M67.6 137.9 L497.7 137.9 L533.5 111.0 L103.4 111.0 Z\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"var(--ground)\"/>\n  <text x=\"53.7\" y=\"124.5\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">places</text>\n  <path d=\"M67.6 187.2 L497.7 187.2 L533.5 160.3 L103.4 160.3 Z\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"var(--ground)\"/>\n  <text x=\"53.7\" y=\"173.8\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">objects</text>\n  <path d=\"M67.6 236.5 L497.7 anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">room B</text>\n</svg></div></div><div style=\"flex:0.470 1 0\"><ul><li>Recall L07: an ESDF stores, at every free voxel, the distance to the nearest obstacle.</li><li>Its ridges, the points equally far from two obstacles, form a skeleton of the free space. <b>Places</b> are nodes sampled along it, each with its clearance.</li><li>Edges between places are paths a robot can drive. A narrow cut in the graph is a <b>doorway</b>; cutting there splits places into <b>rooms</b>.</li></ul></div></div>", "n": ""}, {"t": "Closed set, then open set", "sub": "", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 764 277\" width=\"764\" role=\"img\" aria-label=\"A timeline. Closed-set scene graphs: 3D Scene Graph (Armeni, ICCV 2019), 3D Dynamic Scene Graphs and Kimera (Rosinol, RSS 2020), Hydra (Hughes, RSS 2022). Open-set ones, all in 2024: ConceptGraphs (Gu, ICRA), HOV-SG (Werby, RSS), Clio (Maggio, RA-L), OpenGraph (Deng, IROS).\">\n  <defs><marker id=\"a77c0crules\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--rule-strong)\"/></marker></defs>\n  <path d=\"M93.0 240.4 L707.4 240.4\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a77c0crules)\"/>\n  <path d=\"M134.0 240.4 L134.0 206.7\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"134.0\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent)\"/>\n  <text x=\"134.0\" y=\"186.7\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3D Scene Graph</text>\n  <text x=\"134.0\" y=\"202.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Armeni, ICCV 2019</text>\n  <path d=\"M226.1 240.4 L226.1 155.5\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"226.1\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent)\"/>\n  <text x=\"226.1\" y=\"135.5\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3D DSG, Kimera</text>\n  <text x=\"226.1\" y=\"150.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Rosinol, RSS 2020</text>\n  <path d=\"M328.5 240.4 L328.5 206.7\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"328.5\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent)\"/>\n  <text x=\"328.5\" y=\"186.7\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Hydra</text>\n  <text x=\"328.5\" y=\"202.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Hughes, RSS 2022</text>\n  <path d=\"M471.9 240.4 L471.9 206.7\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"471.9\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent-2)\"/>\n  <text x=\"471.9\" y=\"186.7\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ConceptGraphs</text>\n  <text x=\"471.9\" y=\"202.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Gu, ICRA 2024</text>\n  <path d=\"M533.3 240.4 L533.3 155.5\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"533.3\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent-2)\"/>\n  <text x=\"533.3\" y=\"135.5\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">HOV-SG</text>\n  <text x=\"533.3\" y=\"150.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Werby, RSS 2024</text>\n  <path d=\"M594.8 240.4 L594.8 104.3\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"594.8\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent-2)\"/>\n  <text x=\"594.8\" y=\"84.3\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Clio</text>\n  <text x=\"594.8\" y=\"99.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Maggio, RA-L 2024</text>\n  <path d=\"M656.2 240.4 L656.2 53.1\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <circle cx=\"656.2\" cy=\"240.4\" r=\"3.9\" fill=\"var(--accent-2)\"/>\n  <text x=\"656.2\" y=\"33.1\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">OpenGraph</text>\n  <text x=\"656.2\" y=\"48.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Deng, IROS 2024</text>\n  <text x=\"226.1\" y=\"262.0\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">closed set: labels from a fixed list</text>\n  <text x=\"564.0\" y=\"262.0\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">open set: features and captions</text>\n</svg></div><ul><li><b>Closed set:</b> every object gets a label from a fixed list (chair, table, …). Queries are only as good as the list.</li><li><b>Open set:</b> every object keeps a <b>feature vector</b> (CLIP, from L11) and often a <b>caption</b>. A query is any text, compared to the features or read by a language model.</li></ul>", "n": ""}, {"t": "ConceptGraphs", "sub": "Gu et al., ICRA 2024", "min": 2, "sz": "", "htm =\"var(--surface)\"/>\n  <text x=\"160.0\" y=\"70.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">RGB-D frame</text>\n  <path d=\"M254.2 91.9 L394.1 91.9 L394.1 37.2 L254.2 37.2 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"324.2\" y=\"70.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">SAM masks</text>\n  <path d=\"M232.4 64.5 L251.8 64.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <path d=\"M418.4 91.9 L558.2 91.9 L558.2 37.2 L418.4 37.2 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"488.3\" y=\"70.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">CLIP per mask</text>\n  <path d=\"M396.5 64.5 L416.0 64.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <path d=\"M582.6 91.9 L722.4 91.9 L722.4 37.2 L582.6 37.2 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"652.5\" y=\"70.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">back-project</text>\n  <path d=\"M560.7 64.5 L580.1 64.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <path d=\"M746.7 91.9 L886.6 91.9 L886.6 37.2 L746.7 37.2 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"816.6\" y=\"70.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">associate, fuse</text>\n  <path d=\"M724.8 64.5 L744.3 64.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <text x=\"488.3\" y=\"16.5\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">every frame (online)</text>\n  <path d=\"M746.7 177.0 L886.6 177.0 L886.6 122.3 L746.7 122.3 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"816.6\" y=\"155.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">object map</text>\n  <path d=\"M506.6 177.0 L689.0 177.0 L689.0 122.3 L506.6 122.3 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"597.8\" y=\"155.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">captions: LLaVA, GPT-4</text>\n  <path d=\"M287.7 177.0 L470.1 177.0 L470.1 122.3 L287.7 122.3 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"378.9\" y=\"155.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">edges: boxes overlap</text>\n  <path d=\"M68.8 177.0 L251.2 177.0 L251.2 122.3 L68.8 122.3 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"160.0\" y=\"155.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">MST; LLM names edges</text>\n  <path d=\"M816.6 94.3 L816.6 119.9\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <path d=\"M744.3 149.7 L691.4 149.7\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <path d=\"M504.1 149.7 L472.5 149.7\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <path d=\"M285.2 149.7 L253.6 149.7\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a6663aink)\"/>\n  <text x=\"488.3\" y=\"197.7\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">once, after mapping (offline)</text>\n</svg></div><ul><li><b>Per frame:</b> SAM proposes class-agnostic masks; each mask gets a CLIP image feature and is back-projected to a point cloud with depth and pose. Each one is then matched to an existing object or starts a new one.</li><li><b>After mapping:</b> each object is captioned and the edges are built. These steps call large models and are not real-time.</li></ul>", "n": ""}, {"t": "From a mask to 3D points", "sub": "L02 and L03, once per pixel", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.360 1 0\"><div style=\"height:4mm\"></div><div class=\"fig\"><svg viewBox=\"0 0 369 165\" width=\"369\" role=\"img\" aria-label=\"A camera drawn as a wedge with its image plane. One pixel on the image plane defines a dashed ray out of the camera centre; the 3D point sits on that ray at the measured depth d, X_c = d K inverse (u, v, 1).\">\n  <path d=\"M108.5 69.5 L169.5 39.1 L169.5 100.0 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M169.5 100.0 L169.5 39.1\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <circle cx=\"169.5\" cy=\"58.2\" r=\"3.3\" fill=\"var(--accent-2)\"/>\n  <text x=\"169.5\" y=\"115.7\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">pixel (u, v) on the image plane</text>\n  <path d=\"M108.5 69.5 L360.9 22.7\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"308.7\" cy=\"32.4\" r=\"4.4\" fill=\"var(--accent-2)\"/>\n  <text x=\"308.7\" y=\"14.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">X_c</text>\n  <path d=\"M108.5 130.5 L308.7 130.5\" stroke=\"var(--ink-soft)\" stroke-width=\"1\" fill=\"none\"/>\n  <path d=\"M108.5 126.5 v8 M308.7 126.5 v8\" stroke=\"var(--ink-soft)\" stroke-width=\"1\"/>\n  <text x=\"208.6\" y=\"141.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">depth d</text>\n  <circle cx=\"108.5\" cy=\"69.5\" r=\"3.3\" fill=\"var(--ink)\"/>\n  <text x=\"97.2\" y=\"69.5\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">camera</text>\n</svg></div></div><div style=\"flex:0.610 1 0\"><div class=\"hand\" data-h=\"26\"><p class=\"cue\">$f_x = f_y = 525$, $(c_x, c_y) = (319.5, 239.5)$. Pixel $(400, 300)$ reads depth $1.50$ m. Where is it, in the camera frame and in the world, with the camera at $(2, 1, 0.8)$ and no rotation?</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}X_c &amp;= d\\,\\frac{u - c_x}{f_x} = 1.50\\cdot\\frac{400 - 319.5}{525} = 0.230\\\\ Y_c &amp;= 0.173, \\quad Z_c = 1.50\\\\ \\mathbf{X}_w &amp;= \\mathbf{R}_{wc}\\mathbf{X}_c + \\mathbf{t}_{wc} = (2.230,\\ 1.173,\\ 2.30)\\end{aligned}\\]</div></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div><ul><li>Up to $307{,}200$ points per VGA frame, so each object's cloud is voxel-downsampled at once.</li><li>$\\mathbf{T}_{wc}$ comes from the SLAM system underneath; drift in it moves the whole object, and breaks association.</li></ul>", "n": ""}, {"t": "Association: is this the same object?", "sub": "", "min": 3, "sz": "", "html": "<p>A new detection $i$ with points $\\mathbf{p}_i$ and unit CLIP feature $\\mathbf{f}_i$; an existing object $j$ with $\\mathbf{p}_j$, $\\mathbf{f}_j$.</p><div class=\"eq\">\\[\\varphi_{\\mathrm{sem}}(i,j) = \\tfrac{1}{2}\\,\\mathbf{f}_i^\\top \\mathbf{f}_j + \\tfrac{1}{2}, \\qquad \\varphi_{\\mathrm{geo}}(i,j) = \\text{share of } \\mathbf{p}_i \\text{ with a neighbour in } \\mathbf{p}_j \\text{ within } \\delta_{nn}\\]</div><div class=\"eq\">\\[\\varphi(i,j) = \\varphi_{\\mathrm{sem}}(i,j) + \\varphi_{\\mathrm{geo}}(i,j), \\qquad \\text{merge with } \\arg\\max_j \\varphi(i,j) \\text{ if it exceeds } \\delta_{\\mathrm{sim}} = 1.1\\]</div><ul><li>Both terms lie in $[0, 1]$, so $\\varphi \\in [0, 2]$. The paper uses $\\delta_{nn} = 2.5$ cm, and the threshold $1.1$ cannot be reached on semantics alone unless the features nearly match.</li><li>Detections in one frame are assigned greedily to their best object.</li></ul>", "n": ""}, {"t": "Association by hand", "sub": "two identical mugs", "min": 4, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 370 89\" width=\"370\" role=\"img\" aria-label=\"Two tables, each with a mug: map object A on the left and map object B on the right. A dashed box, the new detection, overlaps mug A. Mug B looks the same but nothing of it overlaps the detection.\">\n  <path d=\"M37.6 64.6 L137.5 64.6 L137.5 54.6 L37.6 54.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M210.7 64.6 L310.5 64.6 L310.5 54.6 L210.7 54.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M65.9 54.6 L89.2 54.6 L89.2 28.0 L65.9 28.0 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"77.6\" y=\"44.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A</text>\n  <path d=\"M245.6 54.6 L268.9 54.6 L268.9 28.0 L245.6 28.0 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"257.3\" y=\"44.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B</text>\n  <text x=\"87.5\" y=\"76.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">map object A: a mug</text>\n  <text x=\"260.6\" y=\"76.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">map object B: another mug</text>\n  <path d=\"M70.9 51.3 L99.2 51.3 L99.2 23.0 L70.9 23.0 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <path d=\"M70.9 51.3 L99.2 51.3 L99.2 23.0 L70.9 23.0 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <text x=\"84.2\" y=\"12.7\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">new detection</text>\n  <text x=\"257.3\" y=\"16.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">same look, no overlap</text>\n</svg></div><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Cosines $0.80$ to mug A and $0.86$ to mug B; overlaps $0.62$ and $0.00$. Which, if either, does it join? And a plant beside mug A: cosine $0.30$, overlap $0.20$?</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}\\varphi_A &amp;= \\tfrac{1}{2}(0.80) + \\tfrac{1}{2} + 0.62 = 1.52 &gt; 1.1 \\;\\Rightarrow\\; \\text{merge with A}\\\\ \\varphi_B &amp;= \\tfrac{1}{2}(0.86) + \\tfrac{1}{2} + 0.00 = 0.93 &lt; 1.1\\\\ \\varphi_{\\text{plant}} &amp;= 0.65 + 0.20 = 0.85 &lt; 1.1 \\;\\Rightarrow\\; \\text{a new object}\\end{aligned}\\]</div><p>Mug B <i>looks</i> more similar ($0.93 &gt; 0.90$). Only geometry tells the two mugs apart.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div>", "n": ""}, {"t": "Fusing a match into the object", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.550 1 0\"><div class=\"eq\">\\[\\mathbf{f}_j \\leftarrow \\frac{n_j\\,\\mathbf{f}_j + \\mathbf{f}_i}{n_j + 1}, \\qquad \\mathbf{p}_j \\leftarrow \\mathrm{downsample}(\\mathbf{p}_j \\cup \\mathbf{p}_i)\\]</div><p>Detection $i$ matched object $j$. $\\mathbf{f}$: CLIP feature; $\\mathbf{p}$: 3D points; $n_j$: detections merged into $j$ so far, the $k$-th with feature $\\mathbf{f}^{(k)}$.</p><div class=\"hand\" data-h=\"15\"><p class=\"cue\">Show that after $n$ merges $\\mathbf{f}_j$ is the plain average of all $n$ detections' features</p><div class=\"worked\"><p>Induction: if $\\mathbf{f}_j = \\frac{1}{n}\\sum_{k=1}^{n}\\mathbf{f}^{(k)}$, then $\\frac{n\\mathbf{f}_j + \\mathbf{f}^{(n+1)}}{n+1} = \\frac{1}{n+1}\\sum_{k=1}^{n+1}\\mathbf{f}^{(k)}$. With $n_j = 4$, the next view moves the feature by only $\\frac{1}{5}$ of the difference.</p></div><div class=\"panel\" style=\"height:15mm\"></div></div></div><div style=\"flex:0.420 1 0\"><ul><li>Points are merged and voxel-downsampled at $2.5$ cm, so an object seen a thousand times does not grow.</li><li>Averaging many views is L11's multi-view fusion, done per object instead of per voxel.</li><li>Trap: the average of unit vectors is shorter than 1. Renormalise before taking a cosine.</li></ul></div></div>", "n": ""}, {"t": "Captions and edges", "sub": "", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.500 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 669 179\" width=\"669\" role=\"img\" aria-label=\"Left: nine object nodes with many grey candidate edges between nearby ones. Right: the same nodes with only the edges of a minimum spanning tree, eight of them, drawn in colour.\">\n  <defs><marker id=\"a74bcbink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M141.8 113.2 L190.4 125.3\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"none\"/>\n  <path d=\"M141.8 113.2 L178.2 64.5\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"none\"/>\n  <path d=\"M190.4 125.3 L178.2 64.5\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"none\"/>\n  <path d=\"M190.4 125.3 L239.0 82.8\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"none\"/>\n  <path d=\"M178.2 64.5 L239.0 82.8\" stroke=\"var(--rule)\" stroke-width=\"0.66\" fill=\"non e-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"226.9\" y=\"162.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">candidates: boxes that overlap</text>\n  <text x=\"482.2\" y=\"162.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">spanning tree: N-1 edges</text>\n  <path d=\"M348.5 70.6 L372.8 70.6\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a74bcbink)\"/>\n</svg></div></div><div style=\"flex:0.470 1 0\"><ul><li><b>Captions:</b> LLaVA-7B describes each object from its 10 best views; GPT-4 condenses those into one caption.</li><li><b>Candidate edges:</b> objects whose 3D bounding boxes overlap.</li><li><b>Prune</b> to a minimum spanning tree, then ask an LLM what each kept edge is: <i>on</i>, <i>in</i>, …</li></ul></div></div><div class=\"hand\" data-h=\"12\"><p class=\"cue\">With $N = 100$ objects, how many LLM calls to label every pair, and how many for a spanning tree?</p><div class=\"worked\"><p>All pairs: $\\binom{100}{2} = 4{,}950$. A spanning tree: $N - 1 = 99$, fifty times fewer.</p></div><div class=\"panel\" style=\"height:12mm\"></div></div>", "n": ""}, {"t": "Asking the graph a question", "sub": "", "min": 2.5, "sz": "", "html": "<ul><li><b>Simple queries:</b> embed the text with CLIP, take the cosine with every node's feature, return the best node and its 3D position.</li><li><b>Complex queries</b> (<i>my wrist hurts from using a screwdriver all day</i>): serialise the graph as a list of nodes with captions and positions, give it to an LLM, and ask which node.</li><li>The answer is a node id, so the robot gets a 3D box to navigate to or grasp.</li></ul><div class=\"rbox\"><span class=\"rbox-t\">The context-window limit</span><p>A few hundred captions fit in an LLM's context. A five-storey building with every object does not. Choosing <i>which</i> nodes to keep is the next part of the lecture.</p></div>", "n": ""}, {"t": "What the language model actually sees", "sub": "", "min": 2, "sz": "", "html": "<pre style=\"text-align:left;font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.45;background:var(--ground);padding:10px 14px;border-radius:3px;overflow-x:auto;margin:10px 0\">[ ...\n  {\"id\": 18, \"caption\": \"a cordless power drill on a shelf\",\n   \"centroid\": [2.41, -0.87, 0.95], \"extent\": [0.24, 0.08, 0.20]},\n  {\"id\": 37, \"caption\": \"a can of soda on the floor by the door\",\n   \"centroid\": [0.62, 3.10, 0.06], \"extent\": [0.07, 0.07, 0.12]},\n... ]\nUser: My wrist hurts from using a screwdriver all day. Anything to help?\nLLM:  {\"object_id\": 18, \"why\": \"a power drill does the screwdriver's job\"}</pre><ul><li>The graph is serialised as a list of nodes: id, caption, where it is and how big. The LLM never sees an image or a point.</li><li>So the answer is only as good as the <b>caption</b>: a drill captioned <i>grey object on a shelf</i> is invisible to this query.</li></ul>", "n": ""}, {"t": "Two ways to get the objects", "sub": "ConceptGraphs and ConceptGraphs-Detect", "min": 2.5, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>ConceptGraphs</th><th>ConceptGraphs-Detect</th></tr></thead><tbody><tr><td>Proposals</td><td>SAM: every region, no names</td><td>RAM tags the image, Grounding DINO finds boxes for the tags</td></tr><tr><td>Walls, floor</td><td>split into many pieces</td><td>recognised as background and merged</td></tr><tr><td>Misses</td><td>nothing large, but many fragments</td><td>anything the tagger did not name</td></tr><tr><td>Choose it when</td><td>you cannot list what matters in advance</td><td>scenes are cluttered and structure gets in the way</td></tr></tbody></table><p class=\"pull\">Class-agnostic finds everything and names nothing. A detector names things, and only the things it was asked about.</p>", "n": ""}, {"t": "Where ConceptGraphs struggles", "sub": "", "min": 2, "sz": "", "html": "<ul><li><b>Granularity:</b> SAM returns a book, a page, or the whole shelf depending on the view. The map inherits whatever the masks were.</li><li><b>Duplicates</b> when pose drift breaks the geometric overlap; <b>merges</b> of touching objects when it does not.</li><li><b>Static world:</b> nothing removes an object that has moved.</li><li><b>Offline:</b> captioning and edges run once, after mapping, with large models.</li><li><b>Relations are LLM guesses</b> from captions and boxes, not measured.</li></ul><p class=\"pull\">The first problem is the deepest: what is an object?</p>", "n": ""}, {"t": "What counts as one object?", "sub": "", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 776 214\" width=\"776\" role=\"img\" aria-label=\"Two copies of the same stack of four books. Left, for the task 'move the books to the shelf', one dashed box goes round the whole stack: one object. Right, for 'get the green book', the dashed box goes round the green book only, and the rest is ignored.\">\n  <path d=\"M154.6 161.6 L295.4 161.6 L295.4 138.6 L154.6 138.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M164.2 134.7 L305.0 134.7 L305.0 111.7 L164.2 111.7 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M154.6 107.8 L295.4 107.8 L295.4 84.8 L154.6 84.8 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M164.2 81.0 L305.0 81.0 L305.0 57.9 L164.2 57.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M138.6 171.2 L324.2 171.2 L324.2 43.2 L138.6 43.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <text x=\"231.4\" y=\"17.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">“move the books to the shelf”</text>\n  <text x=\"231.4\" y=\"197.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">one object</text>\n  <path d=\"M474.6 161.6 L615.4 161.6 L615.4 138.6 L474.6 138.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M484.2 134.7 L625.0 134.7 L625.0 111.7 L484.2 111.7 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M474.6 107.8 L615.4 107.8 L615.4 84.8 L474.6 84.8 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M484.2 81.0 L625.0 81.0 L625.0 57.9 L484.2 57.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M465.0 114.2 L631.4 114.2 L631.4 78.4 L465.0 78.4 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <text x=\"551.4\" y=\"17.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">“get the green book”</text>\n  <text x=\"551.4\" y=\"197.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">one object, the rest ignored</text>\n</svg></div><ul><li>There is no task-free right answer. The stack is one object, or four, or one book and some clutter.</li><li>A fixed segmentation threshold picks one granularity for every task. <b>Clio</b> lets the task list pick.</li></ul>", "n": ""}, {"t": "Clio", "sub": "Maggio et al., RA-L 2024", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><img src=\"data:image/jpeg;base64,/9j/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAMUBXgDASIAAhEBAxEB/8QAHQABAAICAwEBAAAAAAAAAAAAAAUGBAcCAwgBCf/EAGAQAAEDAwICBQUKCQcJBgUBCQEAAgMEBREGIRIxBxNBUWEUInGBkRUWMkJSVZOhsdEIIzNTVHKSweEXNDZidJSyJDVDc4Kis9LwGDdjdcLxJURFVoM stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"314.2\" y=\"58.2\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">floor</text>\n  <text x=\"314.2\" y=\"99.1\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">room</text>\n  <text x=\"314.2\" y=\"140.1\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">object</text>\n  <text x=\"429.9\" y=\"168.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">top-down: pick a floor, a room, then an object</text>\n</svg></div><div class=\"hand\" data-h=\"14\"><p class=\"cue\">$3$ floors, $40$ rooms, $2{,}000$ objects, spread evenly. How many feature comparisons for <i>bean bag, office, floor 1</i>, flat and top-down?</p><div class=\"worked\"><p>Flat: $2{,}000$. Top-down: $3$ floors $+\\ 14$ rooms on that floor $+\\ 50$ objects in that room $= 67$. But a wrong choice at the floor is never undone.</p></div><div class=\"panel\" style=\"height:14mm\"></div></div>", "n": ""}, {"t": "OpenGraph: the same idea outdoors", "sub": "Deng et al., IROS 2024", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.400 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 647 264\" width=\"647\" role=\"img\" aria-label=\"A road junction drawn as four grey road arms. A node sits on each arm, a lane segment, all joined to a junction node in the middle. Objects beside the road, a car, a bin, a tree and a sign, each hang from their nearest segment.\">\n  <path d=\"M160.3 125.5 L323.5 125.5\" stroke=\"var(--rule-strong)\" stroke-width=\"6.08\" fill=\"none\"/>\n  <path d=\"M160.3 125.5 L323.5 125.5\" stroke=\"var(--surface)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M323.5 125.5 L486.7 125.5\" stroke=\"va "var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"350.7\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">sign</text>\n  <text x=\"323.5\" y=\"248.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">lane segments and a junction, objects hung on them</text>\n</svg></div></div><div style=\"flex:0.570 1 0\"><ul><li><b>Front end:</b> RAM tags each image, Grounding DINO boxes the tags, and TAP segments and captions each instance. Captions are embedded with Sentence-BERT.</li><li><b>Mapping:</b> masks are projected onto the <b>LiDAR</b> scan and fused incrementally, matching on 3D overlap, caption similarity and feature similarity: ConceptGraphs' rule with a caption term.</li><li><b>Layers:</b> points, a <b>lane graph</b>, instances, road <b>segments</b> cut along the lane graph, and the environment. Evaluated on SemanticKITTI.</li></ul></div></div>", "n": ""}, {"t": "Four systems side by side", "sub": "", "min": 2.5, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>ConceptGraphs</th><th>Clio</th><th>HOV-SG</th><th>OpenGraph</th></tr></thead><tbody><tr><td>Sensors</td><td>RGB-D</td><td>RGB-D</td><td>RGB-D</td><td>LiDAR and camera</td></tr><tr><td>Layers</td><td>objects</td><td>objects, places, regions</td><td>floors, rooms, objects</td><td>objects, lane segments</td></tr><tr><td>Open set via</td><td>CLIP, LLaVA and GPT-4 captions</td><td>CLIP against a task list</td><td>CLIP features at every level</td><td>captions, encoded as text</td></tr><tr><td>Granularity set by</td><td>SAM's masks</td><td>the tasks</td><td>SAM's masks</td><td>the captioner</td></tr><tr><td>Association</td><td>semantic + geometric overlap</td><td>3D primitives from masks, then IB clustering</td><td>mask overlap across frames</td><td>3D IoU, caption and feature similarity</td></tr><tr><td>Upper layers from</td><td>none</td><td>the tasks</td><td>walls and floor heights</td><td>the lane graph</td></tr><tr><td>Online?</td><td>objects yes, captions and edges no</td><td>yes, onboard</td><td>no</td><td>yes</td></tr></tbody></table>", "n": ""}, {"t": "Which would you pick?", "sub": "", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th>Situation</th><th>Pick</th><th>Why</th></tr></thead><tbody><tr><td>One apartment, questions not known in advance</td><td>ConceptGraphs</td><td>keeps every object with a caption; any later question can be asked of it</td></tr><tr><td>A fixed list of jobs, compute on the robot</td><td>Clio</td><td>builds only what the tasks need, online, at the right granularity</td></tr><tr><td>A multi-storey building, <i>go to X in room Y</i></td><td>HOV-SG</td><td>floors and rooms make the search short and the instruction's structure explicit</td></tr><tr><td>Streets, LiDAR, a vehicle</td><td>OpenGraph</td><td>LiDAR geometry, and segments along the roads it plans over</td></tr><tr><td>Tasks that change hourly</td><td>ConceptGraphs, then filter</td><td>Clio's map cannot answer a task that was not on its list</td></tr></tbody></table>", "n": ""}, {"t": "How much smaller?", "sub": "an illustrative building", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.550 1 0\"><div class=\"hand\" data-h=\"34\"><p class=\"cue\">A $50 \\times 40 \\times 3$ m building at $5$ cm. A TSDF, a feature map with a 1024-d float16 CLIP feature on surface voxels (1 in 50), and a graph of 500 objects, 3,000 places, 40 rooms.</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}\\text{voxels} &amp;= 1000 \\cdot 800 \\cdot 60 = 48{,}000{,}000\\\\ \\text{TSDF} &amp;= 48{,}000{,}000 \\times 8 \\text{ B} = 384 \\text{ MB}\\\\ \\text{features} &amp;= 960{,}000 \\times 2{,}048 \\text{ B} = 2.0 \\text{ GB}\\\\ \\text{graph} &amp;\\approx 500 \\times 2{,}136 \\text{ B} + \\ldots = 1.20 \\text{ MB}\\end{aligned}\\]</div></div><div class=\"panel\" style=\"height:34mm\"></div></div></div><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 321 120\" width=\"321\" role=\"img\" aria-label=\"Horizontal bars on a logarithmic axis from a kilobyte to a terabyte: the dense maps are hundreds of megabytes to tens of gigabytes; the scene graph is under a megabyte.\">\n  <path d=\"M79.9 35.8 L269.8 35.8 L269.8 16.7 L79.9 16.7 Z\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"var(--accent-soft)\"/>\n  <text x=\"69.6\" y=\"26.3\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">TSDF</text>\n  <path d=\"M79.9 63.6 L294.0 63.6 L294.0 44.5 L79.9 44.5 Z\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"var(--accent-soft)\"/>\n  <text x=\"69.6\" y=\"54.0\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">feature map</text>\n  <path d=\"M79.9 91.3 L184.6 91.3 L184.6 72.3 L79.9 72.3 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"69.6\" y=\"81.8\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">scene graph</text>\n  <path d=\"M79.9 95.3 L79.9 8.0\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <text x=\"79.9\" y=\"106.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1 kB</text>\n  <path d=\"M182.0 95.3 L182.0 8.0\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <text x=\"182.0\" y=\"106.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1 MB</text>\n  <path d=\"M284.0 95.3 L284.0 8.0\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <text x=\"284.0\" y=\"106.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1 GB</text>\n</svg></div><p>The graph is about $1{,}640\\times$ smaller than the feature map.</p></div></div>", "n": ""}, {"t": "Two robots, one map", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 490 147\" width=\"490\" role=\"img\" aria-label=\"Two small scene graphs, one per robot, each a room node with four object nodes. A dashed link between the two room nodes is labelled same room: merge. Between them: send nodes and edges, not voxels.\">\n  <path d=\"M86.4 56.6 L86.1 53.7 L85.1 50.8 L83.5 48.3 L81.4 46.2 L78.9 44.6 L76.0 43.6 L73.1 43.3 L70.1 43.6 L67.3 44.6 L64.7 46.2 L62.6 48.3 L61.0 50.8 L60.0 53.7 L59.7 56.6 L60.0 59.6 L61.0 62.4 L62.6 65.0 L64.7 67.1 L67.3 68.7 L70.1 69.7 L73.1 70.0 L76.0 69.7 L78.9 68.7 L81.4 67.1 L83.5 65.0 L85.1 62.4 L86.1 59.6 L86.4 56.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M73.1 56.6 L24.4 123.5\" stroke=\"var(--rule)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M32.3 123.5 L32.1 121.8 L31.5 120.1 L30.6 118.6 L29.3 117.3 L27.8 116.4 L26.2 115.8 L24.4 115.6 L22.7 115.8 L21.0 116.4 L19.5 117.3 L18.2 118.6 L17.3 120.1 L16.7 121.8 L16.5 123.5 L16.7 125.3 L17.3 126.9 L18.2 128.4 L19.5 129.7 L21.0 130.6 L22.7 131.2 L24.4 131.4 L26.2 131.2 L27.8 130.6 L29.3 129.7 L30.6 128.4 L31.5 126.9 L32.1 125.3 L32.3 123.5 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M73.1 56.6 L60.9 123.5\" stroke=\"var(--rule)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M68.8 123.5 L68.6 121.8 L68.0 120.1 L67.1 118.6 L65.8 117.3 L64.3 116.4 L62.7 115.8 L60.9 115.6 L59.1 115.8 L57.5 116.4 L56.0 117.3 L54.7 118.6 L53.8 120.1 L53.2 121.8 L53.0 123.5 L53.2 125.3 L53.8 126.9 L54.7 128.4 L56.0 129.7 L57.5 130.6 L59.1 131.2 L60.9 131.4 L62.7 131.2 L64.3 130.6 L65.8 129.7 L67.1 128.4 L68.0 126.9 L68.6 125.3 L68.8 123.5 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" 56.3 L280.4 55.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"274.6\" y=\"74.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">missing?</text>\n  <path d=\"M408.1 90.9 L407.9 89.6 L407.5 88.4 L406.8 87.2 L405.9 86.3 L404.8 85.6 L403.5 85.2 L402.2 85.1 L400.9 85.2 L399.7 85.6 L398.6 86.3 L397.7 87.2 L397.0 88.4 L396.6 89.6 L396.4 90.9 L396.6 92.2 L397.0 93.4 L397.7 94.5 L398.6 95.4 L399.7 96.1 L400.9 96.6 L402.2 96.7 L403.5 96.6 L404.8 96.1 L405.9 95.4 L406.8 94.5 L407.5 93.4 L407.9 92.2 L408.1 90.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"402.2\" y=\"110.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mug</text>\n  <path d=\"M124.5 95.4 L133.4 82.5 L142.4 72.7 L151.4 68.5 L160.3 70.9 L169.3 79.3 L178.2 91.6 L187.2 104.8\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M192.6 104.8 L192.4 103.6 L192.0 102.5 L191.4 101.4 L190.6 100.6 L189.5 99.9 L188.4 99.5 L187.2 99.4 L186.0 99.5 L184.9 99.9 L183.8 100.6 L183.0 101.4 L182.4 102.5 L182.0 103.6 L181.8 104.8 L182.0 106.0 L182.4 107.1 L183.0 108.1 L183.8 109.0 L184.9 109.6 L186.0 110.0 L187.2 110.2 L188.4 110.0 L189.5 109.6 L190.6 109.0 L191.4 108.1 L192.0 107.1 L192.4 106.0 L192.6 104.8 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"173.8\" y=\"52.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a person, moving</text>\n</svg></div><ul><li><b>Agents</b> move constantly: people and robots are nodes with a trajectory (Rosinol et al., 2020).</li><li><b>Objects</b> move occasionally. A map that never forgets sends the robot to an empty table.</li><li><b>Change detection:</b> an object that <i>should</i> be in view, but is not detected, may have gone.</li></ul><p class=\"pull\">One miss is noise. Several misses in a row are news.</p>", "n": ""}, {"t": "How many misses before we delete it?", "sub": "illustrative detector", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.520 1 0\"><div class=\"hand\" data-h=\"30\"><p class=\"cue\">Prior $0.95$ that the mug is there. The detector misses a present mug $10\\%$ of the time and reports an absent one $5\\%$ of the time. Belief after one miss? After $k$?</p><div class=\"worked\"><div class=\"eq\">\\[P(\\text{there} \\mid \\text{miss}) = \\frac{0.10 \\cdot 0.95}{0.10 \\cdot 0.95 + 0.95 \\cdot 0.05} = 0.67\\]</div><p>Each miss multiplies the odds by $0.10 / 0.95$. After $k$ misses: $0.67,\\ 0.17,\\ 0.02,\\ 0.00,\\ 0.00$.</p></div><div class=\"panel\" style=\"height:30mm\"></div></div></div><div style=\"flex:0.450 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 414 193\" width=\"414\" role=\"img\" aria-label=\"A curve falling from near 1 at zero misses through about one half after a few misses to near zero: each time the object should have been seen and was not, the belief that it is still there drops.\">\n  <path d=\"M112.4 138.6 L378.7 138.6\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M112.4 138.6 L112.4 15.7\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"94.0\" y=\"82.2\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P(still there)</text>\n  <text x=\"240.4\" y=\"177.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">misses in a row</text>\n  <path d=\"M112.4 31.6 L163.6 63.5 L214.8 119.0 L266.0 136.1 L317.2 138.3 L368.4 138.5\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <circle cx=\"112.4\" cy=\"31.6\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"112.4\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.95</text>\n  <text x=\"112.4\" y=\"154.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <circle cx=\"163.6\" cy=\"63.5\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"163.6\" y=\"47.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.67</text>\n  <text x=\"163.6\" y=\"154.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <circle cx=\"214.8\" cy=\"119.0\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"214.8\" y=\"102.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.17</text>\n  <text x=\"214.8\" y=\"154.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <circle cx=\"266.0\" cy=\"136.1\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"266.0\" y=\"119.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.02</text>\n  <text x=\"266.0\" y=\"154.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3</text>\n  <circle cx=\"317.2\" cy=\"138.3\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"317.2\" y=\"121.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.00</text>\n  <text x=\"317.2\" y=\"154.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <circle cx=\"368.4\" cy=\"138.5\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"368.4\" y=\"122.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.00</text>\n  <text x=\"368.4\" y=\"154.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">5</text>\n  <path d=\"M112.4 82.2 L368.4 82.2\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n</svg></div></div></div>", "n": ""}, {"t": "Takeaway", "sub": "", "min": 1.5, "sz": "", "html": "<ul><li>A scene graph is an index over the dense map: objects, places and rooms as nodes, the relations a planner needs as edges.</li><li>ConceptGraphs builds one open-set from SAM, CLIP and an LLM, one detection at a time, with an association score and a threshold.</li><li>What counts as an object depends on the task (Clio), and the hierarchy lets a query go top-down (HOV-SG).</li><li>Graphs are small enough to send between robots, and a node can carry a belief that it still exists.</li></ul><p class=\"pull\">Wednesday hands this graph to a language model.</p>", "n": ""}, {"t": "Learn it again, differently", "sub": "the explanations worth your time", "min": 1, "sz": "", "html": "<ul><li>Hughes, Chang et al., <a href=\"https://arxiv.org/abs/2305.07154\" target=\"_blank\" rel=\"noopener\">Foundations of Spatial Perception for Robotics</a> (IJRR 2024). The long, careful account of layered scene graphs, places and rooms, by the Hydra team.</li><li>MIT News, <a href=\"https://news.mit.edu/2024/helping-robots-focus-on-objects-that-matter-0930\" target=\"_blank\" rel=\"noopener\">Helping robots focus on the objects that matter</a> (Sep 2024). Clio's Information Bottleneck in plain language, with the book-stack and condiment-packet examples.</li><li>The <a href=\"https://concept-graphs.github.io/\" target=\"_blank\" rel=\"noopener\">ConceptGraphs project page</a>. Videos of the map being built and queried by a robot.</li><li>Rotondi et al., <a href=\"https://arxiv.org/abs/2606.19383\" target=\"_blank\" rel=\"noopener\">3D Scene Graphs: Open Challenges and Future Directions</a> (2026), with <a href=\"https://3dscenegraphs.com/\" target=\"_blank\" rel=\"noopener\">3dscenegraphs.com</a>: a survey that fixes the terminology across the field.</li><li>The <a href=\"https://3dscenegraph.stanford.edu/\" target=\"_blank\" rel=\"noopener\">3D Scene Graph project</a> (Armeni et al., ICCV 2019). Where the layered idea started.</li></ul>", "n": ""}, {"t": "What you should be able to do", "sub": "", "min": 1, "sz": "", "html": "<ul><li>Say what a scene graph's nodes and edges store at each layer, and why places and rooms come from free space.</li><li>Compute ConceptGraphs' association score for a detection and decide merge or new object; explain what each term prevents.</li><li>Explain why the spanning tree is a cost decision, and what relations it loses.</li><li>Explain why Clio's map depends on its task list, and what that costs when a new task arrives.</li><li>Estimate the memory and bandwidth of a dense map against a graph, and update an object's existence belief after misses.</li></ul>", "n": ""}, {"t": "Next", "sub": "L14 Mon Oct 26", "min": 1, "sz": "", "html": "<ul><li><b>Response due Sun Oct 25:</b> ConceptGraphs. Clio and HOV-SG are also assigned.</li><li><b>Project proposals due Fri Oct 23</b>, naming a target paper and an evaluation.</li><li><b>L14, Mon Oct 26: guest lecture by Yun Chang.</b> Response paper: Hydra.</li><li>He will cover <a href=\"https://arxiv.org/abs/2201.13360\" target=\"_blank\" rel=\"noopener\">Hydra</a> (building the layers in real time), <a href=\"https://arxiv.org/abs/2404.13696\" target=\"_blank\" rel=\"noopener\">Clio</a> (task-driven granularity), <a href=\"https://arxiv.org/abs/2504.06553\" target=\"_blank\" rel=\"noopener\">ASHiTA</a> (breaking a task into subtasks grounded in the scene graph) and <a href=\"https://arxiv.org/abs/2605.25371\" target=\"_blank\" rel=\"noopener\">FOUND-IT</a> (task-driven scene graphs from one monocular camera, built on foundation models).</li><li><b>L15, Wed Oct 28:</b> the graph as a language model's context (SayPlan, ReMEmbR, OpenEQA), then what a language model can and cannot infer about space.</li></ul>", "n": ""}]}];
</script>

<script>
(function(){
  "use strict";
  var flat=[];
  DECK.forEach(function(L){ L.slides.forEach(function(s,i){
    flat.push({lec:L,s:s,i:i,n:L.slides.length});
  });});

  var cur=0, notesOn=false, gridOn=false, mode="a";
  var slideEl=document.getElementById("slide"), countEl=document.getElementById("count"),
      notesEl=document.getElementById("notes"), notesBody=document.getElementById("notesbody"),
      gridEl=document.getElementById("grid"), progEl=document.getElementById("prog"),
      pickEl=null;

  try{ var sm=localStorage.getItem("rob3dp-mode"); if(sm==="a"||sm==="w") mode=sm; }catch(e){}

  function setMode(m){
    mode=m; document.body.setAttribute("data-mode",m);
    try{ localStorage.setItem("rob3dp-mode",m); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
      b.setAttribute("aria-current", b.getAttribute("data-m")===m ? "true":"false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
    b.addEventListener("click",function(){ setMode(b.getAttribute("data-m")); });
  });

  function typeset(el){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([el]).catch(function(){});
    }
  }

  function render(){
    var f=flat[cur];
    slideEl.innerHTML =
      '<p class="s-meta">'+f.lec.num+' &middot; '+f.lec.title+' &middot; '+f.lec.date+
        (f.s.min?(' &middot; '+f.s.min+' min'):'')+'</p>'+
      '<h2>'+f.s.t+'</h2>'+
      (f.s.sub?'<p class="sub">'+f.s.sub+'</p>':'')+
      '<div class="rulel"></div>'+
      '<div class="body'+(f.s.sz?' sm':'')+'">'+f.s.html+'</div>';
    countEl.textContent=(f.i+1)+" / "+f.n;
    if(notesBody) notesBody.textContent=f.s.n||"—";
    progEl.style.width=((cur+1)/flat.length*100)+"%";
    if(gridOn) buildGrid();
    try{ history.replaceState(null,"","#"+f.lec.id+"-s"+(f.i+1)); }catch(e){}
    document.getElementById("stage").scrollTop=0;
    typeset(slideEl);
  }
  function go(i){ if(i<0||i>=flat.length) return; cur=i; render(); }

  function buildGrid(){
    gridEl.innerHTML="";
    flat.forEach(function(f,k){
      var b=document.createElement("button");
      b.className="thumb"; b.type="button";
      b.setAttribute("aria-current",k===cur?"true":"false");
      b.innerHTML='<span class="tn">'+f.lec.num+' &middot; '+(f.i+1)+
        (f.s.min?(' &middot; '+f.s.min+"'"):'')+'</span><span class="tt">'+f.s.t+'</span>';
      b.addEventListener("click",function(){
        gridOn=false; gridEl.classList.remove("on"); go(k);
      });
      gridEl.appendChild(b);
    });
  }

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); go(cur+1); }
    else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(k==="Home"){ e.preventDefault(); go(0); }
    else if(k==="End"){ e.preventDefault(); go(flat.length-1); }
    else if(k==="a"||k==="A"){ setMode("a"); }
    else if(k==="w"||k==="W"){ setMode("w"); }
    else if((k==="s"||k==="S")&&notesEl){ notesOn=!notesOn; notesEl.classList.toggle("on",notesOn); }
    else if(k==="o"||k==="O"){ gridOn=!gridOn; gridEl.classList.toggle("on",gridOn); if(gridOn) buildGrid(); }
    else if(k==="p"||k==="P"){ document.body.classList.toggle("present"); }
    else if(k==="f"||k==="F"){
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
      else { (document.exitFullscreen||function(){}).call(document); }
    }
    else if(k==="Escape"){ gridOn=false; gridEl.classList.remove("on");
      document.body.classList.remove("present"); }
  });

  var x0=null;
  document.addEventListener("touchstart",function(e){ x0=e.changedTouches[0].clientX; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) go(cur+(dx<0?1:-1));
    x0=null;
  },{passive:true});

  var h=(location.hash||"").replace("#","");
  var m=/^(l\d\d)(?:-s(\d+))?$/.exec(h);
  if(m){
    var idx=flat.findIndex(function(f){
      return f.lec.id===m[1] && (!m[2]||f.i+1===parseInt(m[2],10)); });
    if(idx>=0) cur=idx;
  }
  setMode(mode);
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(render);
  } else { render(); }
})();
</script>
