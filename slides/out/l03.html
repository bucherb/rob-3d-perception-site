<script>
const DECK = [{"id": "l03", "num": "L03", "title": "Rigid-body state, and two views", "date": "Wed Sep 9, 2026", "slides": [{"t": "Rigid-body state, and two views", "sub": "L03 · Unit 0", "min": 1.5, "sz": "", "html": "<p class=\"big\">A pose is not a list of numbers you can add. A second camera is not a second chance to measure depth.</p><p>We stopped last week on the definition of a group. The first half of today uses it: what $[\\mathbf{R}\\mid\\mathbf{t}]$ is, where the arithmetic on it happens, and where its uncertainty lives. The second half asks what two cameras tell you before anything has been matched.</p>", "n": ""}, {"t": "Today", "sub": "", "min": 1, "sz": "", "html": "<ol><li><b>Rotations as a group</b>, poses as a manifold, and where the arithmetic on them happens.</li><li><b>Uncertainty</b> in the tangent space, the lever arm, and the edge of a chain that drifts.</li><li><b>Epipolar geometry</b>: what a second view constrains before you have matched anything.</li><li><b>Features</b>: what makes a point matchable at all.</li></ol><p>Notes: Module <b>A1</b> and <b>A6</b> for the first half, <b>A2</b> and <b>A5</b> for the second. Lab 1 uses every piece of this.</p>", "n": ""}, {"t": "What a group is", "sub": "where we stopped", "min": 2.5, "sz": "", "html": "<p>A <b>group</b> is a set of objects together with one way of combining two of them, obeying four rules.</p><ul><li><b>Closure.</b> Combine two members and you get a member, never anything else.</li><li><b>Associativity.</b> $(ab)c = a(bc)$, so a chain needs no brackets.</li><li><b>Identity.</b> One member $e$ that changes nothing: $ae = ea = a$.</li><li><b>Inverse.</b> Every member $a$ has a partner $a^{-1}$ with $aa^{-1} = e$.</li></ul><table class='cmp'><thead><tr><th>Set and operation</th><th>Group?</th><th>Why</th></tr></thead><tbody><tr><td>Integers, $+$</td><td>Yes</td><td>identity $0$, inverse $-a$</td></tr><tr><td>Integers, $\\times$</td><td>No</td><td>$2$ has no integer inverse</td></tr><tr><td>Shuffles of a deck</td><td>Yes</td><td>undo any shuffle, do nothing = identity</td></tr><tr><td>Rotations, composition</td><td>Yes</td><td>the one we need</td></tr></tbody></table>", "n": ""}, {"t": "$\\mathrm{SO}(3)$: rotations", "sub": "", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{SO}(3) = \\left\\{\\mathbf{R} \\in \\mathbb{R}^{3\\times3} \\;:\\; \\mathbf{R}^\\top\\mathbf{R} = \\mathbf{I},\\ \\det\\mathbf{R} = +1\\right\\}\\]</div><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Count the degrees of freedom: 9 entries, how many constraints?</p><div class=\"worked\"><p>$\\mathbf{R}^\\top\\mathbf{R} = \\mathbf{I}$ is a <i>symmetric</i> matrix equation, so 6 independent constraints rather than 9. Nine minus six leaves <b>three</b>. $\\det\\mathbf{R} = +1$ picks a connected component and removes no dimensions.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div><p class=\"pull\">Three numbers of information, stored in nine, held on a curved surface.</p>", "n": ""}, {"t": "$\\mathrm{SE}(3)$: poses", "sub": "", "min": 2, "sz": "", "html": "<div class=\"eq\">\\[\\mathbf{T} = \\begin{bmatrix}\\mathbf{R} & \\mathbf{t}\\\\ \\mathbf{0}^\\top & 1\\end{bmatrix} \\in \\mathbb{R}^{4\\times4}, \\qquad \\mathbf{R}\\in\\mathrm{SO}(3),\\ \\mathbf{t}\\in\\mathbb{R}^3\\]</div><ul><li>Six degrees of freedom: three from $\\mathbf{R}$, three from $\\mathbf{t}$.</li><li>Composition is matrix multiplication, which is why we padded points to four components.</li><li>Inverse in closed form: $\\mathbf{T}^{-1} = \\begin{bmatrix}\\mathbf{R}^\\top &amp; -\\mathbf{R}^\\top\\mathbf{t}\\\\ \\mathbf{0}^\\top &amp; 1\\end{bmatrix}$.</li></ul><div class=\"rbox\"><span class=\"rbox-t\">Trap</span><p>Never call <code>np.linalg.inv</code> on a pose. It is slower, and it silently drifts off the manifold.</p></div>", "n": ""}, {"t": "Frames and transform trees", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"fig\">\n<svg viewBox=\"0 0 640 190\" width=\"640\" role=\"img\"\n     aria-label=\"A transform tree: world to base_link by odometry, base_link to\n     lidar_mount and cam_link from the URDF, lidar_mount to lidar by calibration,\n     cam_link to cam_optical fixed.\">\n  <defs>\n    <marker id=\"tf-ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\"\n            markerHeight=\"7\" orient=\"auto\">\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/>\n    </marker>\n  </defs>\n  <g stroke=\"var(--accent)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#tf-ar)\">\n    <path d=\"M96 95 H176\"/>\n    <path d=\"M280 84 L338 54\"/>\n    <path d=\"M280 106 L338 136\"/>\n    <path d=\"M436 45 H500\"/>\n    <path d=\"M448 145 H500\"/>\n  </g>\n  <g fill=\"var(--ground)\" stroke=\"var(--rule-strong)\" stroke-width=\"1\" rx=\"3\">\n    <rect x=\"20\"  y=\"80\"  width=\"76\"  height=\"30\" rx=\"3\"/>\n    <rect x=\"176\" y=\"80\"  width=\"104\" height=\"30\" rx=\"3\"/>\n    <rect x=\"338\" y=\"30\"  width=\"98\"  height=\"30\" rx=\"3\"/>\n    <rect x=\"338\" y=\"130\" width=\"110\" height=\"30\" rx=\"3\"/>\n    <rect x=\"500\" y=\"30\"  width=\"66\"  height=\"30\" rx=\"3\"/>\n    <rect x=\"500\" y=\"130\" width=\"118\" height=\"30\" rx=\"3\"/>\n  </g>\n  <g font-family=\"ui-monospace,Menlo,monospace\" font-size=\"13\" fill=\"var(--ink)\"\n     text-anchor=\"middle\" dominant-baseline=\"middle\">\n    <text x=\"58\"  y=\"96\">world</text>\n    <text x=\"228\" y=\"96\">base_link</text>\n    <text x=\"387\" y=\"46\">lidar_mount</text>\n    <text x=\"393\" y=\"146\">cam_link</text>\n    <text x=\"533\" y=\"46\">lidar</text>\n    <text x=\"559\" y=\"146\">cam_optical</text>\n  </g>\n  <g font-family=\"ui-monospace,Menlo,monospace\" font-size=\"10.5\"\n     fill=\"var(--ink-soft)\" text-anchor=\"middle\">\n    <text x=\"136\" y=\"86\">odometry</text>\n    <text x=\"296\" y=\"58\">URDF</text>\n    <text x=\"296\" y=\"132\">URDF</text>\n    <text x=\"468\" y=\"36\" fill=\"var(--accent-2)\" font-weight=\"700\">calibrated</text>\n    <text x=\"474\" y=\"136\">fixed</text>\n  </g>\n</svg>\n</div><ul><li>Each edge is a pose. Reading a chain means multiplying along the path: $\\mathbf{T}_{wc} = \\mathbf{T}_{wb}\\mathbf{T}_{bc}$.</li><li>It is a <b>tree</b>: exactly one path between any two frames, so a lookup is unambiguous.</li></ul><p>Notation: $\\mathbf{T}_{wc}$ maps points <b>from</b> the camera <b>into</b> the world, $\\mathbf{p}_w = \\mathbf{T}_{wc}\\,\\mathbf{p}_c$. Adjacent subscripts cancel.</p>", "n": ""}, {"t": "The four edges fail in four different ways", "sub": "", "min": 2.5, "sz": "", "html": "<table class='cmp'><thead><tr><th>Edge</th><th>Where the number comes from</th><th>What kind of error it has</th></tr></thead><tbody><tr><td>world $\\to$ base</td><td>Odometry or SLAM</td><td>Grows without limit until a loop closes.</td></tr><tr><td>base $\\to$ mount</td><td>A CAD model, via the URDF</td><td>Fixed and wrong, if the part was fitted by hand.</td></tr><tr><td>mount $\\to$ lidar</td><td>You estimated it</td><td>Fixed and uncertain. Bends the whole map.</td></tr><tr><td>cam $\\to$ optical</td><td>A convention someone chose</td><td>Either exactly right or an axis flip.</td></tr></tbody></table><p>Only the first one changes over time. The other three are constants, which makes them easy to forget and impossible to notice.</p>", "n": ""}, {"t": "You cannot add two rotations", "sub": "", "min": 3, "sz": "", "html": "<p>You want to say: *my estimate is $\\bar{\\mathbf{R}}$, and the truth is a little off*. You cannot write $\\mathbf{R} = \\bar{\\mathbf{R}} + \\Delta\\mathbf{R}$, because the sum is not a rotation.</p><div class=\"hand\" data-h=\"34\"><p class=\"cue\">Average a $0^\\circ$ and a $180^\\circ$ rotation about $z$</p><div class=\"worked\"><div class=\"eq\">\\[\\tfrac{1}{2}\\left(\\begin{bmatrix}1&0&0\\\\0&1&0\\\\0&0&1\\end{bmatrix} + \\begin{bmatrix}-1&0&0\\\\0&-1&0\\\\0&0&1\\end{bmatrix}\\right) = \\begin{bmatrix}0&0&0\\\\0&0&0\\\\0&0&1\\end{bmatrix}\\]</div><p>The average of two perfectly good orientations collapses the $x$ and $y$ axes to nothing. Its determinant is $0$, so it has stopped being an orientation rather than become an inaccurate one.</p></div><div class=\"panel\" style=\"height:34mm\"></div></div>", "n": ""}, {"t": "What a vector space gives you", "sub": "", "min": 3, "sz": "", "html": "<p>A <b>vector space</b> is a set where you can add any two members, scale any member, and stay inside. $\\mathbb{R}^3$ is one; $\\mathrm{SO}(3)$ is not. Calculus is built from those two operations:</p><div class=\"eq\">\\[\\frac{\\partial f}{\\partial x} = \\lim_{h\\to 0}\\frac{f(x + h\\mathbf{e}) - f(x)}{h}\\]</div><ul><li>$f$ is whatever you are differentiating, $\\mathbf{e}$ a direction to move in and $h$ a small step along it. Forming $x + h\\mathbf{e}$ needs addition <i>and</i> scaling, and the result has to remain a legal input to $f$.</li><li>On $\\mathrm{SO}(3)$ that step leaves the set, so the limit is asking about a point that does not exist.</li><li>Gradient descent, Gauss&ndash;Newton and Kalman updates all <i>add a correction</i>. None can run here.</li></ul><p class=\"pull\">No addition, no derivative. No derivative, no optimiser.</p>", "n": ""}, {"t": "Flatten it locally: the tangent space", "sub": "", "min": 3.5, "sz": "", "html": "<p>$\\mathrm{SO}(3)$ is a curved surface sitting in $\\mathbb{R}^{3\\times3}$. At any point on it there is a flat plane that touches it, the <b>tangent space</b>, and a plane <i>is</i> a vector space. Calculus works there.</p><div class=\"hand\" data-h=\"34\"><p class=\"cue\">The curve, the plane touching it at $\\bar{\\mathbf{R}}$, and $\\exp$ carrying $\\boldsymbol{\\xi}$ back down onto it</p><div class=\"worked\"><div class=\"fig\"><svg viewBox=\"0 0 367 107\" width=\"367\" role=\"img\" aria-label=\"A curved manifold with a straight tangent line touching it at the mean; a tangent vector maps onto the curve by exp.\">\n  <defs><marker id=\"ad688faccent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"ad688faccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker></defs>\n  <path d=\"M210.8 71.0 L205.5 67.8 L200.0 64.8 L194.4 62.0 L188.7 59.5 L182.9 57.2 L177.0 55.1 L171.0 53.2 L165.0 51.6 L158.9 50.3 L152.7 49.2 L146.5 48.3 L140.3 47.7 L134.1 47.3 L127.8 47.2 L121.6 47.3 L115.3 47.7 L109.1 48.3 L102.9 49.2 L96.8 50.3 L90.7 51.6 L84.6 53.2 L78.7 55.1 L72.8 57.2 L67.0 59.5 L61.2 62.0 L55.6 64.8 L50.1 67.8 L44.8 71.0\" stroke=\"var(--ink)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <text x=\"127.8\" y=\"14.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the manifold SO(3)</text>\n  <path d=\"M8.0 47.2 L247.6 47.2\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <text x=\"252.2\" y=\"37.0\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">tangent space so(3)</text>\n  <circle cx=\"127.8\" cy=\"47.2\" r=\"5.1\" fill=\"var(--ink)\"/>\n  <text x=\"127.8\" y=\"59.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">R̄</text>\n  <path d=\"M127.8 47.2 L206.1 47.2\" stroke=\"var(--accent)\" stroke-width=\"2.28\" fill=\"none\" marker-end=\"url(#ad688faccent)\"/>\n  <text x=\"167.0\" y=\"28.7\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">ξ</text>\n  <circle cx=\"202.9\" cy=\"66.3\" r=\"4.7\" fill=\"var(--accent-2)\"/>\n  <path d=\"M215.1 44.1 L212.3 42.6 L209.5 41.2 L206.7 39.8 L203.9 38.5 L201.0 37.2 L198.1 36.0 L195.2 34.8 L192.3 33.6 L189.3 32.5 L186.4 31.5 L183.4 30.5 L180.4 29.6 L177.4 28.7 L174.4 27.9 L171.3 27.1 L168.3 26.4 L165.2 25.7 L162.1 25.1 L159.1 24.5 L156.0 24.0 L152.9 23.6 L149.8 23.2 L146.6 22.8 L143.5 22.5 L140.4 22.3 L137.3 22.1 L134.1 21.9 L131.0 21.9\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\" marker-end=\"url(#ad688faccent2)\"/>\n  <text x=\"222.7\" y=\"47.5\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">exp</text>\n  <text x=\"219.0\" y=\"90.3\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">R̄exp(ξ<tspan baseline-shift=\"super\" font-size=\"72%\">∧</tspan>)</text>\n</svg></div></div><div class=\"panel\" style=\"height:34mm\"></div></div><p>At the identity that plane is $\\mathfrak{so}(3)$: the <b>skew-symmetric</b> matrices, $\\mathbf{A}^\\top = -\\mathbf{A}$. Three free numbers, and nothing tying them together.</p>", "n": ""}, {"t": "Three numbers, not nine", "sub": "the hat map", "min": 2.5, "sz": "", "html": "<div class=\"hand\" data-h=\"28\"><p class=\"cue\">Write out a skew-symmetric $3\\times3$ and count what is free</p><div class=\"worked\"><p>$\\mathbf{A}^\\top = -\\mathbf{A}$ zeroes the diagonal and makes the lower triangle minus the upper. Three entries are free:</p><div class=\"eq\">\\[\\boldsymbol{\\omega}^\\wedge = \\begin{bmatrix} 0 & -\\omega_3 & \\omega_2\\\\ \\omega_3 & 0 & -\\omega_1\\\\ -\\omega_2 & \\omega_1 & 0\\end{bmatrix} \\qquad\\longleftrightarrow\\qquad \\boldsymbol{\\omega} = (\\omega_1,\\, \\omega_2,\\, \\omega_3)\\]</div><p>You have met it: $\\boldsymbol{\\omega}^\\wedge\\mathbf{x} = \\boldsymbol{\\omega} \\times \\mathbf{x}$, the cross-product matrix, back this afternoon inside $\\mathbf{E}$.</p></div><div class=\"panel\" style=\"height:28mm\"></div></div><p class=\"pull\">The tangent space at the identity is $\\mathbb{R}^3$ in a matrix costume: three numbers you may add and scale.</p>", "n": ""}, {"t": "Where $\\exp$ comes from", "sub": "", "min": 4, "sz": "", "html": "<div class=\"hand\" data-h=\"22\"><p class=\"cue\">Turn at a constant $\\boldsymbol{\\omega}$, and integrate for one second</p><div class=\"worked\"><p>Turning at a constant angular velocity means the rotation obeys a linear differential equation, and a linear ODE with constant coefficients is solved by an exponential:</p><div class=\"eq\">\\[\\dot{\\mathbf{R}} = \\boldsymbol{\\omega}^\\wedge\\mathbf{R}, \\;\\; \\mathbf{R}(0) = \\mathbf{I} \\qquad\\Longrightarrow\\qquad \\mathbf{R}(t) = \\exp\\!\\big(t\\,\\boldsymbol{\\omega}^\\wedge\\big)\\]</div></div><div class=\"panel\" style=\"height:22mm\"></div></div><div class=\"fig\"><svg viewBox=\"0 0 168 133\" width=\"168\" role=\"img\" aria-label=\"A vector v from the origin, an axis omega pointing up, and the circle swept by the tip of the part of v perpendicular to the axis as v turns through an angle theta.\">\n  <defs><marker id=\"acb067accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"acb067accent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"acb067ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M153.2 55.0 L152.8 52.9 L151.6 50.8 L149.6 48.8 L146.9 46.8 L143.4 45.0 L139.3 43.2 L134.5 41.6 L129.1 40.1 L123.2 38.7 L116.9 37.6 L110.1 36.6 L103.0 35.9 L95.7 35.3 L88.2 35.0 L80.6 34.9 L73.0 35.0 L65.5 35.3 L58.1 35.9 L51.1 36.6 L44.3 37.6 L37.9 38.7 L32.0 40.1 L26.6 41.6 L21.9 43.2 L17.7 45.0 L14.3 46.8 L11.6 48.8 L9.6 50.8 L8.4 52.9 L8.0 55.0 L8.4 57.1 L9.6 59.2 L11.6 61.3 L14.3 63.2 L17.7 65.1 L21.9 66.9 L26.6 68.5 L32.0 70.0 L37.9 71.3 L44.3 72.5 L51.1 73.5 L58.1 74.2 L65.5 74.8 L73.0 75.1 L80.6 75.2 L88.2 75.1 L95.7 74.8 L103.0 74.2 L110.1 73.5 L116.9 72.5 L123.2 71.3 L129.1 70.0 L134.5 68.5 L139.3 66.9 L143.4 65.1 L146.9 63.2 L149.6 61.3 L151.6 59.2 L152.8 57.1 L153.2 55.0 Z\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M80.6 124.9 L80.6 20.1\" stroke=\"var(--ink)\" stroke-width=\"1.90\" fill=\"none\" marker-end=\"url(#acb067ink)\"/>\n  <text x=\"80.6\" y=\"11.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">ω</text>\n  <path d=\"M144.7 64.5 L146.7 63.4 L148.5 62.2 L150.0 61.0 L151.2 59.7 L152.1 58.5 L152.7 57.2 L153.1 55.9 L153.1 54.6 L152.9 53.3 L152.4 52.1 L151.5 50.8 L150.4 49.6 L149.0 48.3 L147.3 47.1 L145.4 46.0 L143.2 44.8 L140.7 43.8 L138.0 42.7 L135.1 41.7 L131.9 40.8 L128.5 39.9 L125.0 39.1 L121.2 38.3 L117.3 37.7 L113.2 37.0 L109.1 36.5 L104.7 36.0 L100.3 35.6 L95.9 35.3 L91.3 35.1 L86.7 35.0 L82.1 34.9 L77.5 34.9 L72.9 35.0 L68.3 35.2 L63.8 35.4 L59.3 35.8 L54.9 36.2 L50.7 36.7 L46.5 37.2\" stroke=\"var(--accent)\" stroke-width=\"2.47\" fill=\"none\"/>\n  <path d=\"M80.6 111.5 L144.7 64.5\" stroke=\"var(--accent-2)\" stroke-width=\"2.47\" fill=\"none\" marker-end=\"url(#acb067accent2)\"/>\n  <path d=\"M80.6 111.5 L46.5 37.2\" stroke=\"var(--accent)\" stroke-width=\"2.47\" fill=\"none\" marker-end=\"url(#acb067accent)\"/>\n  <circle cx=\"80.6\" cy=\"111.5\" r=\"2.7\" fill=\"var(--ink)\"/>\n  <text x=\"153.0\" y=\"69.9\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">v</text>\n  <text x=\"38.2\" y=\"33.2\" text-anchor=\"end\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">Rv</text>\n  <text x=\"87.3\" y=\"24.9\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">θ = ‖ω‖</text>\n</svg></div><p>Read it as: spin about $\\boldsymbol{\\omega}/\\|\\boldsymbol{\\omega}\\|$ at $\\|\\boldsymbol{\\omega}\\|$ rad/s for one second, then stop. So $(0, 0, \\pi/2)$ is a $90^\\circ$ turn about $z$. $\\mathrm{Log}$ runs it backwards.</p>", "n": ""}, {"t": "$\\mathfrak{so}(3)$ and $\\mathfrak{se}(3)$", "sub": "what the flat space contains", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>$\\mathrm{SO}(3)$</th><th>$\\mathrm{SE}(3)$</th></tr></thead><tbody><tr><td>Group element</td><td>$\\mathbf{R}$, $3\\times3$, $\\mathbf{R}^\\top\\mathbf{R} = \\mathbf{I}$</td><td>$\\mathbf{T}$, $4\\times4$, a rotation and a translation</td></tr><tr><td>Degrees of freedom</td><td>3</td><td>6</td></tr><tr><td>Tangent space at $\\mathbf{I}$</td><td>$\\mathfrak{so}(3)$</td><td>$\\mathfrak{se}(3)$</td></tr><tr><td>whose elements are</td><td>skew-symmetric $3\\times3$</td><td>$4\\times4$: a skew block and a column</td></tr><tr><td>written as a vector</td><td>$\\boldsymbol{\\omega} \\in \\mathbb{R}^3$</td><td>$\\boldsymbol{\\xi} = (\\mathbf{v}, \\boldsymbol{\\omega}) \\in \\mathbb{R}^6$</td></tr></tbody></table><div class=\"eq\">\\[\\boldsymbol{\\xi}^\\wedge = \\begin{bmatrix} \\boldsymbol{\\omega}^\\wedge & \\mathbf{v}\\\\ \\mathbf{0}^\\top & 0\\end{bmatrix} \\in \\mathfrak{se}(3)\\]</div><p>Both are <b>vector spaces</b>: nothing ties the entries together, so you may add and scale them. That is the entire reason for going there.</p>", "n": ""}, {"t": "A twist", "sub": "what $\\exp$ does to a six-vector", "min": 3, "sz": "", "html": "<p>$\\|\\mathrm{Log}(\\mathbf{R}_1^\\top\\mathbf{R}_2)\\|$ is the angle between two rotations, in radians. That is what a rotation error <i>is</i>, and it is the first thing the tangent space buys you.</p><div class=\"cols\"><div style=\"flex:0.500 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 310 152\" width=\"310\" role=\"img\" aria-label=\"A helix winding around a dotted axis: the path traced by moving with a constant twist for one second. A dashed straight line joins the start to the finish, and a separate arrow at the start shows the direction v points before any turning happens.\">\n  <defs><marker id=\"a247adink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a247adrule\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--rule)\"/></marker></defs>\n  <path d=\"M8.0 72.4 L284.0 72.4\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\" marker-end=\"url(#a247adrule)\"/>\n  <text x=\"293.3\" y=\"72.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">ω</text>\n  <path d=\"M40.3 72.4 L41.9 69.5 L43.5 66.7 L45.2 64.0 L46.8 61.2 L48.5 58.5 L50.1 55.9 L51.8 53.3 L53.4 50.8 L55.0 48.5 L56.7 46.2 L58.3 44.0 L60.0 41.9 L61.6 40.0 L63.3 38.2 L64.9 36.6 L66.5 35.1 L68.2 33.8 L69.8 32.6 L71.5 31.6 L73.1 30.8 L74.8 30.2 L76.4 29.7 L78.0 29.4 L79.7 29.3 L81.3 29.4 L83.0 29.7 L84.6 30.2 L86.3 30.8 L87.9 31.6 L89.5 32.6 L91.2 33.8 L92.8 35.1 L94.5 36.6 L96.1 38.2 L97.7 40.0 L99.4 41.9 L101.0 44.0 L102.7 46.2 L104.3 48.5 L106.0 50.8 L107.6 53.3 L109.2 55.9 L110.9 58.5 L112.5 61.2 L114.2 64.0 L115.8 66.7 L117.5 69.5 L119.1 72.4 L120.7 75.2 L122.4 78.0 L124.0 80.7 L125.7 83.5 L127.3 86.2 L129.0 88.8 L130.6 91.4 L132.2 93.9 L133.9 96.2 L135.5 98.5 L137.2 100.7 L138.8 102.8 L140.5 104.7 L142.1 106.5 L143.7 108.1 L145.4 109.6 L147.0 110.9 L148.7 112.1 L150.3 113.1 L152.0 113.9 L153.6 114.5 L155.2 115.0 L156.9 115.3 L158.5 115.4 L160.2 115.3 L161.8 115.0 L163.5 114.5 L165.1 113.9 L166.7 113.1 L168.4 112.1 L170.0 110.9 L171.7 109.6 L173.3 108.1 L175.0 106.5 L176.6 104.7 L178.2 102.8 L179.9 100.7 L181.5 98.5 L183.2 96.2 L184.8 93.9 L186.5 91.4 L188.1 88.8 L189.7 86.2 L191.4 83.5 L193.0 80.7 L194.7 78.0 L196.3 75.2 L198.0 72.4 L199.6 69.5 L201.2 66.7 L202.9 64.0 L204.5 61.2 L206.2 58.5 L207.8 55.9 L209.5 53.3 L211.1 50.8 L212.7 48.5 L214.4 46.2 L216.0 44.0 L217.7 41.9 L219.3 40.0 L220.9 38.2 L222.6 36.6 L224.2 35.1 L225.9 33.8 L227.5 32.6 L229.2 31.6 L230.8 30.8 L232.4 30.2 L234.1 29.7 L235.7 29.4 L237.4 29.3\" stroke=\"var(--accent)\" stroke-width=\"2.47\" fill=\"none\"/>\n  <path d=\"M40.3 72.4 L237.4 29.3\" stroke=\"var(--accent-2)\" stroke-width=\"1.90\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"131.6\" y=\"65.5\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">where you end up</text>\n  <path d=\"M40.3 72.4 L67.4 25.9\" stroke=\"var(--ink)\" stroke-width=\"2.28\" fill=\"none\" marker-end=\"url(#a247adink)\"/>\n  <text x=\"60.2\" y=\"14.5\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">v</text>\n  <circle cx=\"40.3\" cy=\"72.4\" r=\"3.7\" fill=\"var(--ink)\"/>\n  <circle cx=\"237.4\" cy=\"29.3\" r=\"3.7\" fill=\"var(--accent-2)\"/>\n  <text x=\"138.8\" y=\"139.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">one second of constant twist</text>\n</svg></div></div><div style=\"flex:0.460 1 0\"><p>$\\exp$ of a twist is where you end up after moving that way for one second, <b>turning while you translate</b>. The path is a helix, a screw.</p></div></div><p>So $\\mathbf{v}$ is a velocity, not a displacement. The chord is shorter than the path, and points elsewhere.</p>", "n": ""}, {"t": "Uncertainty lives in the tangent space", "sub": "", "min": 3, "sz": "", "html": "<p>A pose holds 6 degrees of freedom in 12 numbers, so a spread over those 12 numbers is meaningless: most directions leave the surface entirely. Put the <b>mean on the surface</b> and the <b>noise on the flat plane touching it there</b>, the same plane the twist lives in.</p><div class=\"fig\"><svg viewBox=\"0 0 634 175\" width=\"634\" role=\"img\" aria-label=\"A curved surface with a straight tangent plane touching it at the mean pose. A symmetric bell curve sits on the tangent plane, and arrows marked exp carry its samples down onto the curved surface.\">\n  <defs><marker id=\"af776daccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker></defs>\n  <path d=\"M218.6 133.7 L221.8 129.7 L225.1 125.8 L228.4 122.1 L231.7 118.6 L235.0 115.1 L238.3 111.8 L241.6 108.6 L244.8 105.6 L248.1 102.7 L251.4 99.9 L254.7 97.3 L258.0 94.8 L261.3 92.5 L264.6 90.2 L267.8 88.1 L271.1 86.2 L274.4 84.4 L277.7 82.7 L281.0 81.1 L284.3 79.7 L287.6 78.4 L290.8 77.3 L294.1 76.3 L297.4 75.4 L300.7 74.6 L304.0 74.0 L307.3 73.6 L310.5 73.2 L313.8 73.0 L317.1 73.0 L320.4 73.0 L323.7 73.2 L327.0 73.6 L330.3 74.0 L333.5 74.6 L336.8 75.4 L340.1 76.3 L343.4 77.3 L346.7 78.4 L350.0 79.7 L353.3 81.1 L356.5 82.7 L359.8 84.4 L363.1 86.2 L366.4 88.1 L369.7 90.2 L373.0 92.5 L376.3 94.8 L379.5 97.3 L382.8 99.9 L386.1 102.7 L389.4 105.6 L392.7 108.6 L396.0 111.8 L399.3 115.1 L402.5 118.6 L405.8 122.1 L409.1 125.8 L412.4 129.7 L415.7 133.7\" stroke=\"var(--ink)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <path d=\"M200.6 73.0 L442.6 73.0\" stroke=\"var(--accent)\" stroke-width=\"1.90\" fill=\"none\"/>\n  <text x=\"452.0\" y=\"73.0\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">tangent plane</text>\n  <text x=\"248.1\" y=\"126.7\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the group</text>\n  <path d=\"M245.4 71.9 L248.3 71.5 L251.2 71.1 L254.0 70.5 L256.9 69.9 L259.8 69.0 L262.6 68.1 L265.5 66.9 L268.4 65.6 L271.2 64.1 L274.1 62.4 L277.0 60.5 L279.8 58.4 L282.7 56.2 L285.6 53.8 L288.4 51.4 L291.3 48.9 L294.2 46.5 L297.0 44.1 L299.9 41.9 L302.8 39.9 L305.7 38.2 L308.5 36.8 L311.4 35.7 L314.3 35.1 L317.1 34.9 L320.0 35.1 L322.9 35.7 L325.7 36.8 L328.6 38.2 L331.5 39.9 L334.3 41.9 L337.2 44.1 L340.1 46.5 L342.9 48.9 L345.8 51.4 L348.7 53.8 L351.5 56.2 L354.4 58.4 L357.3 60.5 L360.1 62.4 L363.0 64.1 L365.9 65.6 L368.7 66.9 L371.6 68.1 L374.5 69.0 L377.3 69.9 L380.2 70.5 L383.1 71.1 L385.9 71.5 L388.8 71.9\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"317.1\" y=\"14.3\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ξ: an ordinary Gaussian</text>\n  <path d=\"M263.4 77.4 L263.4 86.5\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\" marker-end=\"url(#af776daccent2)\"/>\n  <circle cx=\"263.4\" cy=\"73.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"263.4\" cy=\"91.0\" r=\"3.8\" fill=\"var(--accent-2)\"/>\n  <path d=\"M290.2 77.4 L290.2 73.0\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\" marker-end=\"url(#af776daccent2)\"/>\n  <circle cx=\"290.2\" cy=\"73.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"290.2\" cy=\"77.5\" r=\"3.8\" fill=\"var(--accent-2)\"/>\n  <path d=\"M344.0 77.4 L344.0 73.0\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\" marker-end=\"url(#af776daccent2)\"/>\n  <circle cx=\"344.0\" cy=\"73.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"344.0\" cy=\"77.5\" r=\"3.8\" fill=\"var(--accent-2)\"/>\n  <path d=\"M370.9 77.4 L370.9 86.5\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\" marker-end=\"url(#af776daccent2)\"/>\n  <circle cx=\"370.9\" cy=\"73.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"370.9\" cy=\"91.0\" r=\"3.8\" fill=\"var(--accent-2)\"/>\n  <text x=\"384.8\" y=\"86.5\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">exp</text>\n  <circle cx=\"317.1\" cy=\"73.0\" r=\"5.0\" fill=\"var(--ink)\"/>\n  <text x=\"308.2\" y=\"89.1\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">barT</text>\n  <text x=\"317.1\" y=\"160.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">every sample lands on the surface, so every sample is a pose</text>\n</svg></div><ul><li>On the plane it is an ordinary Gaussian over six numbers, so it has an ordinary $6\\times6$ covariance. This is the number your SLAM system reports.</li><li>Pushed down by $\\exp$ it becomes a spread of poses, each one valid by construction.</li></ul>", "n": ""}, {"t": "Moving uncertainty between frames", "sub": "the lever arm", "min": 3.5, "sz": "", "html": "<p>An uncertainty is always quoted in some frame. Describe the same uncertainty from a different frame and it changes shape, because the conversion mixes <b>rotation into position</b>: a small angular error at the base becomes a position error out where the sensor is.</p><div class=\"fig\"><svg viewBox=\"0 0 564 215\" width=\"564\" role=\"img\" aria-label=\"A wedge of angular uncertainty spreading from the robot base, widening at the sensor and widening much further at an observed point far away.\">\n  <path d=\"M112.7 70.3 L112.8 69.9 L112.8 69.5 L112.8 69.1 L112.8 68.7 L112.9 68.3 L112.9 67.9 L112.9 67.6 L112.9 67.2 L112.9 66.8 L112.9 66.4 L112.9 66.0 L113.0 65.6 L113.0 65.2 L113.0 64.8 L113.0 64.4 L113.0 64.0 L112.9 63.6 L112.9 63.2 L112.9 62.8 L112.9 62.5 L112.9 62.1 L112.9 61.7 L112.9 61.3 L112.8 60.9 L112.8 60.5 L112.8 60.1 L112.8 59.7 L112.7 59.3\" stroke=\"var(--accent-2-soft)\" stroke-width=\"0.00\" fill=\"none\"/>\n  <path d=\"M50.0 64.8 L457.8 100.5\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M50.0 64.8 L457.8 29.1\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M50.0 64.8 L459.3 64.8\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <circle cx=\"50.0\" cy=\"64.8\" r=\"5.8\" fill=\"var(--ink)\"/>\n  <text x=\"44.7\" y=\"76.4\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">base</text>\n  <text x=\"118.2\" y=\"34.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">σ<tspan baseline-shift=\"sub\" font-size=\"72%\">ψ</tspan></text>\n  <circle cx=\"186.4\" cy=\"64.8\" r=\"5.4\" fill=\"var(--accent)\"/>\n  <path d=\"M186.4 76.7 L186.4 52.9\" stroke=\"var(--accent)\" stroke-width=\"2.28\" fill=\"none\"/>\n  <text x=\"186.4\" y=\"98.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">sensor</text>\n  <text x=\"202.2\" y=\"41.3\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">‖t‖ σ<tspan baseline-shift=\"sub\" font-size=\"72%\">ψ</tspan></text>\n  <circle cx=\"459.3\" cy=\"64.8\" r=\"5.4\" fill=\"var(--accent)\"/>\n  <path d=\"M459.3 100.6 L459.3 29.0\" stroke=\"var(--accent)\" stroke-width=\"2.28\" fill=\"none\"/>\n  <text x=\"459.3\" y=\"122.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">observed point</text>\n  <text x=\"475.1\" y=\"17.4\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Z σ<tspan baseline-shift=\"sub\" font-size=\"72%\">ψ</tspan></text>\n  <path d=\"M50.0 138.3 v6.3 H186.4 v-6.3\" stroke=\"var(--ink-soft)\" stroke-width=\"1\" fill=\"none\"/>\n  <text x=\"118.2\" y=\"155.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">‖t‖</text>\n  <path d=\"M50.0 175.0 v6.3 H459.3 v-6.3\" stroke=\"var(--ink-soft)\" stroke-width=\"1\" fill=\"none\"/>\n  <text x=\"254.7\" y=\"192.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">Z</text>\n</svg></div><p>It grows with the mounting offset $\\|\\mathbf{t}\\|$, and then again with the range $Z$ to whatever you observed. The same small angle, multiplied twice.</p>", "n": ""}, {"t": "Half a degree, in centimetres", "sub": "", "min": 3, "sz": "", "html": "<div class=\"hand\" data-h=\"38\"><p class=\"cue\">Base yaw error to sensor position error, then to point error</p><div class=\"worked\"><p>Base yaw uncertainty $\\sigma_\\psi = 0.5^\\circ = 8.73\\times10^{-3}$ rad, sensor mounted $\\|\\mathbf{t}\\| = 2$ m from the base:</p><div class=\"eq\">\\[\\sigma_p \\approx \\|\\mathbf{t}\\|\\,\\sigma_\\psi = 2 \\times 8.73\\times10^{-3} = 1.7\\ \\text{cm}\\]</div><p>A point observed 20 m out inherits the same angular error again: $20 \\times 8.73\\times10^{-3} \\approx 17$ cm, before the sensor's own noise contributes anything.</p></div><div class=\"panel\" style=\"height:38mm\"></div></div><p class=\"pull\">Half a degree at the base is seventeen centimetres at the far wall.</p>", "n": ""}, {"t": "Chains, and the edge that drifts", "sub": "", "min": 3, "sz": "", "html": "<p>A chain of estimated poses is the normal case: odometry, then a mount, then a calibration. Each link carries its own uncertainty into the final frame, and they accumulate.</p><div class=\"fig\"><svg viewBox=\"0 0 699 173\" width=\"699\" role=\"img\" aria-label=\"A dashed path with four uncertainty ellipses along it, each larger than the last, showing position uncertainty growing with distance travelled.\">\n  <path d=\"M61.0 90.9 L70.5 88.4 L80.0 86.0 L89.6 83.6 L99.1 81.2 L108.6 78.8 L118.1 76.4 L127.7 74.1 L137.2 71.8 L146.7 69.5 L156.2 67.2 L165.7 65.0 L175.3 62.8 L184.8 60.7 L194.3 58.6 L203.8 56.6 L213.4 54.6 L222.9 52.7 L232.4 50.9 L241.9 49.1 L251.5 47.4 L261.0 45.8 L270.5 44.2 L280.0 42.7 L289.5 41.3 L299.1 40.0 L308.6 38.7 L318.1 37.6 L327.6 36.5 L337.2 35.5 L346.7 34.7 L356.2 33.9 L365.7 33.2 L375.3 32.6 L384.8 32.0 L394.3 31.6 L403.8 31.3 L413.4 31.1 L422.9 31.0 L432.4 31.0 L441.9 31.0 L451.4 31.2 L461.0 31.5 L470.5 31.9 L480.0 32.3 L489.5 32.9 L499.1 33.6 L508.6 34.3 L518.1 35.2 L527.6 36.1 L537.2 37.1 L546.7 38.3 L556.2 39.5 L565.7 40.8 L575.2 42.1 L584.8 43.6 L594.3 45.1 L603.8 46.7 L613.3 48.4 L622.9 50.1 L632.4 52.0\" stroke=\"var(--rule)\" stroke-width=\"1.52\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M70.2 90.9 L70.1 89.9 L69.8 88.9 L69.4 88.0 L68.7 87.1 L68.0 86.3 L67.0 85.6 L66.0 85.0 L64.8 84.6 L63.6 84.2 L62.3 84.0 L61.0 83.9 L59.7 84.0 L58.4 84.2 L57.2 84.6 L56.0 85.0 L55.0 85.6 L54.0 86.3 L53.2 87.1 L52.6 88.0 L52.1 88.9 L51.9 89.9 L51.8 90.9 L51.9 91.8 L52.1 92.8 L52.6 93.7 L53.2 94.6 L54.0 95.4 L55.0 96.1 L56.0 96.7 L57.2 97.1 L58.4 97.5 L59.7 97.7 L61.0 97.8 L62.3 97.7 L63.6 97.5 L64.8 97.1 L66.0 96.7 L67.0 96.1 L68.0 95.4 L68.7 94.6 L69.4 93.7 L69.8 92.8 L70.1 91.8 L70.2 90.9\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <circle cx=\"61.0\" cy=\"90.9\" r=\"3.9\" fill=\"var(--ink)\"/>\n  <path d=\"M273.6 47.4 L273.3 45.4 L272.7 43.5 L271.6 41.7 L270.1 39.9 L268.2 38.4 L265.9 37.0 L263.4 35.8 L260.6 34.8 L257.7 34.1 L254.6 33.7 L251.5 33.6 L248.3 33.7 L245.2 34.1 L242.3 34.8 L239.5 35.8 L237.0 37.0 L234.7 38.4 L232.8 39.9 L231.3 41.7 L230.2 43.5 L229.6 45.4 L229.3 47.4 L229.6 49.4 L230.2 51.3 L231.3 53.2 L232.8 54.9 L234.7 56.5 L237.0 57.9 L239.5 59.0 L242.3 60.0 L245.2 60.7 L248.3 61.1 L251.5 61.2 L254.6 61.1 L257.7 60.7 L260.6 60.0 L263.4 59.0 L265.9 57.9 L268.2 56.5 L270.1 54.9 L271.6 53.2 L272.7 51.3 L273.3 49.4 L273.6 47.4\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <circle cx=\"251.5\" cy=\"47.4\" r=\"3.9\" fill=\"var(--ink)\"/>\n  <path d=\"M480.6 31.0 L480.2 27.8 L479.1 24.5 L477.1 21.5 L474.5 18.6 L471.2 16.0 L467.3 13.6 L462.8 11.7 L458.0 10.1 L452.8 8.9 L447.4 8.2 L441.9 8.0 L436.4 8.2 L431.0 8.9 L425.8 10.1 L421.0 11.7 L416.6 13.6 L412.7 16.0 L409.4 18.6 L406.7 21.5 L404.8 24.5 L403.6 27.8 L403.2 31.0 L403.6 34.3 L404.8 37.5 L406.7 40.6 L409.4 43.5 L412.7 46.1 L416.6 48.5 L421.0 50.4 L425.8 52.0 L431.0 53.1 L436.4 53.8 L441.9 54.1 L447.4 53.8 L452.8 53.1 L458.0 52.0 L462.8 50.4 L467.3 48.5 L471.2 46.1 L474.5 43.5 L477.1 40.6 L479.1 37.5 L480.2 34.3 L480.6 31.0\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <circle cx=\"441.9\" cy=\"31.0\" r=\"3.9\" fill=\"var(--ink)\"/>\n  <path d=\"M691.4 52.0 L690.8 47.1 L689.0 42.4 L686.0 37.8 L682.0 33.5 L677.0 29.6 L671.0 26.2 L664.3 23.3 L656.9 20.9 L649.0 19.2 L640.8 18.2 L632.4 17.9 L624.0 18.2 L615.8 19.2 L607.9 20.9 L600.5 23.3 L593.8 26.2 L587.8 29.6 L582.8 33.5 L578.7 37.8 L575.8 42.4 L574.0 47.1 L573.4 52.0 L574.0 56.8 L575.8 61.6 L578.7 66.1 L582.8 70.4 L587.8 74.3 L593.8 77.7 L600.5 80.6 L607.9 83.0 L615.8 84.7 L624.0 85.7 L632.4 86.1 L640.8 85.7 L649.0 84.7 L656.9 83.0 L664.3 80.6 L671.0 77.7 L677.0 74.3 L682.0 70.4 L686.0 66.1 L689.0 61.6 L690.8 56.8 L691.4 52.0\" stroke=\"var(--accent)\" stroke-width=\"1.71\" fill=\"none\"/>\n  <circle cx=\"632.4\" cy=\"52.0\" r=\"3.9\" fill=\"var(--ink)\"/>\n  <text x=\"42.6\" y=\"110.2\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">start</text>\n  <text x=\"346.7\" y=\"158.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">same sensor, same noise, more distance travelled</text>\n</svg></div><ul><li>Every edge in the tree has a bounded error except world $\\to$ base. That one integrates incremental motion, so it grows without limit.</li><li>The error is in the integration, not the measurement. A better sensor does not fix it. Closing a loop does.</li></ul>", "n": ""}, {"t": "PnP, framed properly", "sub": "", "min": 3, "sz": "", "html": "<p>Given 3D points <b>in a map you already have</b>, and their projections in the image you are looking at right now, find $[\\mathbf{R}\\mid\\mathbf{t}]$. Both halves of today's lecture meet here.</p><div class=\"eq\">\\[\\argmin_{\\mathbf{R}\\in\\mathrm{SO}(3),\\,\\mathbf{t}\\in\\mathbb{R}^3} \\;\\sum_i \\left\\| \\mathbf{u}_i - \\pi\\!\\left(\\mathbf{K}\\left[\\mathbf{R}\\mid\\mathbf{t}\\right]\\tilde{\\mathbf{X}}_i\\right) \\right\\|^2\\]</div><ul><li>The reprojection error from the first half, minimised over a pose instead of over $\\mathbf{P}$. As before, $\\pi$ is the perspective divide, $(a, b, c) \\mapsto (a/c,\\; b/c)$, turning the product back into a pixel.</li><li>Six unknowns, two equations per correspondence, so <b>three points</b> is the minimum. Three points admit up to four valid solutions; a fourth disambiguates.</li></ul><p class=\"pull\">Wrapped in RANSAC, this is the answer to “where am I?”</p>", "n": ""}, {"t": "Why we optimise on the manifold", "sub": "", "min": 3, "sz": "", "html": "<p>An optimiser repeatedly asks <i>which small motion would reduce the error</i>, then applies it. Both halves of that sentence are where today's second half arrives at once.</p><ul><li><b>What it solves for</b> is a twist: six unconstrained numbers, rather than twelve matrix entries with six constraints between them. Unconstrained is what makes the step computable.</li><li><b>How it applies the answer</b> is by composing, not adding. The current estimate is moved along that twist, the way $\\exp$ moves you along the surface.</li><li>So the estimate is a valid pose at every iteration. Nothing to re-orthogonalise, nothing that slowly slides off the manifold.</li></ul><p class=\"pull\">Add a correction to a pose and you get something that is not a pose. Compose one and you always do.</p>", "n": ""}, {"t": "Epipolar geometry", "sub": "", "min": 3.5, "sz": "", "html": "<div class=\"fig\">\n<svg viewBox=\"0 0 590 275\" width=\"590\" role=\"img\"\n     aria-label=\"Epipolar geometry: two camera centres, a 3D point X, its two\n     projections, the baseline through both epipoles, and the epipolar line in\n     the second image on which the match must lie.\">\n  <g fill=\"var(--ground)\" stroke=\"var(--rule-strong)\" stroke-width=\"1\">\n    <path d=\"M98 252 L182 224 L182 84 L98 112 Z\"/>\n    <path d=\"M406 252 L490 224 L490 84 L406 112 Z\"/>\n  </g>\n  <path d=\"M28 210 L546 168\" stroke=\"var(--ink-soft)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/>\n  <g stroke=\"var(--accent-2)\" stroke-width=\"2\" fill=\"none\">\n    <path d=\"M28 210 L350 42\"/>\n    <path d=\"M546 168 L350 42\"/>\n  </g>\n  <path d=\"M406 215 L451 97\" stroke=\"var(--accent)\" stroke-width=\"2.4\"/>\n  <g>\n    <circle cx=\"28\"  cy=\"210\" r=\"5\"   fill=\"var(--ink)\"/>\n    <circle cx=\"546\" cy=\"168\" r=\"5\"   fill=\"var(--ink)\"/>\n    <circle cx=\"350\" cy=\"42\"  r=\"6\"   fill=\"var(--accent-2)\"/>\n    <circle cx=\"140\" cy=\"152\" r=\"5\"   fill=\"var(--accent)\"/>\n    <circle cx=\"448\" cy=\"105\" r=\"5\"   fill=\"var(--accent)\"/>\n    <circle cx=\"140\" cy=\"201\" r=\"4\"   fill=\"var(--ink-soft)\"/>\n    <circle cx=\"420\" cy=\"178\" r=\"4\"   fill=\"var(--ink-soft)\"/>\n  </g>\n  <g font-family=\"Georgia,serif\" font-size=\"15\" fill=\"var(--ink)\">\n    <text x=\"6\"   y=\"230\">C&#8321;</text>\n    <text x=\"540\" y=\"192\">C&#8322;</text>\n    <text x=\"336\" y=\"30\">X</text>\n    <text x=\"112\" y=\"146\">x&#8321;</text>\n    <text x=\"456\" y=\"98\">x&#8322;</text>\n    <text x=\"128\" y=\"220\" fill=\"var(--ink-soft)\">e&#8321;</text>\n    <text x=\"408\" y=\"197\" fill=\"var(--ink-soft)\">e&#8322;</text>\n    <text x=\"250\" y=\"205\" fill=\"var(--ink-soft)\" font-size=\"12\">baseline</text>\n    <text x=\"466\" y=\"70\"  fill=\"var(--accent)\" font-size=\"12\">epipolar line</text>\n  </g>\n</svg>\n</div><ul><li>The <b>baseline</b> joins the two camera centres. It and $\\mathbf{X}$ span the <b>epipolar plane</b>, which each image sees edge-on, as the <b>epipolar line</b>.</li><li>The <b>epipoles</b> $\\mathbf{e}_1, \\mathbf{e}_2$ are where the baseline pierces each image, and every epipolar line passes through them.</li></ul>", "n": ""}, {"t": "The epipolar constraint", "sub": "", "min": 4.5, "sz": "", "html": "<div class=\"hand\" data-h=\"36\"><p class=\"cue\">Write coplanarity as a triple product, then read off the matrix</p><div class=\"worked\"><p>Work in <b>normalised</b> coordinates ($\\mathbf{K}^{-1}$ already applied), with camera 2's pose relative to camera 1 given by $(\\mathbf{R}, \\mathbf{t})$. The two rays and the baseline all lie in the epipolar plane, and three vectors are coplanar exactly when their triple product vanishes:</p><div class=\"eq\">\\[\\mathbf{x}_1 \\cdot \\big(\\mathbf{t} \\times \\mathbf{R}\\mathbf{x}_2\\big) = 0 \\qquad\\Longrightarrow\\qquad \\mathbf{x}_1^\\top\\,\\underbrace{\\mathbf{t}^\\wedge\\mathbf{R}}_{\\textstyle\\mathbf{E}}\\,\\mathbf{x}_2 = 0\\]</div></div><div class=\"panel\" style=\"height:36mm\"></div></div><p class=\"pull\">The hat operator from Monday, doing real work. The cross product is what turns coplanarity into a matrix.</p>", "n": ""}, {"t": "The essential matrix", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"eq\">\\[\\mathbf{E} = \\mathbf{t}^\\wedge\\mathbf{R} \\qquad \\mathbf{x}_1^\\top\\mathbf{E}\\,\\mathbf{x}_2 = 0\\]</div><ul><li>$\\mathbf{E}\\mathbf{x}_2$ <b>is</b> the epipolar line in image 1. That is the line's coefficient vector, literally.</li><li>Rank 2, and its singular values are $(\\sigma, \\sigma, 0)$: a strong structural constraint.</li><li><b>Five</b> degrees of freedom: 3 rotation + 3 translation, minus 1 for overall scale.</li></ul><div class=\"rbox\"><span class=\"rbox-t\">Trap</span><p>$\\mathbf{E}$ knows the direction of $\\mathbf{t}$, never its length. Scale is gone again, for exactly the reason from L01.</p></div>", "n": ""}, {"t": "Why $\\mathbf{K}^{-1}$ appears in $\\mathbf{F}$", "sub": "", "min": 3.5, "sz": "", "html": "<div class=\"hand\" data-h=\"38\"><p class=\"cue\">Substitute $\\mathbf{x} = \\mathbf{K}^{-1}\\mathbf{u}$ into the epipolar constraint</p><div class=\"worked\"><p>The constraint is a statement about <b>rays</b>, and what a camera hands you is pixels. The two are related by the intrinsics: $\\mathbf{u} = \\mathbf{K}\\mathbf{x}$, so $\\mathbf{x} = \\mathbf{K}^{-1}\\mathbf{u}$. Put that into $\\mathbf{x}_1^\\top\\mathbf{E}\\,\\mathbf{x}_2 = 0$, one camera at a time:</p><div class=\"eq\">\\[\\big(\\mathbf{K}_1^{-1}\\mathbf{u}_1\\big)^{\\!\\top} \\mathbf{E} \\,\\big(\\mathbf{K}_2^{-1}\\mathbf{u}_2\\big) = 0 \\qquad\\Longrightarrow\\qquad \\mathbf{u}_1^\\top\\,\\underbrace{\\mathbf{K}_1^{-\\top}\\,\\mathbf{E}\\,\\mathbf{K}_2^{-1}}_{\\textstyle\\mathbf{F}}\\,\\mathbf{u}_2 = 0\\]</div><p>$\\mathbf{F}$ is $\\mathbf{E}$ with a change of coordinates wrapped around it, one factor per camera. Nothing extra is measured. The same zero is written in pixels instead of rays.</p></div><div class=\"panel\" style=\"height:38mm\"></div></div><p class=\"pull\">Correspondences alone give you F. Getting E out of it costs you the intrinsics.</p>", "n": ""}, {"t": "The fundamental matrix", "sub": "when you do not know $\\mathbf{K}$", "min": 2, "sz": "", "html": "<div class=\"eq\">\\[\\mathbf{u}_1^\\top\\,\\mathbf{F}\\,\\mathbf{u}_2 = 0, \\qquad \\mathbf{F} = \\mathbf{K}_1^{-\\top}\\,\\mathbf{E}\\,\\mathbf{K}_2^{-1}\\]</div><ul><li>Works directly on <b>pixels</b>. Seven degrees of freedom: 9 entries, minus scale, minus $\\det\\mathbf{F} = 0$.</li><li>$\\mathbf{E}$ is the calibrated case, $\\mathbf{F}$ the uncalibrated one. On a robot you almost always have $\\mathbf{K}$, so you almost always want $\\mathbf{E}$.</li><li>$\\mathbf{F}$ stays useful as a check, because you can estimate it without trusting your calibration.</li></ul>", "n": ""}, {"t": "Normalise first", "sub": "or the SVD hands back noise", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 468 191\" width=\"468\" role=\"img\" aria-label=\"Left: correspondences bunched in one corner of an image, far from the pixel origin. Right: the same points recentred on their centroid and rescaled so their RMS distance from the origin is root two.\">\n  <path d=\"M64.0 144.5 L216.1 144.5 L216.1 27.0 L64.0 27.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.33\" fill=\"var(--ground)\"/>\n  <circle cx=\"167.7\" cy=\"51.2\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"181.5\" cy=\"44.3\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"178.0\" cy=\"61.6\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"191.9\" cy=\"54.7\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"171.1\" cy=\"37.4\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"188.4\" cy=\"68.5\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"198.8\" cy=\"40.8\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"160.8\" cy=\"58.1\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"64.0\" cy=\"144.5\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"64.0\" y=\"158.7\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">(0,0)</text>\n  <text x=\"140.0\" y=\"12.8\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">pixels</text>\n  <text x=\"140.0\" y=\"177.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">bunched, and far from the origin</text>\n  <path d=\"M278.3 144.5 L430.3 144.5 L430.3 27.0 L278.3 27.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.33\" fill=\"var(--ground)\"/>\n  <path d=\"M285.2 85.8 L423.4 85.8\" stroke=\"var(--rule)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M354.3 137.6 L354.3 33.9\" stroke=\"var(--rule)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M385.4 85.8 L384.6 78.8 L382.3 72.3 L378.6 66.4 L373.7 61.4 L367.8 57.7 L361.2 55.4 L354.3 54.7 L347.4 55.4 L340.8 57.7 L334.9 61.4 L330.0 66.4 L326.3 72.3 L324.0 78.8 L323.2 85.8 L324.0 92.7 L326.3 99.3 L330.0 105.2 L334.9 110.1 L340.8 113.8 L347.4 116.1 L354.3 116.9 L361.2 116.1 L367.8 113.8 L373.7 110.1 L378.6 105.2 L382.3 99.3 L384.6 92.7 L385.4 85.8 Z\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <circle cx=\"330.4\" cy=\"84.1\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"357.7\" cy=\"70.4\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"350.9\" cy=\"104.6\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"378.2\" cy=\"90.9\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"337.2\" cy=\"56.7\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"371.4\" cy=\"118.2\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"391.9\" cy=\"63.5\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"316.7\" cy=\"97.7\" r=\"2.6\" fill=\"var(--ink)\"/>\n  <circle cx=\"354.3\" cy=\"85.8\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"393.0\" y=\"65.0\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">sqrt2</text>\n  <text x=\"354.3\" y=\"12.8\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">normalised</text>\n  <text x=\"354.3\" y=\"177.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">centred, RMS radius sqrt2</text>\n</svg></div><ul><li>Pixel coordinates run to $O(10^3)$, so entries of $\\mathbf{A}$ span $u^2 \\sim 10^6$ down to $1$. The condition number is enormous.</li><li><b>Translate</b> so the centroid sits at the origin, then <b>scale</b> so the mean squared distance from it is $2$, an RMS radius of $\\sqrt{2}$.</li><li>Matches bunched in one region of the image are the worst case.</li></ul>", "n": ""}, {"t": "One correspondence, one row", "sub": "", "min": 3.5, "sz": "", "html": "<div class=\"hand\" data-h=\"46\"><p class=\"cue\">Turn $\\mathbf{u}_1^\\top\\mathbf{F}\\mathbf{u}_2 = 0$ into one row of a linear system</p><div class=\"worked\"><p>Expand with $\\mathbf{u}_1 = (u_1, v_1, 1)$, $\\mathbf{u}_2 = (u_2, v_2, 1)$ and collect the nine entries of $\\mathbf{F}$ into a vector $\\mathbf{f}$:</p><div class=\"eq\">\\[\\begin{bmatrix} u_1u_2 & u_1v_2 & u_1 & v_1u_2 & v_1v_2 & v_1 & u_2 & v_2 & 1\\end{bmatrix}\\mathbf{f} = 0\\]</div><p><b>One</b> equation per correspondence, unlike $\\mathbf{P}$, which gave two. Eight of them determine $\\mathbf{f}$ up to scale, so stack the rows into $\\mathbf{A}\\mathbf{f} = \\mathbf{0}$.</p></div><div class=\"panel\" style=\"height:46mm\"></div></div>", "n": ""}, {"t": "Five steps, in order", "sub": "", "min": 3.5, "sz": "", "html": "<ol><li><b>Normalise</b> both point sets, and keep the two transforms $\\mathbf{T}_1$, $\\mathbf{T}_2$.</li><li><b>Build</b> $\\mathbf{A}$, one row per correspondence.</li><li><b>Solve</b> $\\mathbf{A}\\mathbf{f} = \\mathbf{0}$ by SVD. $\\mathbf{f}$ is the smallest right singular vector, reshaped into $\\hat{\\mathbf{F}}$.</li><li><b>Enforce rank 2</b>: take the SVD of $\\hat{\\mathbf{F}}$, set its smallest singular value to zero, recompose.</li><li><b>Denormalise</b>: $\\mathbf{F} = \\mathbf{T}_1^\\top\\hat{\\mathbf{F}}\\,\\mathbf{T}_2$, undoing step 1.</li></ol><div class=\"rbox\"><span class=\"rbox-t\">Why step 4 is needed</span><p>The linear solution is not rank 2, so its epipolar lines do not meet at a common epipole. The next slide says where that requirement comes from.</p></div>", "n": ""}, {"t": "Epipolar lines, and why $\\mathbf{F}$ is rank 2", "sub": "", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 438 226\" width=\"438\" role=\"img\" aria-label=\"An image rectangle crossed by a pencil of epipolar lines that all meet at the epipole on the left. One line is highlighted with the matching point lying on it.\">\n  <path d=\"M70.7 191.7 L300.9 191.7 L300.9 28.4 L70.7 28.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.33\" fill=\"var(--ground)\"/>\n  <path d=\"M96.7 113.8 L300.9 184.3\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M96.7 113.8 L300.9 150.9\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M96.7 113.8 L300.9 113.8\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M96.7 113.8 L300.9 76.7\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M96.7 113.8 L300.9 35.8\" stroke=\"var(--rule)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M96.7 113.8 L300.9 76.7\" stroke=\"var(--accent)\" stroke-width=\"2.28\" fill=\"none\"/>\n  <circle cx=\"234.1\" cy=\"90.4\" r=\"3.8\" fill=\"var(--accent)\"/>\n  <text x=\"234.1\" y=\"75.9\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <text x=\"219.2\" y=\"55.9\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ell<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = F<tspan baseline-shift=\"super\" font-size=\"72%\">⊤x<tspan</tspan> baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <circle cx=\"96.7\" cy=\"113.8\" r=\"4.7\" fill=\"var(--accent-2)\"/>\n  <text x=\"93.0\" y=\"130.9\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">e<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <text x=\"185.8\" y=\"13.2\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">image 2</text>\n  <text x=\"185.8\" y=\"212.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Fe<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 0, so F is rank 2</text>\n</svg></div></div><div style=\"flex:0.530 1 0\"><div class=\"hand\" data-h=\"32\"><p class=\"cue\">Every epipolar line contains the epipole</p><div class=\"worked\"><p>$\\mathbf{F}\\mathbf{u}_2$ is the line in image 1 and $\\mathbf{F}^\\top\\mathbf{u}_1$ the line in image 2. The epipole lies on <b>every</b> one of them, whatever $\\mathbf{u}_1$ was:</p><div class=\"eq\">\\[\\mathbf{e}_2^\\top\\big(\\mathbf{F}^\\top\\mathbf{u}_1\\big) = 0 \\;\\;\\forall\\,\\mathbf{u}_1 \\;\\;\\Longrightarrow\\;\\; \\mathbf{F}\\mathbf{e}_2 = \\mathbf{0}\\]</div></div><div class=\"panel\" style=\"height:32mm\"></div></div></div></div><p>A matrix with a null vector is singular, so $\\det\\mathbf{F} = 0$ and $\\mathbf{F}$ has rank 2. Likewise $\\mathbf{F}^\\top\\mathbf{e}_1 = \\mathbf{0}$: the two epipoles are the null vectors of $\\mathbf{F}$ and of its transpose.</p>", "n": ""}, {"t": "When two views tell you nothing", "sub": "degeneracy", "min": 3, "sz": "", "html": "<ul><li><b>Pure rotation.</b> $\\mathbf{t} = \\mathbf{0}$, so $\\mathbf{E} = \\mathbf{0}$. No parallax, no depth, at any baseline you like.</li><li><b>A planar scene.</b> All correspondences satisfy a homography $\\mathbf{u}_1 \\sim \\mathbf{H}\\mathbf{u}_2$, and $\\mathbf{F}$ becomes underdetermined.</li><li>Both are common: a robot turning in place, and a robot facing a wall or a floor.</li></ul><div class=\"rbox\"><span class=\"rbox-t\">Used by</span><p>A real front end fits <b>both</b> $\\mathbf{F}$ and $\\mathbf{H}$, compares how well each explains the data, and picks. ORB-SLAM's initialiser is exactly this, and it is why it does not fall over in a corridor.</p></div>", "n": ""}, {"t": "Which points can be matched?", "sub": "", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 355 226\" width=\"355\" role=\"img\" aria-label=\"Three image windows -- flat, an edge, and a corner -- each with the ellipse of its second-moment matrix below it.\">\n  <path d=\"M8.0 108.8 L91.2 108.8 L91.2 25.6 L8.0 25.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"49.6\" y=\"12.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">flat</text>\n  <path d=\"M54.7 153.6 L54.7 153.1 L54.6 152.5 L54.5 152.0 L54.3 151.5 L54.0 151.0 L53.7 150.6 L53.4 150.2 L53.0 149.8 L52.6 149.5 L52.2 149.2 L51.7 148.9 L51.2 148.7 L50.7 148.6 L50.1 148.5 L49.6 148.5 L49.1 148.5 L48.5 148.6 L48.0 148.7 L47.5 148.9 L47.0 149.2 L46.6 149.5 L46.2 149.8 L45.8 150.2 L45.5 150.6 L45.2 151.0 L44.9 151.5 L44.7 152.0 L44.6 152.5 L44.5 153.1 L44.5 153.6 L44.5 154.1 L44.6 154.7 L44.7 155.2 L44.9 155.7 L45.2 156.2 L45.5 156.6 L45.8 157.0 L46.2 157.4 L46.6 157.7 L47.0 158.0 L47.5 158.3 L48.0 158.5 L48.5 158.6 L49.1 158.7 L49.6 158.7 L50.1 158.7 L50.7 158.6 L51.2 158.5 L51.7 158.3 L52.2 158.0 L52.6 157.7 L53.0 157.4 L53.4 157.0 L53.7 156.6 L54.0 156.2 L54.3 155.7 L54.5 155.2 L54.6 154.7 L54.7 154.1 L54.7 153.6\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <text x=\"49.6\" y=\"177.9\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">λ<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> ≈ λ<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M136.0 108.8 L219.2 108.8 L219.2 25.6 L136.0 25.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <path d=\"M136.0 89.6 L219.2 44.8\" stroke=\"var(--ink)\" stroke-width=\"2.66\" fill=\"none\"/>\n  <text x=\"177.6\" y=\"12.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">edge</text>\n  <path d=\"M216.0 153.6 L215.8 153.1 L215.2 152.5 L214.1 152.0 L212.7 151.5 L210.9 151.0 L208.7 150.6 L 76.9 L288.0 178.5 L291.3 179.9 L294.7 181.0 L298.3 181.8 L301.9 182.2 L305.6 182.4 L309.3 182.2 L312.9 181.8 L316.5 181.0 L319.9 179.9 L323.2 178.5 L326.3 176.9 L329.2 175.0 L331.8 172.9 L334.1 170.5 L336.1 168.0 L337.8 165.3 L339.1 162.5 L340.0 159.6 L340.6 156.6 L340.8 153.6\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <text x=\"305.6\" y=\"197.1\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">λ<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> ≈ λ<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <text x=\"196.8\" y=\"213.1\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">both small</text>\n  <text x=\"49.6\" y=\"213.1\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\"></text>\n</svg></div><ul><li><b>Flat.</b> Every nearby patch looks the same, so there is no information in any direction.</li><li><b>Edge.</b> You can localise across the edge but slide freely along it. The aperture problem.</li><li><b>Corner.</b> The patch changes under motion in <i>every</i> direction, so it is localisable in two dimensions.</li></ul>", "n": ""}, {"t": "What you should be able to do", "sub": "", "min": 1.5, "sz": "", "html": "<ul><li>Say why a pose cannot be corrected by addition, and where the correction goes instead.</li><li>Derive the epipolar constraint from coplanarity, and say what $\\mathbf{E}$ has that $\\mathbf{F}$ does not.</li><li>Show where each $\\mathbf{K}^{-1}$ in $\\mathbf{F}$ comes from.</li><li>List the five steps of the eight-point algorithm, and say what breaks if you drop step 1 or step 4.</li><li>Show that $\\mathbf{F}\\mathbf{e}_2 = \\mathbf{0}$, and say why that makes $\\mathbf{F}$ rank 2.</li></ul><p>Notes: Modules <b>A1</b>, <b>A6</b>, <b>A2</b>, <b>A5</b>. Szeliski §7.</p>", "n": ""}, {"t": "Next time", "sub": "L04 · Robust estimation, and 3D sensing", "min": 1, "sz": "", "html": "<p>You can now write down the geometry of two views and say which points are worth matching. Monday finds the matches, then fits the geometry to them when a third are wrong.</p><ul><li>Features: invariance, the feature transform, image pyramids, and matching as a distance.</li><li>RANSAC, its iteration count, and why the minimal sample size sits in an exponent.</li><li>Triangulation, then structure from motion and bundle adjustment, step by step.</li><li>Visual SLAM, then LiDAR and the difference between metric and relative depth.</li></ul><p><b>Both diagnostic quizzes are due Sun Sep 20.</b> Quiz 1 covers today and the first half of Monday.</p>", "n": ""}]}];
</script>

<script>
(function(){
  "use strict";
  var flat=[];
  DECK.forEach(function(L){ L.slides.forEach(function(s,i){
    flat.push({lec:L,s:s,i:i,n:L.slides.length});
  });});

  var cur=0, notesOn=false, gridOn=false, mode="a";
  var slideEl=document.getElementById("slide"), countEl=document.getElementById("count"),
      notesEl=document.getElementById("notes"), notesBody=document.getElementById("notesbody"),
      gridEl=document.getElementById("grid"), progEl=document.getElementById("prog"),
      pickEl=null;

  try{ var sm=localStorage.getItem("rob3dp-mode"); if(sm==="a"||sm==="w") mode=sm; }catch(e){}

  function setMode(m){
    mode=m; document.body.setAttribute("data-mode",m);
    try{ localStorage.setItem("rob3dp-mode",m); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
      b.setAttribute("aria-current", b.getAttribute("data-m")===m ? "true":"false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
    b.addEventListener("click",function(){ setMode(b.getAttribute("data-m")); });
  });

  function typeset(el){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([el]).catch(function(){});
    }
  }

  function render(){
    var f=flat[cur];
    slideEl.innerHTML =
      '<p class="s-meta">'+f.lec.num+' &middot; '+f.lec.title+' &middot; '+f.lec.date+
        (f.s.min?(' &middot; '+f.s.min+' min'):'')+'</p>'+
      '<h2>'+f.s.t+'</h2>'+
      (f.s.sub?'<p class="sub">'+f.s.sub+'</p>':'')+
      '<div class="rulel"></div>'+
      '<div class="body'+(f.s.sz?' sm':'')+'">'+f.s.html+'</div>';
    countEl.textContent=(f.i+1)+" / "+f.n;
    if(notesBody) notesBody.textContent=f.s.n||"—";
    progEl.style.width=((cur+1)/flat.length*100)+"%";
    if(gridOn) buildGrid();
    try{ history.replaceState(null,"","#"+f.lec.id+"-s"+(f.i+1)); }catch(e){}
    document.getElementById("stage").scrollTop=0;
    typeset(slideEl);
  }
  function go(i){ if(i<0||i>=flat.length) return; cur=i; render(); }

  function buildGrid(){
    gridEl.innerHTML="";
    flat.forEach(function(f,k){
      var b=document.createElement("button");
      b.className="thumb"; b.type="button";
      b.setAttribute("aria-current",k===cur?"true":"false");
      b.innerHTML='<span class="tn">'+f.lec.num+' &middot; '+(f.i+1)+
        (f.s.min?(' &middot; '+f.s.min+"'"):'')+'</span><span class="tt">'+f.s.t+'</span>';
      b.addEventListener("click",function(){
        gridOn=false; gridEl.classList.remove("on"); go(k);
      });
      gridEl.appendChild(b);
    });
  }

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); go(cur+1); }
    else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(k==="Home"){ e.preventDefault(); go(0); }
    else if(k==="End"){ e.preventDefault(); go(flat.length-1); }
    else if(k==="a"||k==="A"){ setMode("a"); }
    else if(k==="w"||k==="W"){ setMode("w"); }
    else if((k==="s"||k==="S")&&notesEl){ notesOn=!notesOn; notesEl.classList.toggle("on",notesOn); }
    else if(k==="o"||k==="O"){ gridOn=!gridOn; gridEl.classList.toggle("on",gridOn); if(gridOn) buildGrid(); }
    else if(k==="p"||k==="P"){ document.body.classList.toggle("present"); }
    else if(k==="f"||k==="F"){
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
      else { (document.exitFullscreen||function(){}).call(document); }
    }
    else if(k==="Escape"){ gridOn=false; gridEl.classList.remove("on");
      document.body.classList.remove("present"); }
  });

  var x0=null;
  document.addEventListener("touchstart",function(e){ x0=e.changedTouches[0].clientX; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) go(cur+(dx<0?1:-1));
    x0=null;
  },{passive:true});

  var h=(location.hash||"").replace("#","");
  var m=/^(l\d\d)(?:-s(\d+))?$/.exec(h);
  if(m){
    var idx=flat.findIndex(function(f){
      return f.lec.id===m[1] && (!m[2]||f.i+1===parseInt(m[2],10)); });
    if(idx>=0) cur=idx;
  }
  setMode(mode);
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(render);
  } else { render(); }
})();
</script>
