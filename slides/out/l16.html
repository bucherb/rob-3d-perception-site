<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --surface-2:#EDF1F0;
  --ink:#16232A; --ink-soft:#55676F; --ink-faint:#84969C;
  --rule:#DCE3E2; --rule-strong:#C3CFCD;
  --accent:#0E7C86; --accent-soft:#E0EFEF;
  --accent-2:#B4652A; --accent-2-soft:#F4E8DC;
  --hand:#C9D6D4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#101619; --surface:#172024; --surface-2:#1D282C;
  --ink:#E4EBE9; --ink-soft:#A3B3B8; --ink-faint:#7D8F95;
  --rule:#2A373C; --rule-strong:#3B4B50;
  --accent:#4FBCC4; --accent-soft:#123336;
  --accent-2:#DFA160; --accent-2-soft:#33261A;
  --hand:#2F3E43;
}}
:root[data-theme="dark"]{
  --ground:#101619; --surface:#172024; --surface-2:#1D282C;
  --ink:#E4EBE9; --ink-soft:#A3B3B8; --ink-faint:#7D8F95;
  --rule:#2A373C; --rule-strong:#3B4B50;
  --accent:#4FBCC4; --accent-soft:#123336;
  --accent-2:#DFA160; --accent-2-soft:#33261A;
  --hand:#2F3E43;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased;overflow:hidden}

#bar{position:fixed;top:0;left:0;right:0;height:46px;z-index:30;display:flex;align-items:center;
  gap:0 16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.03em}
#bar .nm{font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;font-weight:700;
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
#bar .lec{font-family:"Source Serif 4",Georgia,serif;font-size:13px;
  color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .spacer{flex:1}
.mode button{font:inherit;cursor:pointer;border:1px solid var(--rule-strong);
  background:var(--surface);color:var(--ink-soft);border-radius:3px;padding:3px 8px}
.mode button[aria-current="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff}
.mode{display:flex;gap:4px}
#count{color:var(--ink-faint);white-space:nowrap}

#stage{position:fixed;inset:46px 0 0 0;display:flex;justify-content:center;
  padding:22px 18px 34px;overflow:auto}
.slide{width:min(1180px,100%);background:var(--surface);border:1px solid var(--rule);
  border-radius:4px;padding:34px 40px 40px;min-height:calc(100% - 6px)}
.s-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 14px}
.slide h2{font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;font-weight:700;
  font-size:34px;line-height:1.13;margin:0 0 6px;letter-spacing:-.01em}
.slide .sub{font-size:17px;font-style:italic;color:var(--ink-soft);margin:0 0 4px}
.slide .rulel{height:1px;background:var(--rule-strong);margin:14px 0 20px}
.body{font-size:19px;line-height:1.55}
.body.sm{font-size:16.5px}
.body p{margin:0 0 12px}
.body ul,.body ol{margin:0 0 12px;padding-left:24px}
.body li{margin:0 0 7px}
.body ul{list-style:none;padding-left:20px}
.body ul>li{position:relative}
.body ul>li::before{content:"";position:absolute;left:-16px;top:.6em;
  width:6px;height:6px;background:var(--accent)}
.big{font-size:26px;line-height:1.35}
.pull{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:10px 14px;font-style:italic;margin:14px 0}
.eq{overflow-x:auto;margin:12px 0;padding:2px 0}
code{font-family:"IBM Plex Mono",monospace;font-size:.88em;
  background:var(--surface-2);padding:1px 5px;border-radius:3px}
.rbox{border:1px solid var(--rule-strong);background:var(--ground);border-radius:3px;
  padding:16px 14px 6px;margin:14px 0;position:relative;font-size:.92em}
.rbox-t{position:absolute;top:-9px;left:12px;background:var(--surface);padding:0 7px;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2)}
.rbox p:last-child,.rbox ul:last-child,.rbox ol:last-child{margin-bottom:10px}
.cols{display:flex;gap:26px;align-items:flex-start;margin:0 0 12px}
table.cmp{border-collapse:collapse;width:100%;font-size:.86em;margin:12px 0}
table.cmp th,table.cmp td{text-align:left;padding:7px 12px 7px 0;
  border-bottom:1px solid var(--rule);vertical-align:top}
table.cmp th{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);
  border-bottom:1px solid var(--rule-strong)}
.fig{margin:14px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.cap{font-size:14px;color:var(--ink-soft);margin:6px 0 0}
.fig img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:3px}
.credit{font-size:11px;color:var(--ink-faint);margin:3px 0 0}

/* --- the write-in mechanism ------------------------------------------- */
.cue{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--accent-2);margin:16px 0 8px}
.cue::before{content:"";display:inline-block;width:9px;height:9px;
  background:var(--accent-2);margin-right:8px}
.hand .panel{border:1px solid var(--rule-strong);border-radius:3px;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 7.6mm,
    var(--hand) 7.6mm,var(--hand) calc(7.6mm + 1px));
  background-position:0 1mm;margin:0 0 14px}
body[data-mode="a"] .hand:not(.always) .panel{display:none}
body[data-mode="w"] .hand:not(.always) .worked{display:none}

#notes{position:fixed;right:0;bottom:0;width:min(430px,42vw);max-height:52vh;overflow:auto;
  background:var(--surface);border-left:1px solid var(--rule);border-top:1px solid var(--rule);
  padding:12px 16px 16px;font-size:14px;line-height:1.5;color:var(--ink-soft);
  display:none;z-index:25}
#notes.on{display:block}
#notes h3{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin:0 0 8px}
#grid{position:fixed;inset:46px 0 0 0;background:var(--ground);overflow:auto;padding:18px;
  display:none;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;z-index:26}
#grid.on{display:grid}
.thumb{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:9px 10px;cursor:pointer;font:inherit;color:var(--ink);min-height:74px}
.thumb[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tn{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-faint)}
.tt{display:block;font-size:13px;line-height:1.3;margin-top:3px}
#prog{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);z-index:28;width:0}
#help{position:fixed;left:16px;bottom:10px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;color:var(--ink-faint);z-index:24}
body.present #bar,body.present #help{display:none}
body.present #stage{inset:0;padding:0}
body.present .slide{border:0;border-radius:0;min-height:100%;
  padding:46px 62px;display:flex;flex-direction:column}
body.present .body{font-size:22px}

/* Only the current slide is in the DOM, so printing gives you that one slide.
   The full deck is distributed as the two PDFs, not from here. */
@media print{
  @page{size:279mm 157mm;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  #bar,#notes,#grid,#prog,#help{display:none!important}
  #stage{position:static;inset:auto;padding:0;display:block;overflow:visible}
  .slide{width:279mm;height:157mm;border:0;border-radius:0;
    padding:14mm 16mm;min-height:0;overflow:hidden}
}

<script>
const DECK = [{"id": "l16", "num": "L16", "title": "Latent dynamics", "date": "Mon Nov 2, 2026", "slides": [{"t": "Latent dynamics", "sub": "L16 · Unit 3", "min": 1, "sz": "", "html": "<p class=\"big\">Every map so far has described the world as it is. A robot acts, so it also needs to know what the world will look like after it acts.</p><p>Unit 3, <b>world models and prediction</b>: from a static model of what is there to a predictive model of what happens next under the robot's own actions.</p>", "n": ""}, {"t": "Today", "sub": "", "min": 1.5, "sz": "", "html": "<ol><li><b>World models</b>, and the probability they are written in.</li><li><b>Compounding error</b> and <b>planning</b> with a model: MPC, and CEM by hand.</li><li><b>Learning a latent state:</b> likelihood, KL, autoencoders, the VAE.</li><li><b>Recurrent networks</b>, then <b>PlaNet</b>'s recurrent state-space model.</li><li><i>Continued in L17:</i> PlaNet, reinforcement learning, Dreamer and DreamerV3, and I-JEPA.</li></ol>", "n": ""}, {"t": "From what is there to what happens next", "sub": "", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 852 254\" width=\"852\" role=\"img\" aria-label=\"Left: a static map of a table top with two objects, labelled what is there. An arrow labelled plus an action leads right: the current state, and three predicted next states, one each for pushing left, pushing right and lifting the object.\">\n  <defs><marker id=\"a22162ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a22162soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M84.0 214.7 L302.9 214.7 L302.9 56.6 L84.0 56.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M84.0 214.7 L84.0 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M108.3 214.7 L108.3 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M132.6 214.7 L132.6 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M157.0 214.7 L157.0 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M181.3 214.7 L181.3 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M205.6 214.7 L205.6 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M229.9 214.7 L229.9 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M254.2 214.7 L254.2 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M278.6 214.7 L278.6 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M302.9 214.7 L302.9 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 214.7 L302.9 214.7\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 188.4 L302.9 188.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 162.0 L302.9 162.0\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 135.7 L302.9 135.7\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 109.3 L302.9 109.3\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 83.0 L302.9 83.0\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.0 56.6 L302.9 56.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M120.5 178.2 L157.0 178.2 L157.0 141.8 L120.5 141.8 Z\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"var(--ground)\"/>\n  <path d=\"M217.8 129.6 L266.4 129.6 L266.4 93.1 L217.8 93.1 Z\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"var(--ground)\"/>\n  <text x=\"193.4\" y=\"237.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Units 1, 2: what is there</text>\n  <path d=\"M327.2 135.7 L388.0 135.7\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a22162ink)\"/>\n  <text x=\"357.6\" y=\"113.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">+ a<tspan baseline-shift=\"sub\" font-size=\"72%\">t</tspan></text>\n  <path d=\"M412.3 166.1 L509.6 166.1 L509.6 105.3 L412.3 105.3 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <path d=\"M430.6 153.9 L454.9 153.9 L454.9 129.6 L430.6 129.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.76\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"461.0\" y=\"188.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s<tspan baseline-shift=\"sub\" font-size=\"72%\">t</tspan></text>\n  <path d=\"M515.7 135.7 L570.4 38.4\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a22162soft)\"/>\n  <path d=\"M576.5 68.8 L673.8 68.8 L673.8 8.0 L576.5 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"var(--surface)\"/>\n  <path d=\"M582.6 56.6 L606.9 56.6 L606.9 32.3 L582.6 32.3 Z\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"var(--accent-soft)\"/>\n  <text x=\"689.6\" y=\"38.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">push left</text>\n  <path d=\"M515.7 135.7 L570.4 105.3\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a22162soft)\"/>\n  <path d=\"M576.5 135.7 L673.8 135.7 L673.8 74.9 L576.5 74.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"var(--surface)\"/>\n  <path d=\"M637.3 123.5 L661.6 123.5 L661.6 99.2 L637.3 99.2 Z\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"var(--accent-soft)\"/>\n  <text x=\"689.6\" y=\"105.3\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">push right</text>\n  <path d=\"M515.7 135.7 L570.4 172.2\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a22162soft)\"/>\n  <path d=\"M576.5 202.6 L673.8 202.6 L673.8 141.8 L576.5 141.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"var(--surface)\"/>\n  <path d=\"M600.8 172.2 L625.1 172.2 L625.1 147.8 L600.8 147.8 Z\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"var(--accent-soft)\"/>\n  <text x=\"689.6\" y=\"172.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">lift</text>\n  <text x=\"625.1\" y=\"237.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Unit 3: s<tspan baseline-shift=\"sub\" font-size=\"72%\">t+1</tspan> under each action</text>\n</svg><p class=\"cap\">orange: the object as observed now; teal: where the model predicts it goes</p></div><ul><li>Units 1 and 2 built maps of the present: occupancy, TSDFs, Gaussians, scene graphs.</li><li>A <b>world model</b> predicts the next state given the current one <b>and an action</b>.</li></ul>", "n": ""}, {"t": "Why a robot wants one", "sub": "", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 750 178\" width=\"750\" role=\"img\" aria-label=\"An environment box sends an observation o_t into the agent. Inside the agent an encoder turns it into a state s_t, a world model imagines what happens next, and a planner or policy picks the action a_t that goes back to the environment.\">\n  <defs><marker id=\"a1c96accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"a1c96accent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"a1c96ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M20.8 145.4 L178.8 145.4 L178.8 84.6 L20.8 84.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"99.8\" y=\"120.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">environment</text>\n  <path d=\"M367.3 169.7 L732.1 169.7 L732.1 36.0 L367.3 36.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"var(--ground)\"/>\n  <text x=\"549.7\" y=\"16.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">agent</text>\n  <path d=\"M385.6 130.2 L519.3 130.2 L519.3 75.5 L385.6 75.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"452.4\" y=\"108.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">encoder</text>\n  <path d=\"M561.9 130.2 L707.8 130.2 L707.8 75.5 L561.9 75.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"634.8\" y=\"108.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">world model</text>\n  <path d=\"M476.8 162.1 L610.5 162.1 L610.5 128.7 L476.8 128.7 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"543.6\" y=\"150.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">planner or policy</text>\n  <path d=\"M178.8 102.8 L383.1 102.8\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a1c96accent2)\"/>\n  <text x=\"282.2\" y=\"83.4\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">o<tspan baseline-shift=\"sub\" font-size=\"72%\">t</tspan></text>\n  <path d=\"M519.3 102.8 L559.5 102.8\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a1c96ink)\"/>\n  <text x=\"540.0\" y=\"83.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s<tspan baseline-shift=\"sub\" font-size=\"72%\">t</tspan></text>\n  <path d=\"M612.0 65.6 L611.1 62.4 L610.6 59.1 L610.6 55.7 L611.0 52.4 L611.9 49.2 L613.2 46.2 L614.9 43.3 L617.0 40.7 L619.4 38.4 L622.2 36.5 L625.1 35.0 L628.3 33.8 L631.5 33.2 L634.8 32.9 L638.2 33.2 L641.4 33.8 L644.6 35.0 L647.5 36.5 L650.2 38.4 L652.7 40.7 L654.8 43.3 L656.5 46.2 L657.8 49.2 L658.7 52.4 L659.1 55.7 L659.1 59.1 L658.6 62.4 L657.7 65.6\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"687.1\" y=\"48.1\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">imagine</text>\n  <path d=\"M634.8 130.8 L610.5 139.3\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1c96accent)\"/>\n  <path d=\"M476.8 136.3 L181.3 136.3\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a1c96ink)\"/>\n  <text x=\"282.2\" y=\"155.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">t</tspan></text>\n</svg><p class=\"cap\">orange: the real observation; teal: the model's imagined futures</p></div><ul><li><b>Plan:</b> try action sequences inside the model, run the best one.</li><li><b>Imagine:</b> train a policy on rollouts the model makes up, with no robot time.</li><li><b>Fewer real trials:</b> PlaNet matches a model-free agent's scores with $1{,}000$ episodes instead of $100{,}000$.</li><li><b>Safety:</b> a bad action tried in the model breaks nothing.</li></ul>", "n": ""}, {"t": "Probability", "sub": "1 of 6: a random variable; illustrative numbers", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 320 184\" width=\"320\" role=\"img\" aria-label=\"Bar charts of discrete probability distributions: soft push from x = 0: 0 0.60, 1 0.30, 2 0.10.\">\n  <path d=\"M81.0 147.8 L239.0 147.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M88.9 147.8 L125.7 147.8 L125.7 96.8 L88.9 96.8 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"107.3\" y=\"79.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.60</text>\n  <text x=\"107.3\" y=\"167.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M141.6 147.8 L178.4 147.8 L178.4 122.3 L141.6 122.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"160.0\" y=\"105.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.30</text>\n  <text x=\"160.0\" y=\"167.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M194.3 147.8 L231.1 147.8 L231.1 139.3 L194.3 139.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"212.7\" y=\"122.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.10</text>\n  <text x=\"212.7\" y=\"167.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"160.0\" y=\"16.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">soft push from x = 0</text>\n</svg></div></div><div style=\"flex:0.550 1 0\"><p>Push a block on a table. It slides $0$, $1$ or $2$ cm, never the same twice.</p><p>A <b>random variable</b> $X$ is a quantity whose value is uncertain. Its <b>distribution</b> gives each value a probability:</p><div class=\"eq\">\\[p(X{=}0) = 0.6,\\quad p(X{=}1) = 0.3,\\quad p(X{=}2) = 0.1\\]</div><p>Probabilities are $\\geq 0$ and sum to $1$.</p></div></div>", "n": ""}, {"t": "Probability", "sub": "2 of 6: conditional distributions", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 408 175\" width=\"408\" role=\"img\" aria-label=\"Bar charts of discrete probability distributions: soft push: 0 0.60, 1 0.30, 2 0.10; hard push: 0 0.10, 1 0.30, 2 0.60.\">\n  <path d=\"M25.7 140.5 L175.4 140.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M33.2 140.5 L68.1 140.5 L68.1 92.1 L33.2 92.1 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"50.6\" y=\"76.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.60</text>\n  <text x=\"50.6\" y=\"158.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M83.1 140.5 L118.0 140.5 L118.0 116.3 L83.1 116.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"100.5\" y=\"100.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.30</text>\n  <text x=\"100.5\" y=\"158.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M133.0 140.5 L167.9 140.5 L167.9 132.4 L133.0 132.4 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"150.5\" y=\"116.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.10</text>\n  <text x=\"150.5\" y=\"158.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"100.5\" y=\"16.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">soft push</text>\n  <path d=\"M233.0 140.5 L382.8 140.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M240.5 140.5 L275.5 140.5 L275.5 132.4 L240.5 132.4 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"258.0\" y=\"116.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.10</text>\n  <text x=\"258.0\" y=\"158.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M290.4 140.5 L325.4 140.5 L325.4 116.3 L290.4 116.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"307.9\" y=\"100.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.30</text>\n  <text x=\"307.9\" y=\"158.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M340.4 140.5 L375.3 140.5 L375.3 92.1 L340.4 92.1 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"357.8\" y=\"76.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.60</text>\n  <text x=\"357.8\" y=\"158.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"307.9\" y=\"16.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hard push</text>\n</svg></div><div class=\"eq\">\\[p(x' \\mid x, a): \\quad p(x'{=}2 \\mid x{=}0, \\text{soft}) = 0.1, \\qquad p(x'{=}2 \\mid x{=}0, \\text{hard}) = 0.6\\]</div><p>A <b>conditional distribution</b> is one distribution per value of what we condition on. Each one sums to $1$. A world model is exactly this: $p(s' \\mid s, a)$.</p>", "n": ""}, {"t": "Probability", "sub": "3 of 6: expectation", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathbb{E}[X] = \\sum_x x\\,p(x) \\qquad \\text{or, for continuous } x, \\qquad \\mathbb{E}[X] = \\int x\\,p(x)\\,dx\\]</div><div class=\"hand\" data-h=\"20\"><p class=\"cue\">Expected slide for the soft push, and for the hard push. Then average these $8$ observed soft pushes: $0, 1, 0, 0, 2, 0, 1, 0$.</p><div class=\"worked\"><p>Soft: $0 \\cdot 0.6 + 1 \\cdot 0.3 + 2 \\cdot 0.1 = 0.5$ cm. Hard: $0 \\cdot 0.1 + 1 \\cdot 0.3 + 2 \\cdot 0.6 = 1.5$ cm.</p><p>Sample average: $4 / 8 = 0.5$, the same as $\\mathbb{E}[X]$ here.</p></div><div class=\"panel\" style=\"height:20mm\"></div></div><p>The <b>expectation</b> is the probability-weighted average. With samples $x_1, \\ldots, x_N$ from $p$, $\\tfrac{1}{N}\\sum_i x_i \\approx \\mathbb{E}[X]$.</p>", "n": ""}, {"t": "Probability", "sub": "4 of 6: variance and standard deviation", "min": 2, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{Var}[X] = \\mathbb{E}\\big[(X - \\mathbb{E}[X])^2\\big], \\qquad \\sigma = \\sqrt{\\mathrm{Var}[X]}\\]</div><div class=\"hand\" data-h=\"12\"><p class=\"cue\">Variance and standard deviation of the soft push (mean $0.5$).</p><div class=\"worked\"><p>$0.6(0 - 0.5)^2 + 0.3(1 - 0.5)^2 + 0.1(2 - 0.5)^2 = 0.45$, so $\\sigma = 0.671$ cm.</p></div><div class=\"panel\" style=\"height:12mm\"></div></div><p>The mean says where; the standard deviation says how spread out. A model that predicts both says how sure it is.</p>", "n": ""}, {"t": "Probability", "sub": "5 of 6: the Gaussian", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.480 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 331 166\" width=\"331\" role=\"img\" aria-label=\"A bell-shaped Gaussian density centred at its mean, with one standard deviation marked, and points on the curve labelled with their density.\">\n  <path d=\"M8.0 134.0 L322.9 134.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M8.0 133.7 L11.1 133.7 L14.3 133.6 L17.4 133.5 L20.6 133.4 L23.7 133.2 L26.9 133.0 L30.0 132.8 L33.2 132.6 L36.3 132.2 L39.5 131.9 L42.6 131.4 L45.8 130.9 L48.9 130.3 L52.1 129.6 L55.2 128.7 L58.4 127.8 L61.5 126.7 L64.7 125.4 L67.8 124.0 L71.0 122.4 L74.1 120.6 L77.3 118.6 L80.4 116.4 L83.6 113.9 L86.7 111.3 L89.9 108.4 L93.0 105.2 L96.2 101.9 L99.3 98.3 L102.5 94.6 L105.6 90.6 L108.8 86.5 L111.9 82.2 L115.1 77.9 L118.2 73.5 L121.4 69.0 L124.5 64.6 L127.7 60.2 L130.8 55.9 L134.0 51.8 L137.1 47.9 L140.2 44.2 L143.4 40.9 L146.5 37.9 L149.7 35.2 L152.8 33.0 L156.0 31.3 L159.1 30.0 L162.3 29.2 L165.4 29.0 L168.6 29.2 L171.7 30.0 L174.9 31.3 L178.0 33.0 L181.2 35.2 L184.3 37.9 L187.5 40.9 L190.6 44.2 L193.8 47.9 L196.9 51.8 L200.1 55.9 L203.2 60.2 L206.4 64.6 L209.5 69.0 L212.7 73.5 L215.8 77.9 L219.0 82.2 L222.1 86.5 L225.3 90.6 L228.4 94.6 L231.6 98.3 L234.7 101.9 L237.9 105.2 L241.0 108.4 L244.2 111.3 L247.3 113.9 L250.5 116.4 L253.6 118.6 L256.8 120.6 L259.9 122.4 L263.1 124.0 L266.2 125.4 L269.4 126.7 L272.5 127.8 L275.6 128.7 L278.8 129.6 L281.9 130.3 L285.1 130.9 L288.2 131.4 L291.4 131.9 L294.5 132.2 L297.7 132.6 L300.8 132.8 L304.0 133.0 L307.1 133.2 L310.3 133.4 L313.4 133.5 L316.6 133.6 L319.7 133.7 L322.9 133.7\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M165.4 134.0 L165.4 29.0\" stroke=\"var(--ink-soft)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"165.4\" y=\"150.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">μ</text>\n  <path d=\"M165.4 70.3 L210.4 70.3\" stroke=\"var(--ink-soft)\" stroke-width=\"1\" fill=\"none\"/>\n  <path d=\"M165.4 66.3 v8 M210.4 66.3 v8\" stroke=\"var(--ink-soft)\" stroke-width=\"1\"/>\n  <text x=\"187.9\" y=\"56.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">σ</text>\n  <circle cx=\"165.4\" cy=\"29.0\" r=\"3.6\" fill=\"var(--ink)\"/>\n  <text x=\"179.1\" y=\"29.0\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.399</text>\n  <text x=\"165.4\" y=\"150.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <circle cx=\"210.4\" cy=\"70.3\" r=\"3.6\" fill=\"var(--ink)\"/>\n  <text x=\"224.1\" y=\"70.3\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.242</text>\n  <text x=\"210.4\" y=\"150.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <circle cx=\"255.4\" cy=\"119.7\" r=\"3.6\" fill=\"var(--ink)\"/>\n  <text x=\"269.1\" y=\"119.7\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.054</text>\n  <text x=\"255.4\" y=\"150.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n</svg></div></div><div style=\"flex:0.490 1 0\"><div class=\"eq\">\\[\\mathcal{N}(x;\\ \\mu, \\sigma^2) = \\frac{1}{\\sqrt{2\\pi}\\,\\sigma}\\exp\\!\\Big(-\\frac{(x - \\mu)^2}{2\\sigma^2}\\Big)\\]</div><ul><li>A distribution over a continuous $x$: a <b>density</b>, whose area is $1$.</li><li>Two numbers fix it: the mean $\\mu$ and the standard deviation $\\sigma$.</li></ul></div></div><div class=\"hand\" data-h=\"10\"><p class=\"cue\">Evaluate $\\mathcal{N}(x; 0, 1)$ at $x = 0$, $1$, $2$.</p><div class=\"worked\"><p>$\\tfrac{1}{\\sqrt{2\\pi}} = 0.399$; $\\ 0.399\\,e^{-1/2} = 0.242$; $\\ 0.399\\,e^{-2} = 0.054$.</p></div><div class=\"panel\" style=\"height:10mm\"></div></div>", "n": ""}, {"t": "Probability", "sub": "6 of 6: a Gaussian in many dimensions", "min": 2, "sz": "", "html": "<p>With $d$ independent dimensions (a <b>diagonal</b> Gaussian), the density is the product of $d$ one-dimensional ones, so the log density is a sum:</p><div class=\"eq\">\\[\\ln \\mathcal{N}(\\mathbf{z};\\ \\boldsymbol{\\mu}, \\mathrm{diag}(\\boldsymbol{\\sigma}^2)) = \\sum_{i=1}^{d} \\ln \\mathcal{N}(z_i;\\ \\mu_i, \\sigma_i^2)\\]</div><div class=\"hand\" data-h=\"10\"><p class=\"cue\">$\\ln \\mathcal{N}(\\mathbf{z}; \\mathbf{0}, I)$ for $\\mathbf{z} = (0.5, -1)$.</p><div class=\"worked\"><p>$-\\tfrac{1}{2}(0.5^2 + -1^2) - 2 \\cdot \\tfrac{1}{2}\\ln 2\\pi = -0.625 - 1.838 = -2.463$.</p></div><div class=\"panel\" style=\"height:10mm\"></div></div><p>PlaNet's stochastic state is a $30$-dimensional diagonal Gaussian.</p>", "n": ""}, {"t": "A world model, written down", "sub": "", "min": 2, "sz": "", "html": "<p><b>If the state is known</b> (joint angles, object poses), the model is a conditional distribution:</p><div class=\"eq\">\\[s_{t+1} \\sim p(s_{t+1} \\mid s_t,\\ a_t)\\]</div><p><b>From cameras</b> the state is not observed, so predict the next frame from everything seen and done:</p><div class=\"eq\">\\[o_{t+1} \\sim p(o_{t+1} \\mid o_{1:t},\\ a_{1:t})\\]</div><p>Latent models split this into an <b>encoder</b> $o_t \\mapsto s_t$, a <b>transition</b> $p(s_{t+1} \\mid s_t, a_t)$, and a <b>decoder</b> $s_t \\mapsto o_t$.</p>", "n": ""}, {"t": "What a world model is conditioned on", "sub": "", "min": 2, "sz": "", "html": "<table class='cmp'><thead><tr><th>Conditioned on</th><th>What it can answer</th></tr></thead><tbody><tr><td>past frames only</td><td>what usually happens next (video prediction). No use for choosing an action.</td></tr><tr><td>past frames <b>and actions</b></td><td>what happens if <i>I</i> do this: planning, imagination training. Today's models.</td></tr><tr><td>a goal image or text</td><td>which actions reach the goal: the planner compares predictions with it.</td></tr><tr><td>a policy</td><td>what happens if I keep behaving like this: the value of a policy, without running it.</td></tr></tbody></table>", "n": ""}, {"t": "A one-step model, rolled out", "sub": "illustrative numbers", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.500 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 434 219\" width=\"434\" role=\"img\" aria-label=\"Two trajectories from the same start: the true one, solid, and the model's open-loop rollout, dashed. They agree at the start and pull apart as the steps go on; the gap at the last step is marked e_k.\">\n  <path d=\"M31.6 180.8 L377.2 180.8\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M31.6 180.8 L31.6 31.0\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"198.7\" y=\"202.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">step k</text>\n  <path d=\"M31.6 125.0 L73.4 119.4 L115.1 113.2 L156.9 106.5 L198.7 99.1 L240.4 90.9 L282.2 81.9 L323.9 72.0 L365.7 61.1\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M31.6 125.0 L73.4 118.3 L115.1 110.8 L156.9 102.4 L198.7 92.9 L240.4 82.4 L282.2 70.6 L323.9 57.4 L365.7 42.6\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <circle cx=\"31.6\" cy=\"125.0\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"31.6\" cy=\"125.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"31.6\" y=\"200.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <circle cx=\"73.4\" cy=\"119.4\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"73.4\" cy=\"118.3\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"115.1\" cy=\"113.2\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"115.1\" cy=\"110.8\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"115.1\" y=\"200.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <circle cx=\"156.9\" cy=\"106.5\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"156.9\" cy=\"102.4\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"198.7\" cy=\"99.1\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"198.7\" cy=\"92.9\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"198.7\" y=\"200.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <circle cx=\"240.4\" cy=\"90.9\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"240.4\" cy=\"82.4\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"282.2\" cy=\"81.9\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"282.2\" cy=\"70.6\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"282.2\" y=\"200.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">6</text>\n  <circle cx=\"323.9\" cy=\"72.0\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"323.9\" cy=\"57.4\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"365.7\" cy=\"61.1\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"365.7\" cy=\"42.6\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"365.7\" y=\"200.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n  <path d=\"M380.1 61.1 L380.1 42.6\" stroke=\"var(--ink)\" stroke-width=\"1\" fill=\"none\"/>\n  <path d=\"M376.1 61.1 h8 M376.1 42.6 h8\" stroke=\"var(--ink)\" stroke-width=\"1\"/>\n  <text x=\"389.3\" y=\"51.8\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">e<tspan baseline-shift=\"sub\" font-size=\"72%\">k</tspan></text>\n  <text x=\"204.4\" y=\"120.4\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">true</text>\n  <text x=\"192.9\" y=\"71.6\" text-anchor=\"end\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">model, fed its own output</text>\n</svg><p class=\"cap\">teal: produced by the model; orange: observed or true</p></div></div><div style=\"flex:0.470 1 0\"><ul><li>Trained on one step: given the true $s_t$, predict $s_{t+1}$.</li><li>Used for $k$ steps: the model's output becomes its next input.</li><li>True system $x_{k+1} = 1.1\\,x_k$, model $1.12$. After $8$ steps: off by $0.33$.</li></ul></div></div>", "n": ""}, {"t": "Planning as search over action sequences", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"eq\">\\[a^\\star_{t:t+H-1} = \\arg\\min_{a_{t:t+H-1}} \\sum_{k=0}^{H-1} c(\\hat{s}_{t+k},\\ a_{t+k}), \\qquad \\hat{s}_{t+k+1} = f(\\hat{s}_{t+k}, a_{t+k}),\\ \\ \\hat{s}_t = s_t\\]</div><div class=\"cols\"><div style=\"flex:0.550 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 453 147\" width=\"453\" role=\"img\" aria-label=\"Three rows, one per time step. Each row is a plan of four actions starting one step later than the row above; only the first action of each plan, shaded, is run before the robot plans again.\">\n  <defs><marker id=\"acf127soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M85.0 38.0 L120.9 38.0 L120.9 14.9 L85.0 14.9 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M126.4 38.0 L162.4 38.0 L162.4 14.9 L126.4 14.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M167.9 38.0 L203.8 38.0 L203.8 14.9 L167.9 14.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M209.4 38.0 L245.3 38.0 L245.3 14.9 L209.4 14.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"70.2\" y=\"26.4\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">plan at t=0</text>\n  <text x=\"260.1\" y=\"26.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">run the first action, then replan</text>\n  <path d=\"M126.4 74.8 L162.4 74.8 L162.4 51.8 L126.4 51.8 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M167.9 74.8 L203.8 74.8 L203.8 51.8 L167.9 51.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M209.4 74.8 L245.3 74.8 L245.3 51.8 L209.4 51.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M250.8 74.8 L286.8 74.8 L286.8 51.8 L250.8 51.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"70.2\" y=\"63.3\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">plan at t=1</text>\n  <text x=\"301.5\" y=\"63.3\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\"></text>\n  <path d=\"M167.9 111.7 L203.8 111.7 L203.8 88.6 L167.9 88.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M209.4 111.7 L245.3 111.7 L245.3 88.6 L209.4 88.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M250.8 111.7 L286.8 111.7 L286.8 88.6 L250.8 88.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M292.3 111.7 L328.3 111.7 L328.3 88.6 L292.3 88.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"70.2\" y=\"100.2\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">plan at t=2</text>\n  <text x=\"343.0\" y=\"100.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\"></text>\n  <path d=\"M82.2 120.9 L331.0 120.9\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#acf127soft)\"/>\n  <text x=\"343.0\" y=\"120.9\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">time</text>\n</svg><p class=\"cap\">dashed: planned in the model; orange: run on the robot</p></div></div><div style=\"flex:0.420 1 0\"><ul><li><b>Model-predictive control (MPC):</b> solve for $H$ actions, run only the first, observe, solve again.</li><li>The cost $c$ can be a predicted reward or a distance to a goal.</li><li>The model need not be differentiable: the next methods only <i>evaluate</i> it.</li></ul></div></div>", "n": ""}, {"t": "Random shooting, then CEM", "sub": "", "min": 2.5, "sz": "", "html": "<p><b>Random shooting:</b> sample $J$ sequences, score each in the model, run the first action of the best. Fine for small searches; PlaNet's cheetah has $6$ action dimensions over $12$ steps, a $72$-dimensional search.</p><p><b>Cross-entropy method (CEM):</b> sample near the best ones and repeat.</p><ol><li>Gaussian over action sequences, $\\mu = 0$, $\\sigma = 1$.</li><li>Sample $J$ sequences; score each in the model.</li><li>Keep the best $K$, the <b>elites</b>.</li><li>Refit $\\mu$, $\\sigma$ to the elites. Repeat $I$ times.</li><li>Run the first action of $\\mu$; next step, start again from $\\mathcal{N}(0, 1)$.</li></ol><p>PlaNet: $H = 12$, $I = 10$, $J = 1{,}000$, $K = 100$: $120{,}000$ predictions per action.</p>", "n": ""}, {"t": "CEM by hand", "sub": "1 of 2: one round, illustrative numbers", "min": 4, "sz": "", "html": "<p>One action $u$, robot at $x = 0$, goal at $1$, model $x' = x + u$. Cost $J(u) = (u - 1)^2 + 0.25\\,u^2$: reach the goal without pushing hard.</p><div class=\"fig\"><svg viewBox=\"0 0 406 102\" width=\"406\" role=\"img\" aria-label=\"A number line for the action u. A dashed Gaussian shows the sampling distribution; dots on the line are the samples, the elites larger and highlighted. A narrower solid Gaussian, refitted to the elites, sits near the best action, marked by a dotted vertical line.\">\n  <path d=\"M53.3 75.2 L360.5 75.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M84.0 78.3 L84.0 75.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"84.0\" y=\"89.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-2</text>\n  <path d=\"M145.5 78.3 L145.5 75.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"145.5\" y=\"89.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=
