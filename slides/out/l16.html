59.9 103.2 L262.6 103.2 L265.3 103.2 L268.0 103.2 L270.8 103.2 L273.5 103.2 L276.2 103.2 L278.9 103.2 L281.6 103.2 L284.4 103.2 L287.1 103.2 L289.8 103.2 L292.5 103.2 L295.2 103.2 L298.0 103.2 L300.7 103.2 L303.4 103.2 L306.1 103.2 L308.8 103.2 L311.6 103.2 L314.3 103.1 L317.0 103.0 L319.7 102.8 L322.4 102.4 L325.2 101.6 L327.9 100.2 L330.6 98.0 L333.3 94.7 L336.0 89.9 L338.8 83.5 L341.5 75.7 L344.2 66.8 L346.9 57.6 L349.6 49.1 L352.4 42.4 L355.1 38.6 L357.8 38.2 L360.5 41.2 L363.2 47.3 L366.0 55.5 L368.7 64.6 L371.4 73.7 L374.1 81.8 L376.8 88.5 L379.6 93.7 L382.3 97.3 L385.0 99.8 L387.7 101.3 L390.4 102.2 L393.2 102.7 L395.9 103.0 L398.6 103.1 L401.3 103.2 L404.0 103.2 L406.8 103.2 L409.5 103.2 L412.2 103.2 L414.9 103.2 L417.6 103.2 L420.4 103.2 L423.1 103.2 L425.8 103.2 L428.5 103.2 L431.2 103.2 L434.0 103.2 L436.7 103.2 L439.4 103.2 L442.1 103.2 L444.8 103.2 L447.6 103.2 L450.3 103.2 L453.0 103.2 L455.7 103.2 L458.4 103.2 L461.2 103.2 L463.9 103.2 L466.6 103.2 L469.3 103.2 L472.0 103.2 L474.8 103.2 L477.5 103.2 L480.2 103.2 L482.9 103.2 L485.6 103.2 L488.4 103.2 L491.1 103.2 L493.8 103.2 L496.5 103.2 L499.2 103.2 L502.0 103.2 L504.7 103.2 L507.4 103.2\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <circle cx=\"322.6\" cy=\"103.2\" r=\"3.5\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"342.5\" cy=\"103.2\" r=\"4.6\" fill=\"var(--accent)\"/>\n  <circle cx=\"356.7\" cy=\"103.2\" r=\"4.6\" fill=\"var(--accent)\"/>\n  <circle cx=\"371.0\" cy=\"103.2\" r=\"4.6\" fill=\"var(--accent)\"/>\n  <circle cx=\"382.3\" cy=\"103.2\" r=\"3.5\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"393.7\" cy=\"103.2\" r=\"3.5\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"405.1\" cy=\"103.2\" r=\"3.5\" fill=\"var(--ink-soft)\"/>\n  <circle cx=\"425.0\" cy=\"103.2\" r=\"3.5\" fill=\"var(--ink-soft)\"/>\n  <path d=\"M359.4 117.3 L359.4 29.8\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"359.4\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">best u<tspan baseline-shift=\"super\" font-size=\"72%\">star</tspan> = 0.8</text>\n  <text x=\"80.9\" y=\"57.0\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">sampling</text>\n  <text x=\"398.1\" y=\"48.8\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">refit to the elites</text>\n  <text x=\"524.3\" y=\"103.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">u</text>\n</svg><p class=\"cap\">teal: the elites and the refitted Gaussian; orange: the true optimum</p></div><div class=\"hand\" data-h=\"16\"><p class=\"cue\">Same eight $z$, now $u = 0.90 + 0.327\\,z$. Which three win, and where does $\\mu$ go?</p><div class=\"worked\"><p>$u$: $0.377$, $0.606$, $0.769$, $0.933$, $1.063$, $1.194$, $1.325$, $1.553$. Elites $0.606, 0.769, 0.933$, so $\\mu = 0.769$, $\\sigma = 0.133$: closer to $u^\\star = 0.8$, and narrower.</p></div><div class=\"panel\" style=\"height:16mm\"></div></div>", "n": ""}, {"t": "Why plan in a latent space?", "sub": "", "min": 2, "sz": "", "html": "<ul><li>PlaNet sees $64 \\times 64$ RGB images: $12{,}288$ numbers per frame. Its latent state is $200 + 30 = 230$ numbers, $53$ times fewer.</li><li>CEM needs $120{,}000$ predictions per action: out of reach for images, affordable for small vectors.</li><li>Pixels also carry what does not matter for the task: texture, lighting, the background. A latent can drop it.</li></ul><p>The tool for learning a small state from images is the <b>variational autoencoder (VAE)</b>. It is trained by maximum likelihood with a KL penalty, so those come first.</p>", "n": ""}, {"t": "Likelihood", "sub": "illustrative numbers", "min": 3, "sz": "", "html": "<p>Three measurements of the block's position: $0.8$, $1.1$, $1.4$. Model: each is drawn from $\\mathcal{N}(\\mu, 1)$. Which $\\mu$ explains them better?</p><div class=\"eq\">\\[L(\\mu) = \\prod_i \\mathcal{N}(x_i;\\ \\mu, 1), \\qquad \\ln L(\\mu) = -\\tfrac{1}{2}\\sum_i (x_i - \\mu)^2 - \\tfrac{3}{2}\\ln 2\\pi\\]</div><div class=\"hand\" data-h=\"14\"><p class=\"cue\">$\\ln L$ for $\\mu = 1.1$ and $\\mu = 0.5$.</p><div class=\"worked\"><p>$\\mu = 1.1$: $\\sum (x_i - \\mu)^2 = 0.18$, $\\ln L = 0.090 - 2.757 = -2.847$.</p><p>$\\mu = 0.5$: $\\sum (x_i - \\mu)^2 = 1.26$, $\\ln L = 0.630 - 2.757 = -3.387$. The first explains the data better.</p></div><div class=\"panel\" style=\"height:14mm\"></div></div><p>The <b>likelihood</b> is the probability (density) of the observed data, read as a function of the model's parameters.</p>", "n": ""}, {"t": "Maximum likelihood, and why MSE is one", "sub": "", "min": 3, "sz": "", "html": "<p><b>Maximum likelihood:</b> pick the parameters that make the data most likely. Here, set $\\tfrac{d}{d\\mu}\\ln L = \\sum_i (x_i - \\mu) = 0$: $\\mu = $ the mean $= 1.1$.</p><p>For one measurement $x$ and a network's prediction $\\hat{x}$, a unit-variance Gaussian gives</p><div class=\"eq\">\\[-\\ln \\mathcal{N}(x;\\ \\hat{x}, 1) = \\tfrac{1}{2}(x - \\hat{x})^2 + \\tfrac{1}{2}\\ln 2\\pi\\]</div><div class=\"hand\" data-h=\"9\"><p class=\"cue\">Evaluate it for $x = 3$, $\\hat{x} = 2.5$.</p><div class=\"worked\"><p>$0.125 + 0.919 = 1.044$: squared error plus a constant.</p></div><div class=\"panel\" style=\"height:9mm\"></div></div><p>So minimising mean squared error (L05) <b>is</b> maximum likelihood under a Gaussian. Cross-entropy (L05) is the same for a softmax.</p>", "n": ""}, {"t": "Entropy", "sub": "illustrative numbers", "min": 2.5, "sz": "", "html": "<div class=\"eq\">\\[H(p) = -\\sum_x p(x)\\ln p(x)\\]</div><div class=\"hand\" data-h=\"13\"><p class=\"cue\">Entropy of a fair coin $(0.5, 0.5)$, and of a biased coin $(0.9, 0.1)$.</p><div class=\"worked\"><p>Fair: $-2 \\cdot 0.5 \\ln 0.5 = \\ln 2 = 0.693$ nats.</p><p>Biased: $-(0.9 \\ln 0.9 + 0.1 \\ln 0.1) = 0.325$ nats. Less uncertain, lower entropy.</p></div><div class=\"panel\" style=\"height:13mm\"></div></div><p><b>Entropy</b> measures how uncertain a distribution is: the average surprise $-\\ln p(x)$ of its own samples. Zero when one outcome is certain.</p>", "n": ""}, {"t": "From cross-entropy to KL divergence", "sub": "illustrative numbers", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[H(p, q) = -\\sum_x p(x)\\ln q(x) \\ \\ \\text{(L05)}, \\qquad \\mathrm{KL}(p\\,\\|\\,q) = H(p, q) - H(p) = \\sum_x p(x)\\ln\\frac{p(x)}{q(x)}\\]</div><div class=\"hand\" data-h=\"18\"><p class=\"cue\">$p$ = fair coin, $q = (0.9, 0.1)$. Find $H(p, q)$, then $\\mathrm{KL}(p\\,\\|\\,q)$ and $\\mathrm{KL}(q\\,\\|\\,p)$.</p><div class=\"worked\"><p>$H(p, q) = -0.5\\ln 0.9 - 0.5\\ln 0.1 = 1.204$; $\\ \\mathrm{KL}(p\\,\\|\\,q) = 1.204 - 0.693 = 0.511$.</p><p>$\\mathrm{KL}(q\\,\\|\\,p) = 0.9\\ln\\tfrac{0.9}{0.5} + 0.1\\ln\\tfrac{0.1}{0.5} = 0.368$. Not the same: KL is not symmetric.</p></div><div class=\"panel\" style=\"height:18mm\"></div></div><p><b>KL divergence:</b> the extra surprise from using $q$ when the data come from $p$. Always $\\geq 0$, and $0$ only when $q = p$.</p>", "n": ""}, {"t": "Autoencoders", "sub": "1 of 2: the idea", "min": 1.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 385 117\" width=\"385\" role=\"img\" aria-label=\"An image x goes through an encoder to a small code z, and a decoder turns z back into an image x-hat.\">\n  <defs><marker id=\"aab56dink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M8.0 86.3 L72.5 86.3 L72.5 12.6 L8.0 12.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M8.0 86.3 L8.0 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M24.1 86.3 L24.1 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M40.3 86.3 L40.3 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M56.4 86.3 L56.4 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M72.5 86.3 L72.5 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 86.3 L72.5 86.3\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 67.9 L72.5 67.9\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 49.5 L72.5 49.5\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 31.0 L72.5 31.0\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 12.6 L72.5 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <text x=\"40.3\" y=\"102.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x</text>\n  <path d=\"M90.9 90.9 L155.5 65.6 L155.5 33.3 L90.9 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"123.2\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">encoder</text>\n  <path d=\"M208.0 49.5 L207.6 46.0 L206.4 42.7 L204.6 39.7 L202.1 37.2 L199.1 35.4 L195.8 34.2 L192.3 33.8 L188.8 34.2 L185.5 35.4 L182.6 37.2 L180.1 39.7 L178.2 42.7 L177.0 46.0 L176.7 49.5 L177.0 53.0 L178.2 56.3 L180.1 59.2 L182.6 61.7 L185.5 63.6 L188.8 64.7 L192.3 65.1 L195.8 64.7 L199.1 63.6 L202.1 61.7 L204.6 59.2 L206.4 56.3 L207.6 53.0 L208.0 49.5 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"192.3\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z</text>\n  <path d=\"M157.3 49.5 L175.7 49.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#aab56dink)\"/>\n  <path d=\"M208.9 49.5 L227.3 49.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#aab56dink)\"/>\n  <path d=\"M229.2 65.6 L293.7 90.9 L293.7 8.0 L229.2 33.3 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"261.4\" y=\"53.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">decoder</text>\n  <path d=\"M312.1 86.3 L376.6 86.3 L376.6 12.6 L312.1 12.6 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M312.1 86.3 L312.1 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M328.3 86.3 L328.3 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M344.4 86.3 L344.4 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M360.5 86.3 L360.5 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M376.6 86.3 L376.6 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M312.1 86.3 L376.6 86.3\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M312.1 67.9 L376.6 67.9\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M312.1 49.5 L376.6 49.5\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M312.1 31.0 L376.6 31.0\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M312.1 12.6 L376.6 12.6\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <text x=\"344.4\" y=\"102.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x̂</text>\n  <path d=\"M74.4 49.5 L89.1 49.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#aab56dink)\"/>\n  <path d=\"M295.5 49.5 L310.3 49.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#aab56dink)\"/>\n</svg><p class=\"cap\">orange: the input image; teal: the model's reconstruction</p></div><ul><li>An <b>encoder</b> maps an image $x$ to a short code $z$; a <b>decoder</b> maps $z$ back to $\\hat{x}$.</li><li>Train both on $\\|x - \\hat{x}\\|^2$ by gradient descent (L05). The bottleneck forces $z$ to keep what is needed to redraw $x$.</li><li><b>Self-supervised:</b> the target is the input itself, so no labels are needed.</li></ul>", "n": ""}, {"t": "Autoencoders", "sub": "2 of 2: by hand, illustrative numbers", "min": 3, "sz": "", "html": "<p>A linear autoencoder from $2$ numbers to $1$ and back. Encoder $z = 0.8\\,x_1 + 0.6\\,x_2$; decoder $\\hat{x} = (0.8\\,z,\\ 0.6\\,z)$.</p><div class=\"hand\" data-h=\"14\"><p class=\"cue\">Encode $x = (2, 1)$, decode, and find the squared error.</p><div class=\"worked\"><p>$z = 0.8 \\cdot 2 + 0.6 \\cdot 1 = 2.2$. $\\ \\hat{x} = (1.76, 1.32)$. $\\ \\|x - \\hat{x}\\|^2 = 0.24^2 + -0.32^2 = 0.16$.</p></div><div class=\"panel\" style=\"height:14mm\"></div></div><p>One number cannot hold two exactly; training moves the weights to lose as little as possible. Nothing says what a code <i>between</i> training codes decodes to.</p>", "n": ""}, {"t": "Variational autoencoders", "sub": "1 of 6: a distribution per input", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 495 152\" width=\"495\" role=\"img\" aria-label=\"An image x goes through an encoder that outputs a mean mu and a standard deviation sigma. The code z is mu plus sigma times a noise sample epsilon drawn from a standard normal, and a decoder turns z back into an image.\">\n  <defs><marker id=\"a5c26bink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a5c26bsoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M8.0 100.5 L84.2 100.5 L84.2 13.4 L8.0 13.4 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M8.0 100.5 L8.0 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M27.0 100.5 L27.0 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M46.1 100.5 L46.1 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M65.1 100.5 L65.1 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M84.2 100.5 L84.2 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 100.5 L84.2 100.5\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 78.7 L84.2 78.7\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 57.0 L84.2 57.0\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 35.2 L84.2 35.2\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M8.0 13.4 L84.2 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <text x=\"46.1\" y=\"120.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x</text>\n  <path d=\"M105.9 105.9 L182.1 76.0 L182.1 37.9 L105.9 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"144.0\" y=\"61.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">encoder</text>\n  <path d=\"M199.5 50.4 L230.0 50.4 L230.0 20.0 L199.5 20.0 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"214.7\" y=\"40.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">μ</text>\n  <path d=\"M199.5 94.0 L230.0 94.0 L230.0 63.5 L199.5 63.5 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"214.7\" y=\"83.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">σ</text>\n  <path d=\"M184.3 46.1 L198.4 37.4\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <path d=\"M184.3 67.8 L198.4 76.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <path d=\"M287.6 57.0 L287.2 52.8 L285.8 48.9 L283.6 45.4 L280.7 42.5 L277.1 40.3 L273.2 38.9 L269.1 38.5 L265.0 38.9 L261.1 40.3 L257.6 42.5 L254.7 45.4 L252.5 48.9 L251.1 52.8 L250.6 57.0 L251.1 61.1 L252.5 65.0 L254.7 68.5 L257.6 71.4 L261.1 73.6 L265.0 75.0 L269.1 75.5 L273.2 75.0 L277.1 73.6 L280.7 71.4 L283.6 68.5 L285.8 65.0 L287.2 61.1 L287.6 57.0 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"269.1\" y=\"61.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z</text>\n  <path d=\"M231.0 38.5 L251.7 49.3\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <path d=\"M231.0 75.5 L251.7 64.6\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <path d=\"M284.4 122.2 L284.0 118.9 L282.8 115.6 L281.0 112.7 L278.6 110.3 L275.7 108.5 L272.5 107.4 L269.1 107.0 L265.7 107.4 L262.5 108.5 L259.6 110.3 L257.2 112.7 L255.4 115.6 L254.3 118.9 L253.9 122.2 L254.3 125.6 L255.4 128.8 L257.2 131.7 L259.6 134.1 L262.5 136.0 L265.7 137.1 L269.1 137.5 L272.5 137.1 L275.7 136.0 L278.6 134.1 L281.0 131.7 L282.8 128.8 L284.0 125.6 L284.4 122.2 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"269.1\" y=\"127.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ε</text>\n  <path d=\"M269.1 105.9 L269.1 76.5\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bsoft)\"/>\n  <text x=\"294.1\" y=\"122.2\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">~ N(0, 1)</text>\n  <path d=\"M288.7 57.0 L310.5 57.0\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <path d=\"M312.6 76.0 L388.8 105.9 L388.8 8.0 L312.6 37.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"350.7\" y=\"61.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">decoder</text>\n  <path d=\"M410.6 100.5 L486.7 100.5 L486.7 13.4 L410.6 13.4 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M410.6 100.5 L410.6 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M429.6 100.5 L429.6 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M448.6 100.5 L448.6 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M467.7 100.5 L467.7 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M486.7 100.5 L486.7 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M410.6 100.5 L486.7 100.5\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M410.6 78.7 L486.7 78.7\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M410.6 57.0 L486.7 57.0\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M410.6 35.2 L486.7 35.2\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <path d=\"M410.6 13.4 L486.7 13.4\" stroke=\"var(--rule)\" stroke-width=\"0.38\" fill=\"none\"/>\n  <text x=\"448.6\" y=\"120.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x̂</text>\n  <path d=\"M86.3 57.0 L103.7 57.0\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <path d=\"M391.0 57.0 L408.4 57.0\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a5c26bink)\"/>\n  <text x=\"269.1\" y=\"20.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z = μ + σε</text>\n</svg><p class=\"cap\">orange: the input image; teal: the model's reconstruction</p></div><ul><li>The encoder outputs a mean $\\mu(x)$ and a standard deviation $\\sigma(x)$: a Gaussian $q(z \\mid x)$ per input.</li><li>Every code near $\\mu$ must decode to something like $x$.</li><li><b>Analogy:</b> an autoencoder pins each image to one point on a map. A VAE gives each image a small district, so nearby points still decode to something.</li></ul>", "n": ""}, {"t": "Variational autoencoders", "sub": "2 of 6: the reparameterisation, by hand", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[z = \\mu + \\sigma\\,\\epsilon, \\qquad \\epsilon \\sim \\mathcal{N}(0, 1)\\]</div><div class=\"hand\" data-h=\"12\"><p class=\"cue\">The encoder gives $\\mu = 1$, $\\sigma = 0.5$; the noise draw is $\\epsilon = -0.4$. Find $z$, $\\partial z / \\partial \\mu$ and $\\partial z / \\partial \\sigma$.</p><div class=\"worked\"><p>$z = 1 + 0.5 \\cdot (-0.4) = 0.8$. $\\ \\partial z / \\partial \\mu = 1$, $\\ \\partial z / \\partial \\sigma = \\epsilon = -0.4$.</p></div><div class=\"panel\" style=\"height:12mm\"></div></div><p>Sampling becomes a sum and a product, so backpropagation (L05) passes through it to the encoder.</p>", "n": ""}, {"t": "Variational autoencoders", "sub": "3 of 6: keep the clouds together", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.460 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 362 159\" width=\"362\" role=\"img\" aria-label=\"Two bell curves on one axis: a wide one centred at 0, the prior, and a narrower, taller one shifted to the right, the encoder's distribution q.\">\n  <path d=\"M31.8 123.2 L354.4 123.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"81.5\" y=\"142.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-2</text>\n  <path d=\"M81.5 126.7 L81.5 123.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"180.7\" y=\"142.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M180.7 126.7 L180.7 123.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"280.0\" y=\"142.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <path d=\"M280.0 126.7 L280.0 123.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M31.8 122.6 L34.5 122.5 L37.2 122.4 L39.9 122.3 L42.6 122.1 L45.3 121.9 L48.0 121.8 L50.7 121.5 L53.3 121.3 L56.0 121.0 L58.7 120.7 L61.4 120.3 L64.1 119.9 L66.8 119.5 L69.5 119.0 L72.2 118.5 L74.8 117.9 L77.5 117.2 L80.2 116.5 L82.9 115.8 L85.6 114.9 L88.3 114.1 L91.0 113.1 L93.7 112.1 L96.3 111.0 L99.0 109.8 L101.7 108.6 L104.4 107.3 L107.1 105.9 L109.8 104.5 L112.5 103.1 L115.2 101.5 L117.9 100.0 L120.5 98.3 L123.2 96.7 L125.9 95.0 L128.6 93.3 L131.3 91.6 L134.0 89.9 L136.7 88.2 L139.4 86.6 L142.0 84.9 L144.7 83.3 L147.4 81.8 L150.1 80.3 L152.8 78.9 L155.5 77.6 L158.2 76.4 L160.9 75.3 L163.5 74.4 L166.2 73.5 L168.9 72.8 L171.6 72.2 L174.3 71.8 L177.0 71.5 L179.7 71.4 L182.4 71.4 L185.1 71.6 L187.7 71.9 L190.4 72.3 L193.1 73.0 L195.8 73.7 L198.5 74.6 L201.2 75.6 L203.9 76.7 L206.6 77.9 L209.2 79.3 L211.9 80.7 L214.6 82.2 L217.3 83.7 L220.0 85.3 L222.7 86.9 L225.4 88.6 L228.1 90.3 L230.7 92.0 L233.4 93.7 L236.1 95.4 L238.8 97.1 L241.5 98.7 L244.2 100.3 L246.9 101.9 L249.6 103.4 L252.3 104.9 L254.9 106.3 L257.6 107.6 L260.3 108.9 L263.0 110.1 L265.7 111.2 L268.4 112.3 L271.1 113.3 L273.8 114.3 L276.4 115.1 L279.1 115.9 L281.8 116.7 L284.5 117.4 L287.2 118.0 L289.9 118.6 L292.6 119.1 L295.3 119.6 L297.9 120.0 L300.6 120.4 L303.3 120.8 L306.0 121.1 L308.7 121.3 L311.4 121.6 L314.1 121.8 L316.8 122.0 L319.5 122.2 L322.1 122.3 L324.8 122.4 L327.5 122.5 L330.2 122.6 L332.9 122.7 L335.6 122.8 L338.3 122.9 L341.0 122.9 L343.6 123.0 L346.3 123.0 L349.0 123.0 L351.7 123.1 L354.4 123.1\" stroke=\"var(--ink-soft)\" stroke-width=\"1.42\" fill=\"none\"/>\n  <path d=\"M31.8 123.2 L34.5 123.2 L37.2 123.2 L39.9 123.2 L42.6 123.2 L45.3 123.2 L48.0 123.2 L50.7 123.2 L53.3 123.2 L56.0 123.2 L58.7 123.2 L61.4 123.2 L64.1 123.2 L66.8 123.2 L69.5 123.2 L72.2 123.2 L74.8 123.2 L77.5 123.2 L80.2 123.2 L82.9 123.2 L85.6 123.2 L88.3 123.2 L91.0 123.2 L93.7 123.2 L96.3 123.2 L99.0 123.2 L101.7 123.2 L104.4 123.2 L107.1 123.2 L109.8 123.2 L112.5 123.2 L115.2 123.2 L117.9 123.2 L120.5 123.2 L123.2 123.2 L125.9 123.2 L128.6 123.2 L131.3 123.2 L134.0 123.1 L136.7 123.1 L139.4 123.1 L142.0 123.0 L144.7 122.9 L147.4 122.8 L150.1 122.6 L152.8 122.4 L155.5 122.1 L158.2 121.7 L160.9 121.1 L163.5 120.4 L166.2 119.5 L168.9 118.4 L171.6 116.9 L174.3 115.1 L177.0 112.9 L179.7 110.3 L182.4 107.2 L185.1 103.6 L187.7 99.4 L190.4 94.8 L193.1 89.5 L195.8 83.8 L198.5 77.7 L201.2 71.2 L203.9 64.5 L206.6 57.7 L209.2 51.0 L211.9 44.5 L214.6 38.4 L217.3 32.9 L220.0 28.1 L222.7 24.3 L225.4 21.6 L228.1 20.0 L230.7 19.5 L233.4 20.3 L236.1 22.3 L238.8 25.4 L241.5 29.5 L244.2 34.5 L246.9 40.2 L249.6 46.4 L252.3 53.0 L254.9 59.8 L257.6 66.6 L260.3 73.2 L263.0 79.6 L265.7 85.6 L268.4 91.2 L271.1 96.3 L273.8 100.8 L276.4 104.8 L279.1 108.2 L281.8 111.2 L284.5 113.6 L287.2 115.7 L289.9 117.4 L292.6 118.7 L295.3 119.8 L297.9 120.7 L300.6 121.3 L303.3 121.8 L306.0 122.2 L308.7 122.5 L311.4 122.7 L314.1 122.9 L316.8 123.0 L319.5 123.0 L322.1 123.1 L324.8 123.1 L327.5 123.2 L330.2 123.2 L332.9 123.2 L335.6 123.2 L338.3 123.2 L341.0 123.2 L343.6 123.2 L346.3 123.2 L349.0 123.2 L351.7 123.2 L354.4 123.2\" stroke=\"var(--accent)\" stroke-width=\"1.42\" fill=\"none\"/>\n  <text x=\"92.1\" y=\"82.9\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">prior N(0,1)</text>\n  <text x=\"256.8\" y=\"31.0\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">q = N(1, 0.5²)</text>\n</svg><p class=\"cap\">teal: the encoder's output for one image; grey: the shared prior</p></div></div><div style=\"flex:0.510 1 0\"><p>The encoder could cheat: shrink $\\sigma \\to 0$ and spread the means apart. So penalise the KL from each $q(z \\mid x)$ to a shared <b>prior</b> $p(z) = \\mathcal{N}(0, 1)$:</p><div class=\"eq\">\\[\\mathrm{KL}\\big(\\mathcal{N}(\\mu, \\sigma^2)\\,\\|\\,\\mathcal{N}(0, 1)\\big) = \\tfrac{1}{2}\\left(\\mu^2 + \\sigma^2 - 1 - \\ln \\sigma^2\\right)\\]</div></div></div>", "n": ""}, {"t": "Variational autoencoders", "sub": "4 of 6: the KL by hand", "min": 4, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{KL} = \\tfrac{1}{2}\\left(\\mu^2 + \\sigma^2 - 1 - \\ln \\sigma^2\\right)\\]</div><div class=\"hand\" data-h=\"34\"><p class=\"cue\">Evaluate it for $\\mu = 1,\\ \\sigma = 0.5$; for $\\mu = 0,\\ \\sigma = 1$; and for the cheat $\\mu = 0,\\ \\sigma = 0.1$. What does each term punish?</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}\\mu = 1,\\ \\sigma = 0.5:&amp;\\quad \\tfrac{1}{2}\\left(1 + 0.25 - 1 - \\ln 0.25\\right) = \\tfrac{1}{2}(0.25 + 1.386) = 0.818 \\text{ nats}\\\\ \\mu = 0,\\ \\sigma = 1:&amp;\\quad \\tfrac{1}{2}(0 + 1 - 1 - 0) = 0\\\\ \\mu = 0,\\ \\sigma = 0.1:&amp;\\quad \\tfrac{1}{2}\\left(0 + 0.01 - 1 - \\ln 0.01\\right) = \\tfrac{1}{2}(-0.99 + 4.605) = 1.808 \\text{ nats}\\end{aligned}\\]</div><p>$\\mu^2$ punishes a cloud far from 0; $\\sigma^2 - 1 - \\ln \\sigma^2$ punishes one too narrow or too wide. The cheat costs the most.</p></div><div class=\"panel\" style=\"height:34mm\"></div></div>", "n": ""}, {"t": "Variational autoencoders", "sub": "5 of 6: Jensen's inequality", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.520 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 350 150\" width=\"350\" role=\"img\" aria-label=\"The curve ln x with two points on it joined by a dashed chord. Above the average of the two x values, the curve sits higher than the chord: the log of the average is larger than the average of the logs.\">\n  <path d=\"M8.0 108.6 L301.8 108.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M8.0 142.5 L11.7 137.3 L15.3 132.6 L19.0 128.3 L22.7 124.3 L26.4 120.6 L30.0 117.2 L33.7 114.1 L37.4 111.1 L41.0 108.3 L44.7 105.6 L48.4 103.1 L52.1 100.7 L55.7 98.4 L59.4 96.2 L63.1 94.1 L66.8 92.1 L70.4 90.2 L74.1 88.3 L77.8 86.5 L81.4 84.8 L85.1 83.1 L88.8 81.5 L92.5 80.0 L96.1 78.4 L99.8 77.0 L103.5 75.5 L107.1 74.2 L110.8 72.8 L114.5 71.5 L118.2 70.2 L121.8 69.0 L125.5 67.8 L129.2 66.6 L132.8 65.4 L136.5 64.3 L140.2 63.2 L143.9 62.1 L147.5 61.1 L151.2 60.0 L154.9 59.0 L158.6 58.0 L162.2 57.1 L165.9 56.1 L169.6 55.2 L173.2 54.3 L176.9 53.4 L180.6 52.5 L184.3 51.6 L187.9 50.8 L191.6 49.9 L195.3 49.1 L198.9 48.3 L202.6 47.5 L206.3 46.7 L210.0 45.9 L213.6 45.2 L217.3 44.4 L221.0 43.7 L224.6 43.0 L228.3 42.2 L232.0 41.5 L235.7 40.8 L239.3 40.2 L243.0 39.5 L246.7 38.8 L250.4 38.2 L254.0 37.5 L257.7 36.9 L261.4 36.2 L265.0 35.6 L268.7 35.0 L272.4 34.4 L276.1 33.8 L279.7 33.2 L283.4 32.6 L287.1 32.0 L290.7 31.4 L294.4 30.9 L298.1 30.3 L301.8 29.8\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M40.6 108.6 L236.5 40.7\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <circle cx=\"40.6\" cy=\"108.6\" r=\"3.7\" fill=\"var(--ink)\"/>\n  <text x=\"40.6\" y=\"126.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <circle cx=\"236.5\" cy=\"40.7\" r=\"3.7\" fill=\"var(--ink)\"/>\n  <text x=\"236.5\" y=\"126.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <circle cx=\"138.6\" cy=\"63.7\" r=\"3.7\" fill=\"var(--ink)\"/>\n  <circle cx=\"138.6\" cy=\"74.6\" r=\"3.7\" fill=\"var(--ink-soft)\"/>\n  <text x=\"127.7\" y=\"49.0\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ln E[x] = 0.916</text>\n  <text x=\"149.4\" y=\"89.3\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">E[ln x] = 0.693</text>\n  <text x=\"310.5\" y=\"29.8\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">ln x</text>\n</svg></div></div><div style=\"flex:0.450 1 0\"><div class=\"eq\">\\[\\ln \\mathbb{E}[x] \\;\\geq\\; \\mathbb{E}[\\ln x]\\]</div><div class=\"hand\" data-h=\"12\"><p class=\"cue\">$x = 1$ or $4$, equally likely.</p><div class=\"worked\"><p>$\\ln 2.5 = 0.916$; $\\ \\tfrac{1}{2}(\\ln 1 + \\ln 4) = 0.693$.</p></div><div class=\"panel\" style=\"height:12mm\"></div></div><p>$\\ln$ curves downward, so the log of an average is above the average of the logs.</p></div></div>", "n": ""}, {"t": "Variational autoencoders", "sub": "6 of 6: the ELBO", "min": 3, "sz": "", "html": "<p>The model: draw a code $z \\sim p(z)$, decode it with $p(x \\mid z)$. Maximum likelihood wants $\\ln p(x) = \\ln \\int p(x \\mid z)\\,p(z)\\,dz$, but that integral is intractable.</p><div class=\"hand\" data-h=\"24\"><p class=\"cue\">Multiply and divide inside the integral by $q(z \\mid x)$, then use Jensen's inequality.</p><div class=\"worked\"><div class=\"eq\">\\[\\begin{aligned}\\ln p(x) &amp;= \\ln \\mathbb{E}_{q(z \\mid x)}\\!\\left[\\frac{p(x \\mid z)\\,p(z)}{q(z \\mid x)}\\right] \\;\\geq\\; \\mathbb{E}_{q}\\!\\left[\\ln p(x \\mid z)\\right] - \\mathbb{E}_{q}\\!\\left[\\ln \\frac{q(z \\mid x)}{p(z)}\\right]\\\\ &amp;= \\underbrace{\\mathbb{E}_{q}\\left[\\ln p(x \\mid z)\\right]}_{\\text{reconstruction}} - \\underbrace{\\mathrm{KL}\\big(q(z \\mid x)\\,\\|\\,p(z)\\big)}_{\\text{keep the clouds together}}\\end{aligned}\\]</div></div><div class=\"panel\" style=\"height:24mm\"></div></div><p>The <b>evidence lower bound (ELBO)</b>. Maximise it: decode well, and keep the codes near the prior.</p>", "n": ""}, {"t": "The ELBO, by hand", "sub": "one sample, illustrative numbers", "min": 3, "sz": "", "html": "<p>One input $x = 1$. The encoder gives $q = \\mathcal{N}(1, 0.5^2)$; the noise draw $\\epsilon = -0.4$ gives $z = 0.8$ (two slides back). The decoder predicts $\\hat{x} = z$, unit variance.</p><div class=\"hand\" data-h=\"18\"><p class=\"cue\">Estimate the ELBO from this one sample: reconstruction term, minus the KL.</p><div class=\"worked\"><p>Reconstruction: $\\ln \\mathcal{N}(1;\\ 0.8, 1) = -\\tfrac{1}{2}(0.2)^2 - 0.919 = -0.939$.</p><p>KL: $0.818$ (the KL slide). ELBO $\\approx -0.939 - 0.818 = -1.757$.</p></div><div class=\"panel\" style=\"height:18mm\"></div></div><p>Training averages this over a batch and follows its gradient. The expectation is estimated with one sample.</p>", "n": ""}, {"t": "Recurrent networks", "sub": "1 of 2: a network with memory", "min": 2, "sz": "", "html": "<div class=\"eq\">\\[h_t = \\tanh\\big(W h_{t-1} + U x_t + b\\big)\\]</div><ul><li>An MLP (L05) sees one input. A <b>recurrent neural network (RNN)</b> reads a sequence one step at a time.</li><li>The <b>hidden state</b> $h_t$ is its memory: each step mixes the old memory with the new input.</li><li>The same weights $W, U, b$ are used at every step.</li></ul><p>A world model needs this: the next frame depends on the whole history of frames and actions.</p>", "n": ""}, {"t": "Recurrent networks", "sub": "2 of 2: unrolled, by hand, illustrative numbers", "min": 3.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 485 192\" width=\"485\" role=\"img\" aria-label=\"Three copies of the same tanh cell side by side. Each takes an input x from below and the previous hidden state from the left, and passes its new hidden state h to the right and upwards.\">\n  <defs><marker id=\"a1a610accent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"a1a610ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M17.8 94.0 L54.8 94.0 L54.8 57.0 L17.8 57.0 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"36.3\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">0</tspan></text>\n  <text x=\"36.3\" y=\"111.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M79.8 94.5 L145.1 94.5 L145.1 56.4 L79.8 56.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"112.4\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">tanh</text>\n  <path d=\"M54.8 75.5 L79.8 75.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610ink)\"/>\n  <text x=\"112.4\" y=\"145.6\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 1</text>\n  <path d=\"M112.4 129.9 L112.4 94.5\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610accent2)\"/>\n  <path d=\"M112.4 56.4 L112.4 31.9\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610ink)\"/>\n  <text x=\"112.4\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan> = 0.762</text>\n  <path d=\"M221.2 94.5 L286.5 94.5 L286.5 56.4 L221.2 56.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"253.9\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">tanh</text>\n  <path d=\"M145.1 75.5 L221.2 75.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610ink)\"/>\n  <text x=\"253.9\" y=\"145.6\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 0</text>\n  <path d=\"M253.9 129.9 L253.9 94.5\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610accent2)\"/>\n  <path d=\"M253.9 56.4 L253.9 31.9\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610ink)\"/>\n  <text x=\"253.9\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan> = 0.363</text>\n  <path d=\"M362.7 94.5 L428.0 94.5 L428.0 56.4 L362.7 56.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"395.3\" y=\"80.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">tanh</text>\n  <path d=\"M286.5 75.5 L362.7 75.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610ink)\"/>\n  <text x=\"395.3\" y=\"145.6\" text-anchor=\"middle\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">x<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan> = -1</text>\n  <path d=\"M395.3 129.9 L395.3 94.5\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610accent2)\"/>\n  <path d=\"M395.3 56.4 L395.3 31.9\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a1a610ink)\"/>\n  <text x=\"395.3\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan> = -0.674</text>\n  <text x=\"253.9\" y=\"176.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the same weights in every copy</text>\n</svg><p class=\"cap\">orange: the input sequence; teal: the hidden states the network computes</p></div><div class=\"hand\" data-h=\"13\"><p class=\"cue\">Scalar RNN, $W = 0.5$, $U = 1$, $b = 0$, $h_0 = 0$. Run it on $x = 1, 0, -1$.</p><div class=\"worked\"><p>$h_1 = \\tanh(1) = 0.762$; $\\ h_2 = \\tanh(0.5 \\cdot 0.762 + 0) = 0.363$; $\\ h_3 = \\tanh(0.5 \\cdot 0.363 - 1) = -0.674$.</p></div><div class=\"panel\" style=\"height:13mm\"></div></div>", "n": ""}, {"t": "Gated memory", "sub": "1 of 3: keep or overwrite, illustrative numbers", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.420 1 0\"><p>A plain RNN replaces its memory at every step. A <b>gated</b> network blends: the new memory is a point between the old memory and a <b>candidate</b>.</p><div class=\"eq\">\\[h_t = (1 - z)\\,h_{t-1} + z\\,\\tilde{h}\\]</div><p>$z$, the <b>update gate</b>, is between 0 and 1.</p></div><div style=\"flex:0.560 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 446 123\" width=\"446\" role=\"img\" aria-label=\"A number line from -1 to 1. The old memory sits at 0.8 (z = 0 keeps it) and the candidate at -0.537 (z = 1 overwrites with it). z = 0.2 gives 0.533, between them.\">\n  <path d=\"M28.2 70.0 L387.2 70.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M44.5 73.8 L44.5 66.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"44.5\" y=\"89.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-1</text>\n  <path d=\"M207.7 73.8 L207.7 66.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"207.7\" y=\"89.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M370.9 73.8 L370.9 66.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"370.9\" y=\"89.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <circle cx=\"338.3\" cy=\"70.0\" r=\"5.5\" fill=\"var(--ink)\"/>\n  <text x=\"338.3\" y=\"46.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">old memory 0.8</text>\n  <text x=\"338.3\" y=\"107.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z = 0: keep</text>\n  <circle cx=\"120.1\" cy=\"70.0\" r=\"5.5\" fill=\"var(--ink)\"/>\n  <text x=\"120.1\" y=\"46.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">candidate -0.537</text>\n  <text x=\"120.1\" y=\"107.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z = 1: overwrite</text>\n  <circle cx=\"294.6\" cy=\"70.0\" r=\"5.5\" fill=\"var(--accent)\"/>\n  <path d=\"M294.6 62.4 L294.6 31.9\" stroke=\"var(--accent)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <text x=\"294.6\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">z = 0.2: 0.533</text>\n</svg><p class=\"cap\">teal: the new memory at z = 0.2</p></div></div></div><div class=\"hand\" data-h=\"6\"><p class=\"cue\">Old memory $h_{t-1} = 0.8$. Candidate $\\tilde{h} = \\tanh(0.5 \\cdot 0.8 - 1) = -0.537$, the plain RNN's answer. Blend with $z = 0,\\ 0.2,\\ 1$.</p><div class=\"worked\"><p>$z = 0$: $0.8$ (keep). $\\ z = 0.2$: $0.8 \\cdot 0.8 + 0.2 \\cdot (-0.537) = 0.533$. $\\ z = 1$: $-0.537$ (overwrite).</p></div><div class=\"panel\" style=\"height:6mm\"></div></div>", "n": ""}, {"t": "Gated memory", "sub": "2 of 3: the network sets the gate, illustrative numbers", "min": 3.5, "sz": "", "html": "<div class=\"eq\">\\[z = \\sigma(w_z\\,h_{t-1} + u_z\\,x_t)\\]</div><div class=\"hand\" data-h=\"17\"><p class=\"cue\">Made-up weights $w_z = 1$, $u_z = 2$; $h_{t-1} = 0.8$. Find $z$ and $h_t$ for $x_t = -1$, then for $x_t = +1$.</p><div class=\"worked\"><p>$x_t = -1$: $\\ 1 \\cdot 0.8 + 2 \\cdot (-1) = -1.2$, $\\ z = \\sigma(-1.2) = 0.231$. $\\ h_t = 0.769 \\cdot 0.8 + 0.231 \\cdot (-0.537) = 0.491$: mostly kept.</p><p>$x_t = +1$: $\\ 1 \\cdot 0.8 + 2 \\cdot 1 = 2.8$, $\\ z = \\sigma(2.8) = 0.943$. Candidate $\\tanh(0.5 \\cdot 0.8 + 1) = 0.885$; $\\ h_t = 0.880$: mostly overwritten.</p></div><div class=\"panel\" style=\"height:17mm\"></div></div><p>One small neuron, with a sigmoid (L05) so $0 \\le z \\le 1$. Training learns $w_z, u_z$: the network learns <b>when</b> to remember.</p>", "n": ""}, {"t": "Gated memory", "sub": "3 of 3: the reset gate, and the whole GRU", "min": 4, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"eq\">\\[\\begin{aligned}r &amp;= \\sigma(w_r h_{t-1} + u_r x_t) &amp;&amp; \\text{reset gate}\\\\ z &amp;= \\sigma(w_z h_{t-1} + u_z x_t) &amp;&amp; \\text{update gate}\\\\ \\tilde{h} &amp;= \\tanh\\big(W\\,(r\\,h_{t-1}) + U x_t\\big) &amp;&amp; \\text{candidate}\\\\ h_t &amp;= (1 - z)\\,h_{t-1} + z\\,\\tilde{h} &amp;&amp; \\text{blend}\\end{aligned}\\]</div><p>New piece: $r$ sets how much of the old memory the candidate sees. $r$ near 0 is a fresh start.</p></div><div style=\"flex:0.530 1 0\"><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Same $h_{t-1} = 0.8$, $x_t = -1$, $z = 0.231$ from the last slide. Made-up $w_r = u_r = 1$.</p><div class=\"worked\"><p>$r = \\sigma(1 \\cdot 0.8 + 1 \\cdot (-1)) = \\sigma(-0.2) = 0.450$</p><p>$\\tilde{h} = \\tanh(0.5 \\cdot 0.450 \\cdot 0.8 - 1) = \\tanh(-0.82) = -0.675$</p><p>$h_t = 0.769 \\cdot 0.8 + 0.231 \\cdot (-0.675) = 0.459$</p><p>Plain RNN, same input: $-0.537$.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div>", "n": ""}, {"t": "A latent dynamics model", "sub": "1 of 4: deterministic only", "min": 1.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 418 217\" width=\"418\" role=\"img\" aria-label=\"Three time steps. A chain of deterministic hidden states h1, h2, h3 joined by arrows, each action feeding the next step, each h generating its observation o. Only o1 and o2 are observed; o3 is predicted.\">\n  <defs><marker id=\"a4cb58ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a4cb58soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M54.2 187.5 L53.8 183.5 L52.5 179.7 L50.3 176.3 L47.5 173.5 L44.1 171.3 L40.3 170.0 L36.3 169.6 L32.3 170.0 L28.5 171.3 L25.1 173.5 L22.3 176.3 L20.1 179.7 L18.8 183.5 L18.3 187.5 L18.8 191.5 L20.1 195.3 L22.3 198.7 L25.1 201.6 L28.5 203.7 L32.3 205.0 L36.3 205.5 L40.3 205.0 L44.1 203.7 L47.5 201.6 L50.3 198.7 L52.5 195.3 L53.8 191.5 L54.2 187.5 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"36.3\" y=\"192.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">o<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M20.0 95.0 L52.6 95.0 L52.6 62.4 L20.0 62.4 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"36.3\" y=\"83.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M36.3 97.2 L36.3 168.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a4cb58ink)\"/>\n  <text x=\"107.0\" y=\"34.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M53.2 78.7 L160.9 78.7\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a4cb58ink)\"/>\n  <path d=\"M107.0 38.5 L128.8 73.8\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a4cb58soft)\"/>\n  <path d=\"M195.7 187.5 L195.2 183.5 L193.9 179.7 L191.8 176.3 L188.9 173.5 L185.5 171.3 L181.7 170.0 L177.7 169.6 L173.7 170.0 L169.9 171.3 L166.5 173.5 L163.7 176.3 L161.6 179.7 L160.2 183.5 L159.8 187.5 L160.2 191.5 L161.6 195.3 L163.7 198.7 L166.5 201.6 L169.9 203.7 L173.7 205.0 L177.7 205.5 L181.7 205.0 L185.5 203.7 L188.9 201.6 L191.8 198.7 L193.9 195.3 L195.2 191.5 L195.7 187.5 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"177.7\" y=\"192.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">o<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M161.4 95.0 L194.0 95.0 L194.0 62.4 L161.4 62.4 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"177.7\" y=\"83.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M177.7 97.2 L177.7 168.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a4cb58ink)\"/>\n  <text x=\"248.4\" y=\"34.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M194.6 78.7 L302.3 78.7\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a4cb58ink)\"/>\n  <path d=\"M248.4 38.5 L270.2 73.8\" stroke=\"var(--ink-soft)\" stroke-width=\"0.85\" fill=\"none\" marker-end=\"url(#a4cb58soft)\"/>\n  <path d=\"M337.1 187.5 L336.7 183.5 L335.3 179.7 L333.2 176.3 L330.4 173.5 L327.0 171.3 L323.2 170.0 L319.2 169.6 L315.2 170.0 L311.4 171.3 L308.0 173.5 L305.1 176.3 L303.0 179.7 L301.7 183.5 L301.2 187.5 L301.7 191.5 L303.0 195.3 L305.1 198.7 L308.0 201.6 L311.4 203.7 L315.2 205.0 L319.2 205.5 L323.2 205.0 L327.0 203.7 L330.4 201.6 L333.2 198.7 L335.3 195.3 L336.7 191.5 L337.1 187.5 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"319.2\" y=\"192.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">o<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M302.8 95.0 L335.5 95.0 L335.5 62.4 L302.8 62.4 Z\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"var(--surface)\"/>\n  <text x=\"319.2\" y=\"83.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">h<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M319.2 97.2 L319.2 168.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a4cb58ink)\"/>\n  <text x=\"360.5\" y=\"187.5\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predict</text>\n</svg><p class=\"cap\">orange: observed frames; teal: the predicted frame</p></div><ul><li>A recurrent network: $h_t = f(h_{t-1}, a_{t-1})$, each $h_t$ decoded to a frame.</li><li>Remembers well, but predicts <b>one</b> future: it cannot say <i>the door might open or not</i>.</li></ul>", "n": ""}, {"t": "A latent dynamics model", "sub": "2 of 4: stochastic only", "min": 1.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 418 196\" width=\"418\" role=\"img\" aria-label=\"Three time steps. A chain of random states s1, s2, s3, each depending only on the previous state and action, each generating its observation. Dashed arrows from o1 and o2 infer the states they saw.\">\n  <defs><marker id=\"a145dcaccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"a145dcink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker><marker id=\"a145dcsoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M54.2 165.8 L53.8 161.8 L52.5 158.0 L50.3 154.6 L47.5 151.7 L44.1 149.6 L40.3 148.3 L36.3 147.8 L32.3 148.3 L28.5 149.6 L25.1 151.7 L22.3 154.6 L20.1 158.0 L18.8 161.8 L18.3 165.8 L18.8 169.8 L20.1 173.5 L22.3 177.0 L25.1 179.8 L28.5 181.9 L32.3 183.3 L36.3 183.7 L40.3 183.3 L44.1 181.9 L47.5 179.8 L50.3 177.0 L52.5 173.5 L53.8 169 =\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M300.9 153.4 L300.9 200.0\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a25ea5ink)\"/>\n  <path d=\"M300.9 90.4 L300.9 118.1\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a25ea5ink)\"/>\n  <text x=\"339.8\" y=\"217.9\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predict</text>\n</svg><p class=\"cap\">orange: observed frames and what is inferred from them; teal: predicted</p></div><div class=\"eq\">\\[h_t = f(h_{t-1},\\ s_{t-1},\\ a_{t-1}), \\qquad s_t \\sim p(s_t \\mid h_t), \\qquad o_t \\sim p(o_t \\mid h_t, s_t), \\quad r_t \\sim p(r_t \\mid h_t, s_t)\\]</div><p>The <b>recurrent state-space model</b>: $h_t$ (a GRU, $200$ units) carries memory; $s_t$ ($30$-D diagonal Gaussian) carries uncertainty.</p>", "n": ""}, {"t": "Bayes' rule: prior to posterior", "sub": "illustrative numbers", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 620 157\" width=\"620\" role=\"img\" aria-label=\"Bar charts of discrete probability distributions: prior p(x): 0 0.20, 1 0.50, 2 0.30; p(reading | x): 0 0.10, 1 0.30, 2 0.80; posterior p(x | reading): 0 0.05, 1 0.37, 2 0.59.\">\n  <path d=\"M31.0 125.8 L153.9 125.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M37.2 125.8 L65.9 125.8 L65.9 111.4 L37.2 111.4 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"51.5\" y=\"97.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.200</text>\n  <text x=\"51.5\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M78.1 125.8 L106.8 125.8 L106.8 89.9 L78.1 89.9 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"92.5\" y=\"75.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.500</text>\n  <text x=\"92.5\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M119.1 125.8 L147.8 125.8 L147.8 104.3 L119.1 104.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"133.4\" y=\"89.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.300</text>\n  <text x=\"133.4\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"92.5\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">prior p(x)</text>\n  <path d=\"M215.4 125.8 L338.2 125.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M221.5 125.8 L250.2 125.8 L250.2 118.6 L221.5 118.6 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"235.8\" y=\"104.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.100</text>\n  <text x=\"235.8\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M262.5 125.8 L291.1 125.8 L291.1 104.3 L262.5 104.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"276.8\" y=\"89.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.300</text>\n  <text x=\"276.8\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M303.4 125.8 L332.1 125.8 L332.1 68.4 L303.4 68.4 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"317.8\" y=\"54.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.800</text>\n  <text x=\"317.8\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"276.8\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">p(reading | x)</text>\n  <path d=\"M399.7 125.8 L522.6 125.8\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M405.8 125.8 L434.5 125.8 L434.5 122.3 L405.8 122.3 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"420.2\" y=\"107.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.049</text>\n  <text x=\"420.2\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M446.8 125.8 L475.5 125.8 L475.5 99.5 L446.8 99.5 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"461.1\" y=\"85.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.366</text>\n  <text x=\"461.1\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M487.7 125.8 L516.4 125.8 L516.4 83.8 L487.7 83.8 Z\" stroke=\"var(--ink-soft)\" stroke-width=\"0.66\" fill=\"var(--rule-strong)\"/>\n  <text x=\"502.1\" y=\"69.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.585</text>\n  <text x=\"502.1\" y=\"142.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"461.1\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">posterior p(x | reading)</text>\n</svg></div><div class=\"eq\">\\[p(x \\mid o) = \\frac{p(o \\mid x)\\,p(x)}{p(o)}, \\qquad p(o) = \\sum_x p(o \\mid x)\\,p(x)\\]</div><div class=\"hand\" data-h=\"10\"><p class=\"cue\">Before looking, the block is at $0, 1, 2$ with $0.2, 0.5, 0.3$. A sensor says “near 2”, which it does with probability $0.1, 0.3, 0.8$ from each position. Where is the block now?</p><div class=\"worked\"><p>Products $0.02, 0.15, 0.24$, sum $0.41$; divide: $0.049, 0.366, 0.585$.</p></div><div class=\"panel\" style=\"height:10mm\"></div></div>", "n": ""}, {"t": "Learn it again, differently", "sub": "other explanations", "min": 1, "sz": "", "html": "<ul><li>Lilian Weng, <a href=\"https://lilianweng.github.io/posts/2018-08-12-vae/\" target=\"_blank\" rel=\"noopener\">From Autoencoder to Beta-VAE</a>: the VAE and the ELBO step by step.</li><li>Ha and Schmidhuber, <a href=\"https://worldmodels.github.io/\" target=\"_blank\" rel=\"noopener\">World Models</a> (2018): a car racer trained inside its own dream.</li><li>Hou et al., <a href=\"https://arxiv.org/abs/2605.00080\" target=\"_blank\" rel=\"noopener\">World Model for Robot Learning: A Comprehensive Survey</a> (2026), with a <a href=\"https://ntumars.github.io/wm-robot-survey/\" target=\"_blank\" rel=\"noopener\">project page</a>.</li></ul>", "n": ""}, {"t": "What you should be able to do", "sub": "", "min": 1.5, "sz": "", "html": "<ul><li>Compute an expectation, a Gaussian density, a log-likelihood, an entropy and a KL; say why MSE is a Gaussian likelihood.</li><li>Explain why a one-step model drifts when rolled out; run two rounds of CEM by hand.</li><li>Run a VAE forward by hand: encode, reparameterise, decode, ELBO. Derive the ELBO.</li><li>Step an RNN and a GRU by hand; draw the RSSM's two paths and say what each carries.</li><li>Apply Bayes' rule to a prior and a sensor reading.</li></ul>", "n": ""}, {"t": "Next", "sub": "L17 Wed Nov 4", "min": 1, "sz": "", "html": "<ul><li><b>L17, Wed Nov 4:</b> we finish today's material (the RSSM's loss, PlaNet, reinforcement learning, Dreamer and DreamerV3, I-JEPA), then <b>4D and occupancy forecasting</b>. Response paper: Occupancy Networks.</li><li><b>Responses due Sun Nov 8:</b> <a href=\"https://arxiv.org/abs/2301.04104\" target=\"_blank\" rel=\"noopener\">DreamerV3</a> and Occupancy Networks.</li><li>Also assigned for Unit 3: <a href=\"https://arxiv.org/abs/1811.04551\" target=\"_blank\" rel=\"noopener\">PlaNet</a>, <a href=\"https://arxiv.org/abs/2301.08243\" target=\"_blank\" rel=\"noopener\">I-JEPA</a>, <a href=\"https://arxiv.org/abs/2404.08471\" target=\"_blank\" rel=\"noopener\">V-JEPA</a>, <a href=\"https://arxiv.org/abs/2506.09985\" target=\"_blank\" rel=\"noopener\">V-JEPA 2</a>, and the <a href=\"https://arxiv.org/abs/2605.00080\" target=\"_blank\" rel=\"noopener\">survey</a>.</li><li><b>Seminars, student-led:</b> Mon Nov 9 (Unit 2) and Wed Nov 11 (Unit 3). I am at CoRL that week.</li></ul>", "n": ""}]}];
</script>

<script>
(function(){
  "use strict";
  var flat=[];
  DECK.forEach(function(L){ L.slides.forEach(function(s,i){
    flat.push({lec:L,s:s,i:i,n:L.slides.length});
  });});

  var cur=0, notesOn=false, gridOn=false, mode="a";
  var slideEl=document.getElementById("slide"), countEl=document.getElementById("count"),
      notesEl=document.getElementById("notes"), notesBody=document.getElementById("notesbody"),
      gridEl=document.getElementById("grid"), progEl=document.getElementById("prog"),
      pickEl=null;

  try{ var sm=localStorage.getItem("rob3dp-mode"); if(sm==="a"||sm==="w") mode=sm; }catch(e){}

  function setMode(m){
    mode=m; document.body.setAttribute("data-mode",m);
    try{ localStorage.setItem("rob3dp-mode",m); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
      b.setAttribute("aria-current", b.getAttribute("data-m")===m ? "true":"false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
    b.addEventListener("click",function(){ setMode(b.getAttribute("data-m")); });
  });

  function typeset(el){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([el]).catch(function(){});
    }
  }

  function render(){
    var f=flat[cur];
    slideEl.innerHTML =
      '<p class="s-meta">'+f.lec.num+' &middot; '+f.lec.title+' &middot; '+f.lec.date+
        (f.s.min?(' &middot; '+f.s.min+' min'):'')+'</p>'+
      '<h2>'+f.s.t+'</h2>'+
      (f.s.sub?'<p class="sub">'+f.s.sub+'</p>':'')+
      '<div class="rulel"></div>'+
      '<div class="body'+(f.s.sz?' sm':'')+'">'+f.s.html+'</div>';
    countEl.textContent=(f.i+1)+" / "+f.n;
    if(notesBody) notesBody.textContent=f.s.n||"—";
    progEl.style.width=((cur+1)/flat.length*100)+"%";
    if(gridOn) buildGrid();
    try{ history.replaceState(null,"","#"+f.lec.id+"-s"+(f.i+1)); }catch(e){}
    document.getElementById("stage").scrollTop=0;
    typeset(slideEl);
  }
  function go(i){ if(i<0||i>=flat.length) return; cur=i; render(); }

  function buildGrid(){
    gridEl.innerHTML="";
    flat.forEach(function(f,k){
      var b=document.createElement("button");
      b.className="thumb"; b.type="button";
      b.setAttribute("aria-current",k===cur?"true":"false");
      b.innerHTML='<span class="tn">'+f.lec.num+' &middot; '+(f.i+1)+
        (f.s.min?(' &middot; '+f.s.min+"'"):'')+'</span><span class="tt">'+f.s.t+'</span>';
      b.addEventListener("click",function(){
        gridOn=false; gridEl.classList.remove("on"); go(k);
      });
      gridEl.appendChild(b);
    });
  }

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); go(cur+1); }
    else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(k==="Home"){ e.preventDefault(); go(0); }
    else if(k==="End"){ e.preventDefault(); go(flat.length-1); }
    else if(k==="a"||k==="A"){ setMode("a"); }
    else if(k==="w"||k==="W"){ setMode("w"); }
    else if((k==="s"||k==="S")&&notesEl){ notesOn=!notesOn; notesEl.classList.toggle("on",notesOn); }
    else if(k==="o"||k==="O"){ gridOn=!gridOn; gridEl.classList.toggle("on",gridOn); if(gridOn) buildGrid(); }
    else if(k==="p"||k==="P"){ document.body.classList.toggle("present"); }
    else if(k==="f"||k==="F"){
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
      else { (document.exitFullscreen||function(){}).call(document); }
    }
    else if(k==="Escape"){ gridOn=false; gridEl.classList.remove("on");
      document.body.classList.remove("present"); }
  });

  var x0=null;
  document.addEventListener("touchstart",function(e){ x0=e.changedTouches[0].clientX; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) go(cur+(dx<0?1:-1));
    x0=null;
  },{passive:true});

  var h=(location.hash||"").replace("#","");
  var m=/^(l\d\d)(?:-s(\d+))?$/.exec(h);
  if(m){
    var idx=flat.findIndex(function(f){
      return f.lec.id===m[1] && (!m[2]||f.i+1===parseInt(m[2],10)); });
    if(idx>=0) cur=idx;
  }
  setMode(mode);
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(render);
  } else { render(); }
})();
</script>
