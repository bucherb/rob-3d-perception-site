<script>
const DECK = [{"id": "l18", "num": "L18", "title": "Uncertainty, failure, and evaluation", "date": "Mon Nov 16, 2026", "slides": [{"t": "Uncertainty, failure, and evaluation", "sub": "L18 · Unit 3", "min": 1, "sz": "", "html": "<p class=\"big\">Every model in this course will be wrong some of the time. A robot that knows when it is wrong can slow down, look again or ask for help.</p><p>Today: the probability needed to say <b>how wrong a model might be</b>, the methods that say it, and how to judge a world model by <b>what a robot does with it</b>.</p>", "n": ""}, {"t": "Today", "sub": "", "min": 1.5, "sz": "", "html": "<ol><li><b>Probability from zero:</b> frequency, Bayes' rule, belief, expectation, variance, the Gaussian, likelihood.</li><li><b>Ensembles:</b> aleatoric and epistemic uncertainty, entropy and mutual information, PETS.</li><li><b>Calibration:</b> expected calibration error (ECE) by hand, temperature scaling.</li><li><b>Conformal prediction:</b> quantiles, exchangeability, a threshold by hand; KnowNo.</li><li><b>A world that moves:</b> Markov chains and a memory that decays.</li><li><b>Evaluation:</b> PSNR, SSIM, FVD, WorldModelBench, regret, WorldEval.</li></ol>", "n": ""}, {"t": "Three ways to be wrong", "sub": "", "min": 2, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 827 228\" width=\"827\" role=\"img\" aria-label=\"Three panels. Left, aleatoric: orange depth readings scattered above and below a glossy table edge. Middle, epistemic or out of distribution: a cluster of orange training points and one open query point far from them. Right, stale memory: a dashed teal outline of a mug the map recorded at 9:00 on a table that is empty at 15:00.\">\n  <path d=\"M62.8 190.5 L286.5 190.5 L286.5 37.4 L62.8 37.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\"/>\n  <text x=\"174.6\" y=\"16.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the input is noisy</text>\n  <text x=\"174.6\" y=\"211.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">aleatoric</text>\n  <path d=\"M327.7 190.5 L551.5 190.5 L551.5 37.4 L327.7 37.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\"/>\n  <text x=\"439.6\" y=\"16.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the input is new</text>\n  <text x=\"439.6\" y=\"211.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">epistemic, OOD</text>\n  <path d=\"M592.7 190.5 L816.4 190.5 L816.4 37.4 L592.7 37.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\"/>\n  <text x=\"704.6\" y=\"16.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the world moved</text>\n  <text x=\"704.6\" y=\"211.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">stale memory</text>\n  <path d=\"M86.3 143.4 L263.0 143.4\" stroke=\"var(--ink)\" stroke-width=\"1.52\" fill=\"none\"/>\n  <circle cx=\"92.2\" cy=\"98.7\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"108.1\" cy=\"124.6\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"124.0\" cy=\"94.0\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"139.9\" cy=\"131.1\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"155.8\" cy=\"106.9\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"171.7\" cy=\"117.5\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"187.6\" cy=\"101.0\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"203.5\" cy=\"128.1\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"219.4\" cy=\"111.6\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"235.3\" cy=\"96.3\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"251.2\" cy=\"122.2\" r=\"3.5\" fill=\"var(--accent-2)\"/>\n  <text x=\"174.6\" y=\"69.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">depth on a glossy table</text>\n  <circle cx=\"363.0\" cy=\"155.2\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"374.8\" cy=\"137.5\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"386.6\" cy=\"149.3\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"398.4\" cy=\"131.6\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"380.7\" cy=\"119.9\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"368.9\" cy=\"167.0\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"404.3\" cy=\"155.2\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"392.5\" cy=\"114.0\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"410.2\" cy=\"137.5\" r=\"4.0\" fill=\"var(--accent-2)\"/>\n  <path d=\"M517.9 78.7 L517.7 77.0 L517.1 75.3 L516.2 73.9 L515.0 72.7 L513.6 71.8 L511.9 71.2 L510.2 71.0 L508.5 71.2 L506.9 71.8 L505.5 72.7 L504.3 73.9 L503.4 75.3 L502.8 77.0 L502.6 78.7 L502.8 80.4 L503.4 82.0 L504.3 83.4 L505.5 84.6 L506.9 85.6 L508.5 86.1 L510.2 86.3 L511.9 86.1 L513.6 85.6 L515.0 84.6 L516.2 83.4 L517.1 82.0 L517.7 80.4 L517.9 78.7 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"510.2\" y=\"51.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">?</text>\n  <text x=\"392.5\" y=\"75.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">training</text>\n  <path d=\"M622.1 155.2 L787.0 155.2 L787.0 137.5 L622.1 137.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"var(--ground)\"/>\n  <path d=\"M719.9 119.9 L719.5 116.5 L718.3 113.2 L716.5 110.3 L714.1 107.9 L711.2 106.1 L708.0 104.9 L704.6 104.6 L701.1 104.9 L697.9 106.1 L695.0 107.9 L692.6 110.3 L690.8 113.2 L689.6 116.5 L689.2 119.9 L689.6 123.3 L690.8 126.5 L692.6 129.4 L695.0 131.8 L697.9 133.7 L701.1 134.8 L704.6 135.2 L708.0 134.8 L711.2 133.7 L714.1 131.8 L716.5 129.4 L718.3 126.5 L719.5 123.3 L719.9 119.9 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"704.6\" y=\"83.4\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">map: mug, 9:00</text>\n  <text x=\"704.6\" y=\"180.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">now: 15:00</text>\n</svg><p class=\"cap\">orange: observed data; teal: what the robot's map recorded</p></div><ul><li><b>Noisy input:</b> more data of the same kind will not help. The sensor is the limit.</li><li><b>New input:</b> the model has not seen anything like it. More data would help.</li><li><b>The world moved:</b> the model was right when it looked, and its memory is now out of date.</li></ul>", "n": ""}, {"t": "Probability: where it leads", "sub": "where this section is going", "min": 1, "sz": "", "html": "<p class=\"big\">A depth network should output two numbers per pixel: a depth, and how far off that depth might be. Training the second number needs one idea, likelihood.</p><ul><li><b>Where it ends:</b> maximum likelihood, which becomes the loss for a network that reports its own error bar.</li><li><b>What it needs first:</b> frequency, conditional probability and Bayes' rule, expectation and variance, the Gaussian.</li><li><b>Why a robot cares:</b> a depth of 2.0 m give or take 1 cm and one give or take 1 m call for different actions.</li></ul>", "n": ""}, {"t": "Probability as frequency", "sub": "a coin, flipped; illustrative counts", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 254 150\" width=\"254\" role=\"img\" aria-label=\"Bar chart: 10 flips 0.70; 100 flips 0.46; 1000 flips 0.50.\">\n  <path d=\"M47.7 116.3 L194.6 116.3\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M55.9 116.3 L88.5 116.3 L88.5 32.5 L55.9 32.5 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"72.2\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.70</text>\n  <text x=\"72.2\" y=\"134.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10 flips</text>\n  <path d=\"M104.8 116.3 L137.5 116.3 L137.5 61.2 L104.8 61.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"121.2\" y=\"44.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.46</text>\n  <text x=\"121.2\" y=\"134.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">100 flips</text>\n  <path d=\"M153.8 116.3 L186.4 116.3 L186.4 56.1 L153.8 56.1 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.95\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"170.1\" y=\"39.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.50</text>\n  <text x=\"170.1\" y=\"134.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1000 flips</text>\n</svg><p class=\"cap\">orange: observed fraction of heads</p></div><p>Heads: $7$ of $10$, $46$ of $100$, $503$ of $1000$. The fraction settles near $0.5$ as the flips pile up.</p><div class=\"eq\">\\[P(\\text{heads}) = \\lim_{n \\to \\infty} \\frac{\\#\\,\\text{heads}}{n}\\]</div>", "n": ""}, {"t": "Conditional probability", "sub": "a diagnostic test on 10,000 people; illustrative", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th></th><th>test +</th><th>test $-$</th><th>total</th></tr></thead><tbody><tr><td>has it</td><td>90</td><td>10</td><td>100</td></tr><tr><td>does not</td><td>495</td><td>9405</td><td>9900</td></tr><tr><td>total</td><td>585</td><td>9415</td><td>10000</td></tr></tbody></table><div class=\"hand\" data-h=\"16\"><p class=\"cue\">$P(+ \\mid \\text{has it})$? $P(\\text{has it} \\mid +)$?</p><div class=\"worked\"><p>$P(+ \\mid \\text{has it}) = 90/100 = 0.90$: restrict to the row.</p><p>$P(\\text{has it} \\mid +) = 90/585 = 0.154$: restrict to the column.</p></div><div class=\"panel\" style=\"height:16mm\"></div></div><div class=\"eq\">\\[P(A \\mid B) = \\frac{P(A \\text{ and } B)}{P(B)}\\]</div>", "n": ""}, {"t": "Bayes' rule", "sub": "the same test, without the table", "min": 4, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.460 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 387 178\" width=\"387\" role=\"img\" aria-label=\"A tree of 10000 people: 100 have the condition and 9900 do not. Of those who have it, 90 test positive and 10 negative; of those who do not, 495 test positive and 9405 negative. The positive results are shaded orange.\">\n  <defs><marker id=\"a389eesoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M29.8 99.5 L100.2 99.5 L100.2 71.4 L29.8 71.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"65.0\" y=\"88.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10000 people</text>\n  <path d=\"M142.5 64.3 L219.9 64.3 L219.9 36.2 L142.5 36.2 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"181.2\" y=\"53.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">100 have it</text>\n  <path d=\"M142.5 134.7 L219.9 134.7 L219.9 106.6 L142.5 106.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"181.2\" y=\"123.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">9900 do not</text>\n  <path d=\"M100.2 81.9 L142.5 50.2\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a389eesoft)\"/>\n  <path d=\"M100.2 89.0 L142.5 120.6\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a389eesoft)\"/>\n  <path d=\"M269.2 34.4 L374.8 34.4 L374.8 9.8 L269.2 9.8 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"322.0\" y=\"25.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">90, test +</text>\n  <path d=\"M219.9 50.2 L269.2 22.1\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a389eesoft)\"/>\n  <path d=\"M269.2 83.7 L374.8 83.7 L374.8 59.0 L269.2 59.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"322.0\" y=\"74.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10, test -</text>\n  <path d=\"M219.9 50.2 L269.2 71.4\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a389eesoft)\"/>\n  <path d=\"M269.2 118.9 L374.8 118.9 L374.8 94.2 L269.2 94.2 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"322.0\" y=\"109.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">495, test +</text>\n  <path d=\"M219.9 120.6 L269.2 106.6\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a389eesoft)\"/>\n  <path d=\"M269.2 168.2 L374.8 168.2 L374.8 143.5 L269.2 143.5 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"322.0\" y=\"159.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">9405, test -</text>\n  <path d=\"M219.9 120.6 L269.2 155.8\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a389eesoft)\"/>\n</svg><p class=\"cap\">orange: the positive test results</p></div></div><div style=\"flex:0.510 1 0\"><div class=\"hand\" data-h=\"26\"><p class=\"cue\">$1\\%$ have it. The test finds $90\\%$ of them and falsely flags $5\\%$ of the rest. $P(\\text{has it} \\mid +)$?</p><div class=\"worked\"><div class=\"eq\">\\[\\frac{0.90 \\times 0.01}{0.90 \\times 0.01 + 0.05 \\times 0.99}\\]</div><div class=\"eq\">\\[= \\frac{0.0090}{0.0585} = 0.154\\]</div></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div><div class=\"eq\">\\[P(A \\mid B) = \\frac{P(B \\mid A)\\,P(A)}{P(B)}\\]</div><div class=\"eq\">\\[P(B) = P(B \\mid A)P(A) + P(B \\mid \\text{not } A)P(\\text{not } A)\\]</div>", "n": ""}, {"t": "Probability as belief", "sub": "is the mug still on the table? illustrative", "min": 3, "sz": "", "html": "<p>One mug, one table, one afternoon: there is nothing to repeat. A probability here is the robot's <b>degree of belief</b>.</p><div class=\"cols\"><div style=\"flex:0.400 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 184 156\" width=\"184\" role=\"img\" aria-label=\"Bar chart: before 0.50; one 0.95; two 1.00.\">\n  <path d=\"M32.5 125.3 L162.1 125.3\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M39.7 125.3 L68.5 125.3 L68.5 77.3 L39.7 77.3 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"54.1\" y=\"62.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.50</text>\n  <text x=\"54.1\" y=\"141.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">before</text>\n  <path d=\"M82.9 125.3 L111.7 125.3 L111.7 34.4 L82.9 34.4 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"97.3\" y=\"19.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.95</text>\n  <text x=\"97.3\" y=\"141.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">one</text>\n  <path d=\"M126.1 125.3 L154.9 125.3 L154.9 29.6 L126.1 29.6 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"140.5\" y=\"14.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1.00</text>\n  <text x=\"140.5\" y=\"141.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">two</text>\n</svg><p class=\"cap\">teal: the robot's belief that the mug is there, before and after detections</p></div></div><div style=\"flex:0.570 1 0\"><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Belief $0.5$. The detector fires: $P(\\text{fire} \\mid \\text{there}) = 0.90$, $P(\\text{fire} \\mid \\text{gone}) = 0.05$. New belief?</p><div class=\"worked\"><div class=\"eq\">\\[\\frac{0.90 \\times 0.5}{0.90 \\times 0.5 + 0.05 \\times 0.5} = 0.947\\]</div><p>A second detection, from $0.947$: $0.997$.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div>", "n": ""}, {"t": "Random variables", "sub": "a depth reading; illustrative", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 195 149\" width=\"195\" role=\"img\" aria-label=\"Bar chart: 1.9 m 0.25; 2.0 m 0.50; 2.1 m 0.25.\">\n  <path d=\"M28.5 116.4 L166.7 116.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M36.2 116.4 L66.9 116.4 L66.9 73.7 L36.2 73.7 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"51.5\" y=\"57.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.25</text>\n  <text x=\"51.5\" y=\"133.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1.9 m</text>\n  <path d=\"M82.2 116.4 L113.0 116.4 L113.0 31.0 L82.2 31.0 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"97.6\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.50</text>\n  <text x=\"97.6\" y=\"133.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2.0 m</text>\n  <path d=\"M128.3 116.4 L159.0 116.4 L159.0 73.7 L128.3 73.7 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"143.7\" y=\"57.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.25</text>\n  <text x=\"143.7\" y=\"133.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2.1 m</text>\n</svg><p class=\"cap\">teal: the distribution $P(D = d)$</p></div><ul><li>A <b>random variable</b> is a number decided by chance: here the depth $D$ a sensor returns for one pixel.</li><li>Its <b>distribution</b> lists each value with its probability. The probabilities sum to $1$.</li></ul><p>$P(D = 1.9) = 0.25$, $P(D = 2.0) = 0.50$, $P(D = 2.1) = 0.25$.</p>", "n": ""}, {"t": "Expectation", "sub": "the probability-weighted average; illustrative", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathbb{E}[X] = \\sum_x x\\,P(X = x)\\]</div><div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 180 137\" width=\"180\" role=\"img\" aria-label=\"Bar chart: 1 0.50; 2 0.40; 10 0.10.\">\n  <path d=\"M22.5 105.3 L157.3 105.3\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M30.0 105.3 L59.9 105.3 L59.9 30.5 L30.0 30.5 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"44.9\" y=\"15.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.50</text>\n  <text x=\"44.9\" y=\"122.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M74.9 105.3 L104.8 105.3 L104.8 45.4 L74.9 45.4 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"89.9\" y=\"30.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.40</text>\n  <text x=\"89.9\" y=\"122.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <path d=\"M119.8 105.3 L149.8 105.3 L149.8 90.4 L119.8 90.4 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"134.8\" y=\"74.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.10</text>\n  <text x=\"134.8\" y=\"122.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n</svg><p class=\"cap\">teal: distribution of a plan's cost $C$</p></div></div><div style=\"flex:0.550 1 0\"><div class=\"hand\" data-h=\"26\"><p class=\"cue\">$\\mathbb{E}[D]$ for the depth reading. $\\mathbb{E}[C]$ for a cost of $1$, $2$ or $10$ with probability $0.5$, $0.4$, $0.1$.</p><div class=\"worked\"><p>$\\mathbb{E}[D] = 0.25(1.9) + 0.5(2.0) + 0.25(2.1) = 2.0$ m.</p><p>$\\mathbb{E}[C] = 0.5 + 0.8 + 1.0 = 2.3$. The rare cost of $10$ pulls it up.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div>", "n": ""}, {"t": "Variance and standard deviation", "sub": "how far from the mean, on average; same two variables", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{Var}[X] = \\mathbb{E}\\bigl[(X - \\mathbb{E}[X])^2\\bigr], \\qquad \\sigma = \\sqrt{\\mathrm{Var}[X]}\\]</div><div class=\"hand\" data-h=\"22\"><p class=\"cue\">$\\mathrm{Var}[D]$ and $\\mathrm{Var}[C]$, then $\\sigma$.</p><div class=\"worked\"><p>$\\mathrm{Var}[D] = 0.25(0.1)^2 + 0.5(0)^2 + 0.25(0.1)^2 = 0.005$ m$^2$, $\\sigma = 0.071$ m.</p><p>$\\mathrm{Var}[C] = 0.845 + 0.036 + 5.929 = 6.81$, $\\sigma = 2.61$.</p></div><div class=\"panel\" style=\"height:22mm\"></div></div><p>Square the distance from the mean, weight by probability, add. $\\sigma$ is back in the units of $X$.</p>", "n": ""}, {"t": "Mean and variance of a set of values", "sub": "each value weighted $1/M$; illustrative", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.450 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 374 107\" width=\"374\" role=\"img\" aria-label=\"Values on a number line, one row per set, each with its mean marked by a tick. A: 3, 4, 5, mean 4.00. B: 2, 4, 6, mean 4.00.\">\n  <path d=\"M32.2 35.0 L349.6 35.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M190.9 45.3 L190.9 24.7\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <text x=\"190.9\" y=\"13.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean 4.00</text>\n  <circle cx=\"138.0\" cy=\"35.0\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"190.9\" cy=\"35.0\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"243.8\" cy=\"35.0\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <text x=\"17.9\" y=\"35.0\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A</text>\n  <path d=\"M32.2 78.6 L349.6 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M190.9 88.9 L190.9 68.3\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <text x=\"190.9\" y=\"57.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean 4.00</text>\n  <circle cx=\"85.1\" cy=\"78.6\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"190.9\" cy=\"78.6\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"296.7\" cy=\"78.6\" r=\"3.4\" fill=\"var(--accent-2)\"/>\n  <text x=\"17.9\" y=\"78.6\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B</text>\n  <path d=\"M32.2 82.6 L32.2 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"32.2\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M85.1 82.6 L85.1 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"85.1\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <path d=\"M138.0 82.6 L138.0 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"138.0\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3</text>\n  <path d=\"M190.9 82.6 L190.9 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"190.9\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia, =\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-1σ</text>\n  <path d=\"M198.4 154.9 L198.4 149.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"198.4\" y=\"170.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">μ</text>\n  <path d=\"M252.8 154.9 L252.8 149.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"252.8\" y=\"170.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">+1σ</text>\n  <path d=\"M307.2 154.9 L307.2 149.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"307.2\" y=\"170.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">+2σ</text>\n</svg><p class=\"cap\">teal: the density; shaded: within $\\pm 1\\sigma$</p></div><div class=\"eq\">\\[p(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}} \\exp\\Bigl(-\\frac{(x - \\mu)^2}{2\\sigma^2}\\Bigr)\\]</div><p>Two numbers set it: mean $\\mu$ and standard deviation $\\sigma$. About $68\\%$ of draws land within $\\pm 1\\sigma$, $95\\%$ within $\\pm 2\\sigma$. At $x = 2.1$ m, $p = 2.42$ per metre.</p>", "n": ""}, {"t": "Likelihood and maximum likelihood", "sub": "three readings, $\\sigma = 0.1$ m known; illustrative", "min": 4, "sz": "", "html": "<p>The <b>likelihood</b> of $\\mu$ is how probable the observed data are if the true mean were $\\mu$. Take $-\\ln$ and drop constants:</p><div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 262 126\" width=\"262\" role=\"img\" aria-label=\"A bell-shaped Gaussian density (teal) centred on mu, with the region within one standard deviation shaded. Observed values (orange) on the axis at 1.9, 2, 2.2.\">\n  <path d=\"M8.0 99.5 L254.4 99.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M8.0 99.3 L11.1 99.2 L14.2 99.2 L17.2 99.0 L20.3 98.9 L23.4 98.7 L26.5 98.4 L29.6 98.1 L32.6 97.7 L35.7 97.2 L38.8 96.6 L41.9 95.9 L45.0 95.0 L48.0 93.9 L51.1 92.6 L54.2 91.2 L57.3 89.4 L60.4 87.4 L63.4 85.2 L66.5 82.6 L69.6 79.7 L72.7 76.5 L75.8 73.0 L78.8 69.2 L81.9 65.2 L85.0 60.8 L88.1 56.3 L91.2 51.6 L94.2 46.8 L97.3 41.9 L100.4 37.1 L103.5 32.4 L106.6 27.9 L109.6 23.7 L112.7 19.8 L115.8 16.4 L118.9 13.4 L122.0 11.1 L125.0 9.4 L128.1 8.3 L131.2 8.0 L134.3 8.3 L137.4 9.4 L140.4 11.1 L143.5 13.4 L146.6 16.4 L149.7 19.8 L152.8 23.7 L155.8 27.9 L158.9 32.4 L162.0 37.1 L165.1 41.9 L168.2 46.8 L171.2 51.6 L174.3 56.3 L177.4 60.8 L180.5 65.2 L183.6 69.2 L186.6 73.0 L189.7 76.5 L192.8 79.7 L195.9 82.6 L199.0 85.2 L202.0 87.4 L205.1 89.4 L208.2 91.2 L211.3 92.6 L214.4 93.9 L217.4 95.0 L220.5 95.9 L223.6 96.6 L226.7 97.2 L229.8 97.7 L232.8 98.1 L235.9 98.4 L239.0 98.7 L242.1 98.9 L245.2 99.0 L248.2 99.2 L251.3 99.2 L254.4 99.3\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M60.8 103.0 L60.8 99.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"60.8\" y=\"112.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-2σ</text>\n  <path d=\"M96.0 103.0 L96.0 99.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"96.0\" y=\"112.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">-1σ</text>\n  <path d=\"M131.2 103.0 L131.2 99.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"131.2\" y=\"112.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">μ</text>\n  <path d=\"M166.4 103.0 L166.4 99.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"166.4\" y=\"112.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">+1σ</text>\n  <path d=\"M201.6 103.0 L201.6 99.5\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"201.6\" y=\"112.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">+2σ</text>\n  <circle cx=\"96.0\" cy=\"99.5\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"131.2\" cy=\"99.5\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <circle cx=\"201.6\" cy=\"99.5\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n</svg><p class=\"cap\">teal: the model with $\\mu = 2.0$; orange: readings $1.9, 2.0, 2.2$</p></div></div><div style=\"flex:0.550 1 0\"><div class=\"hand\" data-h=\"32\"><p class=\"cue\">$\\sum_i (d_i - \\mu)^2 / 2\\sigma^2$ for $\\mu = 2.0$ and $\\mu = 2.1$. Which fits best?</p><div class=\"worked\"><p>$\\mu = 2.0$: $(0.01 + 0 + 0.04)/0.02 = 2.5$.</p><p>$\\mu = 2.1$: $(0.04 + 0.01 + 0.01)/0.02 = 3.0$.</p><p>Best: the mean of the readings, $\\hat{\\mu} = 2.033$, where the sum is $2.33$.</p></div><div class=\"panel\" style=\"height:32mm\"></div></div></div></div>", "n": ""}, {"t": "Ensembles: where they lead", "sub": "where this section is going", "min": 1, "sz": "", "html": "<p class=\"big\">A model can be unsure for two reasons: the data is noisy, or there was no data like this input. One network can learn the first. Seeing the second takes several networks and checking where they disagree.</p><ul><li><b>Where it ends:</b> PETS, a planner that avoids actions where its dynamics models disagree.</li><li><b>What it needs first:</b> the two kinds of uncertainty, a network that predicts its own noise, an ensemble's mean and variance, entropy and mutual information.</li><li><b>Why a robot cares:</b> noisy data means slow down; missing data means go and look, or ask.</li></ul>", "n": ""}, {"t": "Aleatoric and epistemic uncertainty", .6 L242.1 118.0 L250.0 120.0 L258.0 121.6 L265.9 122.6 L273.9 126.2 L281.8 130.1 L289.7 133.3 L297.7 135.7 L305.6 137.4 L313.5 138.3 L321.5 138.3 L329.4 137.5 L337.3 135.7 L345.3 132.8 L353.2 129.5 L361.2 125.7 L369.1 121.7 L377.0 117.6 L385.0 113.3 L392.9 109.1 L400.8 104.9 L408.8 101.0 L416.7 97.4 L424.6 94.2 L432.6 91.4 L440.5 89.2 L448.4 87.6 L456.4 86.6\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"none\"/>\n  <path d=\"M59.6 113.6 L67.5 109.4 L75.5 105.2 L83.4 101.3 L91.3 97.6 L99.3 94.3 L107.2 91.5 L115.1 89.2 L123.1 87.4 L131.0 86.3 L138.9 85.9 L146.9 86.1 L154.8 86.9 L162.8 88.4 L170.7 90.4 L178.6 93.1 L186.6 96.2 L194.5 99.7 L202.4 103.1 L210.4 105.4 L218.3 107.4 L226.2 109.0 L234.2 110.1 L242.1 110.9 L250.0 111.2 L258.0 110.8 L265.9 109.9 L273.9 114.4 L281.8 120.3 L289.7 125.3 L297.7 129.5 L305.6 132.7 L313.5 135.0 L321.5 136.3 L329.4 136.5 L337.3 135.4 L345.3 132.5 L353.2 129.1 L361.2 125.4 L369.1 121.4 L377.0 117.2 L385.0 112.9 L392.9 108.7 L400.8 104.6 L408.8 100.7 L416.7 97.0 L424.6 93.8 L432.6 91.1 L440.5 88.9 L448.4 87.2 L456.4 86.2\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"none\"/>\n  <text x=\"265.9\" y=\"48.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">models disagree: epistemic</text>\n  <text x=\"388.9\" y=\"163.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">noisy data: aleatoric</text>\n  <text x=\"138.9\" y=\"163.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">data, little noise</text>\n</svg><p class=\"cap\">teal: five fitted models; orange: training data</p></div><ul><li><b>Aleatoric</b> (Latin <i>alea</i>, dice): noise in the data. More data of the same kind does not remove it.</li><li><b>Epistemic</b> (Greek <i>episteme</i>, knowledge): too little data. Models that fit the same data <b>disagree</b> where there was none.</li></ul><p>A die roll is aleatoric: no amount of study predicts it. Directions in a city you have never visited are epistemic: a week there fixes them.</p>", "n": ""}, {"t": "A network that reports its own error bar", "sub": "depth with a predicted $\\hat{\\sigma}$; illustrative", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.470 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 369 181\" width=\"369\" role=\"img\" aria-label=\"Predicted depths along an image row, each with a one-sigma error bar (teal), and the true depth as an orange dot beside each. Bars are short on the left and long on the right, over glass. Most true depths fall inside their bars; two fall outside.\">\n  <path d=\"M40.6 150.7 L354.0 150.7\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M40.6 150.7 L40.6 28.9\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"193.0\" y=\"167.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">pixel along a row</text>\n  <text x=\"52.0\" y=\"25.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">depth</text>\n  <path d=\"M58.0 104.6 L58.0 92.4\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M53.7 104.6 L62.4 104.6\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M53.7 92.4 L62.4 92.4\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"58.0\" cy=\"98.5\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"63.7\" cy=\"101.0\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <path d=\"M82.0 98.9 L82.0 86.7\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M77.6 98.9 L86.3 98.9\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M77.6 86.7 L86.3 86.7\" stroke=  <path d=\"M201.7 88.8 L201.7 76.6\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M197.3 88.8 L206.0 88.8\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M197.3 76.6 L206.0 76.6\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"201.7\" cy=\"82.7\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"207.3\" cy=\"89.0\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <path d=\"M225.6 103.3 L225.6 68.5\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M221.2 103.3 L230.0 103.3\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M221.2 68.5 L230.0 68.5\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"225.6\" cy=\"85.9\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"231.3\" cy=\"85.6\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <path d=\"M249.5 108.0 L249.5 73.2\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M245.2 108.0 L253.9 108.0\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M245.2 73.2 L253.9 73.2\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"249.5\" cy=\"90.6\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"255.2\" cy=\"109.4\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <path d=\"M273.5 113.5 L273.5 78.7\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M269.1 113.5 L277.8 113.5\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M269.1 78.7 L277.8 78.7\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"273.5\" cy=\"96.1\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"279.1\" cy=\"100.1\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <path d=\"M297.4 119.2 L297.4 84.4\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M293.1 119.2 L301.8 119.2\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M293.1 84.4 L301.8 84.4\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"297.4\" cy=\"101.8\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"303.1\" cy=\"119.4\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <path d=\"M321.3 124.7 L321.3 89.8\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M317.0 124.7 L325.7 124.7\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M317.0 89.8 L325.7 89.8\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <circle cx=\"321.3\" cy=\"107.2\" r=\"2.0\" fill=\"var(--accent)\"/>\n  <circle cx=\"327.0\" cy=\"123.9\" r=\"2.2\" fill=\"var(--accent-2)\"/>\n  <text x=\"266.9\" y=\"52.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">glass: large hatσ</text>\n</svg><p class=\"cap\">teal: predicted depth $\\hat{\\mu}$ with bar $\\pm\\hat{\\sigma}$; orange: true depth</p></div></div><div style=\"flex:0.500 1 0\"><ul><li>A depth network normally outputs one number per pixel: the depth $\\hat{\\mu}$.</li><li>Give it a <b>second output</b>, $\\hat{\\sigma}$: how far off it expects that depth to be. *About $2.0$ m, give or take $0.1$ m.*</li><li>A weather forecast of $15^\\circ \\pm 2^\\circ$ does the same.</li><li>No label says what $\\hat{\\sigma}$ should be. It is learned from how wrong $\\hat{\\mu}$ turns out to be.</li></ul></div></div>", "n": ""}, {"t": "Training the error bar", "sub": "true depth $d = 2.00$ m; illustrative", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathcal{L} = \\underbrace{\\frac{(d - \\hat{\\mu})^2}{2\\hat{\\sigma}^2}}_{\\text{the miss, divided by the bar}} + \\underbrace{\\ln \\hat{\\sigma}}_{\\text{the cost of a wide bar}}\\]</div><p>This is the Gaussian likelihood loss from the maximum-likelihood slide, with $\\sigma$ now an output instead of a fixed number.</p><table class='cmp'><thead><tr><th>Depth guess $\\hat{\\mu}$</th><th>$\\mathcal{L}$ with $\\hat{\\sigma} = 0.1$</th><th>$\\mathcal{L}$ with $\\hat{\\sigma} = 0.3$</th><th>Lower loss</th></tr></thead><tbody><tr><td>$2.30$ m (miss $0.30$)</td><td>$2.20$</td><td>$-0.70$</td><td>wide bar</td></tr><tr><td>$2.03$ m (miss $0.03$)</td><td>$-2.26$</td><td>$-1.20$</td><td>narrow bar</td></tr></tbody></table><p>A big miss is cheaper with a wide bar; a small miss is cheaper with a narrow one. Over many pixels, $\\hat{\\sigma}$ settles at the <b>typical size of the miss</b> for inputs like that one.</p>", "n": ""}, {"t": "Three numbers, three meanings", "sub": "what each uncertainty estimate measures, for one pixel's depth", "min": 3, "sz": "", "html": "<table class='cmp'><thead><tr><th>Number</th><th>Comes from</th><th>Measures</th></tr></thead><tbody><tr><td>$\\hat{\\sigma}^2$, one network's error bar</td><td>a second output, trained on its misses</td><td><b>aleatoric</b>: noise like the noise it saw in training</td></tr><tr><td>spread of the depth guesses across several networks</td><td>an ensemble, or MC dropout (next)</td><td><b>epistemic</b>: what the training data did not pin down</td></tr><tr><td>the two added</td><td>one formula, four slides on</td><td><b>total</b> predicted uncertainty</td></tr></tbody></table><ul><li>The <b>actual error</b> $|d - \\hat{\\mu}|$ is what the total is trying to predict. At test time the robot never sees it.</li><li>Papers that call an ensemble's variance <i>epistemic</i> mean row 2: members that output only a depth. Give each member an error bar too, and one ensemble gives rows 1 and 2, then adds them.</li></ul>", "n": ""}, {"t": "Deep ensembles", "sub": "Lakshminarayanan et al., NeurIPS 2017", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 604 202\" width=\"604\" role=\"img\" aria-label=\"One input goes to three networks trained on the same data from different random starting weights. Each outputs its own prediction (teal), mu-hat 1 to 3. The three predictions are combined into a mean and a variance.\">\n  <defs><marker id=\"a84ebcsoft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M16.9 113.0 L111.4 113.0 L111.4 71.0 L16.9 71.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"64.2\" y=\"96.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">input x</text>\n  <path d=\"M174.4 50.0 L289.8 50.0 L289.8 8.0 L174.4 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"232.1\" y=\"33.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">network 1</text>\n  <path d=\"M111.4 92.0 L174.4 29.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <circle cx=\"342.3\" cy=\"29.0\" r=\"4.5\" fill=\"var(--accent)\"/>\n  <text x=\"358.6\" y=\"29.0\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hatμ<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M289.8 29.0 L334.4 29.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <path d=\"M384.3 29.0 L436.8 92.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <path d=\"M174.4 113.0 L289.8 113.0 L289.8 71.0 L174.4 71.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"232.1\" y=\"96.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">network 2</text>\n  <path d=\"M111.4 92.0 L174.4 92.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <circle cx=\"342.3\" cy=\"92.0\" r=\"4.5\" fill=\"var(--accent)\"/>\n  <text x=\"358.6\" y=\"92.0\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hatμ<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M289.8 92.0 L334.4 92.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <path d=\"M384.3 92.0 L436.8 92.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <path d=\"M174.4 175.9 L289.8 175.9 L289.8 134.0 L174.4 134.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"232.1\" y=\"159.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">network 3</text>\n  <path d=\"M111.4 92.0 L174.4 154.9\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <circle cx=\"342.3\" cy=\"154.9\" r=\"4.5\" fill=\"var(--accent)\"/>\n  <text x=\"358.6\" y=\"154.9\" text-anchor=\"start\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hatμ<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M289.8 154.9 L334.4 154.9\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <path d=\"M384.3 154.9 L436.8 92.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a84ebcsoft)\"/>\n  <path d=\"M436.8 113.0 L562.7 113.0 L562.7 71.0 L436.8 71.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"499.7\" y=\"96.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean, variance</text>\n  <text x=\"232.1\" y=\"187.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">same data, different random start</text>\n</svg><p class=\"cap\">teal: each network's prediction</p></div><ul><li>Train $M$ networks on the same data, each from a different random start. Report the <b>mean</b> of their predictions and the <b>variance</b> between them: row 2, epistemic.</li><li>Ask three locals for directions. If all point the same way, go. If each points a different way, none of them knows.</li></ul>", "n": ""}, {"t": "MC dropout", "sub": "Gal and Ghahramani, ICML 2016", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.400 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 332 152\" width=\"332\" role=\"img\" aria-label=\"A small fully connected network with two hidden units crossed out and their connections removed: one random thinned network. The output units are teal.\">\n  <path d=\"M18.9 37.9 L116.8 18.9\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 37.9 L116.8 95.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 37.9 L116.8 133.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 76.0 L116.8 18.9\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 76.0 L116.8 95.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 76.0 L116.8 133.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 114.1 L116.8 18.9\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 114.1 L116.8 95.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M18.9 114.1 L116.8 133.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M116.8 18.9 L214.7 18.9\" stroke=\"var(--rule-strong)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <path d=\"M116.8 1 f one training run. The variance is again row 2, epistemic.</li></ul></div></div>", "n": ""}, {"t": "An ensemble's mean and variance, by hand", "sub": "three members predict one pixel's depth; illustrative", "min": 4, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.450 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 376 107\" width=\"376\" role=\"img\" aria-label=\"Values on a number line, one row per set, each with its mean marked by a tick. wall: 2, 2.1, 1.9, mean 2.00. glass: 1.2, 2, 3.1, mean 2.10.\">\n  <path d=\"M50.3 35.0 L367.7 35.0\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M188.3 45.3 L188.3 24.7\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <text x=\"188.3\" y=\"13.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean 2.00</text>\n  <circle cx=\"188.3\" cy=\"35.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"202.1\" cy=\"35.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"174.5\" cy=\"35.0\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"36.0\" y=\"35.0\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">wall</text>\n  <path d=\"M50.3 78.6 L367.7 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M202.1 88.9 L202.1 68.3\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <text x=\"202.1\" y=\"57.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean 2.10</text>\n  <circle cx=\"77.9\" cy=\"78.6\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"188.3\" cy=\"78.6\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <circle cx=\"340.1\" cy=\"78.6\" r=\"3.4\" fill=\"var(--accent)\"/>\n  <text x=\"36.0\" y=\"78.6\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">glass</text>\n  <path d=\"M50.3 82.6 L50.3 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"50.3\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M188.3 82.6 L188.3 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"188.3\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <path d=\"M326.3 82.6 L326.3 78.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <text x=\"326.3\" y=\"93.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3</text>\n</svg><p class=\"cap\">teal: the three members' predictions, in metres</p></div></div><div style=\"flex:0.520 1 0\"><div class=\"hand\" data-h=\"34\"><p class=\"cue\">Wall: $2.00, 2.10, 1.90$ m. Glass: $1.20, 2.00, 3.10$ m. Mean and variance of each.</p><div class=\"worked\"><p>Wall: mean $2.00$ m; $\\mathrm{Var} = \\tfrac{1}{3}(0 + 0.01 + 0.01) = 0.0067$ m$^2$; $\\sigma = 0.08$ m.</p><p>Glass: mean $2.10$ m; $\\mathrm{Var} = \\tfrac{1}{3}(0.81 + 0.01 + 1.00) = 0.607$ m$^2$; $\\sigma = 0.78$ m.</p></div><div class=\"panel\" style=\"height:34mm\"></div></div></div></div><p>Same network design, same training data. On glass the members were never pinned down, and they spread.</p>", "n": ""}, {"t": "Splitting the variance in two", "sub": "each member now also has an error bar, $\\sigma_m^2 = 0.04$ m$^2$", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{Var}[d] \\;=\\; \\underbrace{\\tfrac{1}{M}\\textstyle\\sum_m \\sigma_m^2}_{\\text{aleatoric}} \\;+\\; \\underbrace{\\tfrac{1}{M}\\textstyle\\sum_m (\\mu_m - \\bar{\\mu})^2}_{\\text{epistemic}}\\]</div><div class=\"hand\" data-h=\"18\"><p class=\"cue\">Total variance for the wall and for the glass. Which term dominates?</p><div class=\"worked\"><p>Wall: $0.040 + 0.0067 = 0.0467$ m$^2$, mostly noise.</p><p>Glass: $0.040 + 0.607 = 0.647$ m$^2$, mostly disagreement.</p></div><div class=\"panel\" style=\"height:18mm\"></div></div><p>Rows 1 and 2 of the table, added. Each member was equally sure of itself in both places; only the second term flags the glass.</p>", "n": ""}, {"t": "Entropy, on a coin", "sub": "how unpredictable a distribution is, in bits", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 329 190\" width=\"329\" role=\"img\" aria-label=\"A plot of $H$ (bits) against $P(\\text{heads})$. Point (0.5, 1). Point (0.9, 0.468996). Point (0.99, 0.0807931).\">\n  <path d=\"M50.9 146.1 L312.7 146.1\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M50.9 146.1 L50.9 27.0\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"61.2\" y=\"23.9\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">H (bits)</text>\n  <text x=\"177.8\" y=\"176.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P(heads)</text>\n  <path d=\"M50.9 146.1 L53.4 137.1 L55.9 130.4 L58.5 124.5 L61.0 119.2 L63.6 114.3 L66.1 109.7 L68.6 105.4 L71.2 101.4 L73.7 97.6 L76.2 94.0 L78.8 90.5 L81.3 87.3 L83.9 84.2 L86.4 81.2 L88.9 78.3 L91.5 75.6 L94.0 73.0 L96.6 70.5 L99.1 68.2 L101.6 65.9 L104.2 63.7 L106.7 61.6 L109.3 59.6 L111.8 57.8 L114.3 56.0 L116.9 54.2 L119.4 52.6 L122.0 51.0 L124.5 49.6 L127.0 48.2 L129.6 46.9 L132.1 45.6 L134.7 44.4 L137.2 43.3 L139.7 42.3 L142.3 41.4 L144.8 40.5 L147.4 39.6 L149.9 38.9 L152.4 38.2 L155.0 37.6 L157.5 37.0 L160.1 36.6 L162.6 36.1 L165.1 35.8 L167.7 35.5 L170.2 35.3 L172.8 35.1 L175.3 35.0 L177.8 35.0 L180.4 35.0 L182.9 35.1 L185.4 35.3 L188.0 35.5 L190.5 35.8 L193.1 36.1 L195.6 36.6 L198.1 37.0 L200.7 37.6 L203.2 38.2 L205.8 38.9 L208.3 39.6 L210.8 40.5 L213.4 41.4 L215.9 42.3 L218.5 43.3 L221.0 44.4 L223.5 45.6 L226.1 46.9 L228.6 48.2 L231.2 49.6 L233.7 51.0 L236.2 52.6 L238.8 54.2 L241.3 56.0 L243.9 57.8 L246.4 59.6 L248.9 61.6 L251.5 63.7 L254.0 65.9 L256.6 68.2 L259.1 70.5 L261.6 73.0 L264.2 75.6 L266.7 78.3 L269.3 81.2 L271.8 84.2 L274.3 87.3 L276.9 90.5 L279.4 94.0 L282.0 97.6 L284.5 101.4 L287.0 105.4 L289.6 109.7 L292.1 114.3 L294.6 119.2 L297.2 124.5 L299.7 130.4 L302.3 137.1 L304.8 146.1\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <circle cx=\"177.8\" cy=\"35.0\" r=\"2.7\" fill=\"var(--accent)\"/>\n  <circle cx=\"279.4\" cy=\"94.0\" r=\"2.7\" fill=\"var(--accent)\"/>\n  <circle cx=\"302.3\" cy=\"137.1\" r=\"2.7\" fill=\"var(--accent)\"/>\n  <text x=\"50.9\" y=\"159.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"177.8\" y=\"159.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <text x=\"304.8\" y=\"159.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <text x=\"41.3\" y=\"146.1\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"41.3\" y=\"35.0\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n</svg><p class=\"cap\">teal: entropy of a coin</p></div></div><div style=\"flex:0.530 1 0\"><div class=\"eq\">\\[H[\\mathbf{p}] = -\\sum_k p_k \\log_2 p_k\\]</div><div class=\"hand\" data-h=\"24\"><p class=\"cue\">$H$ for a coin with $P(\\text{heads}) = 0.5$, $0.9$, $0.99$, $1$.</p><div class=\"worked\"><p>$0.5$: $-2(0.5)\\log_2 0.5 = 1$ bit.</p><p>$0.9$: $-(0.9\\log_2 0.9 + 0.1\\log_2 0.1) = 0.469$.</p><p>$0.99$: $0.081$. Certain coin: $0$.</p></div><div class=\"panel\" style=\"height:24mm\"></div></div></div></div>", "n": ""}, {"t": "Mutual information", "sub": "how much one variable tells you about another; two biased coins", "min": 3.5, "sz": "", "html": "<p>A bag holds a coin biased $0.9$ to heads and one biased $0.9$ to tails. Pick one at random ($M$), then flip it ($Y$).</p><div class=\"hand\" data-h=\"22\"><p class=\"cue\">$H(Y)$ before you know which coin. $H(Y \\mid M)$ once you know. The difference?</p><div class=\"worked\"><p>Overall heads is $0.5$, so $H(Y) = 1$ bit.</p><p>Either coin alone: $H = 0.469$, so $H(Y \\mid M) = 0.469$.</p><p>$I(Y; M) = 1 - 0.469 = 0.531$ bit learned by knowing the coin.</p></div><div class=\"panel\" style=\"height:22mm\"></div></div><div class=\"eq\">\\[I(Y; M) = H(Y) - H(Y \\mid M)\\]</div>", "n": ""}, {"t": "Disagreement by hand", "sub": "two classes, three members; illustrative", "min": 3.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 441 214\" width=\"441\" role=\"img\" aria-label=\"Two rows of small bar charts of predicted probabilities (teal), two classes each, the second class with a dashed outline. all unsure: members 0.50, 0.50; 0.50, 0.50; 0.50, 0.50; mean 0.50, 0.50. each sure, differently: members 0.90, 0.10; 0.10, 0.90; 0.50, 0.50; mean 0.50, 0.50.\">\n  <text x=\"139.1\" y=\"28.5\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">all unsure</text>\n  <path d=\"M153.4 64.3 L196.4 64.3\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M157.5 64.3 L172.9 64.3 L172.9 28.5 L157.5 28.5 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M177.0 64.3 L192.3 64.3 L192.3 28.5 L177.0 28.5 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft
