nd the real outcome (orange) is scored by task success.\">\n  <defs><marker id=\"a1b282accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"a1b282accent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker><marker id=\"a1b282soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M32.1 102.2 L161.7 102.2 L161.7 55.1 L32.1 55.1 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"96.9\" y=\"84.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">world model</text>\n  <path d=\"M232.3 55.1 L385.4 55.1 L385.4 8.0 L232.3 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"308.9\" y=\"36.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">predicted frames</text>\n  <path d=\"M456.1 55.1 L609.2 55.1 L609.2 8.0 L456.1 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"532.6\" y=\"36.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">PSNR, human scores</text>\n  <path d=\"M232.3 149.3 L385.4 149.3 L385.4 102.2 L232.3 102.2 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"308.9\" y=\"131.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">planner / policy</text>\n  <path d=\"M456.1 149.3 L609.2 149.3 L609.2 102.2 L456.1 102.2 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"532.6\" y=\"131.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">real outcome</text>\n  <path d=\"M161.7 69.8 L232.3 31.6\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a1b282accent)\"/>\n  <path d=\"M161.7 87.5 L232.3 125.8\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a1b282accent)\"/>\n  <path d=\"M385.4 31.6 L456.1 31.6\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#a1b282soft)\"/>\n  <path d=\"M385.4 125.8 L456.1 125.8\" stroke=\"var(--accent-2)\" stroke-width=\"1.52\" fill=\"none\" marker-end=\"url(#a1b282accent2)\"/>\n  <text x=\"618.6\" y=\"31.6\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">looks right?</text>\n  <text x=\"618.6\" y=\"125.8\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">task done?</text>\n</svg><p class=\"cap\">teal: predicted by a model; orange: observed</p></div><ul><li>Evaluate a world model by the <b>success rate</b> of the planner or policy that uses it, in the real world or a trusted simulator.</li><li>Or by <b>regret</b>: how much worse its decisions are than the best available, $\\mathrm{regret}(m) = J(\\pi^\\star) - J(\\pi_m)$.</li><li>Example: the best planner grasps successfully $85\\%$ of the time and the one built on model $m$ $30\\%$. Model $m$'s regret is $0.55$.</li></ul>", "n": ""}, {"t": "A ranking that flips", "sub": "models A, B, C from the image row; success rates illustrative", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.450 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 427 167\" width=\"427\" role=\"img\" aria-label=\"Two columns ranking the same items from best to worst. Left (teal), by PSNR: A, B, C. Right (orange), by grasp success: A, C, B. Lines join each item's two positions; crossing lines are pairs the rankings disagree on.\">\n  <path d=\"M107.3 56.6 L107.0 53.9 L106.1 51.3 L104.6 49.0 L102.7 47.0 L100.4 45.6 L97.8 44.7 L95.0 44.4 L92.3 44.7 L89.7 45.6 L87.4 47.0 L85.4 49.0 L84.0 51.3 L83.1 53.9 L82.8 56.6 L83.1 59.4 L84.0 62.0 L85.4 64.3 L87.4 66.2 L89.7 67.7 L92.3 68.6 L95.0 68.9 L97.8 68.6 L100.4 67.7 L102.7 66.2 L104.6 64.3 L106.1 62.0 L107.0 59.4 L107.3 56.6 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"71.5\" y=\"56.6\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A  24.1 dB</text>\n  <path d=\"M107.3 97.6 L107.0 94.9 L106.1 92.3 L104.6 89.9 L102.7 88.0 L100.4 86.5 L97.8 85.6 L95.0 85.3 L92.3 85.6 L89.7 86.5 L87.4 88.0 L85.4 89.9 L84.0 92.3 L83.1 94.9 L82.8 97.6 L83.1 100.3 L84.0 102.9 L85.4 105.3 L87.4 107.2 L89.7 108.7 L92.3 109.6 L95.0 109.9 L97.8 109.6 L100.4 108.7 L102.7 107.2 L104.6 105.3 L106.1 102.9 L107.0 100.3 L107.3 97.6 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"71.5\" y=\"97.6\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B  15.1 dB</text>\n  <path d=\"M107.3 138.6 L107.0 135.8 L106.1 133.2 L104.6 130.9 L102.7 129.0 L100.4 127.5 L97.8 126.6 L95.0 126.3 L92.3 126.6 L89.7 127.5 L87.4 129.0 L85.4 130.9 L84.0 133.2 L83.1 135.8 L82.8 138.6 L83.1 141.3 L84.0 143.9 L85.4 146.2 L87.4 148.2 L89.7 149.6 L92.3 150.5 L95.0 150.8 L97.8 150.5 L100.4 149.6 L102.7 148.2 L104.6 146.2 L106.1 143.9 L107.0 141.3 L107.3 138.6 Z\" stroke=\"var(--accent)\" stroke-width=\"1.14\" fill=\"var(--accent-soft)\"/>\n  <text x=\"71.5\" y=\"138.6\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">C  12.7 dB</text>\n  <path d=\"M342.8 56.6 L342.5 53.9 L341.6 51.3 L340.2 49.0 L338.2 47.0 L335.9 45.6 L333.3 44.7 L330.6 44.4 L327.8 44.7 L325.2 45.6 L322.9 47.0 L321.0 49.0 L319.5 51.3 L318.6 53.9 L318.3 56.6 L318.6 59.4 L319.5 62.0 L321.0 64.3 L322.9 66.2 L325.2 67.7 L327.8 68.6 L330.6 68.9 L333.3 68.6 L335.9 67.7 L338.2 66.2 L340.2 64.3 L341.6 62.0 L342.5 59.4 L342.8 56.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"354.1\" y=\"56.6\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A  0.85</text>\n  <path d=\"M108.4 56.6 L317.2 56.6\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M342.8 97.6 L342.5 94.9 L341.6 92.3 L340.2 89.9 L338.2 88.0 L335.9 86.5 L333.3 85.6 L330.6 85.3 L327.8 85.6 L325.2 86.5 L322.9 88.0 L321.0 89.9 L319.5 92.3 L318.6 94.9 L318.3 97.6 L318.6 100.3 L319.5 102.9 L321.0 105.3 L322.9 107.2 L325.2 108.7 L327.8 109.6 L330.6 109.9 L333.3 109.6 L335.9 108.7 L338.2 107.2 L340.2 105.3 L341.6 102.9 L342.5 100.3 L342.8 97.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"354.1\" y=\"97.6\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">C  0.80</text>\n  <path d=\"M108.4 138.6 L317.2 97.6\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M342.8 138.6 L342.5 135.8 L341.6 133.2 L340.2 130.9 L338.2 129.0 L335.9 127.5 L333.3 126.6 L330.6 126.3 L327.8 126.6 L325.2 127.5 L322.9 129.0 L321.0 130.9 L319.5 133.2 L318.6 135.8 L318.3 138.6 L318.6 141.3 L319.5 143.9 L321.0 146.2 L322.9 148.2 L325.2 149.6 L327.8 150.5 L330.6 150.8 L333.3 150.5 L335.9 149.6 L338.2 148.2 L340.2 146.2 L341.6 143.9 L342.5 141.3 L342.8 138.6 Z\" stroke=\"var(--accent-2)\" stroke-width=\"1.14\" fill=\"var(--accent-2-soft)\"/>\n  <text x=\"354.1\" y=\"138.6\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B  0.30</text>\n  <path d=\"M108.4 97.6 L317.2 138.6\" stroke=\"var(--ink-soft)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"95.0\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">PSNR</text>\n  <text x=\"330.6\" y=\"15.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">grasp success</text>\n</svg><p class=\"cap\">teal: PSNR ranking; orange: real grasp success</p></div></div><div style=\"flex:0.520 1 0\"><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Regret of each model? If you pick between B and C by PSNR, what does it cost?</p><div class=\"worked\"><p>Best success is $0.85$ (A). Regret: A $0.00$, B $0.55$, C $0.05$.</p><p>PSNR puts B above C, so it picks B: regret $0.55$ instead of $0.05$, a loss of $0.50$ in success.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div><ul><li><b>Report:</b> task success or regret with intervals, the policy and planner used, and which kinds of error (WorldModelBench's categories) caused failures.</li></ul>", "n": ""}, {"t": "WorldEval: test robot policies inside a world model", "sub": "Li et al., 2025; video on the project page", "min": 3, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 610 144\" width=\"610\" role=\"img\" aria-label=\"WorldEval's pipeline. The first frame and the task text, plus a latent action vector taken from inside the policy under test, go into a fine-tuned video model (WAN 2.1). Its generated video (teal) goes to a vision-language model that answers whether the task succeeded.\">\n  <defs><marker id=\"af4e2accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent)\"/></marker><marker id=\"af4e2soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink-soft)\"/></marker></defs>\n  <path d=\"M63.3 49.0 L186.2 49.0 L186.2 8.0 L63.3 8.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"124.7\" y=\"33.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">first frame + task</text>\n  <path d=\"M63.3 120.6 L186.2 120.6 L186.2 79.7 L63.3 79.7 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"124.7\" y=\"104.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">policy under test</text>\n  <path d=\"M247.6 84.8 L391.0 84.8 L391.0 43.8 L247.6 43.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"319.3\" y=\"68.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">video model (WAN 2.1)</text>\n  <path d=\"M452.4 84.8 L575.3 84.8 L575.3 43.8 L452.4 43.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"513.9\" y=\"68.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">VLM: success?</text>\n  <path d=\"M186.2 28.5 L247.6 56.6\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#af4e2soft)\"/>\n  <path d=\"M186.2 100.2 L247.6 72.0\" stroke=\"var(--ink-soft)\" stroke-width=\"1.14\" fill=\"none\" marker-end=\"url(#af4e2soft)\"/>\n  <text x=\"216.9\" y=\"128.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">latent action</text>\n  <path d=\"M391.0 64.3 L452.4 64.3\" stroke=\"var(--accent)\" stroke-width=\"1.52\" fill=\"none\" marker-end=\"url(#af4e2accent)\"/>\n  <text x=\"421.7\" y=\"48.4\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">generated video</text>\n  <text x=\"513.9\" y=\"105.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">Gemini 2.0</text>\n</svg><p class=\"cap\">teal: generated video</p></div><ul><li>Instead of running each policy on the real robot, run it <b>inside a video world model</b> and let a judge decide from the video whether the task succeeded.</li><li>If the world model ranks policies in the <b>same order</b> as real trials, it can choose between them without the robot.</li><li>With four policies on five tasks, its ranking closely matched $40$ real trials per task. Video: <a href=\"https://worldeval.github.io\" target=\"_blank\" rel=\"noopener\">worldeval.github.io</a></li></ul>", "n": ""}, {"t": "Learn it again, differently", "sub": "other explanations of the same ideas", "min": 1, "sz": "", "html": "<ul><li>Angelopoulos and Bates, <a href=\"https://arxiv.org/abs/2107.07511\" target=\"_blank\" rel=\"noopener\">A Gentle Introduction to Conformal Prediction</a>. Code for every example; read sections 1 and 2.</li><li>Kendall and Gal, <a href=\"https://arxiv.org/abs/1703.04977\" target=\"_blank\" rel=\"noopener\">What Uncertainties Do We Need in Bayesian Deep Learning for Computer Vision?</a> (NeurIPS 2017). Aleatoric and epistemic in depth and segmentation.</li><li>Guo et al., <a href=\"https://arxiv.org/abs/1706.04599\" target=\"_blank\" rel=\"noopener\">On Calibration of Modern Neural Networks</a> (ICML 2017). Reliability diagrams and temperature scaling.</li><li>The <a href=\"https://robot-help.github.io/\" target=\"_blank\" rel=\"noopener\">KnowNo project page</a>: videos of the robot asking for help.</li><li>The <a href=\"https://worldmodelbench-team.github.io\" target=\"_blank\" rel=\"noopener\">WorldModelBench site</a> and the <a href=\"https://worldeval.github.io\" target=\"_blank\" rel=\"noopener\">WorldEval site</a>: generated videos beside their scores.</li><li>Tian, Finn and Wu, <a href=\"https://arxiv.org/abs/2304.13723\" target=\"_blank\" rel=\"noopener\">A Control-Centric Benchmark for Video Prediction</a> (ICLR 2023).</li><li>Lambert et al., <a href=\"https://arxiv.org/abs/2002.04523\" target=\"_blank\" rel=\"noopener\">Objective Mismatch in Model-based Reinforcement Learning</a> (L4DC 2020).</li></ul>", "n": ""}, {"t": "What you should be able to do", "sub": "", "min": 1, "sz": "", "html": "<ul><li>Apply Bayes' rule to a test or a sensor reading; compute an expectation and a variance.</li><li>Compute an ensemble's mean and variance by hand and split it into aleatoric and epistemic parts; do the same with entropy for a classifier.</li><li>Bin predictions, compute ECE, and apply temperature scaling.</li><li>Compute a conformal threshold by hand, form the set, and prove the coverage bound from exchangeability.</li><li>Find a two-state chain's stationary distribution; decay a memory belief and update it on a miss.</li><li>Compute PSNR, SSIM and regret; say what WorldModelBench scores and what WorldEval tests.</li></ul>", "n": ""}, {"t": "Next", "sub": "L19 Wed Nov 18", "min": 1, "sz": "", "html": "<ul><li><b>L19, Wed Nov 18:</b> research talk on navigation, exploration, and instruction following.</li><li><b>Responses due Sun Nov 22:</b> WorldModelBench (today), and VLFM for Wednesday.</li><li><b>L20, Mon Nov 23: guest lecture by Jun Gao</b>, <i>Generative 3D and video world models</i>. Genie response due Sun Nov 29; Cosmos is also assigned.</li><li><b>Lab 1 due Fri Dec 4.</b></li><li>Come with a question for Jun: how would you check whether a Cosmos rollout is good enough to plan with?</li></ul>", "n": ""}]}];
</script>

<script>
(function(){
  "use strict";
  var flat=[];
  DECK.forEach(function(L){ L.slides.forEach(function(s,i){
    flat.push({lec:L,s:s,i:i,n:L.slides.length});
  });});

  var cur=0, notesOn=false, gridOn=false, mode="a";
  var slideEl=document.getElementById("slide"), countEl=document.getElementById("count"),
      notesEl=document.getElementById("notes"), notesBody=document.getElementById("notesbody"),
      gridEl=document.getElementById("grid"), progEl=document.getElementById("prog"),
      pickEl=null;

  try{ var sm=localStorage.getItem("rob3dp-mode"); if(sm==="a"||sm==="w") mode=sm; }catch(e){}

  function setMode(m){
    mode=m; document.body.setAttribute("data-mode",m);
    try{ localStorage.setItem("rob3dp-mode",m); }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
      b.setAttribute("aria-current", b.getAttribute("data-m")===m ? "true":"false");
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".mode button"),function(b){
    b.addEventListener("click",function(){ setMode(b.getAttribute("data-m")); });
  });

  function typeset(el){
    if(window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise([el]).catch(function(){});
    }
  }

  function render(){
    var f=flat[cur];
    slideEl.innerHTML =
      '<p class="s-meta">'+f.lec.num+' &middot; '+f.lec.title+' &middot; '+f.lec.date+
        (f.s.min?(' &middot; '+f.s.min+' min'):'')+'</p>'+
      '<h2>'+f.s.t+'</h2>'+
      (f.s.sub?'<p class="sub">'+f.s.sub+'</p>':'')+
      '<div class="rulel"></div>'+
      '<div class="body'+(f.s.sz?' sm':'')+'">'+f.s.html+'</div>';
    countEl.textContent=(f.i+1)+" / "+f.n;
    if(notesBody) notesBody.textContent=f.s.n||"—";
    progEl.style.width=((cur+1)/flat.length*100)+"%";
    if(gridOn) buildGrid();
    try{ history.replaceState(null,"","#"+f.lec.id+"-s"+(f.i+1)); }catch(e){}
    document.getElementById("stage").scrollTop=0;
    typeset(slideEl);
  }
  function go(i){ if(i<0||i>=flat.length) return; cur=i; render(); }

  function buildGrid(){
    gridEl.innerHTML="";
    flat.forEach(function(f,k){
      var b=document.createElement("button");
      b.className="thumb"; b.type="button";
      b.setAttribute("aria-current",k===cur?"true":"false");
      b.innerHTML='<span class="tn">'+f.lec.num+' &middot; '+(f.i+1)+
        (f.s.min?(' &middot; '+f.s.min+"'"):'')+'</span><span class="tt">'+f.s.t+'</span>';
      b.addEventListener("click",function(){
        gridOn=false; gridEl.classList.remove("on"); go(k);
      });
      gridEl.appendChild(b);
    });
  }

  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); go(cur+1); }
    else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(k==="Home"){ e.preventDefault(); go(0); }
    else if(k==="End"){ e.preventDefault(); go(flat.length-1); }
    else if(k==="a"||k==="A"){ setMode("a"); }
    else if(k==="w"||k==="W"){ setMode("w"); }
    else if((k==="s"||k==="S")&&notesEl){ notesOn=!notesOn; notesEl.classList.toggle("on",notesOn); }
    else if(k==="o"||k==="O"){ gridOn=!gridOn; gridEl.classList.toggle("on",gridOn); if(gridOn) buildGrid(); }
    else if(k==="p"||k==="P"){ document.body.classList.toggle("present"); }
    else if(k==="f"||k==="F"){
      if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
      else { (document.exitFullscreen||function(){}).call(document); }
    }
    else if(k==="Escape"){ gridOn=false; gridEl.classList.remove("on");
      document.body.classList.remove("present"); }
  });

  var x0=null;
  document.addEventListener("touchstart",function(e){ x0=e.changedTouches[0].clientX; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>60) go(cur+(dx<0?1:-1));
    x0=null;
  },{passive:true});

  var h=(location.hash||"").replace("#","");
  var m=/^(l\d\d)(?:-s(\d+))?$/.exec(h);
  if(m){
    var idx=flat.findIndex(function(f){
      return f.lec.id===m[1] && (!m[2]||f.i+1===parseInt(m[2],10)); });
    if(idx>=0) cur=idx;
  }
  setMode(mode);
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){
    MathJax.startup.promise.then(render);
  } else { render(); }
})();
</script>
