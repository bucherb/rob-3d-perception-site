dle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean</text>\n  <text x=\"139.1\" y=\"146.2\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">each sure, differently</text>\n  <path d=\"M153.4 182.1 L196.4 182.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M157.5 182.1 L172.9 182.1 L172.9 117.6 L157.5 117.6 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M177.0 182.1 L192.3 182.1 L192.3 174.9 L177.0 174.9 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"174.9\" y=\"198.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">m<tspan baseline-shift=\"sub\" font-size=\"72%\">1</tspan></text>\n  <path d=\"M220.0 182.1 L263.0 182.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M224.1 182.1 L239.4 182.1 L239.4 174.9 L224.1 174.9 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M243.5 182.1 L258.9 182.1 L258.9 117.6 L243.5 117.6 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"241.5\" y=\"198.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">m<tspan baseline-shift=\"sub\" font-size=\"72%\">2</tspan></text>\n  <path d=\"M286.5 182.1 L329.5 182.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M290.6 182.1 L306.0 182.1 L306.0 146.2 L290.6 146.2 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M310.1 182.1 L325.4 182.1 L325.4 146.2 L310.1 146.2 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"308.0\" y=\"198.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">m<tspan baseline-shift=\"sub\" font-size=\"72%\">3</tspan></text>\n  <path d=\"M373.6 182.1 L416.6 182.1\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M377.7 182.1 L393.0 182.1 L393.0 146.2 L377.7 146.2 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <path d=\"M397.1 182.1 L412.5 182.1 L412.5 146.2 L397.1 146.2 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"395.1\" y=\"198.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mean</text>\n</svg><p class=\"cap\">teal: predicted class probabilities; dashed: class 2</p></div></div><div style=\"flex:0.550 1 0\"><div class=\"eq\">\\[\\underbrace{H\\bigl[\\bar{\\mathbf{p}}\\bigr]}_{\\text{total}} = \\underbrace{\\tfrac{1}{M}\\textstyle\\sum_m H[\\mathbf{p}_m]}_{\\text{aleatoric}} + \\underbrace{I}_{\\text{epistemic}}\\]</div><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Find $I$ for both rows.</p><div class=\"worked\"><p>Both means are $(0.5, 0.5)$, so total $= 1$ bit in each row.</p><p>Row 1: every member has $H = 1$, so $I = 0$.</p><p>Row 2: $\\tfrac{1}{3}(0.469 + 0.469 + 1) = 0.646$, so $I = 0.354$ bits.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div></div></div>", "n": ""}, {"t": "Ensembles of dynamics models", "sub": "PETS: Chua et al., NeurIPS 2018", "min": 2, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.480 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 550 317\" width=\"550\" role=\"img\" aria-label=\"From a start state, six predicted trajectories for each of two action sequences. Sequence A's trajectories (solid) stay in a tight bundle above an obstacle; sequence B's (dashed) start together and spread widely, some crossing the obstacle.\">\n  <circle cx=\"201.3\" cy=\"129.6\" r=\"5.2\" fill=\"var(--ink)\"/>\n  <text x=\"201.3\" y=\"155.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">s<tspan baseline-shift=\"sub\" font-size=\"72%\">0</tspan></text>\n  <path d=\"M201.3 129.6 L243.9 122.2 L286.5 112.1 L329.0 100.7 L371.6 86.8 L414.1 71.1 L456.7 53.7 L499.3 33.3 L541.8 10.8\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M201.3 129.6 L243.9 122.2 L286.5 112.6 L329.0 100.3 L371.6 86.2 L414.1 69.9 L456.7 52.2 L499.3 32.7 L541.8 11.6\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M201.3 129.6 L243.9 122.9 L286.5 115.2 L329.0 106.4 L371.6 95.9 L414.1 83.5 L456.7 69.4 L499.3 53.3 L541.8 36.0\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M201.3 129.6 L243.9 122.3 L286.5 112.9 L329.0 101.2 L371.6 88.0 L414.1 73.1 L456.7 57.4 L499.3 40.1 L541.8 22.1\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M201.3 129.6 L243.9 123.0 L286.5 113.9 L329.0 104.0 L371.6 91.8 L414.1 77.5 L456.7 61.5 L499.3 43.3 L541.8 22.9\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M201.3 129.6 L243.9 121.6 L286.5 111.9 L329.0 100.6 L371.6 87.6 L414.1 73.3 L456.7 57.1 L499.3 39.5 L541.8 19.3\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\"/>\n  <path d=\"M201.3 129.6 L243.9 138.6 L286.5 152.3 L329.0 170.1 L371.6 196.4 L414.1 215.9 L456.7 245.1 L499.3 275.8 L541.8 309.1\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M201.3 129.6 L243.9 125.1 L286.5 128.7 L329.0 128.7 L371.6 131.9 L414.1 136.2 L456.7 143.6 L499.3 149.0 L541.8 159.2\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M201.3 129.6 L243.9 131.7 L286.5 133.0 L329.0 127.7 L371.6 132.1 L414.1 131.2 L456.7 127.0 L499.3 125.2 L541.8 122.8\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M201.3 129.6 L243.9 133.2 L286.5 131.0 L329.0 128.5 L371.6 127.3 L414.1 127.4 L456.7 128.8 L499.3 131.3 L541.8 137.7\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M201.3 129.6 L243.9 123.6 L286.5 125.3 L329.0 141.4 L371.6 158.4 L414.1 176.4 L456.7 193.5 L499.3 211.9 L541.8 231.3\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M201.3 129.6 L243.9 130.2 L286.5 127.5 L329.0 127.1 L371.6 128.5 L414.1 123.0 L456.7 115.9 L499.3 113.1 L541.8 101.9\" stroke=\"var(--accent)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M383.7 147.8 L468.9 147.8 L468.9 132.6 L383.7 132.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.76\" fill=\"var(--ground)\"/>\n  <text x=\"426.3\" y=\"146.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">obstacle</text>\n  <text x=\"223.2\" y=\"32.3\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A (solid): members agree</text>\n  <text x=\"223.2\" y=\"239.0\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B (dashed): members disagree</text>\n</svg><p class=\"cap\">teal: predicted trajectories</p></div></div><div style=\"flex:0.490 1 0\"><ul><li>From L16: a learned dynamics model $s_{t+1} \\sim f_\\theta(s_t, a_t)$ inside a CEM planner.</li><li>PETS trains an <b>ensemble</b> of networks, each predicting a Gaussian over the next state (aleatoric).</li><li>Each <b>particle</b> is pushed through a randomly chosen member. Where members disagree, the particles spread (epistemic).</li></ul></div></div>", "n": ""}, {"t": "Planning with disagreement", "sub": "five particles per action sequence; illustrative costs", "min": 3, "sz": "", "html": "<p>Sequence A: costs $4.0, 4.2, 3.9, 4.1, 4.3$. Sequence B: costs $2.0, 2.4, 6.1, 1.8, 2.7$. Score each by $J = \\mathbb{E}[\\text{cost}] + \\lambda\\,\\sigma$.</p><div class=\"hand\" data-h=\"22\"><p class=\"cue\">Which does CEM pick with $\\lambda = 0$? With $\\lambda = 1$?</p><div class=\"worked\"><p>A: mean $4.10$, $\\sigma = 0.14$. B: mean $3.00$, $\\sigma = 1.58$.</p><p>$\\lambda = 0$: B ($3.00 &lt; 4.10$). $\\lambda = 1$: $J_A = 4.24$, $J_B = 4.58$, so <b>A</b>.</p></div><div class=\"panel\" style=\"height:22mm\"></div></div><ul><li>$\\lambda &gt; 0$: stay where the model is trusted (deployment).</li><li>$\\lambda &lt; 0$: go where members disagree, to collect data. Plan2Explore (Sekar et al., ICML 2020) uses disagreement as its exploration reward.</li></ul>", "n": ""}, {"t": "Calibration: where it leads", "sub": "where this section is going", "min": 1, "sz": "", "html": "<p class=\"big\">When a classifier says it is 90% sure, it should be right about 90% of the time. Most modern networks are right less often than they say, and one extra number fixes much of it.</p><ul><li><b>Where it ends:</b> temperature scaling: divide the logits by one constant, fitted on held-out data.</li><li><b>What it needs first:</b> softmax confidence (L05), what calibrated means, and the expected calibration error (ECE) that measures it.</li><li><b>Why a robot cares:</b> a planner that acts on confidence needs confidence it can trust.</li></ul>", "n": ""}, {"t": "Recap: softmax probabilities", "sub": "from L05", "min": 1.5, "sz": "", "html": "<div class=\"eq\">\\[\\hat{p}_k = \\frac{e^{z_k}}{\\sum_j e^{z_j}}\\]</div><p>L05's scores $z = (2, 1, -1)$ for flower, person, tree: $e^{z} = (7.39, 2.72, 0.37)$, sum $10.48$, so $\\hat{p} = (0.705, 0.259, 0.035)$.</p><ul><li>The predicted class is the largest $\\hat{p}_k$. That probability, $0.71$ here, is the model's <b>confidence</b>.</li><li>Cross-entropy loss is $-\\ln \\hat{p}$ of the true class: small when right and confident, large when wrong and confident.</li></ul>", "n": ""}, {"t": "Calibration", "sub": "", "min": 2.5, "sz": "", "html": "<p>A forecaster says <i>70% chance of rain</i> on 100 days. If it rains on about 70 of them, the forecaster is <b>calibrated</b>.</p><div class=\"eq\">\\[P(\\hat{y} = y \\mid \\hat{p} = p) = p\\]</div><ul><li>For a classifier: of all its predictions made with confidence $0.8$, $80\\%$ should be right.</li><li><b>Overconfident:</b> right less often than it says.</li><li>A forecaster who says the yearly rain rate every day is also calibrated, and useless.</li></ul><p>The usual single number for this is the <b>expected calibration error (ECE)</b>: the average gap between confidence and accuracy.</p>", "n": ""}, {"t": "Expected calibration error (ECE) 1 of 2: bin the predictions", "sub": "twelve predictions; illustrative", "min": 4, "sz": "", "html": "<p>Confidence / right (1) or wrong (0):</p><p>$0.55$/1; $0.60$/0; $0.65$/1; $0.60$/0; $0.75$/1; $0.80$/0; $0.85$/0; $0.80$/1; $0.95$/1; $0.95$/1; $0.99$/0; $0.95$/1.</p><div class=\"hand\" data-h=\"28\"><p class=\"cue\">Bins $[0.5, 0.7)$, $[0.7, 0.9)$, $[0.9, 1]$. For each: mean confidence, accuracy, gap.</p><div class=\"worked\"><p>Bin 1: confidence $0.60$, accuracy $0.50$, gap $0.10$.</p><p>Bin 2: confidence $0.80$, accuracy $0.50$, gap $0.30$.</p><p>Bin 3: confidence $0.960$, accuracy $0.75$, gap $0.210$.</p></div><div class=\"panel\" style=\"height:28mm\"></div></div><p>In every bin the confidence is above the accuracy: this model is overconfident.</p>", "n": ""}, {"t": "Expected calibration error (ECE) 2 of 2: the weighted gap", "sub": "the same twelve predictions", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 325 273\" width=\"325\" role=\"img\" aria-label=\"A reliability diagram. Orange bars give the measured accuracy in each confidence bin; a teal dot gives the bin's mean confidence; a dashed diagonal marks perfect calibration. Bin 0.5 to 0.7: mean confidence 0.60, accuracy 0.50, 4 predictions. Bin 0.7 to 0.9: mean confidence 0.80, accuracy 0.50, 4 predictions. Bin 0.9 to 1.0: mean confidence 0.96, accuracy 0.75, 4 predictions.\">\n  <path d=\"M57.8 223.7 L297.4 223.7\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M57.8 223.7 L57.8 30.1\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"69.7\" y=\"26.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">accuracy</text>\n  <text x=\"173.0\" y=\"258.7\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">confidence</text>\n  <path d=\"M57.8 131.5 L288.2 39.3\" stroke=\"var(--ink-soft)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"113.1\" y=\"84.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">calibrated</text>\n  <path d=\"M57.8 223.7 L149.9 223.7 L149.9 131.5 L57.8 131.5 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M103.8 131.5 L103.8 113.1\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <circle cx=\"103.8\" cy=\"113.1\" r=\"3.1\" fill=\"var(--accent)\"/>\n  <text x=\"103.8\" y=\"145.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <path d=\"M149.9 223.7 L242.1 223.7 L242.1 131.5 L149.9 131.5 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M196.0 131.5 L196.0 76.2\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <circle cx=\"196.0\" cy=\"76.2\" r=\"3.1\" fill=\"var(--accent)\"/>\n  <text x=\"196.0\" y=\"145.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <path d=\"M242.1 223.7 L288.2 223.7 L288.2 85.4 L242.1 85.4 Z\" stroke=\"var(--accent-2)\" stroke-width=\"0.85\" fill=\"var(--accent-2-soft)\"/>\n  <path d=\"M269.7 85.4 L269.7 46.7\" stroke=\"var(--ink)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <circle cx=\"269.7\" cy=\"46.7\" r=\"3.1\" fill=\"var(--accent)\"/>\n  <text x=\"265.1\" y=\"99.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <text x=\"57.8\" y=\"239.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <text x=\"149.9\" y=\"239.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.7</text>\n  <text x=\"242.1\" y=\"239.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.9</text>\n  <text x=\"288.2\" y=\"239.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1.0</text>\n  <text x=\"45.8\" y=\"131.5\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <text x=\"45.8\" y=\"39.3\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1.0</text>\n</svg><p class=\"cap\">orange bar: measured accuracy; teal dot: mean confidence</p></div></div><div style=\"flex:0.530 1 0\"><div class=\"eq\">\\[\\mathrm{ECE} = \\sum_{b} \\frac{|B_b|}{n}\\,\\bigl|\\,\\mathrm{acc}(B_b) - \\mathrm{conf}(B_b)\\,\\bigr|\\]</div><div class=\"hand\" data-h=\"14\"><p class=\"cue\">ECE from the three gaps.</p><div class=\"worked\"><div class=\"eq\">\\[\\mathrm{ECE} = \\tfrac{4}{12}(0.10 + 0.30 + 0.210) = 0.203\\]</div></div><div class=\"panel\" style=\"height:14mm\"></div></div><p>$B_b$: bin $b$'s predictions, a share $|B_b|/n$ of all. acc: fraction right; conf: mean confidence.</p><p>The <b>reliability diagram</b> (left) draws the same gaps. A calibrated model's bars reach the diagonal.</p></div></div>", "n": ""}, {"t": "What ECE does not tell you", "sub": "", "min": 1.5, "sz": "", "html": "<ul><li>A model that says $0.70$ for <b>every</b> input, on data where class 1 is right $70\\%$ of the time, has $\\mathrm{ECE} = 0$. It cannot tell one input from another.</li><li>Report calibration <b>beside</b> accuracy, or use a proper scoring rule that rewards both: negative log-likelihood, or the Brier score $\\frac{1}{n}\\sum_i \\|\\hat{\\mathbf{p}}_i - \\mathbf{y}_i\\|^2$.</li><li>ECE depends on the binning, and is an average over the test set. It says nothing about one kind of input, such as glass.</li></ul>", "n": ""}, {"t": "Why networks are overconfident", "sub": "Guo et al., ICML 2017", "min": 2, "sz": "", "html": "<ul><li>Recall L05: cross-entropy is $-\\ln \\hat{p}_y$. Once an example is classified correctly, the loss still falls if $\\hat{p}_y$ goes from $0.9$ to $0.999$.</li><li>So training keeps scaling the logits up. On held-out data the accuracy stops improving while the confidence keeps climbing.</li><li>Guo et al. found modern deep networks far less calibrated than older, smaller ones.</li></ul><div class=\"rbox\"><span class=\"rbox-t\">Confidence maps too</span><p>DUSt3R and VGGT (L10) predict a per-pixel confidence. Before trusting it as a probability, bin by confidence and measure the error in each bin.</p></div>", "n": ""}, {"t": "Temperature scaling", "sub": "Guo et al., ICML 2017", "min": 4, "sz": "", "html": "<p>Of the fixes Guo et al. compared, dividing every logit by one fitted number $T$ worked best.</p><div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 271 173\" width=\"271\" role=\"img\" aria-label=\"Two bar charts of softmax probabilities for logits 3, 1, 0. At T = 1: 0.84, 0.11, 0.04. At T = 2: 0.63, 0.23, 0.14.\">\n  <path d=\"M21.9 145.2 L116.1 145.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M28.1 145.2 L48.6 145.2 L48.6 55.4 L28.1 55.4 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"38.3\" y=\"42.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.84</text>\n  <text x=\"38.3\" y=\"159.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mug</text>\n  <path d=\"M58.8 145.2 L79.3 145.2 L79.3 133.1 L58.8 133.1 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"69.0\" y=\"120.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.11</text>\n  <text x=\"69.0\" y=\"159.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">bowl</text>\n  <path d=\"M89.5 145.2 L110.0 145.2 L110.0 140.7 L89.5 140.7 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"99.8\" y=\"128.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.04</text>\n  <text x=\"99.8\" y=\"159.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">cup</text>\n  <text x=\"68.0\" y=\"13.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">T = 1</text>\n  <path d=\"M155.0 145.2 L249.3 145.2\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M161.2 145.2 L181.7 145.2 L181.7 78.3 L161.2 78.3 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"171.4\" y=\"65.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.63</text>\n  <text x=\"171.4\" y=\"159.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mug</text>\n  <path d=\"M191.9 145.2 L212.4 145.2 L212.4 120.6 L191.9 120.6 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"202.2\" y=\"107.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.23</text>\n  <text x=\"202.2\" y=\"159.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">bowl</text>\n  <path d=\"M222.6 145.2 L243.1 145.2 L243.1 130.3 L222.6 130.3 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"232.9\" y=\"117.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.14</text>\n  <text x=\"232.9\" y=\"159.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">cup</text>\n  <text x=\"201.1\" y=\"13.7\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">T = 2</text>\n</svg><p class=\"cap\">teal: predicted probabilities</p></div><div class=\"eq\">\\[\\hat{p}_k = \\frac{e^{z_k/T}}{\\sum_j e^{z_j/T}}\\]</div></div><div style=\"flex:0.530 1 0\"><div class=\"hand\" data-h=\"32\"><p class=\"cue\">Logits $z = (3, 1, 0)$. Softmax at $T = 1$ and $T = 2$. Loss if the answer was <i>bowl</i>? If it was <i>mug</i>?</p><div class=\"worked\"><p>$T=1$: $(0.84, 0.11, 0.04)$. $T=2$: $(0.63, 0.23, 0.14)$.</p><p>Bowl: $-\\ln 0.114 = 2.17$ falls to $-\\ln 0.231 = 1.46$. Mug: $0.17$ rises to $0.46$.</p><p>Fit $T$ to minimise the loss on a <b>validation</b> set. The argmax never changes, so accuracy is untouched.</p></div><div class=\"panel\" style=\"height:32mm\"></div></div></div></div>", "n": ""}, {"t": "Conformal prediction: where it leads", "sub": "where this section is going", "min": 1, "sz": "", "html": "<p class=\"big\">Take any trained model and turn its output into a set of answers that contains the right one at least 90% of the time. The proof uses nothing about the model.</p><ul><li><b>Where it ends:</b> KnowNo: a robot that asks for help when its set holds more than one possible plan.</li><li><b>What it needs first:</b> quantiles and exchangeability, worked through with a commute before any classifier appears.</li><li><b>Why a robot cares:</b> a guaranteed error rate tells the robot when an answer is safe to act on and when to ask.</li></ul>", "n": ""}, {"t": "Quantiles", "sub": "ten days of commute delays, in minutes; illustrative", "min": 2.5, "sz": "", "html": "<p>A map app predicts your arrival; the <b>delay</b> is how many minutes later you arrive. Ten days, sorted: $1, 2, 3, 3, 4, 5, 6, 7, 9, 12$.</p><div class=\"fig\"><svg viewBox=\"0 0 396 100\" width=\"396\" role=\"img\" aria-label=\"A number line with 10 values marked and numbered in sorted order. A dashed line marks value number 9, 9.\">\n  <path d=\"M21.6 71.9 L387.7 71.9\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M21.6 75.2 L21.6 68.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"21.6\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M162.4 75.2 L162.4 68.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"162.4\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">5</text>\n  <path d=\"M303.2 75.2 L303.2 68.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"303.2\" y=\"85.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n  <path d=\"M49.8 71.9 L49.8 65.2\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"49.8\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"49.8\" y=\"64.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M78.0 71.9 L78.0 51.9\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"78.0\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"78.0\" y=\"50.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <path d=\"M106.1 71.9 L106.1 65.2\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"106.1\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"106.1\" y=\"64.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3</text>\n  <path d=\"M106.1 71.9 L106.1 25.3\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"106.1\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"106.1\" y=\"24.3\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <path d=\"M134.3 71.9 L134.3 65.2\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"134.3\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"134.3\" y=\"64.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">5</text>\n  <path d=\"M162.4 71.9 L162.4 51.9\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"162.4\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"162.4\" y=\"50.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">6</text>\n  <path d=\"M190.6 71.9 L190.6 65.2\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"190.6\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"190.6\" y=\"64.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">7</text>\n  <path d=\"M218.8 71.9 L218.8 51.9\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"218.8\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"218.8\" y=\"50.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n  <path d=\"M275.1 71.9 L275.1 65.2\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"275.1\" cy=\"71.9\" r=\"3.1\" fill=\"var(--ink)\"/>\n  <text x=\"275.1\" y=\"64.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">9</text>\n  <path d=\"M359.6 71.9 L359.6 51.9\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"359.6\" cy=\"71.9\" r=\"2.0\" fill=\"var(--ink)\"/>\n  <text x=\"359.6\" y=\"50.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n  <path d=\"M275.1 91.9 L275.1 25.3\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"275.1\" y=\"15.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">0.9 quantile</text>\n</svg><p class=\"cap\">the ten delays, numbered in sorted order</p></div><ul><li>The $0.9$ <b>quantile</b> is the delay that $90\\%$ of days are at or under. Count $9$ of the $10$ from the left: $9$ minutes.</li><li>The $0.5$ <b>quantile</b> is the median. Count $5$ of $10$: $4$ minutes.</li><li>In general: sort the $n$ values and take the $\\lceil \\beta n \\rceil$-th for the $\\beta$ quantile.</li></ul>", "n": ""}, {"t": "Exchangeability", "sub": "when the order of the data carries no information; illustrative", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 347 190\" width=\"347\" role=\"img\" aria-label=\"A plot of delay (min) against day. \">\n  <path d=\"M63.9 146.1 L325.8 146.1\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M63.9 146.1 L63.9 27.0\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"74.3\" y=\"23.9\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">delay (min)</text>\n  <text x=\"190.9\" y=\"176.2\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">day</text>\n  <path d=\"M63.9 129.0 L92.2 103.4 L120.4 137.5 L148.6 86.3 L176.8 120.4 L205.0 43.5 L233.3 111.9 L261.5 94.8 L289.7 69.2 L317.9 120.4\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M63.9 137.5 L92.2 129.0 L120.4 120.4 L148.6 111.9 L176.8 103.4 L205.0 94.8 L233.3 86.3 L261.5 77.7 L289.7 69.2 L317.9 60.6\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"63.9\" y=\"159.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <text x=\"176.8\" y=\"159.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">5</text>\n  <text x=\"317.9\" y=\"159.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n  <text x=\"54.4\" y=\"146.1\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"54.4\" y=\"103.4\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">5</text>\n  <text x=\"54.4\" y=\"60.6\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n</svg><p class=\"cap\">orange solid: the ten delays; orange dashed: roadworks, one minute worse each day</p></div><ul><li><b>Exchangeable:</b> every ordering of the values is equally likely. Then a new day's delay is equally likely to take any of the $n+1$ ranks.</li><li>Draws that are independent and from one distribution (i.i.d.) are exchangeable.</li><li>The dashed days are not: the 11th will almost surely be the largest.</li></ul>", "n": ""}, {"t": "Conformal prediction 1 of 6: slack for a commute", "sub": "the ten delays again", "min": 3, "sz": "", "html": "<p>To arrive on time on $90\\%$ of future days, add slack to the app's estimate. Choose it from the past delays.</p><div class=\"hand\" data-h=\"26\"><p class=\"cue\">A new, 11th day. How much slack covers it with probability at least $0.9$?</p><div class=\"worked\"><p>If the days are exchangeable, the new delay is equally likely to take any of the $11$ ranks.</p><p>$9$ minutes covers it when its rank is $9$ or less: probability $9/11 = 0.82$, short of $0.9$.</p><p>Take the $\\lceil 11 \\times 0.9 \\rceil = 10$th smallest, $12$ minutes: $10/11 = 0.91$.</p></div><div class=\"panel\" style=\"height:26mm\"></div></div><p>A snow day is unlike the ten you recorded, and the $90\\%$ says nothing about it.</p>", "n": ""}, {"t": "Conformal prediction 2 of 6: a score for a classifier", "sub": "", "min": 2, "sz": "", "html": "<p><b>Goal:</b> from any trained classifier, output a <b>set</b> of classes that contains the truth with probability at least $1-\\alpha$.</p><ul><li>Hold out $n$ labelled <b>calibration</b> examples the model never trained on.</li><li>Score each: $s_i = 1 - \\hat{p}(y_i \\mid x_i)$, one minus the probability given to the true class. It plays the part of the delay.</li></ul><div class=\"fig\"><svg viewBox=\"0 0 735 165\" width=\"735\" role=\"img\" aria-label=\"A number line with 19 values marked and numbered in sorted order. A dashed line marks value number 18, 0.78.\">\n  <path d=\"M32.9 120.5 L701.7 120.5\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M32.9 126.6 L32.9 114.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"32.9\" y=\"145.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <path d=\"M367.3 126.6 L367.3 114.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"367.3\" y=\"145.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <path d=\"M701.7 126.6 L701.7 114.4\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <text x=\"701.7\" y=\"145.4\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M39.6 120.5 L39.6 108.3\" stroke=\"var(--rule)\" stroke-width=\"0.57\" fill=\"none\"/>\n  <circle cx=\"39.6\" cy=\"120.5\" r=\"3.6\" fill=\"var(--ink)\"/>\n  <text x=\"39.6\" y=\"106.5\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M53.0 120.5 L53.0 84.0\" stroke=\"var(--rule)\" stroke-wid  <path d=\"M554.6 157.0 L554.6 35.4\" stroke=\"var(--ink)\" stroke-width=\"1.14\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"554.6\" y=\"16.5\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"11.5\" dominant-baseline=\"middle\">q̂</text>\n</svg><p class=\"cap\">the $19$ calibration scores, sorted; illustrative</p></div>", "n": ""}, {"t": "Conformal prediction 3 of 6: the threshold by hand", "sub": "the 19 scores above; illustrative", "min": 4, "sz": "", "html": "<div class=\"eq\">\\[\\hat{q} = \\text{the } \\bigl\\lceil (n+1)(1-\\alpha) \\bigr\\rceil\\text{-th smallest of } s_1, \\dots, s_n\\]</div><p>Sorted: $0.01, 0.03, 0.04, 0.06, 0.08, 0.09, 0.12, 0.15, 0.18, 0.22, 0.25, 0.31, 0.36, 0.42, 0.49, 0.57, 0.66, 0.78, 0.91$.</p><div class=\"hand\" data-h=\"24\"><p class=\"cue\">$n = 19$, $\\alpha = 0.10$. Which score is $\\hat{q}$? What happens at $\\alpha = 0.04$?</p><div class=\"worked\"><p>$\\lceil 20 \\times 0.90 \\rceil = 18$, so $\\hat{q}$ is the $18$th: $\\hat{q} = 0.78$.</p><p>$\\alpha = 0.04$: $\\lceil 20 \\times 0.96 \\rceil = 20 &gt; n$. No score is large enough, so $\\hat{q} = \\infty$ and every set holds every class.</p></div><div class=\"panel\" style=\"height:24mm\"></div></div>", "n": ""}, {"t": "Conformal prediction 4 of 6: the set", "sub": "", "min": 2.5, "sz": "", "html": "<div class=\"eq\">\\[C(x) = \\{\\, k : 1 - \\hat{p}(k \\mid x) \\le \\hat{q} \\,\\} = \\{\\, k : \\hat{p}(k \\mid x) \\ge 0.22 \\,\\}\\]</div><div class=\"fig\"><svg viewBox=\"0 0 494 222\" width=\"494\" role=\"img\" aria-label=\"Two bar charts of predicted class probabilities with a dashed threshold at 0.22. Bars above it are filled teal and are in the set; bars below are grey. a clear mug: mug 0.90, bowl 0.05, cup 0.04, vase 0.01; kept: mug. a mug half in shadow: mug 0.38, bowl 0.33, cup 0.24, vase 0.05; kept: mug, bowl, cup.\">\n  <path d=\"M30.5 186.6 L191.7 186.6\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"none\"/>\n  <path d=\"M36.2 186.6 L65.0 186.6 L65.0 62.1 L36.2 62.1 Z\" stroke=\"var(--accent)\" stroke-width=\"0.95\" fill=\"var(--accent-soft)\"/>\n  <text x=\"50.6\" y=\"44.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.90</text>\n  <text x=\"50.6\" y=\"206.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">mug</text>\n  <path d=\"M76.5 186.6 L105.3 186.6 L105.3 179.6 L76.5 179.6 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"90.9\" y=\"162.4\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.05</text>\n  <text x=\"90.9\" y=\"206.1\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">bowl</text>\n  <path d=\"M116.9 186.6 L145.7 186.6 L145.7 181.0 L116.9 181.0 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"131.3\" y=\"163.8\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.04</text>\n  <text x=\"131.3\" y=\"206.1\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">cup</text>\n  <path d=\"M157.2 186.6 L186.0 186.6 L186.0 185.2 L157.2 185.2 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.95\" fill=\"var(--surface)\"/>\n  <text x=\"171.6\" y=\"167.9\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.01</text>\n  <text x=\"171.6\" y=\"206.1\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">vase</text>\n  <path d=\"M30.5 156.1 L191.7 156.1\" stroke=\"var(--ink)\" stroke-width=\"0 rgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.05</text>\n  <text x=\"402.0\" y=\"206.1\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">vase</text>\n  <path d=\"M260.9 156.1 L422.1 156.1\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"341.5\" y=\"16.1\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">a mug half in shadow</text>\n  <text x=\"440.0\" y=\"156.1\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1-q̂</text>\n</svg><p class=\"cap\">teal: predicted probabilities of the classes in the set</p></div><p>Clear image: $\\{\\text{mug}\\}$. Ambiguous image: $\\{\\text{mug, bowl, cup}\\}$. The set's <b>size</b> is the model's uncertainty.</p>", "n": ""}, {"t": "Conformal prediction 5 of 6: why it covers", "sub": "", "min": 4, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 862 87\" width=\"862\" role=\"img\" aria-label=\"A row of 11 boxes numbered 1 to 11, the ranks a test score can take among the calibration scores; all are equally likely.\">\n  <path d=\"M145.7 51.2 L188.9 51.2 L188.9 10.9 L145.7 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"167.3\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M197.5 51.2 L240.7 51.2 L240.7 10.9 L197.5 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"219.1\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <path d=\"M249.3 51.2 L292.5 51.2 L292.5 10.9 L249.3 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"270.9\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3</text>\n  <path d=\"M301.2 51.2 L344.4 51.2 L344.4 10.9 L301.2 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"322.8\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <path d=\"M353.0 51.2 L396.2 51.2 L396.2 10.9 L353.0 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"374.6\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">5</text>\n  <path d=\"M404.9 51.2 L448.1 51.2 L448.1 10.9 L404.9 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"426.5\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">6</text>\n  <path d=\"M456.7 51.2 L499.9 51.2 L499.9 10.9 L456.7 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"478.3\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">7</text>\n  <path d=\"M508.5 51.2 L551.7 51.2 L551.7 10.9 L508.5 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"530.1\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n  <path d=\"M560.4 51.2 L603.6 51.2 L603.6 10.9 L560.4 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"582.0\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">9</text>\n  <path d=\"M612.2 51.2 L655.4 51.2 L655.4 10.9 L612.2 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\"/>\n  <text x=\"633.8\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n  <path d=\"M664.1 51.2 L707.3 51.2 L707.3 10.9 L664.1 10.9 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--ground)\" stroke-dasharray=\"5 4\"/>\n  <text x=\"685.7\" y=\"36.2\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">11</text>\n  <text x=\"430.8\" y=\"70.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">the test score is equally likely to land in any of the n+1 ranks</text>\n</svg></div><p><b>Assumption:</b> the calibration examples and the test example are <b>exchangeable</b>.</p><div class=\"hand\" data-h=\"26\"><p class=\"cue\">Show $P(y_{\\text{test}} \\in C(x_{\\text{test}})) \\ge 1 - \\alpha$.</p><div class=\"worked\"><p>$y_{\\text{test}} \\in C \\iff s_{\\text{test}} \\le \\hat{q}$, the $k$th smallest calibration score, $k = \\lceil (n+1)(1-\\alpha) \\rceil$.</p><p>By exchangeability $s_{\\text{test}}$ is equally likely to have any of the $n+1$ ranks. It is $\\le \\hat{q}$ if its rank is $\\le k$:</p><div class=\"eq\">\\[P \\ge \\frac{k}{n+1} = \\frac{\\lceil (n+1)(1-\\alpha) \\rceil}{n+1} \\ge 1 - \\alpha\\]</div></div><div class=\"panel\" style=\"height:26mm\"></div></div>", "n": ""}, {"t": "Conformal prediction 6 of 6: what it promises", "sub": "with $\\alpha = 0.1$, so $90\\%$ coverage", "min": 2.5, "sz": "", "html": "<p><b>The promise:</b> run the model on many new inputs that come from the same place as the calibration data. At least $90\\%$ of the sets contain the true class.</p><table class='cmp'><thead><tr><th>Promised</th><th>Not promised</th></tr></thead><tbody><tr><td>at least $90$ of every $100$ test images covered</td><td>$90\\%$ for <b>each kind</b> of image: clear mugs may be covered every time and mugs in shadow only $70\\%$ of the time</td></tr><tr><td>for <b>any</b> model, even a bad one</td><td>small sets: a bad model keeps its $90\\%$ by putting many classes in each set</td></tr><tr><td>while new inputs are like the calibration set</td><td>anything once the robot is in a new building, at night, or behind a dirty lens</td></tr></tbody></table><p>The last row is where the method stops: it cannot tell the robot that its inputs have changed. That job is out-of-distribution detection, beyond today.</p>", "n": ""}, {"t": "Intervals for depth and pose", "sub": "same recipe, different score; illustrative residuals", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.440 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 451 244\" width=\"451\" role=\"img\" aria-label=\"Predicted depths along an image row with a teal interval at each pixel. The interval is narrow where the network's sigma is small and wide where it is large.\">\n  <path d=\"M72.7 208.2 L442.7 208.2\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M72.7 208.2 L72.7 34.1\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"252.3\" y=\"228.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">pixel along a row</text>\n  <text x=\"86.9\" y=\"29.8\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">depth (m)</text>\n  <path d=\"M99.9 136.0 L99.9 117.2\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"99.9\" cy=\"126.6\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M131.5 120.3 L131.5 101.6\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"131.5\" cy=\"110.9\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M163.0 108.5 L163.0 89.7\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"163.0\" cy=\"99.1\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M194.6 103.4 L194.6 84.6\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"194.6\" cy=\"94.0\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M226.1 106.3 L226.1 87.5\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"226.1\" cy=\"96.9\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M257.7 116.4 L257.7 97.7\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"257.7\" cy=\"107.1\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M289.2 131.4 L289.2 112.6\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"289.2\" cy=\"122.0\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M320.8 194.3 L320.8 81.7\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"320.8\" cy=\"138.0\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M352.4 207.6 L352.4 95.0\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"352.4\" cy=\"151.3\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M383.9 214.8 L383.9 102.2\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"383.9\" cy=\"158.5\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <path d=\"M415.5 214.2 L415.5 101.6\" stroke=\"var(--accent)\" stroke-width=\"2.09\" fill=\"none\"/>\n  <circle cx=\"415.5\" cy=\"157.9\" r=\"2.8\" fill=\"var(--ink)\"/>\n  <text x=\"342.0\" y=\"44.4\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">band ±q̂ hatσ</text>\n</svg><p class=\"cap\">teal: predicted depth intervals</p></div></div><div style=\"flex:0.530 1 0\"><p>Score $s_i = |d_i - \\hat{d}_i| / \\hat{\\sigma}_i$, normalised by the network's own $\\hat{\\sigma}$. Interval:</p><div class=\"eq\">\\[C(x) = \\bigl[\\hat{d} - \\hat{q}\\,\\hat{\\sigma},\\; \\hat{d} + \\hat{q}\\,\\hat{\\sigma}\\bigr]\\]</div><p>With $n = 19$, $\\alpha = 0.1$: $\\hat{q}$ is again the 18th score, $2.3$. A pixel at $\\hat{d} = 2.40$ m with $\\hat{\\sigma} = 0.05$ m gets $\\pm 0.11$ m; on glass, $\\hat{\\sigma} = 0.30$ gives $\\pm 0.69$ m.</p></div></div><p><b>Pose:</b> score each calibration object by its rotation error or ADD (L12); the set is every pose within $\\hat{q}$ of the estimate.</p>", "n": ""}, {"t": "KnowNo 1 of 2: planners that ask for help", "sub": "Ren et al., CoRL 2023", "min": 2.5, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.520 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 359 178\" width=\"359\" role=\"img\" aria-label=\"Horizontal bars of the language model's probability for each multiple-choice option: A: plastic bowl in microwave 0.47; B: metal bowl in microwave 0.41; C: both bowls in microwave 0.07; D: do nothing 0.05. A dashed line at 0.15 keeps the options above it, which are filled teal.\">\n  <path d=\"M181.7 62.9 L309.4 62.9 L309.4 41.9 L181.7 41.9 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <text x=\"168.7\" y=\"52.4\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">A: plastic bowl in microwave</text>\n  <text x=\"322.3\" y=\"52.4\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.47</text>\n  <path d=\"M181.7 95.4 L293.1 95.4 L293.1 74.4 L181.7 74.4 Z\" stroke=\"var(--accent)\" stroke-width=\"0.85\" fill=\"var(--accent-soft)\"/>\n  <text x=\"168.7\" y=\"84.9\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">B: metal bowl in microwave</text>\n  <text x=\"306.0\" y=\"84.9\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.41</text>\n  <path d=\"M181.7 127.8 L200.7 127.8 L200.7 106.8 L181.7 106.8 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\"/>\n  <text x=\"168.7\" y=\"117.3\" text-anchor=\"end\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">C: both bowls in microwave</text>\n  <text x=\"213.7\" y=\"117.3\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.07</text>\n  <path d=\"M181.7 160.3 L195.3 160.3 L195.3 139.3 L181.7 139.3 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"0.85\" fill=\"var(--surface)\"/>\n  <text x=\"168.7\" y=\"149.8\" text-anchor=\"end\" fill=\"var(--ink-faint)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">D: do nothing</text>\n  <text x=\"208.3\" y=\"149.8\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.05</text>\n  <path d=\"M222.5 167.7 L222.5 30.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"222.5\" y=\"15.0\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1-q̂</text>\n</svg><p class=\"cap\">teal: options in the set; scores illustrative</p></div><p><i>Put the bowl in the microwave</i>, with a plastic and a metal bowl on the counter.</p></div><div style=\"flex:0.450 1 0\"><ul><li>An LLM lists candidate next steps as <b>multiple choice</b>, A to D.</li><li>Each option's score is the LLM's next-token probability of its letter.</li><li>Conformal calibration on $400$ labelled scenarios gives $\\hat{q}$.</li><li>One option in the set: act. More than one: <b>ask a person</b> to choose.</li></ul></div></div>", "n": ""}, {"t": "KnowNo 2 of 2: results", "sub": "mobile manipulator in an office kitchen, PaLM-2L; Table 2", "min": 2, "sz": "", "html": "<table class='cmp'><thead><tr><th>Method</th><th>$1-\\epsilon$</th><th>Plan succ.</th><th>Task succ.</th><th>Set size</th><th>Help rate</th></tr></thead><tbody><tr><td>KnowNo</td><td>0.85</td><td>0.87</td><td>0.76</td><td>2.22</td><td>0.67</td></tr><tr><td>Simple Set</td><td>0.76</td><td>0.87</td><td>0.75</td><td>2.38</td><td>0.81</td></tr><tr><td>No Help</td><td>&ndash;</td><td>0.62</td><td>0.51</td><td>&ndash;</td><td>0</td></tr></tbody></table><ul><li>KnowNo hits its $0.85$ target ($0.87$) and asks for help on $67\\%$ of scenarios. <b>Simple Set</b>, the same scores with a hand-tuned threshold, needs $81\\%$ to reach the same plan success.</li><li>Never asking gets $0.62$. The tasks were built to be ambiguous, so a high help rate is expected.</li></ul>", "n": ""}, {"t": "When the world moves", "sub": "", "min": 1.5, "sz": "", "html": "<ul><li>L13 and L15 built maps and memories: a scene graph's object nodes, ReMEmbR's time-stamped captions.</li><li>Each entry was right <b>when it was written</b>. A mug seen on the kitchen bench at 9:00 may be in the sink by noon.</li><li>L13 handled the case where the robot <b>looks</b> and misses: a Bayes update per miss. Here: what to believe <b>between</b> looks.</li></ul><div class=\"rbox\"><span class=\"rbox-t\">Two questions</span><p>How much should a sighting be trusted $t$ hours later? When should the robot go back to check?</p></div>", "n": ""}, {"t": "A Markov chain with two states", "sub": "per hour; illustrative", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.450 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 390 163\" width=\"390\" role=\"img\" aria-label=\"Two states, there and gone. From there: move to gone with probability 0.20, stay with 0.80. From gone: move back with 0.05, stay with 0.95.\">\n  <defs><marker id=\"a7a06ink\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--ink)\"/></marker></defs>\n  <path d=\"M119.0 81.4 L118.2 74.2 L115.7 67.3 L111.9 61.1 L106.7 55.9 L100.5 52.0 L93.6 49.6 L86.3 48.8 L79.1 49.6 L72.2 52.0 L66.0 55.9 L60.8 61.1 L56.9 67.3 L54.5 74.2 L53.7 81.4 L54.5 88.7 L56.9 95.6 L60.8 101.8 L66.0 107.0 L72.2 110.8 L79.1 113.3 L86.3 114.1 L93.6 113.3 L100.5 110.8 L106.7 107.0 L111.9 101.8 L115.7 95.6 L118.2 88.7 L119.0 81.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"86.3\" y=\"86.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">there</text>\n  <path d=\"M336.6 81.4 L335.8 74.2 L333.3 67.3 L329.5 61.1 L324.3 55.9 L318.1 52.0 L311.2 49.6 L303.9 48.8 L296.7 49.6 L289.8 52.0 L283.6 55.9 L278.4 61.1 L274.5 67.3 L272.1 74.2 L271.3 81.4 L272.1 88.7 L274.5 95.6 L278.4 101.8 L283.6 107.0 L289.8 110.8 L296.7 113.3 L303.9 114.1 L311.2 113.3 L318.1 110.8 L324.3 107.0 L329.5 101.8 L333.3 95.6 L335.8 88.7 L336.6 81.4 Z\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"var(--ground)\"/>\n  <text x=\"303.9\" y=\"86.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">gone</text>\n  <path d=\"M113.5 62.4 L195.1 32.5 L276.7 62.4\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a7a06ink)\"/>\n  <path d=\"M276.7 100.5 L195.1 130.4 L113.5 100.5\" stroke=\"var(--ink)\" stroke-width=\"0.95\" fill=\"none\" marker-end=\"url(#a7a06ink)\"/>\n  <text x=\"195.1\" y=\"15.6\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.20</text>\n  <text x=\"195.1\" y=\"147.3\" text-anchor=\"middle\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.05</text>\n  <text x=\"39.6\" y=\"81.4\" text-anchor=\"end\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.80</text>\n  <text x=\"350.7\" y=\"81.4\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.95</text>\n</svg><p class=\"cap\">transition probabilities per hour</p></div></div><div style=\"flex:0.520 1 0\"><p>Each hour, a mug that is there is moved away with probability $0.20$; a mug that is gone is put back with $0.05$. The next state depends only on the current one.</p><div class=\"hand\" data-h=\"18\"><p class=\"cue\">Seen at hour $0$: $P(\\text{there}) = 1$. After $1$ hour? $2$ hours?</p><div class=\"worked\"><p>$p_1 = 1(0.80) + 0(0.05) = 0.80$.</p><p>$p_2 = 0.80(0.80) + 0.20(0.05) = 0.65$.</p></div><div class=\"panel\" style=\"height:18mm\"></div></div></div></div><div class=\"eq\">\\[p_{t+1} = p_t\\,(1 - a) + (1 - p_t)\\,b\\]</div>", "n": ""}, {"t": "The stationary distribution", "sub": "where the chain settles", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.480 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 374 212\" width=\"374\" role=\"img\" aria-label=\"A plot of $P(\\text{there})$ against hours. \">\n  <path d=\"M56.4 163.9 L352.1 163.9\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M56.4 163.9 L56.4 29.5\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"68.0\" y=\"25.9\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P(there)</text>\n  <text x=\"199.7\" y=\"198.0\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hours</text>\n  <path d=\"M56.4 138.8 L343.1 138.8\" stroke=\"var(--ink-soft)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M56.4 38.5 L80.3 63.6 L104.2 82.4 L128.1 96.5 L152.0 107.1 L175.9 115.0 L199.7 121.0 L223.6 125.4 L247.5 128.8 L271.4 131.3 L295.3 133.2 L319.2 134.6 L343.1 135.6\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <text x=\"56.4\" y=\"179.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"152.0\" y=\"179.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <text x=\"247.5\" y=\"179.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n  <text x=\"343.1\" y=\"179.1\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">12</text>\n  <text x=\"45.6\" y=\"163.9\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"45.6\" y=\"101.2\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0.5</text>\n  <text x=\"45.6\" y=\"38.5\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n</svg><p class=\"cap\">teal: the chain's prediction; dashed: $\\pi = 0.2$</p></div></div><div style=\"flex:0.490 1 0\"><div class=\"hand\" data-h=\"22\"><p class=\"cue\">Find $\\pi$ with $\\pi = \\pi(1 - a) + (1 - \\pi)\\,b$.</p><div class=\"worked\"><p>$\\pi a = (1 - \\pi) b$, so $\\pi = \\dfrac{b}{a + b} = \\dfrac{0.05}{0.25} = 0.2$.</p><p>Check: $0.2(0.80) + 0.8(0.05) = 0.2$.</p></div><div class=\"panel\" style=\"height:22mm\"></div></div></div></div><p>However sure the robot was, with no new look its belief relaxes to $\\pi$: how often the mug is there for any reason.</p>", "n": ""}, {"t": "A belief that decays 1 of 2", "sub": "the chain in continuous time; illustrative rates", "min": 3.5, "sz": "", "html": "<p>With rates $a = 0.20$ and $b = 0.05$ per hour, $P(\\text{there})$ relaxes from $p_0$ to $\\pi = b/(a+b)$:</p><div class=\"eq\">\\[p(t) = \\pi + (p_0 - \\pi)\\, e^{-(a+b)\\,t}\\]</div><div class=\"cols\"><div style=\"flex:0.420 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 416 175\" width=\"416\" role=\"img\" aria-label=\"A teal curve of the robot's belief that an object is still where it was seen, starting near one and decaying towards a floor. A dashed threshold marks when to re-check, reached at 3.8 hours.\">\n  <path d=\"M70.4 132.7 L364.2 132.7\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M70.4 132.7 L70.4 25.2\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"79.7\" y=\"22.3\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P(still there)</text>\n  <text x=\"213.7\" y=\"161.8\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hours since last seen</text>\n  <path d=\"M70.4 34.4 L77.5 39.1 L84.7 43.6 L91.9 47.8 L99.0 51.7 L106.2 55.4 L113.4 58.9 L120.5 62.1 L127.7 65.2 L134.9 68.1 L142.0 70.8 L149.2 73.3 L156.4 75.7 L163.5 77.9 L170.7 80.0 L177.9 82.0 L185.0 83.9 L192.2 85.6 L199.4 87.2 L206.6 88.8 L213.7 90.2 L220.9 91.6 L228.1 92.9 L235.2 94.1 L242.4 95.2 L249.6 96.2 L256.7 97.2 L263.9 98.2 L271.1 99.1 L278.2 99.9 L285.4 100.6 L292.6 101.4 L299.7 102.1 L306.9 102.7 L314.1 103.3 L321.2 103.9 L328.4 104.4 L335.6 104.9 L342.7 105.4 L349.9 105.8 L357.1 106.2\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M70.4 82.5 L357.1 82.5\" stroke=\"var(--ink)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"362.8\" y=\"82.5\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">re-check</text>\n  <path d=\"M179.9 132.7 L179.9 82.5\" stroke=\"var(--ink)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"186.4\" y=\"72.5\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3.8 h</text>\n  <text x=\"70.4\" y=\"144.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"127.7\" y=\"144.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"185.0\" y=\"144.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <text x=\"242.4\" y=\"144.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">6</text>\n  <text x=\"299.7\" y=\"144.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n  <text x=\"357.1\" y=\"144.9\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n  <text x=\"61.0\" y=\"32.4\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n</svg><p class=\"cap\">teal: the robot's belief</p></div></div><div style=\"flex:0.550 1 0\"><div class=\"hand\" data-h=\"22\"><p class=\"cue\">Seen with $p_0 = 0.98$. What is $\\pi$? $p(2)$? $p(8)$?</p><div class=\"worked\"><p>$\\pi = 0.05 / 0.25 = 0.20$; $a + b = 0.25$.</p><p>$p(2) = 0.20 + 0.78\\,e^{-0.50} = 0.673$.</p><p>$p(8) = 0.20 + 0.78\\,e^{-2} = 0.306$.</p></div><div class=\"panel\" style=\"height:22mm\"></div></div></div></div>", "n": ""}, {"t": "A belief that decays 2 of 2", "sub": "when to look again, and what a miss does", "min": 2.5, "sz": "", "html": "<div class=\"fig\"><svg viewBox=\"0 0 575 243\" width=\"575\" role=\"img\" aria-label=\"A teal curve of the robot's belief that an object is still where it was seen, starting near one and decaying towards a floor. A dashed threshold marks when to re-check, reached at 3.8 hours. At 2 hours an orange arrow, an observation, drops the belief from 0.67 to 0.18.\">\n  <defs><marker id=\"ae87aeaccent2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--accent-2)\"/></marker></defs>\n  <path d=\"M97.1 186.2 L516.9 186.2\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <path d=\"M97.1 186.2 L97.1 32.6\" stroke=\"var(--rule-strong)\" stroke-width=\"1.14\" fill=\"none\"/>\n  <text x=\"110.4\" y=\"28.5\" text-anchor=\"start\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">P(still there)</text>\n  <text x=\"301.9\" y=\"227.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">hours since last seen</text>\n  <path d=\"M97.1 45.7 L107.3 52.5 L117.6 58.8 L127.8 64.8 L138.0 70.4 L148.3 75.7 L158.5 80.7 L168.8 85.3 L179.0 89.7 L189.2 93.8 L199.5 97.7 L209.7 101.3 L220.0 104.7 L230.2 107.9 L240.4 110.9 L250.7 113.7 L260.9 116.4 L271.2 118.9 L281.4 121.2 L291.6 123.4 L301.9 125.5 L312.1 127.4 L322.4 129.2 L332.6 130.9 L342.8 132.6 L353.1 134.1 L363.3 135.5 L373.6 136.8 L383.8 138.1 L394.0 139.2 L404.3 140.4 L414.5 141.4 L424.8 142.4 L435.0 143.3 L445.2 144.1 L455.5 145.0 L465.7 145.7 L476.0 146.4 L486.2 147.1 L496.4 147.7 L506.7 148.3\" stroke=\"var(--accent)\" stroke-width=\"1.33\" fill=\"none\"/>\n  <path d=\"M97.1 114.5 L506.7 114.5\" stroke=\"var(--ink)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"5 4\"/>\n  <text x=\"514.9\" y=\"114.5\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">re-check</text>\n  <path d=\"M253.6 186.2 L253.6 114.5\" stroke=\"var(--ink)\" stroke-width=\"0.76\" fill=\"none\" stroke-dasharray=\"1.5 3\" stroke-linecap=\"round\"/>\n  <text x=\"262.9\" y=\"100.2\" text-anchor=\"start\" fill=\"var(--ink)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">3.8 h</text>\n  <text x=\"97.1\" y=\"203.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">0</text>\n  <text x=\"179.0\" y=\"203.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">2</text>\n  <text x=\"260.9\" y=\"203.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">4</text>\n  <text x=\"342.8\" y=\"203.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">6</text>\n  <text x=\"424.8\" y=\"203.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">8</text>\n  <text x=\"506.7\" y=\"203.6\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">10</text>\n  <text x=\"83.8\" y=\"42.8\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">1</text>\n  <path d=\"M179.0 89.7 L179.0 160.6\" stroke=\"var(--accent-2)\" stroke-width=\"1.33\" fill=\"none\" marker-end=\"url(#ae87aeaccent2)\"/>\n  <circle cx=\"179.0\" cy=\"160.6\" r=\"3.0\" fill=\"var(--accent-2)\"/>\n  <text x=\"192.3\" y=\"125.2\" text-anchor=\"start\" fill=\"var(--accent-2)\" font-family=\"Georgia,serif\" font-size=\"10.0\" dominant-baseline=\"middle\">looked, missed</text>\n</svg><p class=\"cap\">teal: the robot's belief; orange: an observation</p></div><ul><li><b>Re-check</b> when $p(t)$ falls below $0.5$: $t = \\ln\\frac{p_0 - \\pi}{0.5 - \\pi} / (a+b) = 3.8$ h.</li><li><b>A miss at 2 h</b> ($P(\\text{miss} \\mid \\text{there}) = 0.10$, $P(\\text{miss} \\mid \\text{gone}) = 0.95$): Bayes' rule gives $0.673 \\to 0.178$.</li></ul>", "n": ""}, {"t": "Evaluation: where it leads", "sub": "where this section is going", "min": 1, "sz": "", "html": "<p class=\"big\">A world model's video can look right and still be useless to the robot that plans with it. The test that matters is the decisions it leads to.</p><ul><li><b>Where it ends:</b> regret, and WorldEval, which uses a world model to rank robot policies.</li><li><b>What it needs first:</b> the standard image and video scores (PSNR, SSIM, FVD), a case where they rank models wrongly, and WorldModelBench.</li><li><b>Why a robot cares:</b> a model chosen for good-looking video can pick worse actions.</li></ul>", "n": ""}, {"t": "Pixel metrics: MSE and PSNR", "sub": "", "min": 3, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{MSE} = \\frac{1}{N}\\sum_i (I_i - \\hat{I}_i)^2, \\qquad \\mathrm{PSNR} = 10 \\log_{10} \\frac{255^2}{\\mathrm{MSE}} \\;\\text{dB}\\]</div><div class=\"hand\" data-h=\"18\"><p class=\"cue\">Truth $(100, 120, 140, 160)$, prediction $(110, 120, 130, 170)$, 8-bit. PSNR?</p><div class=\"worked\"><p>Errors $10, 0, -10, 10$: $\\mathrm{MSE} = 75$. $\\mathrm{PSNR} = 10\\log_{10}(65025 / 75) = 29.4$ dB.</p></div><div class=\"panel\" style=\"height:18mm\"></div></div><ul><li><b>Measures:</b> per-pixel error, on a log scale. Higher is better; halving the RMSE adds $6$ dB.</li><li>PSNR rewards predicting the <b>average</b> of the possible futures, which is a blur.</li></ul>", "n": ""}, {"t": "SSIM: structure, not raw error", "sub": "Wang et al., 2004; the same four pixels as one window", "min": 3.5, "sz": "", "html": "<div class=\"eq\">\\[\\mathrm{SSIM} = \\underbrace{\\frac{2\\mu_x\\mu_y + C_1}{\\mu_x^2 + \\mu_y^2 + C_1}}_{\\text{brightness}} \\cdot \\underbrace{\\frac{2\\sigma_{xy} + C_2}{\\sigma_x^2 + \\sigma_y^2 + C_2}}_{\\text{contrast and structure}}\\]</div><div class=\"hand\" data-h=\"20\"><p class=\"cue\">Means, variances and covariance of truth and prediction. Then SSIM, with $C_1 = 6.5$, $C_2 = 58.5$.</p><div class=\"worked\"><p>$\\mu_x = 130$, $\\mu_y = 132.5$; $\\sigma_x^2 = 500$, $\\sigma_y^2 = 518.75$; $\\sigma_{xy} = 475$.</p><p>Brightness $0.9998$, structure $0.936$: $\\mathrm{SSIM} = 0.936$ (1 is identical).</p></div><div class=\"panel\" style=\"height:20mm\"></div></div><p>$\\sigma_{xy}$, the <b>covariance</b>, averages $(x_i - \\mu_x)(y_i - \\mu_y)$: positive when the two rise and fall together. <b>Measures:</b> whether patches match in brightness, contrast and pattern.</p>", "n": ""}, {"t": "FID and FVD: comparing distributions", "sub": "", "min": 3, "sz": "", "html": "<ul><li>Embed many real and many generated images (FID, Heusel et al., 2017) or videos (FVD, Unterthiner et al., 2018) with a fixed network.</li><li>Fit a Gaussian to each set of features, and measure the distance between the two Gaussians:</li></ul><div class=\"eq\">\\[d^2 = \\|\\boldsymbol{\\mu}_r - \\boldsymbol{\\mu}_g\\|^2 + \\mathrm{Tr}\\bigl(\\Sigma_r + \\Sigma_g - 2(\\Sigma_r\\Sigma_g)^{1/2}\\bigr)\\]</div><div class=\"hand\" data-h=\"12\"><p class=\"cue\">In 1D: real $\\mathcal{N}(0, 1^2)$, generated $\\mathcal{N}(0.5, 0.8^2)$. $d^2$?</p><div class=\"worked\"><p>$d^2 = (\\mu_r - \\mu_g)^2 + (\\sigma_r - \\sigma_g)^2 = (0.5)^2 + (0.2)^2 = 0.29$.</p></div><div class=\"panel\" style=\"height:12mm\"></div></div><p><b>Measures:</b> whether the outputs look like real ones <b>in bulk</b>, not whether one prediction matches its truth.</p>", "n": ""}, {"t": "One image row, three predictions", "sub": "64 pixels, a 2-pixel ball; illustrative", "min": 3, "sz": "", "html": "<div class=\"cols\"><div style=\"flex:0.500 1 0\"><div class=\"fig\"><svg viewBox=\"0 0 436 283\" width=\"436\" role=\"img\" aria-label=\"Intensity profiles along one image row: the true row in orange, predictions in teal. truth: the true row, a brig
